DPRK health stakeholders:
  - Ministry of Public Health (MoPH):
      - Choe Kyong Chol (WPK):
          - Title: Minister of Public Health
          - Stakeholder engagement notes:
              - "Minister of Public Health reported in DPRK cabinet listings under Premier Kim Tok Hun in the cabinet that serves General Secretary of the Workers' Party of Korea (WPK) and Chairman of the State Affairs Commission Kim Jong Un; verify currency against KCNA (Korean Central News Agency, kcna.kp when accessible), Rodong Sinmun, the analytical reporting of NK News, 38 North, the Stimson Center, and WHO DPRK country office briefings — external visibility of DPRK senior officials is structurally limited and lag is common."
              - "Owns MoPH policy and budget within significant sanctions-and-resource constraints, Pyongyang Maternity Hospital, Kim Man Yu Hospital, Ryugyong Dental Hospital, the Pyongyang Friendship Hospital, the Okryu Children's Hospital, the provincial people's hospital network across the nine provinces (Chagang, Hamgyong-buk, Hamgyong-nam, Hwanghae-buk, Hwanghae-nam, Kangwon, Pyongan-buk, Pyongan-nam, Ryanggang) and the three city-level administrations (Pyongyang, Rason, Nampo), the constitutional free-and-universal coverage framing, and engagement with WHO DPRK, UNICEF DPRK, UNFPA, IFRC (the only permanent ICRC-family presence), Eugene Bell Foundation (TB), Global Fund (TB and malaria — historically), Gavi (immunisation), and a small set of bilateral partners (Sweden, Switzerland, EU humanitarian where licensed) under UN Security Council sanctions humanitarian-exemption frameworks."
              - "Hook: tuberculosis and MDR-TB (a sustained burden where Global Fund and Eugene Bell Foundation have been the principal external responders), malaria control, maternal-and-child health, immunisation (DPRK has historically had relatively strong vaccination coverage by regional and resource-comparable standards), NCDs (hypertension and gastric cancer are notable), mental health, traditional Koryo medicine integration into the public system, the post-2020 supply-chain restoration after the Covid border closure, mpox preparedness, and humanitarian-exception coordination architectures — these are the operational lines available for engagement."
          - Tone advice:
              - "Open with TB-MDR, MCH, immunisation, NCDs, Koryo medicine and humanitarian-exception coordination — these are the operational lines and the only framings that map to the available engagement architecture."
              - "Do not assume normalised diplomatic engagement (DPRK is under UNSC sanctions; humanitarian exemptions require specific licensing), do not ignore the 2020-2023 Covid border-closure legacy (it materially disrupted supply chains and donor access, and the architecture is still being restored), and do not conflate with the Republic of Korea — sovereign states with radically different political, economic and health systems."
