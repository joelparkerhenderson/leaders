Barbadian health stakeholders:
  - Ministry of Health and Wellness (MoHW):
      - Hon. Jerome Walcott (BLP):
          - Title: Minister of Health and Wellness
          - Stakeholder engagement notes:
              - "Senior Minister in the Mia Amor Mottley Barbados Labour Party (BLP) government (the BLP holds all seats in the House of Assembly since the January 2022 election); Barbados became a republic within the Commonwealth on 30 November 2021 (the 55th anniversary of independence) with Dame Sandra Mason as the first President, succeeded by Sir Carl Springer in 2023; verify current portfolio holder against gov.bb and Barbados Government Information Service since portfolio reshuffles have occurred."
              - "Owns MoHW policy and budget, the Queen Elizabeth Hospital (QEH — the apex tertiary public facility in Bridgetown), the Psychiatric Hospital (Black Rock), the polyclinic network across the eleven parishes (Christ Church, Saint Andrew, Saint George, Saint James, Saint John, Saint Joseph, Saint Lucy, Saint Michael, Saint Peter, Saint Philip, Saint Thomas), the geriatric hospital architecture (St. Philip District Hospital and others), Barbados Drug Service procurement, and CARICOM, CARPHA (Caribbean Public Health Agency headquartered in Trinidad), PAHO, OECS partial-engagement, Commonwealth and AOSIS (Alliance of Small Island States) health diplomacy."
              - "Hook: non-communicable diseases (Barbados has very high NCD burden including obesity, diabetes, hypertension and cardiovascular disease; the Barbados Declaration on NCDs is a CARICOM reference), mental health, climate-and-health (Prime Minister Mottley's Bridgetown Initiative gives Barbados global leadership on climate finance and the health dimension is prominent), maternal-and-child health, hurricane and disaster preparedness, NCDs and youth obesity, sugary-drinks tax (a Barbadian policy innovation studied regionally), and CARPHA-CARICOM cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, mental health, Bridgetown Initiative climate-and-health, MCH, sugary-drinks tax policy, hurricane preparedness and CARPHA-CARICOM cooperation — these are durable MoHW lines aligned with the Mottley government's climate-and-development leadership."
              - "Recognise Barbados's republican status (since 30 November 2021 — King Charles III is no longer Head of State), the Mottley government's global leadership on climate finance, and the distinctness from other CARICOM members; do not import Jamaican or Trinidadian framings."
