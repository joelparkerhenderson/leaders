Namibian health stakeholders:
  - Ministry of Health and Social Services (MoHSS):
      - Dr. Esperance Luvindao (SWAPO):
          - Title: Minister of Health and Social Services (since 22 March 2025)
          - Stakeholder engagement notes:
              - "Sworn in as Minister of Health and Social Services on 22 March 2025 by President Netumbo Nandi-Ndaitwah, the first woman President of Namibia; at 34 years old, the youngest health minister in Namibian history and among the youngest globally; medical doctor by training; born in the Democratic Republic of the Congo, Namibian by naturalisation; SWAPO-aligned; appointment widely interpreted as a generational signal in the Nandi-Ndaitwah cabinet."
              - "Owns MoHSS policy and budget, the four intermediate (referral) hospitals — Windhoek Central, Katutura, Oshakati, Rundu — plus Onandjokwe in Oshikoto, the district hospitals and primary-care clinic network across the fourteen administrative regions (Erongo, Hardap, Karas, Kavango East, Kavango West, Khomas, Kunene, Ohangwena, Omaheke, Omusati, Oshana, Oshikoto, Otjozondjupa, Zambezi), NMRC oversight, the HIV/AIDS programme (Namibia is a sustained PEPFAR partner with very high ART coverage and one of the strongest 95-95-95 records in SADC), and SADC and African Union health diplomacy."
              - "Hook: HIV continuity and sustainability, maternal and child health (Namibia has materially reduced maternal mortality over the SWAPO era), non-communicable diseases (hypertension, diabetes, cancer burden rising), mental health (a stated Luvindao priority), rural-service delivery (Namibia's geography poses access challenges given low population density and long distances), HR retention (specialist emigration to South Africa, the UK and the Gulf is a persistent pressure), and the Nandi-Ndaitwah presidential modernisation agenda — these all land."
          - Tone advice:
              - "Open with HIV continuity, maternal and child health, NCDs, mental health, rural delivery and the presidential modernisation agenda — these are Luvindao's first-term priorities and align with the SWAPO-Nandi-Ndaitwah direction of travel."
              - "Do not assume South African NHI alignment or PSEMAS-MoHSS unity — Namibia operates a health system institutionally distinct from South Africa and is not part of SA's NHI; PSEMAS (Public Service Employee Medical Aid Scheme) purchases private care for civil servants and is administratively separate from MoHSS service provision; framings that bundle them will be corrected."
  - Notes on Deputy Minister, Executive Director (Permanent Secretary), Registrar NMRC, and Parliamentary Standing Committee Chair:
      - Status: Substantive identities to be verified against the Office of the President, MoHSS press releases, and Parliament of Namibia committee allocations.
