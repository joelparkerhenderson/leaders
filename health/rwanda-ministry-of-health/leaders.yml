Rwandan health stakeholders:
  - Ministry of Health:
      - Dr. Sabin Nsanzimana (RPF):
          - Title: Minister of Health of the Republic of Rwanda (since November 2022)
          - Stakeholder engagement notes:
              - "Minister of Health since November 2022 in the Paul Kagame (RPF — Rwandan Patriotic Front) government; epidemiologist; PhD in Epidemiology from the University of Basel; pre-ministerial career included leading the Rwanda Biomedical Centre (RBC), the University Teaching Hospital of Butare (CHUB), and Rwanda's national HIV and hepatitis programmes; author of more than 230 scientific publications — distinctively research-active among African health ministers."
              - "Re-elected Co-Chair of the Pandemic Fund Board (RBC SPPROHRWANDA) — sustained international governance role on pandemic financing; named to the TIME100 Health 2026 list — international recognition of his global-health leadership."
              - "Active 2026: reassured Rwandans on outbreak surveillance as Ebola cases rise in neighbouring DRC and Uganda (IGIHE); spoke at the 3rd annual Rwanda Health Research & Policy Conference; manages legacy of the September-October 2024 Marburg virus outbreak that Rwanda contained quickly."
              - "Owns Ministry policy and budget, RBC operational programmes (DRC- and Uganda-border surveillance, HIV / TB / malaria vertical programmes), Rwanda FDA (the African Medicines Agency host candidate at one stage) medicines regulation, RSSB Community-Based Health Insurance (CBHI / Mutuelles de Santé) administration, the 30 district hospitals plus King Faisal Hospital, CHUK, CHUB, Rwanda Military Hospital referral network, the BioNTech-Africa mRNA-vaccine manufacturing hub in Kigali, the Rwanda Cancer Centre, and Rwanda's WHO Africa, AU CDC (Africa CDC), EAC and Commonwealth health diplomacy."
              - "Hook: CBHI / Mutuelles de Santé refinement, AU CDC and pandemic preparedness, Ebola / Marburg / mpox preparedness, BioNTech-Africa mRNA hub Kigali (a flagship Rwanda strategic-investment programme), Rwanda Cancer Centre and oncology national programme, and AU CDC leadership cooperation land."
          - Tone advice:
              - "Open with CBHI / Mutuelles, AU CDC pandemic preparedness, BioNTech-Africa mRNA hub Kigali and the Rwanda Cancer Centre — these are his sustained 2022-2026 priorities and his international research-profile assets, distinguishing him from purely political appointees."
              - "Do not pitch as if Rwanda were donor-dependent — Rwanda's self-reliance and ownership framing under Kagame is structural; pitches that assume aid-recipient dynamics will be politically misaligned and any framing must respect Rwandan ownership of strategic health decisions."
