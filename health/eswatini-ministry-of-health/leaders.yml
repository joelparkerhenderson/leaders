Eswatini health stakeholders:
  - Ministry of Health (MoH):
      - Hon. Mduduzi Matsebula:
          - Title: Minister of Health
          - Stakeholder engagement notes:
              - "Minister of Health under the King Mswati III government within Eswatini's non-party Tinkhundla electoral system; elected Chair of the East, Central and Southern Africa Health Community (ECSA-HC) Council of Health Ministers for 2026 — a recognised signal of Eswatini's standing in regional health diplomacy; previously served as a civil servant in Eswatini Customs for approximately 17 years before entering politics, an unusually long technocratic background for a Cabinet appointment."
              - "Owns MoH policy and budget, Mbabane Government Hospital, Raleigh Fitkin Memorial Hospital in Manzini (a Nazarene-affiliated mission hospital under MoU), Good Shepherd Mission Hospital in Siteki (Catholic-affiliated mission hospital under MoU), the regional and primary-care network across the four regions (Hhohho, Lubombo, Manzini, Shiselweni), EMRA oversight, NERCHA HIV/AIDS programmes, and SADC and ECSA-HC health diplomacy."
              - "Hook: HIV/AIDS continuity and sustainability (Eswatini is a globally recognised 95-95-95 success case and a sustained PEPFAR partner — historically the country had the highest adult HIV prevalence in the world and the response is a public-health reference case), TB and TB/HIV coinfection, NCDs (hypertension, diabetes), cervical cancer (HPV-driven), maternal and child health, mission-hospital partnerships, ECSA-HC regional cooperation, and digital-health architecture for ART continuity — these all land."
          - Tone advice:
              - "Open with HIV continuity, TB and TB/HIV coinfection, NCDs, cervical cancer, mission-hospital partnerships and ECSA-HC regional cooperation — these are MoH's priorities and Matsebula's chair-line for 2026."
              - "Do not use 'Swaziland' or import party-political framings — the country was renamed Eswatini by royal proclamation in April 2018 and operates the non-party Tinkhundla electoral system; both will be politely corrected."
