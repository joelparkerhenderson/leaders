Latvijas veselības aprūpes sistēma — ieinteresētās puses:
  - Veselības ministrija (Ministry for Health):
      - Hosams Abu Meri (JV):
          - Title: Veselības ministrs (Minister for Health) (kopš 28. maija 2026 jaunajā Ministru kabinetā)
          - Stakeholder engagement notes:
              - "Veselības ministrs jaunajā Ministru kabinetā, ko Saeima apstiprināja 2026. gada 28. maijā; Jaunās Vienotības (JV) partijas pārstāvis; saglabā amatu veselības ressortā jaunajā valdības konfigurācijā pēc 2026. gada pavasara politiskās rotācijas."
              - "Latvijas Republikas Veselības ministrijas vadītājs sektorā ar pastāvīgu plašsaziņas līdzekļu un Saeimas uzmanību: ārstu un māsu trūkums, garas rindas, NVD finansējuma stabilitāte, slimnīcu konsolidācija un primārās aprūpes pieejamība."
              - "Owns Nacionālā veselības dienesta (NVD) līgumus ar ārstniecības iestādēm, valsts apmaksāto pakalpojumu grozu, Zāļu valsts aģentūras (ZVA) un Slimību profilakses un kontroles centra (SPKC) darbības uzraudzību, kā arī Eiropas Savienības fondu un Atveseļošanas un noturības mehānisma īstenošanu veselības nozarē."
              - "Hook: rindu samazināšana, slimnīcu konsolidācija, primārā aprūpe, medicīnas darbinieku atalgojums, ES fondi un digitālā veselība (e-veselība) nolaižas; pitch, kas ignorē NVD kā vienīgo komisionāra lomu, neielaižas."
          - Tone advice:
              - "Sāc ar rindu samazināšanu, slimnīcu konsolidāciju, NVD finansējumu un medicīnas darbinieku trūkumu — tās ir politiski jutīgākās līnijas un Saeimas pārbaudes priekšmeti."
              - "Nepiedāvājiet centralizētus ministrijas iepirkuma modeļus — Latvijas arhitektūrā NVD darbojas kā vienīgais komisionārs; centralizācijas piedāvājumi tiks pārvirzīti atpakaļ uz NVD līgumu sistēmu."
