Parties prenantes du système de santé burundais:
  - Notes sur le Ministre de la Santé Publique et de la Lutte contre le SIDA de la République du Burundi:
      - Status: Identité substantive du Ministre du MSPLS sous le gouvernement du Président Évariste Ndayishimiye (CNDD-FDD, au pouvoir depuis 2020) à vérifier contre la Présidence de la République (presidence.gov.bi), le site du Ministère (minisante.bi) et l'Agence Burundaise de Presse (ABP). Les médias indépendants Iwacu et SOS Médias Burundi (en exil) sont des canaux complémentaires utiles compte tenu de l'environnement médiatique restreint.
      - Implication: L'engagement sur la santé burundaise nécessite (i) l'identification du titulaire actuel via les canaux officiels de Bujumbura/Gitega (la capitale politique a été déplacée à Gitega), (ii) la reconnaissance de l'architecture de soins — CHU de Kamenge, Hôpital Prince Régent Charles, Hôpital Roi Khaled, hôpitaux provinciaux et un réseau missionnaire (catholique et protestant) significatif — et (iii) la lecture de la dépendance forte aux partenaires (OMS, UNICEF, Banque Mondiale, Fonds Mondial, Gavi, Coopération Belge — historiquement très présente —, UE, FNUAP).
      - Hook: paludisme (charge très élevée — épidémies répétées), VIH (gratuité des ARV est la politique de référence et politiquement protégée), MCH (gratuité pour enfants de moins de 5 ans et femmes enceintes, une politique-signature politiquement protégée), NCDs, tuberculose, mpox et préparation aux urgences régionales (Marburg en RDC voisine, Ebola en Ouganda périodiquement), nutrition et sécurité alimentaire (Burundi très densément peuplé avec stress agricole), et coopération EAC (Communauté de l'Afrique de l'Est) et CIRGL.
      - Tone: Ouvrir avec paludisme, VIH, MCH avec gratuité ciblée, NCDs, préparation aux urgences et coopération EAC — priorités opérationnelles et politiquement durables du MSPLS. Ne pas importer des framings rwandais (Burundi et Rwanda partagent géographie et histoire mais ont des trajectoires politiques et sanitaires distinctes et la comparaison directe est sensible) ni proposer de retrait de la gratuité ciblée (politiquement intouchable).
