Afghan health stakeholders:
  - Ministry of Public Health (MoPH) — de facto Islamic Emirate of Afghanistan administration:
      - Mawlavi Noor Jalal Jalali:
          - Title: Acting Minister of Public Health
          - Stakeholder engagement notes:
              - "Acting Minister of Public Health in the Islamic Emirate of Afghanistan (IEA — Taliban de facto administration since 15 August 2021); operates within the IEA cabinet under Acting Prime Minister Mullah Hasan Akhund and the political authority of Supreme Leader Mullah Hibatullah Akhundzada based in Kandahar; verify currency against Bakhtar News Agency, TOLOnews, Khaama Press, Pajhwok, the IEA spokesperson Zabihullah Mujahid, and WHO Afghanistan briefings; no UN Member State has recognised the IEA but the MoPH is the de facto health-system administration."
              - "Owns MoPH policy and the de facto coordination of tertiary hospitals (Wazir Akbar Khan Hospital, Jamhuriat Hospital, Indira Gandhi Children's Hospital, Ali Abad Teaching Hospital), provincial-public-health directorates across the 34 provinces, and engagement with the Sehatmandi-successor project (the post-2021 essential package of health services architecture financed via the World Bank and delivered through WHO and UNICEF as service-delivery proxies contracting with NGO implementers — IRC, ICRC, MSF, Aga Khan Health Services, BRAC and others — under humanitarian-exception arrangements that bypass direct budget support to the IEA)."
              - "Hook: Sehatmandi-successor continuity (the financing architecture is renewed periodically and is politically delicate), maternal-and-child mortality reduction (Afghanistan has one of the highest maternal mortality ratios globally and IEA restrictions on women's medical education and practice directly threaten midwifery capacity), polio (Afghanistan is one of two remaining wild poliovirus type 1 endemic countries with Pakistan and a focus of the Global Polio Eradication Initiative), measles outbreaks, severe acute malnutrition (chronic and acute), mpox and cholera preparedness, mental health, and humanitarian-exception engagement frameworks under OFAC General Licenses and UN sanctions exceptions — these are the operational lines."
          - Tone advice:
              - "Open with Sehatmandi-successor continuity, polio eradication, MCH, severe acute malnutrition, measles outbreaks, mpox preparedness and humanitarian-exception coordination — these are the operational priorities and the only framings that map to the available engagement architecture."
              - "Do not assume normalised diplomatic engagement (no UN Member State recognition of the IEA), do not import standard commercial framings (sanctions-compliance risk), and do not ignore the IEA's restrictions on women's education and professional participation — these directly affect midwifery capacity, female community health workers and women's access to care, and are central to feasibility of any framing."
  - Notes on Deputy Ministers, Director-General of Tertiary Hospitals, and provincial public-health director coordination:
