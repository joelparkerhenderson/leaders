Icelandic health stakeholders / Íslenskir heilbrigðishagsmunaaðilar:
  - Heilbrigðisráðuneytið (Ministry of Health):
      - Alma Dagbjört Möller (Samfylkingin):
          - Title: Heilbrigðisráðherra (Minister of Health) (since 21 December 2024)
          - Stakeholder engagement notes:
              - "Heilbrigðisráðherra since 21 December 2024 in the Kristrún Frostadóttir (Samfylkingin / Social Democratic Alliance) coalition government formed after the November 2024 Alþingi election; elected to the Alþingi for Samfylkingin in the same election; doctor by profession; born 24 June 1961 in Iceland."
              - "Pre-political career as Chief Epidemiologist of Iceland (Sóttvarnalæknir) during the Covid-19 pandemic — high national-profile clinical-public-health role; brings clinical credibility and pandemic-response experience to the portfolio, distinguishing her from non-clinician predecessors."
              - "Active 2026 public lines: proposed a new National Action Plan on Obesity (Iceland Review / Grapevine, February 2026); visited Heilbrigðisstofnun Norðurlands (HSN) and other regional networks; announced 100 new nursing spaces at Urðarhvarf (Iceland Health, 31 March 2026); visited the Icelandic Radiation Safety Authority; oversaw Emergency Power Funding for Rural Healthcare in winter 2025-2026."
              - "Owns Ministry of Health policy and budget, Landspítali (national university hospital) financing and reform programme, regional Heilbrigðisstofnun coordination across the six regions, Lyfjastofnun (Icelandic Medicines Agency) regulation, mental-health and obesity policy, healthcare workforce (nurses, GPs, specialists), and Nordic health-cooperation portfolio (Norden, NOMESCO, NOMESKO)."
              - "Hook: National Obesity Action Plan, mental health, nursing workforce, rural healthcare resilience, Landspítali development, Lyfjastofnun reform, climate-and-health (Iceland's geothermal-and-volcanic health risks), and Nordic cooperation land."
          - Tone advice:
              - "Open with obesity action plan, mental health, nursing workforce, rural healthcare and Nordic cooperation — these are her authored 2026 public lines and align with the Samfylkingin / Social Democratic Alliance health-policy frame."
              - "Do not pitch as if Iceland were resource-poor — small population (~400k) but high-income with strong digital infrastructure (Heilsuvera) and academic-clinical integration with the University of Iceland."
