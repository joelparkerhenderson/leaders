Mongolian health stakeholders:
  - Ministry of Health (Эрүүл мэндийн яам):
      - Munkhsaikhan Togtmol (MPP):
          - Title: Minister of Health, Mongolia (in the current Mongolian cabinet)
          - Stakeholder engagement notes:
              - "Minister of Health of Mongolia in the current cabinet (Prime Minister Luvsannamsrai Oyun-Erdene era or successor; subject to verification given coalition volatility); MPP-aligned (the Mongolian People's Party is the dominant party); met with the WHO Representative in Mongolia (Montsame coverage)."
              - "Owns MoH policy and budget, the Health Insurance General Agency coordination of mandatory health insurance, NCCD (National Center for Communicable Diseases) outbreak surveillance and response, the network of Central Hospitals (First Central Hospital, State First Central Hospital, Third Central Hospital, National Cancer Centre), the 21 Aimag and Ulaanbaatar district Health Offices, telemedicine programmes including the UNFPA Telemedicine Project on Maternal and Newborn Health, and Mongolia's WHO WPRO, SCO (Shanghai Cooperation Organisation observer), CSTO and OSCE health-cooperation engagement."
              - "Hook: Health Insurance reform, telemedicine for nomadic and remote rural populations (a distinctive Mongolian operational requirement given vast territory and dispersed population), NCDs (Mongolia has among the world's highest alcohol-related-disease burdens), mpox preparedness, traditional Mongolian medicine integration into the formal system, third-neighbour policy health-cooperation with Japan, Korea, EU and US, and SCO cooperation land."
          - Tone advice:
              - "Open with telemedicine for remote populations, NCDs (particularly alcohol-related), traditional Mongolian medicine integration and third-neighbour policy cooperation — these are distinctive Mongolian priorities reflecting the country's geography and strategic positioning."
              - "Do not pitch as if Mongolia were a small island system — Mongolia's vast territory, nomadic populations, severe winters and strategic position landlocked between Russia and China make the engagement context distinctive and require Mongolia-specific framings."
