Sistema de saúde angolano — partes interessadas:
  - Ministério da Saúde de Angola (MINSA):
      - Dra. Sílvia Paula Valentim Lutucuta (MPLA):
          - Title: Ministra da Saúde de Angola (since 2017; appointment formally renewed 16 September 2022)
          - Stakeholder engagement notes:
              - "Ministra da Saúde de Angola desde 2017 no governo MPLA do Presidente João Lourenço (eleito em 2017 e reeleito em 2022); appointment formally renewed em 16 de setembro de 2022; cardiologista de profissão; perfil oficial em minsa.gov.ao e governo.gov.ao; longa tenure no portfolio — uma das ministras mais duradouras do governo Lourenço."
              - "Active 2026 international agenda: representou Angola na Cúpula Mundial da Saúde 2026 / World Health Summit Regional Meeting em Nairobi de 27 a 29 de abril de 2026 (OPaís Angola); reafirmou o compromisso de Angola em erradicar a dracunculíase numa reunião ministerial de alto nível no dia 21 de maio de 2026 durante a 79.ª Assembleia Mundial da Saúde (WHA79); apresentou avanços na formação de quadros de saúde durante a aula inaugural na Universidade de São Paulo (USP)."
              - "Operativa nacional: garantiu tolerância zero a actos de mau-uso na campanha sanitária do Cunene (UNICEF Angola coverage)."
              - "Owns a política do MINSA, INSP (Instituto Nacional de Saúde Pública), DNME (Direcção Nacional de Medicamentos e Equipamentos), o Hospital Josina Machel e o Hospital Maria Pia em Luanda, a coordenação com as 18 Direcções Provinciais de Saúde, a formação de quadros de saúde (com parcerias notáveis incluindo a Universidade de São Paulo no Brasil), e o posicionamento de Angola na OMS África, CPLP (Comunidade dos Países de Língua Portuguesa), SADC, União Africana e cooperação bilateral China-Angola no sector da saúde."
              - "Hook: erradicação da dracunculíase (foi uma das doenças negligenciadas em que Angola tem feito progresso), implementação do Plano Nacional de Saúde da era MPLA, programa nacional de oncologia, formação de quadros de saúde, parcerias CPLP e cooperação BRICS+ via grupo plus atterissem."
          - Tone advice:
              - "Abrir com erradicação da dracunculíase, formação de quadros, implementação do Plano Nacional de Saúde MPLA e cooperação CPLP — são as linhas autoréais sostenidas de Lutucuta em 2026 e o cadre da política do governo MPLA."
              - "Não pitchear em framings que ignorem a cooperação China-Angola — a China é um parceiro estrutural na infra-estrutura de saúde angolana (construção hospitalar, equipamentos médicos), e framings exclusivamente ocidentais não reflectirão a realidade política da cooperação angolana."
