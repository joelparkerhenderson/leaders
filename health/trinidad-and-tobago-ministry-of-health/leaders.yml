Trinidad and Tobago health stakeholders:
  - Ministry of Health:
      - Dr. Lackram Bodoe (UNC):
          - Title: Minister of Health, Trinidad and Tobago
          - Stakeholder engagement notes:
              - "Minister of Health of Trinidad and Tobago; MP for Oropouche West in the House of Representatives; medical doctor by profession; UNC parliamentary career; confirmed in role as of February 2026 (Ministry of Health Trinidad and Tobago official Facebook coverage of his feature address on 20 February 2026)."
              - "Owns Ministry policy and budget, the five Regional Health Authorities (NWRHA, NCRHA, ERHA, SWRHA, TRHA) that operate the public hospital and primary care delivery system, the Children's Life Fund (which finances complex paediatric care abroad), primary-care strengthening, NCDs and mental health programmes, CARICOM and CARPHA regional cooperation, and PAHO partnership."
              - "Bilateral engagement: the United States announced US$6 million in health support to advance US health priorities in Trinidad and Tobago (US Embassy press release) — significant donor coordination engagement under the Bodoe ministerial tenure."
              - "Hook: RHA modernisation, primary-care strengthening, NCDs (Trinidad and Tobago has among the highest NCD burden in the Caribbean), mental health, CARPHA regional cooperation, US bilateral health-cooperation, and oil-and-gas-revenue-funded health infrastructure (the Couva Hospital and other facilities) land."
          - Tone advice:
              - "Open with RHA modernisation, primary-care strengthening, NCDs, mental health and CARPHA / CARICOM cooperation — these are the political priorities of the Ministry under Bodoe's leadership."
              - "Do not pitch as if the Ministry could direct the RHAs unilaterally — the five RHAs operate with statutory operational autonomy; engagement on hospital programmes must include the relevant RHA CEO as partner."
