Saudi Arabian health stakeholders / أصحاب المصلحة في النظام الصحي السعودي:
  - Ministry of Health (وزارة الصحة):
      - H.E. Fahad bin Abdulrahman Al-Jalajel:
          - Title: Minister of Health (since 15 October 2021); concurrently Chairman of the Saudi Health Council, Chairman of the SFDA Board, and Chairman of the SCFHS Board of Trustees
          - Stakeholder engagement notes:
              - "Minister of Health since 15 October 2021 by Royal Decree; concurrently Chairman of the Saudi Health Council, Chairman of the Saudi Commission for Health Specialties (SCFHS) Board of Trustees, and Chairman of the SFDA Board of Directors; member of the Council of Economic and Development Affairs (CEDA) and Chair of the Transformation Program Committee in the health sector — an unusually broad concentration of institutional authority for a Saudi minister."
              - "Background: financial and healthcare-management career; previously served in senior health-investment and Vision-2030 implementation roles within the Ministry and adjacent bodies prior to assuming the Minister portfolio."
              - "Active public lines 2026: announced advanced healthcare readiness for the 2026 Hajj season with bed-capacity surpassing 20,000 (Saudi Gazette); highlighted to Arab News a 40 percent reduction in mortality from chronic diseases and a 60 percent decrease in road-traffic fatalities; inaugurated 37 health projects costing SR 1.6 billion in Hail region; affirmed sector readiness across Ministry of Health press communications."
              - "Owns the Vision 2030 Health Sector Transformation Program: the 21 regional Health Clusters payer-provider separation, the planned single-payer Council of Health Insurance (CHI) design, e-health and digital-clinical infrastructure (Sehhaty, Tawakkalna-Health), SFDA regulation including fast-track-approval pathways, SCFHS professional licensing, Hajj health-services delivery, and Saudi G20 / Global Health Initiative multilateral positioning."
              - "Recognised in the King Salman Center for Disability Research and in international health-policy fora (interview profiles in PharmaBoardroom, Saudipedia); positioned as the political-administrative face of the Saudi health transformation."
              - "Hook: Health Sector Transformation Program, Health Clusters payer-provider separation, single-payer CHI design, Hajj health-services, AI in clinical workflows, SFDA fast-track approvals, biomanufacturing localisation under Vision 2030, and partnership with multilateral and bilateral health partners land."
          - Tone advice:
              - "Open with Vision 2030 Transformation Program, Health Clusters, Hajj health services, SFDA fast-track approvals and AI / digital health — these are Al-Jalajel's authored, sustained public lines and the operational levers under his unusually concentrated authority."
              - "Do not pitch as if the MoH were a single payer today — the CHI single-payer design is still under construction; current arrangements vary by Cluster, by Aramco / NGHA / MoD Health parallel system, and by phase of transformation."
