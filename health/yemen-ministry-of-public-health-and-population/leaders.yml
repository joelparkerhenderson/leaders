Yemeni health stakeholders:
  - Ministry of Public Health and Population, Internationally-Recognised Government (IRG):
      - Dr. Qasim Buhaibeh (IRG):
          - Title: Minister of Public Health and Population, Internationally-Recognised Government of Yemen (since 2026 by Presidential Decree No. 3)
          - Stakeholder engagement notes:
              - "Minister of Public Health and Population in the new Yemeni Internationally-Recognised Government cabinet formed by Presidential Decree No. 3 of 2026 — a comprehensive cabinet reshuffle establishing a 35-minister government (Yeni Yemen detailed biographies coverage; Yemen Monitor 'New Yemeni Government Announced with Comprehensive Cabinet Reshuffle'); medical specialist; led national pandemic response during Covid-19; operates under the Presidential Leadership Council (PLC) Chair Rashad al-Alimi from Aden."
              - "Owns IRG MoPHP policy and budget within IRG-controlled territories (Aden, Hadhramaut, Marib, Taiz, Lahij, Abyan, Shabwah, Mahra and Socotra), the hospital network in those areas, pharmaceutical supply chains in coordination with WHO and the Yemen Health Cluster, cholera and dengue outbreak response programmes, malnutrition response programmes (Yemen has experienced the world's worst humanitarian crisis with widespread acute malnutrition and famine risk), conflict-injury surgical services, gender-based violence and reproductive-health emergency programmes, and coordination with WHO Yemen, UNICEF, WFP, MSF, ICRC and IOM."
              - "Hook: cholera and dengue response, severe acute malnutrition treatment, conflict-injury surgical care, GBV and reproductive-health emergencies, Aden Republican Teaching Hospital network reconstruction, and cross-administration humanitarian coordination (with the Sana'a-based Houthi-controlled administration on supply lines and outbreak response) land."
          - Tone advice:
              - "Open with cholera and outbreak response, severe acute malnutrition, hospital reconstruction in IRG areas, conflict-injury services and humanitarian coordination — these are the war-context priorities of the IRG MoPHP."
              - "Do not assume a single Yemeni counterpart — Houthi-Sana'a-controlled territory operates a separate MoPHP administration with its own Minister of Health, separate supply chains, and a parallel humanitarian-coordination structure; engagement must respect this de facto duality."
  - Notes on Ministry of Public Health and Population, Houthi-controlled administration (Sana'a):
      - Status: The Houthi-controlled administration in Sana'a operates a separate de facto MoPHP with its own Minister of Health, separate hospital network (Al-Thawra, Al-Kuwait, Al-Sabeen and others in Sana'a, plus Hodeidah, Saada, Hajjah and other northern governorates), separate pharmaceutical supply chains, and its own humanitarian-coordination structure with UN agencies operating under access agreements. The substantive identity of the Houthi MoPHP Minister of Health should be verified against the Houthi-controlled SABA News Agency and humanitarian-actor reports.
      - Implication: Engagement on Yemeni health requires acknowledging the two de facto administrations (IRG in Aden; Houthi in Sana'a); framings must accommodate the political complexity, sanctions environment for Houthi-controlled territory, and the practical access requirements for humanitarian operations on both sides of the conflict line.
