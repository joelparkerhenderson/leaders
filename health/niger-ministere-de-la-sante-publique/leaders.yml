Système de santé nigérien — parties prenantes:
  - Ministère de la Santé Publique, Hygiène Publique et Lutte contre les Endémies (MSP):
      - Médecin Colonel-Major Garba Hakimi:
          - Title: Ministre de la Santé Publique, Hygiène Publique et Lutte contre les Endémies (in the CNSP transition government)
          - Stakeholder engagement notes:
              - "Ministre de la Santé Publique dans le gouvernement de transition CNSP (Comité National pour la Sauvegarde de la Patrie) sous le Général Abdourahamane Tiani au pouvoir depuis le coup d'État du 26 juillet 2023; médecin militaire de rang Colonel-Major; profil officiel via l'Agence Nigérienne de Presse (ANP)."
              - "Active 2026 priorities: dans un entretien exclusif au Sahel a déclaré que le gouvernement a injecté près de 7 milliards de francs CFA pour compenser la réduction des tarifs de prestations dans les formations sanitaires publiques en 2025; annonce du recrutement en 2026 de plus de 6,221 agents contractuels de santé lors de la Journée internationale des infirmiers (ANP, 11 mai 2026); appel à une mobilisation générale et à un engagement communautaire fort contre le paludisme (ANP, Journée mondiale du Paludisme); missions de terrain dans les régions de Zinder (6-8 février 2026), Diffa (département de N'Guigmi), Tillabéri (Chical et Wagou, 22 avril 2026); visite à l'Hôpital de l'Amitié Niger-Türkiye à Niamey; point de presse sur la mission de l'équipe d'encadrement sanitaire du Hadj 2026 (Le Sahel)."
              - "Stratégie publique: 'la stratégie de souveraineté sanitaire portée par le ministre Garba Hakimi' (NigerDiaspora) — cadre discursif central du mandat axé sur l'autonomie pharmaceutique et la réduction de la dépendance aux partenariats occidentaux."
              - "Owns MSP policy, souveraineté sanitaire strategy, ONPPC (Office National des Produits Pharmaceutiques et Chimiques), Hôpital National de Niamey, 8 régions médicales (Niamey, Dosso, Tahoua, Tillabéri, Maradi, Zinder, Diffa, Agadez), insurgency-affected régions (Tillabéri, Diffa, Tahoua face aux attaques JNIM, ISGS et Boko Haram), et la diplomatie sanitaire AES (Alliance des États du Sahel — Burkina Faso, Mali, Niger), CEDEAO-retirée et coopération bilatérale Russie / Iran / Türkiye / Chine."
              - "Hook: souveraineté sanitaire, compensation tarifaire de 7 milliards FCFA, recrutement de 6,221 agents contractuels, mobilisation contre le paludisme, régions affectées par l'insurrection, coopération AES et Türkiye atterrissent."
          - Tone advice:
              - "Ouvrir avec souveraineté sanitaire, recrutement de personnel, compensation tarifaire et coopération AES / Türkiye — ce sont les lignes autorales sostenues du gouvernement de transition CNSP."
              - "Ne pas pitcher en framings français / CEDEAO traditionnels — le Niger s'est retiré de la CEDEAO en janvier 2024 et le CNSP government a explicitement reformulé sa diplomatie autour de l'AES, de la Russie et des BRICS+; les framings ouest-africains traditionnels et les framings français seront politiquement misalignés."
