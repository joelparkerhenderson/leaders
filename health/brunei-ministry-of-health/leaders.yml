Bruneian health stakeholders:
  - Ministry of Health (MoH):
      - YB Dato Seri Setia Dr. Haji Md Isham bin Haji Jaafar:
          - Title: Minister of Health
          - Stakeholder engagement notes:
              - "Long-serving Minister of Health in the cabinet of Sultan Hassanal Bolkiah (Sultan of Brunei since 5 October 1967 — one of the longest-serving heads of state in the world — and concurrently Prime Minister, Defence Minister, Finance Minister and Foreign Affairs Minister); medical doctor with senior clinical and public-administration background; verify currency against the Prime Minister's Office (pmo.gov.bn) and the Ministry of Health (moh.gov.bn); Brunei operates a non-party absolute monarchy and cabinet appointments are made directly by the Sultan."
              - "Owns MoH policy and budget, RIPAS Hospital (Raja Isteri Pengiran Anak Saleha — the apex tertiary facility in Bandar Seri Begawan), Suri Seri Begawan Hospital (Kuala Belait), Pengiran Muda Mahkota Pengiran Muda Haji Al-Muhtadee Billah Hospital (Tutong), the new Temburong District hospital, the primary-care health centre network across the four districts (Brunei-Muara, Belait, Tutong, Temburong), the Halal Health Excellence and halal pharmaceutical agenda, the National Vision Wawasan Brunei 2035 health pillar, and ASEAN Health Cluster, BIMP-EAGA and OIC health diplomacy."
              - "Hook: non-communicable diseases (Brunei has one of the highest obesity, diabetes and cardiovascular-disease burdens in ASEAN despite high health-system capacity — a recognised policy priority), tobacco control and smoke-free policy, halal pharmaceutical and biomedical agenda (a distinctive Bruneian niche aligned with OIC partners), digital health and electronic medical records, mental health and adolescent health, cancer services (RIPAS oncology and the National Cancer Centre), and ASEAN cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, tobacco control, halal-health agenda, digital health, mental health and ASEAN cooperation — these are durable MoH priorities and align with Wawasan 2035 framing."
              - "Do not import party-political framings (Brunei is a non-party absolute monarchy under the Sultan), do not ignore the Islamic-policy lens (Syariah principles inform halal pharmaceuticals, modesty in service delivery and alcohol policy) and do not conflate with Malaysia (sovereign state with distinct architecture, language conventions and ASEAN positioning)."
