Belgisch gezondheidssysteem stakeholders / Stakeholders du système de santé belge:
  - Federale regering — Volksgezondheid / Gouvernement fédéral — Santé publique:
      - Frank Vandenbroucke (Vooruit):
          - Title: Vice-eersteminister en Minister van Sociale Zaken en Volksgezondheid, belast met Armoedebestrijding (Vice-Prime Minister and Minister of Social Affairs and Public Health, in charge of Poverty Reduction) (sinds 3 februari 2025)
          - Website: https://vandenbroucke.belgium.be/nl
          - Stakeholder engagement notes:
              - "Vice-eersteminister en Minister van Sociale Zaken en Volksgezondheid in de regering-De Wever (N-VA, MR, CD&V, Vooruit, Les Engagés — Arizona-coalitie) sinds 3 februari 2025; Vooruit; aanhoudende federale aanwezigheid op het ressort na de Vivaldi-regering 2020-2024 onder De Croo."
              - "Owns het federale gezondheidsbudget (€41,3 mld voor 2026, waaronder €1,57 mld bijkomende middelen), de RIZIV-/INAMI-conventies met artsen en ziekenfondsen, de FAGG-koers, en publiceert jaarlijks een beleidsnota / beleidsverklaring Volksgezondheid als sturingsinstrument."
              - "Per 1 januari 2026: alle opnamedagen in een psychiatrisch ziekenhuis tellen volledig mee voor de maximumfactuur — concreet voorbeeld van zijn distributieve agenda inzake mentale gezondheid en armoedebestrijding; nieuwe interfederale strategie drugsbeleid 2026-2029 goedgekeurd in 2026."
              - "Roept EU op tot strengere vape-regulering (maart 2026) — gebruikt het federale gezondheidsmandaat ook voor EU-positionering; tabak, alcohol en suiker zijn herhaalde publieke linies."
              - "Hook: ziekenhuishervorming, conventies en honoraria, geestelijke gezondheidszorg, federaal-deelstatelijke coördinatie, medicijnenbeleid en EU-gezondheid landen; pitches die de devolutie sinds 2014 negeren landen niet."
          - Tone advice:
              - "Open met geestelijke gezondheidszorg, ziekenhuishervorming, conventies, armoedebestrijding en EU-gezondheid — dit zijn zijn Vooruit-lijnen en zijn institutionele voorkeur voor distributie en hervorming."
              - "Pitch niet als ware er één Belgische zorgcontactpersoon — Gemeenschappen/Communautés bezitten preventie, ambulant en ouderenzorg sinds 2014; centraliserende framings worden teruggespeeld."
