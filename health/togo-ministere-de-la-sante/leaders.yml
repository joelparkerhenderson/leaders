Parties prenantes du système de santé togolais:
  - Notes sur le Ministre de la Santé et de l'Hygiène Publique de la République Togolaise:
      - Status: Identité substantive du Ministre de la Santé sous le gouvernement de la 5ème République togolaise — instaurée en 2024-2025 et faisant de Faure Gnassingbé (UNIR — Union pour la République) Président du Conseil des Ministres avec un rôle exécutif central et le Président de la République en fonction protocolaire — à vérifier contre la Présidence (presidence.gouv.tg), l'Agence Togolaise de Presse (ATOP) et Republicoftogo.com. Le remaniement post-transition a recomposé le cabinet.
      - Implication: L'engagement sur la santé togolaise nécessite (i) l'identification du titulaire actuel via les canaux officiels de Lomé, (ii) la reconnaissance de la nouvelle architecture institutionnelle de la 5ème République où le Président du Conseil des Ministres est l'autorité exécutive principale (et non plus le Président de la République comme sous la 4ème), et (iii) la lecture de la cartographie hospitalière (CHU Sylvanus Olympio et CHU Campus à Lomé; hôpital régional de Kara) et de la couverture INAM (Institut National d'Assurance Maladie).
      - Hook: paludisme et lutte vectorielle, santé maternelle et infantile, NCDs (hypertension, diabète, cancers), couverture santé universelle via INAM (élargissement progressif), tuberculose, VIH (programme partenaire PEPFAR et Fonds Mondial), préparation aux urgences (Lassa, mpox), et coopération CEDEAO-UEMOA-Francophonie.
      - Tone: Ouvrir avec paludisme, MCH, NCDs, CUS-INAM, préparation aux urgences et coopération régionale — priorités durables du MSHP. Ne pas ignorer la 5ème République (les framings basés sur l'ancienne 4ème République seront désalignés) ni importer des framings ghanéens (le Togo est francophone, dans la zone CFA UEMOA, et institutionnellement distinct du Ghana anglophone voisin).
