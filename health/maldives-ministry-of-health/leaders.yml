Maldives health stakeholders:
  - Ministry of Health:
      - Notes on Minister of Health:
          - Status: The Maldives Minister of Health position has experienced rapid turnover under the Mohamed Muizzu (People's National Congress, PNC) government formed November 2023. Dr. Abdulla Khaleel served as Minister of Health 2023-2024 before moving to the Ministry of Foreign Affairs (per Wikipedia / presidency.gov.mv). Abdulla Nazim Ibrahim subsequently served as Health Minister but resigned en masse along with nine other cabinet ministers on 14 April 2026 in a political-instability episode (per 2026 in the Maldives Wikipedia coverage). The substantive identity of the Minister of Health post-14-April-2026 should be verified against presidency.gov.mv, the Ministry of Health website at health.gov.mv, and contemporaneous Maldivian media (Maldives Independent, Sun Online, Avas, Mihaaru).
          - Implication: Engagement on the Maldives health portfolio should be routed via the Permanent Secretary of the Ministry of Health, the CEO of Aasandha (the universal-coverage health insurance scheme), and the CEO of Indira Gandhi Memorial Hospital (IGMH, the main tertiary referral facility in Malé) until the substantive Minister of Health identity is publicly confirmed and added to this register. The 14 April 2026 mass-resignation context indicates significant political volatility in the Muizzu government.
