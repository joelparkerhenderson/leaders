South African health stakeholders:
  - National Department of Health (NDoH):
      - Dr. Pakishe Aaron Motsoaledi (ANC):
          - Title: Minister of Health (since 3 July 2024, in the Government of National Unity)
          - Stakeholder engagement notes:
              - "Minister of Health since 3 July 2024 in the Government of National Unity (GNU) formed by President Cyril Ramaphosa after the May 2024 election, in which the ANC lost its parliamentary majority and entered coalition with the DA, IFP, PA and smaller partners; ANC; medical doctor; returning to the Health portfolio he held 2009-2019 before serving as Minister of Home Affairs 2019-2024 — distinctive institutional continuity over multiple Presidents and political cycles."
              - "On 5 June 2026 tabled the 2026/27 financial year budget vote for the National Department of Health in the National Council of Provinces (NCOP), revealing 11 bids to enhance healthcare infrastructure (IOL coverage); on 6 May 2026 briefed Parliament on Hantavirus implications (TimesLIVE); on 6 February 2026 met newly appointed Provincial HoDs of Health to coordinate the new GNU-era provincial leadership."
              - "Owns the implementation of the National Health Insurance Act (signed into law May 2024 by President Ramaphosa), the response to private-medical-schemes industry legal challenges to NHI, oversight of SAHPRA (medicines and devices regulator), NICD (communicable diseases), OHSC (standards), NHLS (laboratories), and the post-2024-election GNU coalition negotiations on health-policy direction."
              - "Hook: NHI implementation, HIV / TB programmes (South Africa hosts the world's largest HIV-positive cohort and one of the largest TB programmes), Hantavirus and outbreak preparedness, infrastructure investment (the 11 May / June 2026 bids), healthcare workforce shortages, mental health, NCDs and obesity, and BRICS+ health-cooperation land."
              - "Coalition tradeoffs: DA holds the Western Cape and is in the GNU coalition; DA-led provinces and the medical-schemes industry have challenged NHI implementation in court — coalition politics are core to NHI rollout and any health-policy proposal; ANC-DA dynamic shapes every cabinet-level health decision."
          - Tone advice:
              - "Open with NHI implementation, HIV / TB, outbreak preparedness (Hantavirus 2026), healthcare infrastructure, workforce and BRICS+ cooperation — these are Motsoaledi's authored, sustained policy lines across his multi-term ministerial career and the priorities of his 2024-2026 budget votes."
              - "Do not pitch as if the GNU were a single-party government — the ANC-DA-IFP-PA coalition dynamic shapes every health-policy decision; framings that ignore coalition complexity, the WC DA-led province, and the medical-schemes industry's legal challenges to NHI will fail."
