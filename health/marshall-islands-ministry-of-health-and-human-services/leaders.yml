Marshall Islands health stakeholders:
  - Notes on Minister of Health and Human Services of the Republic of the Marshall Islands:
      - Status: Identity of the current Minister of Health and Human Services under the cabinet of President Hilda Heine (who returned to the presidency in January 2024 after the November 2023 election succeeded David Kabua) to be verified against rmigovernment.org and the Marshall Islands Journal.
      - Implication: Engagement on RMI health requires (i) identification of the current titleholder via official channels in Majuro, (ii) recognition of the renewed Compact of Free Association (COFA) with the United States, signed in 2023 and approved by US Congress in March 2024, which provides ~$2.3 billion over 20 years (2024-2043) and continued US medical-system access for RMI citizens — a structural feature that shapes most engagement framings —, (iii) the nuclear-testing legacy from 67 US tests at Bikini and Enewetak Atolls (1946-1958) including the 1954 Castle Bravo detonation; the Rongelap, Utrik, Bikini and Enewetak populations have specific health programmes including the Nuclear Claims Trust Fund and the Special Medical Care Program, and (iv) the climate-existential framing (low-lying atoll state at imminent sea-level-rise risk).
      - Hook: NCDs (very high obesity, diabetes — among the highest globally — with diabetes prevalence reportedly above 30% in some populations), the nuclear legacy (cancer screening and follow-up programmes for affected populations, the Marshall Islands Nuclear Legacy and the Four Atolls Health Care Program), TB, MCH, climate-and-health (centrally — RMI is a leading voice on climate-existential framing), COFA-financed health architecture and US-Hawaii referral pathway, mental health and suicide prevention, kidney disease and dialysis.
      - Tone: Open with COFA-renewal architecture, NCDs (especially diabetes), nuclear legacy, climate-and-health, US-Hawaii referral pathway and TB-MCH — durable lines. Recognise the COFA US-bilateral structure (distinctive in the Pacific along with FSM and Palau) and the nuclear legacy as defining policy memory.
