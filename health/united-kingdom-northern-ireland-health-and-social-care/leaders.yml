HSC Northern Ireland stakeholders:
  - Northern Ireland Assembly — Committee for Health:
      - Philip McGuigan MLA:
          - Title: Chairperson, Committee for Health, Northern Ireland Assembly (2022-2027 mandate)
          - X: https://x.com/PhilipMcGuigan
          - Stakeholder engagement notes:
              - "Sinn Féin MLA for North Antrim since 2016 (and 2003-2007); appointed Chairperson of the Committee for Health on restoration of the Assembly in February 2024 — the parliamentary chair scrutinising HSC legislation, the DoH budget, and Trust performance."
              - "BA Politics, Queen's University Belfast; former Sinn Féin national organiser; constituency profile dominated by rural primary-care access, Causeway Hospital sustainability, and mental-health waiting times."
              - "Committee has used the 2022-2027 mandate to question successive DoH leadership on the £800m deficit projection, the Care Closer to Home plan, encompass roll-out, and the response to the Muckamore Abbey Hospital Inquiry."
              - "Hook: data-driven evidence on Trust-level performance, waiting times, and acute-to-community shift lands because it fuels committee scrutiny lines used in the chamber within the same week."
          - Tone advice:
              - "Lead with disaggregated Trust-level data, rural-access metrics, and concrete shift-left evidence — the committee uses these to test the Minister and Permanent Secretary in public session."
              - "Do not pitch as a delivery partner — McGuigan is a scrutiny chair and his framing must respect that adversarial role, not co-production."
  - Department of Health (Northern Ireland):
      - Mike Nesbitt MLA:
          - Title: Minister of Health (from 28 May 2024)
          - X: https://x.com/mikenesbittni
          - Stakeholder engagement notes:
              - "Ulster Unionist Party MLA for Strangford since 2011; appointed Minister of Health 28 May 2024 in the restored Northern Ireland Executive; previously UUP Leader 2012-2017 and again 30 August 2024 - 31 January 2026."
              - "Pre-politics career as a UTV journalist and newsreader; Victims' Commissioner for Northern Ireland 2008-2010; brings a public-communications and victims-and-survivors lens to the brief."
              - "Has announced he will stand down as an MLA at the next Assembly election — the Care Closer to Home plan and the 2026-27 Budget are the legacy bets; he does not have a long horizon."
              - "Unveiled the 'Care Closer to Home' plan in March 2026 — 17 Integrated Neighbourhood Teams (INTs) each serving around 115,000 people — against an £800m DoH deficit warning for the year."
              - "Hook: digital propositions that demonstrably accelerate INT delivery, reduce acute deficit pressure, or measurably shift activity from hospital to community will land; vision-only pitches will not."
          - Tone advice:
              - "Lead with INT delivery, deficit recovery, and concrete shift-left evidence — Nesbitt is a communicator who needs lines he can take publicly within days, not multi-year transformation theory."
              - "Do not pitch slow-burn transformation or strategic-reform vehicles — he is a minister on a shortening clock with an £800m deficit and a standing-down date; he will mark down anything that lacks an in-mandate delivery window."
      - Mike Farrar CBE:
          - Title: Interim Permanent Secretary, Department of Health (from April 2025; fixed-term initially 12 months with potential for extension; substantive post to be filled by open recruitment)
          - Stakeholder engagement notes:
              - "Appointed Interim Permanent Secretary of the Department of Health from April 2025, succeeding Peter May who retired from the Northern Ireland Civil Service; specialist appointment recruited from outside the NICS."
              - "Career English NHS senior manager: former Chief Executive of the NHS Confederation; Chief Executive of strategic health authorities in North West England, Yorkshire and the Humber, and the Tees; Head of Primary Care at the Department of Health in London."
              - "CBE for services to healthcare; the appointment reflects ministerial preference for an external delivery-credible operator over an internal NICS career path during the Care Closer to Home reset."
              - "Owns DoH-wide delivery of the £800m deficit recovery, the Care Closer to Home plan, the encompass programme, and the response to the Muckamore Abbey Hospital Inquiry — alongside building a substantive succession plan for the role itself."
          - Tone advice:
              - "Lead with English-NHS-comparable benchmarks and confederation-style framings — Farrar's career frame of reference is the NHS Confederation and English STP/ICS experience, not NICS tradition."
              - "Do not assume long-tenure NICS instincts — he is on a fixed-term external mandate and will favour rapid, externally-defensible delivery moves over slow internal consensus."
      - Professor Sir Michael McBride:
          - Title: Chief Medical Officer for Northern Ireland (from September 2006)
          - LinkedIn: https://uk.linkedin.com/in/professor-sir-michael-mcbride-15a912a8
          - Stakeholder engagement notes:
              - "Chief Medical Officer for Northern Ireland since September 2006 — by some margin the longest-tenured CMO in the UK; consultant physician by background; MB BCh BAO with distinction, Queen's University Belfast (1986); Research Fellowship at St Mary's Hospital and Imperial College London (1991) on new drug treatments for HIV."
              - "Knighted in the 2021 Birthday Honours for services to public health in Northern Ireland; previously CEO of the Belfast HSC Trust 2009-2014; led the NI Covid-19 medical response."
              - "Leads on Health and Wellbeing 2026 — Delivering Together, the long-running policy frame for HSC transformation; central voice in the Care Closer to Home and INT design."
              - "Hook: clinical-evidence framings, HIV / infectious-disease research credibility, and population-health propositions land; he is the most stable clinical voice in the system and a key sponsor of any cross-Trust digital clinical change."
          - Tone advice:
              - "Lead with clinical evidence, population health, and Delivering Together heritage — McBride values policy continuity and clinical rigour over novelty."
              - "Do not pitch as an outsider parachuting in with NHS England-style framings — twenty years in post means he reads the NI HSC system in its own terms and will mark down anyone who flattens it into an NHS analogue."
      - Professor Maria McIlgorm OBE:
          - Title: Chief Nursing Officer for Northern Ireland (from 2022)
          - Stakeholder engagement notes:
              - "Appointed Chief Nursing Officer at the Department of Health in 2022; over 40 years' experience in nursing across community and hospital settings in professional, operational and strategic roles in Northern Ireland, Scotland and other parts of the UK."
              - "Awarded an OBE for services to nursing and midwifery in the 2026 New Year Honours; described the CNO role as 'a privilege and an honour' on receiving the honour."
              - "Owns regional nursing and midwifery workforce policy, safe-staffing legislation implementation, and the nursing voice in the encompass roll-out and the Care Closer to Home / INT design."
              - "Hook: workforce-supply, safe-staffing-evidence, and digital-nursing-record propositions land; she values multi-disciplinary clinical evidence over single-vendor framings."
          - Tone advice:
              - "Lead with nursing workforce, safe-staffing, and the nursing contribution to INT design — these are her authentic priorities and align with her authored regional positions."
              - "Do not pitch nursing as an implementation afterthought to a clinician- or technology-led programme — McIlgorm will mark down framings that subordinate the nursing voice to acute medical or vendor narratives."
  - Belfast Health and Social Care Trust (BHSCT):
      - Jennifer Welsh:
          - Title: Chief Executive, Belfast HSC Trust (from October 2025)
          - Stakeholder engagement notes:
              - "Appointed Chief Executive of Belfast HSC Trust in October 2025; previously Chief Executive of the Northern HSC Trust from April 2020 — moved from Northern Trust to Belfast Trust during the 2025 senior-leadership reshuffle."
              - "Over 20 years as a Director in HSC services in Northern Ireland; one of the most experienced operational leaders in the regional system; led the Northern Trust through the Covid-19 response and post-Covid recovery."
              - "Owns the largest HSC Trust by spend and population — including Royal Victoria Hospital, Belfast City Hospital, Mater Hospital and the Royal Belfast Hospital for Sick Children; lead Trust for regional specialist services including major trauma, neurosciences and cardiac surgery."
              - "Hook: regional-specialist-service propositions, encompass second-wave optimisation, and Belfast-tertiary integration with INTs are the natural priorities; her Northern Trust track record makes her credible on rural-to-urban patient-flow conversations."
          - Tone advice:
              - "Lead with regional-specialist-service resilience and encompass optimisation — the Belfast Trust footprint means her decisions ripple across all five Trusts."
              - "Do not pitch as if Belfast were a single-site Trust — she has just inherited the most complex HSC portfolio and will mark down framings that ignore the regional specialist remit."
      - Professor Stuart Elborn:
          - Title: Non-Executive Chair, Belfast HSC Trust (from 1 March 2026)
          - Stakeholder engagement notes:
              - "Appointed Non-Executive Chair of Belfast HSC Trust 1 March 2026, for a term ending no later than 28 February 2030; clinical-academic background as a Professor of Respiratory Medicine; internationally recognised cystic fibrosis researcher."
              - "Previously Dean of the School of Medicine, Dentistry and Biomedical Sciences at Queen's University Belfast; honorary consultant in respiratory medicine at Belfast HSC Trust; brings academic-clinical credibility unusual in an HSC Chair."
              - "Appointment signals ministerial preference for clinical-academic governance during the Care Closer to Home reset and the response to the Muckamore Abbey Hospital Inquiry."
              - "Hook: clinical-research, academic-partnership, and Queen's-collaboration propositions land; he is the natural Chair to engage on research-active digital and translational programmes."
          - Tone advice:
              - "Lead with clinical-academic evidence, Queen's University Belfast collaboration, and research-active framings — Elborn's professional identity is academic medicine."
              - "Do not pitch purely commercial or vendor-driven framings — he will reframe them in research-and-evidence terms, and pitches that cannot survive that reframing will fail."
  - Northern Health and Social Care Trust (NHSCT):
      - Suzanne Pullins:
          - Title: Interim Chief Executive, Northern HSC Trust (from 1 October 2025; substantive recruitment to follow)
          - Stakeholder engagement notes:
              - "Appointed Interim Chief Executive of the Northern HSC Trust from 1 October 2025, succeeding Jennifer Welsh who moved to Belfast HSC Trust; previously Executive Director of Nursing at the Northern Trust from September 2020."
              - "Almost four decades of experience in nursing and healthcare leadership; brings operational management, patient safety and quality improvement credibility into the CEO role from a nursing pedigree."
              - "Owns Antrim Area Hospital, Causeway Hospital and a large community footprint across mid- and north-east Northern Ireland; sustained political scrutiny on Causeway sustainability and emergency-department performance."
              - "Hook: nursing-led service redesign, patient-safety and quality-improvement propositions, and Causeway/Antrim emergency-pathway resilience are the immediate priorities."
          - Tone advice:
              - "Lead with patient safety, nursing-led redesign and emergency-pathway resilience — her clinical pedigree and the Trust's political pressures align on these."
              - "Do not pitch long-horizon strategic-reform vehicles — she is in an interim role with a finite window and will favour deliverable, evidence-led tactical moves."
  - South Eastern Health and Social Care Trust (SEHSCT):
      - Roisin Coulter:
          - Title: Chief Executive, South Eastern HSC Trust (from July 2021)
          - Stakeholder engagement notes:
              - "Appointed Chief Executive of South Eastern HSC Trust in July 2021; one of the longest-tenured Trust CEOs in the current HSC leadership cohort after the 2025 reshuffle."
              - "Owns the Ulster Hospital, Lagan Valley Hospital, Downe Hospital and Ards Community Hospital — the Trust covers the population belt east and south-east of Belfast with significant commuter-into-Belfast patient flows."
              - "South Eastern Trust was an early adopter site for encompass — the regional electronic patient record — giving Coulter the longest operational experience of the platform among Trust CEOs."
              - "Hook: encompass benefits-realisation, cross-Trust digital learning, and Belfast-commuter patient-flow propositions are the natural angles; she is the system's most credible voice on operational EPR experience."
          - Tone advice:
              - "Lead with encompass operational learning and benefits-realisation — her early-adopter experience makes her the credible regional voice and she will engage on detail."
              - "Do not pitch greenfield digital propositions that ignore the encompass roll-out — she will read them as duplicative or destabilising and disengage."
  - Southern Health and Social Care Trust (SHSCT):
      - Dr Maria O'Kane:
          - Title: Chief Executive, Southern HSC Trust
          - Stakeholder engagement notes:
              - "Chief Executive of Southern HSC Trust; clinical background — medical training — distinguishing her from the predominantly non-clinical CEO cohort across the HSC."
              - "Owns Craigavon Area Hospital, Daisy Hill Hospital (Newry) and South Tyrone Hospital — including the cross-border patient-flow pressures with the Republic of Ireland health system around Newry and Armagh."
              - "Southern Trust was a Wave 2 encompass deployment site alongside Western Trust; O'Kane has been a public voice on the realities of large-scale EPR roll-out in HSC."
              - "Hook: cross-border health, rural-acute sustainability (Daisy Hill), and clinically-led digital change propositions land; her medical background means she will probe clinical-safety detail rigorously."
          - Tone advice:
              - "Lead with clinical-safety framing, cross-border patient-flow evidence, and Daisy Hill sustainability — these are her live operational pressures."
              - "Do not pitch digital programmes without clinical-safety data and a credible engagement plan for clinicians — her medical background means superficial clinical claims will not land."
  - Western Health and Social Care Trust (WHSCT):
      - Karen Hargan:
          - Title: Chief Executive, Western HSC Trust (from 1 May 2026)
          - Stakeholder engagement notes:
              - "Appointed Chief Executive of Western HSC Trust 1 May 2026, succeeding Neil Guckian who retired at the end of April 2026 after almost five years in post; joined the Trust in 2021 prior to the CEO appointment."
              - "Owns Altnagelvin Area Hospital (Derry/Londonderry), South West Acute Hospital (Enniskillen), Tyrone County Hospital (Omagh) and the Trust's substantial rural and cross-border footprint with Donegal."
              - "Inherits the encompass roll-out (Western was a Wave 2 site with Southern Trust), continued political pressure on South West Acute Hospital service configuration, and the cross-border North West Cancer Centre relationship."
              - "Hook: rural-acute resilience, cross-border (NI / Republic) service planning, and post-go-live encompass optimisation are the natural opening angles; new in post means appetite for early credibility wins is high."
          - Tone advice:
              - "Lead with South West Acute sustainability, cross-border North West service planning, and rural digital access — these are the Trust's defining political and operational pressures."
              - "Do not pitch Belfast-centric framings — Western Trust's identity is its westernmost, cross-border, rural footprint, and centrist framings will be read as missing the point."
  - Northern Ireland Ambulance Service (NIAS):
      - Maxine Paterson:
          - Title: Interim Chief Executive, Northern Ireland Ambulance Service (from April 2025; substantive recruitment to follow)
          - Stakeholder engagement notes:
              - "Appointed Interim Chief Executive of NIAS in April 2025; previously NIAS Deputy Chief Executive from March 2023; joined NIAS in April 2020 as Director of Planning, Performance and Corporate Services."
              - "Non-clinical operational and corporate-services background; the Trust's longest-running senior operational leader through the post-Covid demand surge and ED-handover-delay crisis."
              - "Owns regional 999 response, urgent and emergency care interface with all five Trusts, and the NIAS contribution to the Care Closer to Home INT model — ambulance is a structural bottleneck for the wider shift-left."
              - "Hook: ED-handover-delay reduction, alternative-care-pathway technology, and INT-aligned community-response propositions are the live priorities; her interim status means appetite for fast operational wins is high."
          - Tone advice:
              - "Lead with handover-delay reduction, alternative-pathway data, and operational analytics — she is a planning and performance leader by background and will engage on hard numbers."
              - "Do not pitch long-horizon strategic-reform vehicles — interim status and acute pressure mean propositions must show delivery within months, not years."
  - Public Health Agency (PHA):
      - Aidan Gilmore:
          - Title: Chief Executive, Public Health Agency
          - Stakeholder engagement notes:
              - "Chief Executive of the Public Health Agency; the PHA is the regional body responsible for public health, health protection, health improvement, and the commissioning of public-health and research-and-development programmes across HSC."
              - "PHA's remit covers screening programmes, immunisation, health-protection response (carried forward from the Covid-19 response), suicide-prevention strategy (Protect Life 2), and the regional health-inequalities response."
              - "Hook: population-health-management, health-inequalities-targeted digital propositions, and screening / immunisation pathway propositions are the natural engagement angles; PHA is the route into regional public-health programmes that cross Trust boundaries."
          - Tone advice:
              - "Lead with health-inequalities, population-health-management evidence, and cross-Trust public-health programmes — these are PHA's authored remit."
              - "Do not pitch acute-hospital productivity propositions — PHA's frame is prevention, public-health, and inequalities, not throughput."
      - Dr Joanne McClean:
          - Title: Director of Public Health, Public Health Agency
          - Stakeholder engagement notes:
              - "Director of Public Health at the PHA; made Honorary Professor of Public Health Practice by Queen's University Belfast in February 2023; consultant in public health medicine by training."
              - "Senior PHA public-health voice during the Covid-19 response; sits on regional health-protection, screening, and inequalities governance; the natural regional clinical lead on population-health framings."
              - "Owns the public-health professional leadership across the PHA — health protection, health improvement, and the public-health input into commissioning decisions made by SPPG."
              - "Hook: population-health-management, surveillance, screening, and inequalities propositions land; her Queen's honorary chair makes her the natural bridge into academic-public-health partnerships."
          - Tone advice:
              - "Lead with epidemiology, surveillance and inequalities evidence — her professional identity is consultant public-health medicine, not management."
              - "Do not pitch propositions framed only at acute trusts — she will reframe them through a population denominator, and weak denominator stories will fail."
  - Strategic Planning and Performance Group (SPPG):
      - Notes on the Strategic Planning and Performance Group:
          - Status: The SPPG sits inside the Department of Health and assumed the commissioning and performance functions of the dissolved Health and Social Care Board on 1 April 2022; SPPG Chief Officer and directorate leads are named here only when their role and remit are publicly confirmed by the Department of Health.
          - Implication: Do not look for a separate Health and Social Care Board CEO — there has been none since 31 March 2022; route engagement on commissioning and performance through the Department of Health Permanent Secretary and the Minister until SPPG directorate leadership is publicly confirmed and added to this register.
