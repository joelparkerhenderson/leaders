Swedish health and medical care stakeholders:
  - Socialdepartementet (Ministry of Health and Social Affairs):
      - Jakob Forssmed (KD):
          - Title: Socialminister (Minister for Social Affairs and Public Health) (från oktober 2022)
          - Stakeholder engagement notes:
              - "Kristdemokraterna (KD); appointed Socialminister in the Kristersson cabinet 18 October 2022; member of the Riksdag since 2014; first deputy chair of the Christian Democrats since 2015."
              - "Brief covers social services, public health, dental policy, pharmaceuticals, alcohol and tobacco policy — the Sjukvårdsminister (Elisabet Lann, KD) holds the separate care-delivery brief in the same ministry."
              - "Long-running public posture on loneliness, mental health, and youth screen-time policy — early author of the 2024-2026 KD positioning that produced the screen-time and youth-wellbeing framings."
              - "Active counterpart for SKR, Socialstyrelsen, Folkhälsomyndigheten, Läkemedelsverket, TLV, E-hälsomyndigheten and IVO on Ministry-level reform decisions; the senior Minister on the social-and-public-health side of the brief."
              - "Hook: mental-health, youth and addictive-substance policy, pharmaceutical access (TLV), and public-health-prevention propositions land; pure acute-throughput pitches are not his brief and will be redirected."
          - Tone advice:
              - "Lead with mental health, youth wellbeing, screen-time, public-health prevention, and pharmaceutical access — these are his authored Ministry priorities since 2022."
              - "Do not pitch acute hospital productivity or kömiljarden mechanics direct to him — that is the Sjukvårdsminister's brief, and he will route the conversation accordingly."
      - Elisabet Lann (KD):
          - Title: Sjukvårdsminister (Minister for Health Care) (från 9 september 2025)
          - Stakeholder engagement notes:
              - "Kristdemokraterna (KD); appointed Sjukvårdsminister 9 September 2025 in the Kristersson cabinet, replacing Acko Ankarberg Johansson who unexpectedly left the government on the same day."
              - "Pre-government background in Göteborg municipal politics; brings a regional and municipal governance lens to a national portfolio that is implemented through the 21 regions."
              - "Stated on assuming office that she aims to increase national-government control of healthcare delivery to reduce waiting times — a substantive shift from the Swedish convention of regional self-government."
              - "Through 2026 active on international health: visited Kyiv and Lviv in May 2026 on Ukraine health and medical care; met partners in Cairo in February 2026 on care for severely injured patients from Gaza; presented a global health support package April 2026."
              - "Hook: kömiljarden delivery, national-level steering of the regions, waiting-time data and reporting, and international-medical-evacuation propositions are the live priorities; her short tenure (from September 2025) means appetite for rapid, demonstrable wins is high."
          - Tone advice:
              - "Lead with kömiljarden mechanics, national steering, waiting-time evidence, and rapid-implementation propositions — she is publicly committed to tightening central control of regional delivery."
              - "Do not pitch as if regional self-government is sacrosanct — her stated direction of travel is more state steering, not less, and regional-autonomy framings will read as defending the status quo she is trying to move."
  - Socialstyrelsen (National Board of Health and Welfare):
      - Björn Eriksson:
          - Title: Generaldirektör (Director General) (från 15 augusti 2024; sexårigt förordnande)
          - LinkedIn: https://se.linkedin.com/in/bj%C3%B6rn-eriksson-1245aa28
          - Stakeholder engagement notes:
              - "Tillträdde som GD för Socialstyrelsen 15 augusti 2024 på ett sexårigt förordnande; previously generaldirektör of Läkemedelsverket from 2021; physician by training, specialised in cardiology."
              - "One of the most experienced agency heads in the Swedish health system; the moves Läkemedelsverket → Socialstyrelsen and Wigzell Socialstyrelsen → Folkhälsomyndigheten in August 2024 were a coordinated agency-leadership rotation."
              - "Socialstyrelsen owns the national knowledge guidance (nationella riktlinjer), the national health registries (kvalitetsregister governance), professional licensing for healthcare professionals, and the response to crises across health and social care."
              - "Reform agenda under his tenure has emphasised tighter alignment of national guidelines with the kunskapsstyrning system run jointly with the regions through SKR, and a sharpened focus on equity of access across the 21 regions."
              - "Hook: national guidelines, kvalitetsregister, professional licensing, kunskapsstyrning integration, and equity-of-access propositions land; he is the natural sponsor for any cross-region clinical-evidence programme."
          - Tone advice:
              - "Lead with national guidelines, kvalitetsregister, kunskapsstyrning, professional licensing, and equity-of-access — these are Socialstyrelsen's authored mission and his clinical-leader frame of reference."
              - "Do not pitch as if Socialstyrelsen is a delivery agency — its leverage is normative and regulatory, not operational; propositions that assume direct delivery authority will not land."
  - Folkhälsomyndigheten (Public Health Agency of Sweden):
      - Olivia Wigzell:
          - Title: Generaldirektör (Director General) (sexårigt förordnande; tidigare tillförordnad sedan augusti 2024, substantiv från senare 2024)
          - LinkedIn: https://se.linkedin.com/in/olivia-wigzell-b2a18030
          - Stakeholder engagement notes:
              - "Substantive Generaldirektör of Folkhälsomyndigheten on a six-year appointment; previously generaldirektör of Socialstyrelsen, where she led that agency through the Covid-19 response and the post-pandemic governance review."
              - "Background as a senior civil servant rather than a clinician; experience leading large public agencies through reform programmes — recognised counterpart for the Ministry on cross-agency public-health programmes."
              - "Folkhälsomyndigheten owns infectious-disease surveillance and response, vaccination programmes, health-inequalities reporting, alcohol-tobacco-narcotics-and-gambling public-health policy, and environmental health."
              - "Public-health priorities under her tenure: rebuilding the agency's credibility post-Covid, strengthening surveillance and emergency-response capacity, and operationalising the public-health frame of the Forssmed mental-health agenda."
              - "Hook: surveillance and pandemic-preparedness, mental-health-public-health bridging, vaccination delivery, and health-inequalities propositions land; vendor proposals that ignore the post-Covid trust-rebuilding context will not."
          - Tone advice:
              - "Lead with surveillance, mental-health-public-health bridging, vaccination, and inequalities — these are Folkhälsomyndigheten's authored mission and align with Forssmed's Ministry priorities."
              - "Do not pitch the Folkhälsomyndigheten brand as if pandemic-era trust were intact — Wigzell is rebuilding institutional credibility, and propositions that lean on pre-2024 authority will read as tone-deaf."
  - Läkemedelsverket (Medical Products Agency):
      - Notes on Läkemedelsverket:
          - Status: Joakim Brandenberg has been serving as tillförordnad (acting) generaldirektör since Björn Eriksson moved to Socialstyrelsen on 15 August 2024. Substantive recruitment for a new generaldirektör has been continuing into 2026; the chair-of-network role at the European Medicines Agencies Network previously held by Eriksson should be tracked separately.
          - Implication: Engagement on Swedish medicines regulation, clinical-trial authorisation, falsified-medicines work, and the EU-level network role should be routed through the acting GD's office and the agency's directors; long-horizon strategic asks should wait for the substantive appointment to land.
  - Inspektionen för vård och omsorg (IVO; Health and Social Care Inspectorate):
      - John Ahlberk:
          - Title: Generaldirektör (Director General), Inspektionen för vård och omsorg (verifiera aktualitet — IVO övergår till styrelseledning från 15 juni 2026)
          - LinkedIn: https://www.linkedin.com/in/john-ahlberk-375023150/
          - Stakeholder engagement notes:
              - "Generaldirektör of IVO during the agency's reform period; previously generaldirektör of Statens haverikommission (Swedish Accident Investigation Authority); career civil servant with a regulatory and inquiry background."
              - "IVO owns the inspection and supervision of health and social care providers — both public regions and private operators — including elderly care, healthcare, and the licensing of new healthcare establishments."
              - "Government decision in March 2026: from 15 June 2026 IVO transitions from single-DG leadership to a board-led governance model (styrelseledning), with a continued generaldirektör role but main responsibility shifting to the board. Substantive board composition still to be appointed."
              - "Hook: inspection-data, risk-based supervision, elderly-care quality, and the new governance model's first-year priorities are the live engagement angles; the upcoming transition makes 2026 unusual."
          - Tone advice:
              - "Lead with risk-based supervision, inspection-data analytics, elderly-care quality, and the board-transition operational priorities — these are the agency's authored remit during the reform."
              - "Do not pitch long-horizon strategic transformation while the board-led governance model is being stood up — until the board is appointed and ways of working settle, the agency's strategic posture is unstable."
  - Tandvårds- och läkemedelsförmånsverket (TLV; Dental and Pharmaceutical Benefits Agency):
      - Magnus Thyberg:
          - Title: Generaldirektör (Director General) (från 1 januari 2026; sexårigt förordnande)
          - Stakeholder engagement notes:
              - "Tillträdde som GD för TLV 1 januari 2026 på ett sexårigt förordnande; pharmacist by training; previously head of the Department for Knowledge Development at Region Stockholm; has earlier worked at Apoteket AB, SKL (now SKR), and as a department head inside TLV itself."
              - "Brings unusual cross-system experience: regional knowledge management, national agency leadership, the regions' association, and the state pharmacy company — equally fluent across the public-pharmaceutical value chain."
              - "TLV owns reimbursement decisions on outpatient prescription medicines, medical devices, and dental care benefits — the national HTA function with statutory authority over the pharmaceutical benefits scheme (Läkemedelsförmånerna)."
              - "Hook: HTA methodology, managed-entry agreements, advanced-therapy reimbursement (gene and cell therapies), and pharmacy-system propositions land; his Region Stockholm background gives him region-side credibility unusual for a TLV GD."
          - Tone advice:
              - "Lead with HTA evidence, managed-entry agreements, advanced-therapy reimbursement, and region-aligned implementation — these are his authored expertise areas at the start of a six-year term."
              - "Do not pitch reimbursement framings that ignore region-level uptake mechanics — Thyberg's Region Stockholm background means he will probe the regional implementation chain, and propositions that stop at the national decision will not land."
  - E-hälsomyndigheten (eHealth Agency):
      - Gunilla Nordlöf:
          - Title: Generaldirektör (Director General) (förordnande förlängt till 31 juli 2026; substantiv rekrytering pågår)
          - LinkedIn: https://se.linkedin.com/in/gunilla-nordl%C3%B6f-b0938339
          - Stakeholder engagement notes:
              - "Tillträdde som GD för E-hälsomyndigheten 1 juli 2022; previously generaldirektör for Tillväxtverket (the Swedish Agency for Economic and Regional Growth); appointment originally set to expire February 2026 but extended by the government until 31 July 2026."
              - "Open recruitment for a substantive successor started January 2026 through the Social Department's listing process; Nordlöf is in a finishing-mode period through the first half of 2026."
              - "E-hälsomyndigheten owns the national e-prescription infrastructure (Receptdepån), the pharmacy data infrastructure, the national patient summary (NPÖ) governance, and the cross-system national digital health infrastructure under Vision e-hälsa 2025."
              - "Hook: e-prescription infrastructure, NPÖ, FHIR adoption, and Nordic cross-border e-health propositions land; the finishing-mode period means appetite for handover-friendly, narrowly-scoped propositions is higher than for new strategic bets."
          - Tone advice:
              - "Lead with e-prescription, NPÖ, FHIR-based national infrastructure, and Nordic cross-border e-health — these are the agency's authored mission under Vision e-hälsa 2025."
              - "Do not pitch long-horizon strategic-platform reorganisations during the finishing-mode period — wait for the substantive successor before staking strategic asks."
  - Sveriges Kommuner och Regioner (SKR; Swedish Association of Local Authorities and Regions):
      - Anders Henriksson (S):
          - Title: Ordförande (Chair), Sveriges Kommuner och Regioner (från 2023; verifiera aktualitet inför 2026 års kongress)
          - Stakeholder engagement notes:
              - "Socialdemokraterna (S); elected Ordförande of SKR in 2023 following the resignation of Anders Knape (M); regional politician in Region Kalmar län; long-standing Socialdemokraterna profile on regional health and elderly care."
              - "SKR is the employer and member organisation for the 21 regions and 290 municipalities — the principal counterparty to the state on collective negotiation, joint reform programmes (God och nära vård, kunskapsstyrning), and the regions' shared digital infrastructure."
              - "Owns the regions-side voice on kömiljarden delivery, the integration of God och nära vård into regional planning, the kunskapsstyrning national knowledge system, and the regions' joint procurement and digital platforms."
              - "Hook: God och nära vård delivery, kunskapsstyrning, joint procurement, regional digital infrastructure, and kömiljarden mechanics are the live engagement angles; SKR is the only national-scale counterparty for multi-region reform."
          - Tone advice:
              - "Lead with regions-side delivery, God och nära vård, kunskapsstyrning, joint procurement, and kömiljarden mechanics — these are SKR's authored programmes and the dimensions on which it negotiates."
              - "Do not pitch state-centric or national-steering framings — SKR's institutional role is to defend regional self-government against national encroachment; framings that read as state-side will be rebuffed."
