India Ministry of Health and Family Welfare stakeholders:
  - Ministry of Health and Family Welfare (MoHFW):
      - Shri Jagat Prakash Nadda (BJP):
          - Title: Union Minister of Health and Family Welfare and Union Minister of Chemicals and Fertilizers (from 9 June 2024)
          - Stakeholder engagement notes:
              - "Union Minister of Health and Family Welfare and Union Minister of Chemicals and Fertilizers from 9 June 2024 in the Modi III government; BJP National President 2020-2024; previously Union Minister of Health and Family Welfare 2014-2019 in Modi I; 34th Minister of Health and 25th Minister of Chemicals and Fertilizers in independent India."
              - "Dual portfolio architecture: combined Health and Pharmaceuticals (Chemicals and Fertilizers) gives him the regulatory, pricing, drug-access and PM-JAY policy levers across India's pharmaceutical sector and over Ayushman Bharat's ~500 million eligible beneficiaries."
              - "Launched SAHI and BODH initiatives at the India AI Impact Summit 2026 to strengthen the 'responsible health AI ecosystem' — Health AI is a definitional theme of the second Nadda mandate; virtually addressed the 8th edition of 'Advantage Health Care – India 2026' to position India as a medical-value-travel destination."
              - "Owns the National Health Mission, Ayushman Bharat PM-JAY expansion, the post-Covid health infrastructure programme (PM-ABHIM), the CDSCO regulatory file, ICMR research portfolio, NMC reforms (replacing the former Medical Council of India), and India's WHO, BRICS, and G20 multilateral positioning on health."
              - "MoS team: Anupriya Patel (Apna Dal-S) and Prataprao Ganpatrao Jadhav (Shiv Sena) — coalition-balancing MoS appointments that reflect NDA coalition partners' political interests."
              - "Hook: PM-JAY expansion, Health AI (SAHI / BODH), pharma export and bulk-drug parks, medical-value-travel (Heal in India), digital public infrastructure for health (Ayushman Bharat Digital Mission / ABDM), and NMC reforms land; State-bypassing framings on delivery do not land."
          - Tone advice:
              - "Lead with PM-JAY, Health AI (SAHI / BODH), pharma export, medical-value-travel and Ayushman Bharat Digital Mission — these are Nadda's authored, sustained policy lines and the political signature of Modi III on health."
              - "Do not pitch as if Union Health were operational delivery — Health is a State subject under the Seventh Schedule, and State Health Ministers run delivery; framings must respect federal-State competence and Nadda's institutional politeness about it."
