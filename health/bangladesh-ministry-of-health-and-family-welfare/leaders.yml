Bangladesh health stakeholders:
  - Ministry of Health and Family Welfare (MoHFW):
      - Nurjahan Begum (interim government appointee):
          - Title: Adviser for Health and Family Welfare (equivalent to Minister of Health) (since August 2024, in the Muhammad Yunus interim government)
          - Stakeholder engagement notes:
              - "Adviser for Health and Family Welfare in the Muhammad Yunus interim government since August 2024, established after the August 2024 student-led uprising that ended the Sheikh Hasina (Awami League) government; the role is functionally equivalent to Minister of Health (previous office-holder was Samanta Lal Sen under Hasina); the title 'Adviser' rather than 'Minister' reflects the interim-government constitutional structure."
              - "Public-policy lines through 2026: urged doctors to refrain from political involvement and prioritise their healthcare duties (in meetings with divisional and district-level health officials per New Age); participated as Chief Guest in national stakeholder consultations for the landmark 2026 tobacco-control legislative reform (covered by WHO Bangladesh); commented on the upcoming national referendum and general election preparation cycle."
              - "Owns coordination of the public-health network through DGHS, DGFP, and DGDA; oversight of IEDCR (Institute of Epidemiology, Disease Control and Research); chairs national health-security and pandemic-preparedness committees; manages the MoHFW budget through both the Health Services Division and the Medical Education and Family Welfare Division."
              - "Operates in a fluid political environment: BSS reports cover her 'Yes' campaign for the referendum to 'build a beautiful Bangladesh' (January 2026); transition timing for general elections and a future post-election government remains a key open variable for the duration of her tenure."
              - "Hook: tobacco control (landmark 2026 legislation), maternal and neonatal mortality reduction, dengue outbreaks (annual scale-up), cholera (with icddr,b research base in Dhaka), primary care and community-clinic strengthening, BSMMU and tertiary-network reform, and climate-health adaptation land."
          - Tone advice:
              - "Open with tobacco control, maternal and child health, dengue and climate health, and primary-care community-clinic strengthening — these are her authored 2026 public lines and the interim government's signature reform areas."
              - "Do not assume political continuity beyond the interim transition — the political environment is fluid (national referendum and election prospects); long-term commitments and multi-year strategic asks will be filtered or deferred to a post-election successor."
