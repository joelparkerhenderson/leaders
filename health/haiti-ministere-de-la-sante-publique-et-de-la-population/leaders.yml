Parties prenantes du système de santé haïtien:
  - Notes sur le Ministre de la Santé Publique et de la Population de la République d'Haïti:
      - Status: Identité substantive du Ministre du MSPP sous le gouvernement de transition d'Alix Didier Fils-Aimé (Premier Ministre depuis novembre 2024, succédant à Garry Conille qui avait été remercié par le Conseil Présidentiel de Transition / CPT) à vérifier contre la Primature (primature.gouv.ht), le MSPP (mspp.gouv.ht) et l'Agence Haïtienne de Presse (AHP). Le Nouvelliste, Haiti Libre, Alterpresse et Le National sont des canaux complémentaires. Le contexte politique haïtien est en transition continue depuis l'assassinat du Président Jovenel Moïse le 7 juillet 2021 ; le Conseil Présidentiel de Transition (CPT) à neuf membres représentant plusieurs forces politiques (Pitit Desalin, Fanmi Lavalas, EDE/RED, Collectif du 30 janvier, Accord du 21 décembre, et observateurs) gouverne depuis avril 2024 avec rotation de la présidence du CPT.
      - Implication: L'engagement sur la santé haïtienne nécessite (i) l'identification du titulaire actuel via les canaux officiels de Port-au-Prince, (ii) la reconnaissance impérative du contexte sécuritaire — la coalition de gangs Viv Ansanm contrôle environ 85% de la zone métropolitaine de Port-au-Prince, l'Hôpital Universitaire de l'État d'Haïti (HUEH, le principal hôpital public) a été largement détruit et pillé en 2024, de nombreux établissements ont fermé ou opèrent à capacité très réduite, MSF a suspendu ses opérations à plusieurs reprises en raison de l'insécurité, et l'accès humanitaire est conditionné par la sécurité —, et (iii) la lecture de la dépendance écrasante aux partenaires (PAHO/OMS, UNICEF, FNUAP, MSF, ICRC, USAID, BID, Banque Mondiale, UE, Canada bilatéral, Brésil bilatéral, MSS — Mission Multinationale de Soutien à la Sécurité menée par le Kenya).
      - Hook: choléra (réémergence depuis octobre 2022 après quelques années sans cas), mpox, malnutrition aiguë sévère (Haïti est en crise alimentaire aiguë selon les classifications IPC), blessures par armes à feu et chirurgie d'urgence (afflux constant lié à l'insécurité), santé mentale et traumatisme, santé maternelle et infantile (mortalité maternelle parmi les plus élevées de l'Hémisphère Ouest), reconstruction de l'HUEH et des hôpitaux endommagés, paludisme, lymphatique filariasis (programme d'élimination), VIH (programme historique PEPFAR), choix de vaccination de routine en chute, et coordination humanitaire dans un environnement d'accès restreint.
      - Tone: Ouvrir avec choléra, mpox, malnutrition aiguë sévère, blessures et chirurgie d'urgence, santé maternelle et infantile, reconstruction de l'HUEH et coordination humanitaire — priorités opérationnelles dominantes en 2025-2026. Ne pas ignorer le contexte sécuritaire (l'accès est la contrainte première), ne pas importer des framings République Dominicaine voisine (États souverains distincts avec des architectures, langues officielles — créole et français vs. espagnol — et trajectoires politiques très différentes; la frontière hispaniola est politiquement sensible) et ne pas sous-estimer la dimension humanitaire (Haïti est en crise humanitaire aiguë et la lecture développementale doit être adaptée).
