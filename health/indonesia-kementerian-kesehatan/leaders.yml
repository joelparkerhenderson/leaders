Indonesian health stakeholders / Pemangku kepentingan kesehatan Indonesia:
  - Kementerian Kesehatan Republik Indonesia (Kemenkes):
      - Budi Gunadi Sadikin:
          - Title: Menteri Kesehatan Republik Indonesia (Minister of Health) (Kabinet Merah Putih, sejak 21 Oktober 2024 — kelanjutan dari Kabinet Indonesia Maju II)
          - Stakeholder engagement notes:
              - "Menteri Kesehatan sejak 23 Desember 2020 dalam Kabinet Indonesia Maju II (pemerintahan Jokowi); diangkat kembali oleh Presiden Prabowo Subianto pada 21 Oktober 2024 dalam Kabinet Merah Putih untuk masa jabatan 2024-2029 — continuity tidak biasa lintas dua presiden, dan diangkat dengan tiga pesan khusus dari Presiden Prabowo."
              - "Lahir 6 Mei 1964 di Bogor; Sarjana Teknik Fisika dari Institut Teknologi Bandung (ITB, 1988) — hanya Menteri Kesehatan Indonesia kedua tanpa latar belakang pendidikan kedokteran formal; karier sebelumnya: IT (IBM Asia-Pasifik di Tokyo), perbankan komersial (Bank Bali, ABN AMRO Indonesia & Malaysia, Bank Danamon, Adira Quantum), Direktur Utama Bank Mandiri, Wakil Menteri BUMN."
              - "Owns kebijakan Kemenkes, sistem JKN melalui koordinasi dengan BPJS Kesehatan (>270 juta peserta), pengawasan BPOM, reformasi Transformasi Sistem Kesehatan dengan enam pilar (layanan primer, layanan rujukan, ketahanan kesehatan, pembiayaan kesehatan, SDM kesehatan, teknologi kesehatan), warisan vaksinasi COVID-19, dan kesiapsiagaan pasca-pandemi."
              - "Lini publik 2026: lima strategi peningkatan pelayanan kesehatan ibu dan anak; eliminasi TB pada 2030; pengurangan stunting; peluncuran skrining kanker; transformasi digital melalui platform SatuSehat; dan komitmen Indonesia di BRICS+ dan G20 dalam diplomasi kesehatan."
              - "Wakil Menteri Kesehatan Dante Saksono Harbuwono dilaporkan melanjutkan masa jabatannya dalam pemerintahan kedua — kontinuitas tim manajemen tinggi Kemenkes."
              - "Hook: Transformasi Sistem Kesehatan (Enam Pilar), BPJS Kesehatan reform dan keberlanjutan finansial, kesehatan digital (SatuSehat), eliminasi TB, pengurangan stunting, kesehatan ibu-anak, dan kerja sama BRICS+ / G20 mendarat."
          - Tone advice:
              - "Buka dengan Transformasi Sistem Kesehatan, layanan primer, kesehatan digital (SatuSehat), TB, dan stunting — ini adalah kerangka Enam Pilar dan jajaran publik yang Sadikin pertahankan lintas dua pemerintahan."
              - "Jangan pitch seolah BPJS Kesehatan sebagai pembayar pasif — BPJS otonom secara statuter dan masif secara operasional; engagement pada pembiayaan dan kontrak provider harus melibatkan BPJS Kesehatan secara langsung sebagai counterparty."
