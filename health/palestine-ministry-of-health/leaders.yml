Palestinian health stakeholders:
  - Ministry of Health, State of Palestine (Palestinian Authority — Ramallah):
      - Dr. Maged Abu Ramadan (Independent technocrat in Mustafa government):
          - Title: Minister of Health, State of Palestine (since March 2024 in the Mustafa technocratic government)
          - Stakeholder engagement notes:
              - "Minister of Health in the technocratic government of Prime Minister Mohammad Mustafa formed in March 2024 under President Mahmoud Abbas; ophthalmologist by training; previously served as Mayor of Gaza (1997-2005) under the PLO-PA framework and ran the Gaza Eye Hospital; appointed as part of a deliberately technocratic cabinet intended to manage the immediate post-October-2023 humanitarian and reconstruction agenda; verify currency against the State of Palestine Council of Ministers (palestinecabinet.gov.ps) and WAFA (Palestinian News and Information Agency, wafa.ps)."
              - "Owns PA MoH policy and budget across the West Bank (Ramallah-headquartered with hospitals in Ramallah, Nablus, Hebron, Jenin, Bethlehem, Tulkarm, Jericho, Qalqilya, Salfit, Tubas), coordination with the East Jerusalem hospital network (Augusta Victoria, Makassed, St. Joseph, Princess Basma, St. John Eye Hospital — these serve as the apex tertiary referral network for Palestinians and operate under specific administrative status under Israeli control of East Jerusalem), the PA-led coordination role for Gaza post-conflict reconstruction within the 2025 transitional architecture, UNRWA Health Programme coordination, the Palestine Red Crescent Society (PRCS) and Palestinian Medical Relief Society partnerships, donor coordination (WHO occupied Palestinian territory office, UNICEF, UNFPA, UNHCR, EU-PEGASE, World Bank, AHLC — Ad Hoc Liaison Committee, OIC, Arab Fund for Economic and Social Development, Qatari, Saudi, UAE, Kuwaiti, Norwegian, Swiss, German, French and Italian bilaterals), and WHO Eastern Mediterranean Region (EMRO) and Arab League and OIC diplomacy."
              - "Hook: Gaza reconstruction — the absolutely central operational priority of 2025-2026 — including hospital reconstruction (the Gaza health system was substantially destroyed in the October 2023 to early 2025 conflict; Al-Shifa, Indonesian Hospital, Kamal Adwan and many others rendered inoperative or severely damaged), conflict-trauma surgical services and prosthetics, mental health and psychosocial support (one of the world's most acute mental-health and trauma burdens), severe acute malnutrition (famine conditions in Gaza), cholera, polio (an emergency polio campaign in Gaza in 2024 responded to detected vaccine-derived poliovirus) and mpox preparedness, immunisation catch-up for children, non-communicable diseases (PA territories have high NCD burden), maternal and child health, the East Jerusalem hospitals sustainability (financial and operational fragility under Israeli administrative constraints), UNRWA Health Programme coordination, and the post-2024 PA-Gaza unified-administration agenda under the 2025 ceasefire and reconstruction framework — these are the operational lines."
          - Tone advice:
              - "Open with Gaza reconstruction (centrally), trauma surgical services and prosthetics, mental health and psychosocial support, severe acute malnutrition, cholera and polio response, NCDs, East Jerusalem hospitals sustainability and UNRWA coordination — these are the operational priorities of 2025-2026."
              - "Do not conflate the PA MoH (Ramallah-based, State of Palestine), the historically Hamas-administered Gaza MoH (now in transition under the 2025 framework) and the UNRWA Health Programme (UN agency with its own clinic and refugee-coverage architecture) — three distinct authorities with distinct mandates and operational coverage; do not ignore the Gaza post-conflict reconstruction context (framings that assume pre-October-2023 architecture are inaccurate); and do not ignore the East Jerusalem hospital network's specific administrative and financial fragility."
  - Notes on the historically Hamas-administered Gaza Ministry of Health and the 2025 transitional administration:
      - Status: The Gaza MoH was historically administered by Hamas as the de facto authority in Gaza from 2007. Under the 2025 ceasefire and Cairo / Riyadh-mediated transitional framework, the Gaza health administration is in transition and the substantive identity of leadership is in flux. The PA-led unified administration agenda envisions integration but operational realities, security architecture and political negotiations continue. Verify the current Gaza health administration counterpart against the post-ceasefire arrangements published through Egyptian and Qatari mediation channels, WHO Gaza Field Presence, the Palestinian Civil Society Coalition for Gaza Reconstruction, and PA MoH coordination communications.
      - Implication: Engagement on Gaza health requires acknowledging the transitional architecture and the practical access requirements; framings must accommodate the evolving authority structures, the unprecedented scale of destruction of medical infrastructure, the famine conditions and the trauma burden.
  - Notes on UNRWA Health Programme:
      - Status: UNRWA (United Nations Relief and Works Agency for Palestine Refugees in the Near East) operates a parallel health programme for Palestine refugees in the West Bank, Gaza, Jordan, Lebanon and Syria; it runs its own primary-care clinic network and is a critical component of the Palestinian health architecture. UNRWA Health Programme leadership reports to the UNRWA Commissioner-General; verify current leadership against unrwa.org. UNRWA's funding and operational sustainability is under chronic political pressure (notably from US, Israeli and some donor decisions) which affects continuity of services.
