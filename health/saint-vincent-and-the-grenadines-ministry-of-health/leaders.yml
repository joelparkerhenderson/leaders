Vincentian health stakeholders:
  - Ministry of Health, Wellness and the Environment:
      - Hon. St. Clair Prince (ULP):
          - Title: Minister of Health, Wellness and the Environment
          - Stakeholder engagement notes:
              - "Minister of Health in the Ralph Gonsalves Unity Labour Party (ULP) government — Gonsalves has been Prime Minister since 29 March 2001, one of the longest-serving in the Caribbean (the 'Comrade Ralph' political legacy is central to Vincentian politics); Saint Vincent and the Grenadines is a Commonwealth realm under King Charles III represented by Governor-General Susan Dougan; verify currency against gov.vc and iWitness News."
              - "Owns MoH policy and budget, the Milton Cato Memorial Hospital in Kingstown (apex public facility), the Mental Health Centre, district hospitals (Chateaubelair, Georgetown), the Bequia Hospital and Grenadines clinics (Mayreau, Canouan, Union Island), polyclinics across the seven parishes, coordination with the Cuban medical brigade (a sustained Cuban-medical-cooperation arrangement reflecting SVG's ALBA membership), Venezuelan engagement (oil-and-health cooperation legacy), the Modern Medical Centre Complex project (Taiwanese-financed multi-specialty facility under construction near Argyle), and CARICOM, CARPHA, OECS, ECCB, ALBA (SVG joined the Bolivarian Alliance under Gonsalves), CELAC, Commonwealth and PAHO diplomacy."
              - "Hook: non-communicable diseases (high Caribbean burden), mental health, La Soufrière volcanic eruption legacy (the April 2021 eruption displaced about 20% of the population and damaged health and other infrastructure on the northern half of Saint Vincent; reconstruction and preparedness are sustained themes), Cuban medical brigade and ALBA-frame health cooperation (distinctive in OECS), Modern Medical Centre Complex Taiwanese-financed project, inter-island Grenadines health architecture (air and sea evacuation), MCH, climate-and-health, and CARPHA-OECS regional cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, mental health, La Soufrière 2021 legacy and preparedness, Cuban medical brigade and ALBA cooperation, Modern Medical Centre Complex, Grenadines inter-island architecture, climate-and-health and CARPHA cooperation — durable lines."
              - "Recognise ALBA-Cuban-Venezuelan engagement which is distinctive within OECS and shapes engagement framings; do not treat SVG as a single-island state — the Grenadines (Bequia, Mustique, Canouan, Mayreau, Union Island, Palm Island, Petit Saint Vincent) require inter-island health architecture; do not conflate with other OECS states."
