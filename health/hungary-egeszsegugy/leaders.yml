Magyar egészségügy érintettek:
  - Egészségügyi Minisztérium (Ministry of Health):
      - Zsolt Hegedűs (Tisza):
          - Title: Egészségügyi miniszter (Minister of Health) (a Tisza-kormányban, 2026-tól)
          - Stakeholder engagement notes:
              - "Egészségügyi miniszter a 2026-ban hivatalba lépett Tisza-kormányban (Magyar Péter pártja, mely az Országgyűlési választáson nyerte el a többséget); Magyar Péter 2025. október 30-án jelentette be Hegedűs miniszteri kinevezését, mielőtt megnyerte volna a választást."
              - "Ortopéd sebész, négygyermekes családapa; 2005-2015 között az Egyesült Királyság NHS-ében dolgozott — Clinical Lead és Head of the Orthopaedic Department a North Manchester General Hospitalban, később Lead Surgeon for Day Surgery a Cirencester Treatment Centre-ben — szakmai hivatkozási rendszere brit NHS-orientált."
              - "Hazai szerepei: a '1001 orvos vesztegetés nélkül' mozgalom egyik vezetője; később a Magyar Orvosi Kamara Etikai Bizottságának elnöke — etikai-szakmai legitimációval érkezik a ressortba, ellentétben a Fidesz-kor Belügyminisztérium-államtitkársági konstrukciójával (Takács Péter, 2022-2026)."
              - "Politikai államtitkára Svéd Tamás (a MOK volt főtitkára); az alapellátásért felelős államtitkár Porpáczy Krisztina (háziorvos, Tisza-egyéni képviselő); külön államtitkárok népegészségügyért és betegségmegelőzésért, járó- és fekvőbeteg-ellátásért, és egészségügyi digitalizációért."
              - "Első, médiában látható döntései közé tartozott a kórházi arcfelismerő rendszerek leszerelésének bejelentése 2026. július 1-jéig — szimbolikus szakítás a Fidesz-éra digitális megfigyelési irányával; valamint a megújuló Országos Egészségbiztosítási Pénztár kulcsszerepének deklarálása."
              - "Hook: a Tisza-kormány egészségügyi terve, a NEAK / OEP restrukturálása, alapellátás megerősítése, kórházhálózat-konszolidáció, NHS-stílusú szakmai irányítás, európai uniós helyreállítási források landolnak; az ortopéd-sebészeti és sebészeti programok különösen jól csengenek."
          - Tone advice:
              - "Kezdje az alapellátással, a NEAK / OEP reformjával, a brit NHS-stílusú irányítási elemekkel és az európai uniós forrásokkal — ezek Hegedűs intellektuális forrásai és a Tisza-program keretei."
              - "Ne pitcheljen a 2018-2026-os Fidesz-éra architektúrája alapján — a Belügyminisztérium-egészségügyi-államtitkárság konstrukció megszűnt, és az új minisztérium aktívan restrukturálódik, így a régi szervezeti referenciák azonnal elavulnak."
