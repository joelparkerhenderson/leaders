Suomen sosiaali- ja terveydenhuollon sidosryhmät:
  - Sosiaali- ja terveysministeriö (STM):
      - Wille Rydman (PS):
          - Title: Sosiaali- ja terveysministeri (Minister of Social Affairs and Health) (20.2.2026 alkaen)
          - Stakeholder engagement notes:
              - "Nimitetty sosiaali- ja terveysministeriksi Tasavallan presidentin päätöksellä 20.2.2026 Perussuomalaisten ehdokkaana Kaisa Juuson erottua sairauslomalle uupumuksen vuoksi; ministerin ehdokkuus vahvistettiin PS:n eduskuntaryhmän ja puoluehallituksen yksimielisellä päätöksellä."
              - "Aiemmin Orpon hallituksen elinkeinoministeri 2023-2025; valtiotieteiden maisteri (Master of Social Sciences); kansanedustaja ja PS-puolueprofiili pitkä ennen ministeriyttä — siirtyminen elinkeinoportfoliosta sote-portfolioon edellyttää huomattavaa uudelleenkohdennusta."
              - "Astuu virkaan kireässä poliittisessa tilanteessa: hyvinvointialueiden talousahdinko, sote-rahoitusmallin tarkistus ja yliopistollisten sairaaloiden ohjauksen kysymykset ovat avoimena; Orpon hallituksen sote-linjan jatkuvuus on poliittisesti herkkä (PS:n linja sote-rahoituksessa korostaa kuntien ja alueiden vastuuta sekä yksityisen sektorin roolia)."
              - "Edeltäjä Kaisa Juuson irtisanoutumisilmoitusta käsiteltiin Helsinki Times -lähteissä 'kansaa väsyttävänä' työnä ja yhtenä Suomen poliittisesti vaativimmista ministerinvirroista — Rydmanin ensimmäinen tehtävä on osoittaa toimintakykyä tässä raskaassa portfoliossa."
              - "Hook: hyvinvointialueiden talous, sote-rahoitusmallin tarkistus, työvoimakysymykset, lääkkeiden saatavuus ja Kanta-palvelujen kehitys laskeutuvat; vendorpitchit ohi hyvinvointialueiden eivät laskeudu."
          - Tone advice:
              - "Avaa keskustelu hyvinvointialueiden talouden, sote-rahoituksen ja työvoiman kautta — nämä ovat Orpon hallituksen sote-linjan etusijaiset linjat ja Rydmanin ensimmäiset poliittiset puhealueet."
              - "Älä pitchaa kuin STM olisi operatiivinen tilaaja — sote-palvelut ovat hyvinvointialueiden vastuulla 1.1.2023 alkaen, ja keskittävä framing torjutaan."
  - Terveyden ja hyvinvoinnin laitos (THL):
      - Mika Salminen, FT:
          - Title: Pääjohtaja, Terveyden ja hyvinvoinnin laitos (1.1.2024-31.12.2028)
          - Stakeholder engagement notes:
              - "Pääjohtaja kaudella 1.1.2024-31.12.2028; filosofian tohtori (FT); aiemmin THL:n terveysturvallisuusosaston johtaja ja Suomen pandemiavastauksen tieteellinen ääni 2020-2023."
              - "Owns THL:n tehtävät: kansallinen terveyden ja hyvinvoinnin seuranta, tutkimus- ja kehitystoiminta, tilasto- ja indikaattorijärjestelmät, terveysrekisterit, infektiotautien seuranta, sote-uudistuksen vaikutusarviointi, ja STM:n strategisen ohjauksen tieteellinen tuki."
              - "Vuosina 2025-2026 julkisesti varoittanut Ylelle hyvinvointialueiden ja kuntien palvelukarsintojen ristikkäisistä riskeistä ja kannattanut terveysperusteista verotusta — sairaiden ihmisten kustannusten näkökulma, mikä kytkeytyy STM:n verolinjaan."
              - "THL:n rooli hyvinvointialueiden ohjaukessa vahvistuu osana sote-uudistuksen toimeenpanoa — Salminen on tämän uuden ohjausroolin keskeinen instituutiojohtaja."
              - "Hook: kansalliset terveysseurannat, sote-uudistuksen vaikutusarviointi, terveyspoliittinen tutkimus, infektiotautien seuranta, ja hyvinvointialueiden ohjauksen tietopohja laskeutuvat."
          - Tone advice:
              - "Avaa keskustelu kansallisen seurannan, sote-vaikutusarvioinnin ja näyttöperustaisen ohjauksen kautta — Salmisen instituutionalinen ääni on tieteellinen näyttö ja seuranta."
              - "Älä pitchaa lyhytaikaisia poliittisia framingeja — Salminen on tieteellisen riippumattomuuden vartija ja torjuu puhdasta puoluepoliittista linjaa."
  - Lääkealan turvallisuus- ja kehittämiskeskus (Fimea):
      - Eija Pelkonen:
          - Title: Ylijohtaja (Director-General), Fimea (1.10.2023-30.9.2028, jatkokausi)
          - Stakeholder engagement notes:
              - "Fimean ylijohtaja vuodesta 2018; nykyinen kausi 1.10.2023-30.9.2028; farmasian maisteri; aiemmin Fimean valvonta- ja luvat -osaston johtaja vuodesta 2009 — Fimean sisäisen polun pisin kasvattaja."
              - "Owns lääkkeiden myyntilupien arviointi (kansallinen ja eurooppalainen), lääkkeiden ja lääkeneuvonnan valvonta, lääkkeiden saatavuuden seuranta (saatavuushäiriöt), lääketurvatoiminta, ja lääkkeiden hintalautakuntayhteistyö."
              - "Fimea toimii Euroopan lääkeviraston (EMA) tieteellisissä komiteoissa — Pelkonen edustaa Suomea CHMP:ssä ja CMD(h):ssa tasolla, jolla Suomen kanta lääkkeiden eurooppalaiseen arviointiin määräytyy."
              - "Lääkkeiden saatavuushäiriöt ja eurooppalainen lääkereformi (HMA, EMA, MDR/IVDR) ovat dominantteja teemoja kuluvassa kaudessa."
              - "Hook: lääkkeiden saatavuus, eurooppalainen lääkereformi, MDR/IVDR-toimeenpano, lääketurva, biologisten lääkkeiden arviointi, ATMP (geeni- ja soluterapiat) laskeutuvat."
          - Tone advice:
              - "Avaa eurooppalaisesta lääkesääntelystä, saatavuushäiriöistä ja lääketurvasta — Pelkosen institutionaalinen ääni on tieteellis-regulaattinen ja EMA-keskeinen."
              - "Älä pitchaa Fimea hyvinvointialueiden palveluiden ostajana — Fimea on lääkkeiden ja lääkevalvonnan viranomainen, ei terveyspalvelujen tilaaja."
