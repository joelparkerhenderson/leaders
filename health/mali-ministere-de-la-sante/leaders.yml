Système de santé malien — parties prenantes:
  - Ministère de la Santé et du Développement Social (MSDS):
      - Médecin Colonel-major Assa Badiallo Touré:
          - Title: Ministre de la Santé et du Développement Social (in the Goïta transition government, since 4 July 2023)
          - Stakeholder engagement notes:
              - "Ministre de la Santé et du Développement Social depuis le 4 juillet 2023 dans le gouvernement de transition du Colonel Assimi Goïta au pouvoir depuis le coup d'État de mai 2021; médecin militaire de rang Colonel-major; profil public 'Vertus : Sens élevé du travail, intégrité morale et amour pour la patrie' (Maliweb)."
              - "Active 2026: a conduit une délégation au séminaire de coopération sanitaire Mali-Chine à Taiyuan (Maliweb); a renforcé les axes humanitaires et sanitaires avec l'ONU et la Banque mondiale (Maliweb communiqué); a lancé les activités de la Journée Nationale de la Souveraineté Retrouvée à Kalaban-Coro (Bamada); a présenté ses vœux 2026 'sous le sceau de la reconnaissance et de l'engagement collectif' (Bamada); a remis une feuille de route à l'INPS appelant à une restructuration profonde de la sécurité sociale au Mali (Maliweb); a lancé les épreuves du DEF 2026 appelant à des examens propres et sereins (Maliweb, EchosMedias, Maliexpress); reportée comme présidente régionale OMS Afrique (Malikunafoni)."
              - "Owns MSDS policy, CNAM CMU / RAMED, Pharmacie Populaire du Mali pharmaceutical supply, INSP, CHU Point G et CHU Gabriel Touré, 19 régions médicales, sécurité sociale via INPS, réponse sanitaire dans les régions affectées par l'insurrection (Centre, Nord, dynamiques JNIM, ISGS, GATIA), et la diplomatie sanitaire du Mali à l'OMS Afrique (où Mali a un rôle reconnu), AES, BRICS+ et coopération bilatérale Russie / Chine / Türkiye."
              - "Hook: souveraineté sanitaire, coopération Mali-Chine, réforme INPS sécurité sociale, leadership OMS Afrique, AES sanitaire cooperation, réponse aux régions affectées par l'insurrection atterrissent."
          - Tone advice:
              - "Ouvrir avec souveraineté sanitaire, coopération Mali-Chine, leadership OMS Afrique et AES — ce sont les lignes autoréais du gouvernement de transition malien et le cadre discursif sous Goïta."
              - "Ne pas pitcher en framings français / CEDEAO traditionnels — le Mali s'est retiré de la CEDEAO en janvier 2024 et a profondément pivoté vers la coopération Russie, Chine et AES; les framings ouest-africains traditionnels et les framings français seront politiquement misalignés."
