Gesundheitswesen Deutschland stakeholders:
  - Bundesministerium für Gesundheit (BMG):
      - Nina Warken (CDU):
          - Title: Bundesministerin für Gesundheit (Federal Minister of Health) (seit 6. Mai 2025)
          - Stakeholder engagement notes:
              - "Bundesministerin für Gesundheit seit dem 6. Mai 2025 im Kabinett Merz; Volljuristin (lawyer); zuvor parlamentarische Geschäftsführerin der Unionsfraktion seit 2021 und Generalsekretärin der CDU Baden-Württemberg seit 2023."
              - "Mit 45 Jahren und ohne klinische oder kassenärztliche Vorerfahrung das jüngste Mitglied im Merz-Kabinett auf einem Ressort, das traditionell ärztlich besetzt war (Lauterbach, Spahn) — politisch-juristischer Zugang statt sektoraler Vorprägung."
              - "Im April 2026 angekündigt: zwölf Milliarden Euro Einsparungen über alle Leistungsbereiche des Gesundheitssystems hinweg im Jahr 2026 und rund zwanzig Milliarden Euro Einsparungen mit zusätzlichen Instrumenten für 2027 — die Krankenkassenreform und die GKV-Finanzstabilisierung sind die definierenden Mandatslinien."
              - "Krankenhausreform (KHVVG), GKV-Finanzstabilisierung, Pflegereform und die Einführung einer verbindlichen Primärversorgung sind die vier zentralen Gesetzgebungsstränge des Mandats; Pressestatement nach Beschluss der Krankenkassenreform mit Bundeskanzler Merz markiert die politische Linie."
              - "Etat-Rede im Bundestag zum Gesundheitsetat 2026 zentriert auf Konsolidierung, KHVVG-Umsetzung und Pflegereform — die rhetorische Signatur ist 'Solidität' und 'Reformfähigkeit', nicht 'Versorgungsversprechen'."
              - "Hook: Krankenhausreform-Umsetzung, GKV-Konsolidierung, verbindliche Primärversorgung, Pflegereform und Digital-Gesetz-Folgegesetze landen; Pitches, die fiskalische Konsolidierung ignorieren, landen nicht."
          - Tone advice:
              - "Mit Krankenhausreform, GKV-Konsolidierung, Primärversorgung und Pflegereform einsteigen — das sind die definierenden Linien des Merz-Kabinetts auf dem Ressort."
              - "Nicht klinisch-fachlich pitchen, als wäre Warken eine SPD-geprägte ärztliche Ministerin — die Ressortlogik ist juristisch-fiskalisch und CDU-konsolidierend; Lauterbach-Stil-Framings werden zurückgewiesen."
  - Robert Koch-Institut (RKI):
      - Prof. Dr. med. Lars Schaade:
          - Title: Präsident, Robert Koch-Institut (seit Oktober 2023)
          - Stakeholder engagement notes:
              - "Präsident des Robert Koch-Instituts seit Oktober 2023, Nachfolger von Lothar H. Wieler; Facharzt für Medizinische Mikrobiologie und Infektionsepidemiologie, habilitiert in Medizinischer Mikrobiologie und Virologie; Honorarprofessor an der Charité."
              - "Berufliche Stationen vor dem RKI: Universitäten Göttingen und Aachen, Referent im Bundesministerium für Gesundheit; seit 2010 am RKI als Abteilungsleiter, ab 2011 Vizepräsident, seit 2023 Präsident — Insider-Karriere innerhalb des Instituts."
              - "Reformiert das RKI nach der Covid-19-Pandemie und nach der politisch umstrittenen Ära Wieler — Ziel: stärkere Trennung von wissenschaftlicher Bewertung und politischer Kommunikation, Stärkung der Surveillance-Funktion, klarere Abgrenzung zum BIPAM (Bundesinstitut für Öffentliche Gesundheit)."
              - "Owns infektionsepidemiologische Surveillance, Berichts- und Meldewesen nach IfSG, Pandemie-Vorsorge, Gesundheitsmonitoring (DEGS, KiGGS), Antibiotikaresistenz-Surveillance, Reise- und Tropenmedizin (Robert-Koch-Wege)."
              - "Hook: Surveillance-Modernisierung, Pandemie-Preparedness, Antibiotikaresistenz, Public-Health-Daten-Infrastruktur und Schnittstellen zu BIPAM und Ländern landen; politische Tagesframings ('Lauterbach-Sound') werden vermieden."
          - Tone advice:
              - "Mit Surveillance, Preparedness, Antibiotikaresistenz und Public-Health-Daten einsteigen — Schaades Profil ist Mikrobiologie / Epidemiologie / Surveillance, nicht klinische Versorgung."
              - "Nicht politisch-aktivistisch framen, als ginge es um Tagespolitik — Schaade definiert sein Mandat ausdrücklich als wissenschaftlich-distanziert und reagiert auf aktivistische Framings reserviert."
  - Bundesinstitut für Arzneimittel und Medizinprodukte (BfArM):
      - Prof. Dr. med. Karl Broich:
          - Title: Präsident, Bundesinstitut für Arzneimittel und Medizinprodukte (seit 2014)
          - Stakeholder engagement notes:
              - "Präsident des BfArM in Bonn seit 2014 — eine der längsten Präsidentschaften im Tier der deutschen Bundesinstitute; Facharzt für Neurologie, Psychiatrie und Verhaltenstherapie; klinisch-akademischer Hintergrund."
              - "Mitglied des Management Boards der European Medicines Agency (EMA MB) und Mitglied der HMA Management Group; Co-Vorsitzender mehrerer EMA-Komitees — die europäische Vernetzung ist eine prägende Mandatslinie."
              - "Owns die Zulassung und Marktüberwachung von Humanarzneimitteln (national und in europäischen Verfahren), die Bewertung und Überwachung von Medizinprodukten (MDR/IVDR-Umsetzung), die DiGA-Liste (digitale Gesundheitsanwendungen) und die nationale Stelle für Klinische Prüfungen."
              - "Gilt als technokratischer, präzise auftretender Präsident mit hoher Reputation in der europäischen Arzneimittelregulierung; öffentliche Kommunikation eher zurückhaltend, Schwerpunkt fachliche Tiefe statt politische Profilierung."
              - "Hook: EMA-zentrierte Zulassungspfade, MDR/IVDR-Umsetzung, DiGA-Reform, ATMP (Gen- und Zelltherapien), KI-Regulierung im Arzneimittel- und Medizinproduktebereich, AMNOG-Schnittstelle und Lieferengpässe landen."
          - Tone advice:
              - "Mit EMA-Vernetzung, MDR/IVDR, DiGA, ATMP und KI-Regulierung einsteigen — das sind Broichs Schwerpunkte und seine europäische Plattform."
              - "Nicht rein politisch oder vertriebsorientiert pitchen — Broich erwartet wissenschaftlich-regulatorische Tiefe; oberflächliche Marketing-Framings werden offen markiert und zurückgewiesen."
  - Gemeinsamer Bundesausschuss (G-BA; Federal Joint Committee):
      - Prof. Josef Hecken:
          - Title: Unparteiischer Vorsitzender, Gemeinsamer Bundesausschuss (seit Juli 2012; vorgezogenes Mandatsende seit Februar 2026 angekündigt)
          - Stakeholder engagement notes:
              - "Unparteiischer Vorsitzender des G-BA seit Juli 2012 — die mit Abstand längste Vorsitzzeit in der Geschichte des Ausschusses; vorher CDU-Gesundheitsminister des Saarlands; gleicher Person die Selbstverwaltungsbilanz der vergangenen vierzehn Jahre zuzuschreiben."
              - "Hat im Februar 2026 angekündigt, sein im Juli 2024 begonnenes drittes Mandat (bis 2030) wahrscheinlich vorzeitig zu beenden aus persönlichen / familiären Gründen — Entscheidung über Zeitpunkt offen; die Bestätigung neuer Unparteiischer muss durch den Bundestags-Gesundheitsausschuss erfolgen."
              - "Owns die Konkretisierung des Leistungskatalogs der GKV nach SGB V, die Methodenbewertung, die Frühe Nutzenbewertung nach AMNOG, die Qualitätssicherung (über IQTIG), die Bedarfsplanung der vertragsärztlichen Versorgung, die Disease-Management-Programme."
              - "Pragmatisch-konservativer Schiedsrichter zwischen GKV-Spitzenverband, KBV, KZBV, DKG und Patientenvertretung; Interview-Linie 'Die gemeinsame Selbstverwaltung ist zum Erfolg verpflichtet' definiert sein institutionelles Selbstverständnis."
              - "Hook: AMNOG, Methodenbewertung, Bedarfsplanung, Qualitätsverfahren und KHVVG-Schnittstellen zur Qualität landen; alles, was die Selbstverwaltung umgehen will, wird strukturell zurückgewiesen."
          - Tone advice:
              - "Mit AMNOG, Methodenbewertung, Bedarfsplanung und Qualität einsteigen — das sind Heckens institutionelle Anker und die Hebel, die der G-BA tatsächlich bedient."
              - "Nicht die Selbstverwaltung umgehen wollen — Hecken definiert sich als Gralshüter der gemeinsamen Selbstverwaltung; jeder direkte Pitch zum BMG, der den G-BA überspringt, wird sichtbar zurückgereicht."
  - GKV-Spitzenverband (Federal Association of Statutory Health Insurance Funds):
      - Oliver Blatt:
          - Title: Vorstandsvorsitzender, GKV-Spitzenverband (seit 1. Juli 2025)
          - Stakeholder engagement notes:
              - "Vorstandsvorsitzender des GKV-Spitzenverbands seit dem 1. Juli 2025, Nachfolger von Dr. Doris Pfeiffer, die nach 18 Jahren und drei Amtszeiten in den Ruhestand ging (Wahl ein Jahr zuvor, Amtsantritt zum 1. Juli 2025)."
              - "Tritt das Amt in einer Phase struktureller GKV-Finanzkrise an — Bundesministerin Warken hat im April 2026 zwölf Milliarden Euro Einsparungen für 2026 und rund zwanzig Milliarden Euro für 2027 angekündigt; der GKV-Spitzenverband ist die zentrale GKV-seitige Verhandlungsbank."
              - "Owns die GKV-seitige Verhandlung und Bewertung von Versorgungsverträgen (Rahmenverträge mit Leistungserbringerverbänden, AMNOG-Erstattungsbeträge, Festbeträge), die Versorgungs- und Honorarverhandlungen mit KBV und KZBV, die Verhandlungen mit DKG zur Krankenhausvergütung."
              - "Repräsentiert die 95+ gesetzlichen Krankenkassen gemeinsam — strukturelle Spannung zwischen Kassenwettbewerb und Solidarprinzip definiert die institutionelle Position."
              - "Hook: GKV-Finanzstabilisierung, AMNOG-Erstattungsbeträge, KHVVG-Vorhaltevergütung, Honorarverhandlungen mit KBV / KZBV, ePA-Nutzung aus Kassenperspektive landen; Pitches, die die GKV nur als Zahler statt als Verhandler ansprechen, landen nicht."
          - Tone advice:
              - "Mit GKV-Finanzstabilisierung, AMNOG-Verhandlung, KHVVG-Vergütung und Honorarverhandlungen einsteigen — das sind die Hebel, die Blatts Vorstand tatsächlich zieht."
              - "Nicht den GKV-Spitzenverband als monolithischen 'Zahler' adressieren — die Pluralität der Kassen und der Solidar-Wettbewerb-Spagat sind sein institutionelles Definitionsmerkmal; vereinfachende Framings werden korrigiert."
  - Kassenärztliche Bundesvereinigung (KBV):
      - Dr. med. Andreas Gassen:
          - Title: Vorstandsvorsitzender, Kassenärztliche Bundesvereinigung (zweite Amtszeit bestätigt 2023)
          - Stakeholder engagement notes:
              - "Vorstandsvorsitzender der KBV in zweiter Amtszeit (Bestätigung 2023); praktizierender Facharzt für Orthopädie, Unfallchirurgie und Rheumatologie in Düsseldorf; im Vorstand zuständig für den fachärztlichen Sektor."
              - "Politische Linie 2025-2026: gegen die im Koalitionsvertrag und in der Warken-Linie angekündigte verbindliche Primärversorgung; Pressestatement der KBV explizit zu den Plänen eines Primärversorgungssystems; Spannung mit dem CDU-geführten BMG ist Mandatsdefinierend."
              - "Owns die KBV-seitige Verhandlung der ambulanten Versorgungs- und Honorarverträge, die Bedarfsplanung der vertragsärztlichen Versorgung in Kooperation mit GKV-Spitzenverband, die Vertretung der niedergelassenen Ärzte gegenüber Politik, GKV und G-BA."
              - "Position auf Wartezeiten 2026: 'geringerer finanzieller Spielraum führt zu weniger Terminen' — Verhandlungsrahmen ist Honorarvolumen, nicht Versorgungsverpflichtung; Position auf Telefon-AU: KBV-Bundeszentrale steht im Konflikt mit Länder-KVen."
              - "Hook: ambulante Honorierung, Bedarfsplanung, Telematikinfrastruktur (ePA, eRezept) aus Praxisperspektive, Telemedizin, Telefon-AU und Primärversorgungs-Architektur landen — alles, was die niedergelassene Praxis stärkt."
          - Tone advice:
              - "Mit ambulanter Honorierung, Bedarfsplanung, Telematikinfrastruktur aus Praxisperspektive und Primärversorgungs-Architektur einsteigen — das sind Gassens Kernlinien und die Themen, zu denen die KBV regelmäßig öffentlich Stellung bezieht."
              - "Nicht verbindliche Primärversorgung oder Gatekeeper-Modelle als Selbstverständlichkeit pitchen — Gassen ist explizit dagegen und wird Pitches in diese Richtung öffentlich kritisieren; CDU-/BMG-Linie wird hier hart zurückgespiegelt."
