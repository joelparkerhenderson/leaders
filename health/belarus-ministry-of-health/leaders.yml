Belarusian health stakeholders / Беларускія зацікаўленыя бакі ў сферы аховы здароўя:
  - Ministry of Health of the Republic of Belarus (Министерство здравоохранения Республики Беларусь):
      - Alexander Khodzhayev / Аляксандр Хаджаеў:
          - Title: Minister of Health of the Republic of Belarus (Министр здравоохранения, since 26 January 2024)
          - Stakeholder engagement notes:
              - "Minister of Health of the Republic of Belarus since 26 January 2024 in the Lukashenko-aligned Council of Ministers (PM Roman Golovchenko, succeeded by Aleksandr Turchin); physician background; senior Belarusian health-system career before the ministerial role."
              - "Active 2026 public lines: stated that 'quality healthcare must be accessible across Belarus' (BelTA, 2026); described how the healthcare exhibition helps Belarus find new partners from abroad (BelTA); hailed the BelarusMedica forum as crucial for shaping national strategy — signal of openness to international cooperation despite sanctions context."
              - "Owns Minzdrav policy and budget, state pharmaceutical supply (Belmedpreparaty, Borisov Plant of Medical Preparations and other state biopharmaceutical enterprises), the network of Republican Scientific and Practical Centres (Cardiology, Oncology, Tuberculosis and Lung Diseases, Otorhinolaryngology, etc.), primary-care polyclinic network, the BRICS+ and CSTO / Eurasian Economic Union (EAEU) health cooperation, China-Belarus medical cooperation under the Belt and Road framework, and Russia-Belarus Union State health programmes."
              - "Hook: pharmaceutical localisation (Belmedpreparaty, Borisov), Russia-Belarus Union State health programmes, BelarusMedica forum, China-Belarus cooperation, primary-care polyclinic modernisation, oncology and cardiology centres of excellence, and EAEU health-cooperation land."
          - Tone advice:
              - "Open with pharmaceutical localisation, Union State and BRICS+ / EAEU cooperation, and pharmaceutical-export ambition — these are the geopolitical-economic frames of Belarusian healthcare under Lukashenko."
              - "Do not pitch through Western multilateral framings — engagement is politically calibrated to Russia-Belarus-China alignment, and Western-framed proposals (US, EU, NATO-aligned) will be filtered, particularly given the post-2020 sanctions environment."
