Guyana health stakeholders:
  - Ministry of Health:
      - Dr. Frank C. S. Anthony (PPP/C):
          - Title: Minister of Health (since 2020)
          - Stakeholder engagement notes:
              - "Minister of Health since 2020 in the People's Progressive Party / Civic (PPP/C) government of President Irfaan Ali; retained the portfolio following the PPP/C win in the 2025 general election, marking a continuous tenure across two electoral cycles."
              - "Medical doctor by training (PhD-level academic involvement also noted in regional health fora); long parliamentary career; previously Minister of Culture, Youth and Sport; recognised regionally — elected to chair a CARICOM-coordinated health initiative."
              - "Owns Guyana's universal health-coverage agenda, oil-revenue-funded health infrastructure investments (multi-hospital construction across Regions 3, 4, 5, 6 and 10), oncology and cardiology centres, telemedicine to hinterland regions, and the Caribbean health-cooperation portfolio."
              - "Public visibility at PAHO and WHO platforms; partner-of-choice for Suriname's Minister of Health in regional bilateral meetings (per Ministry of Health Guyana social media)."
              - "Hook: oil-revenue health infrastructure (post-2020 fiscal expansion), oncology and cardiology specialist centres, telemedicine to hinterland communities, CARICOM cooperation, non-communicable disease prevention, maternal-and-child health, and HIV care land."
          - Tone advice:
              - "Lead with oil-revenue health infrastructure, NCD prevention, telemedicine to interior regions and CARICOM cooperation — these are the policy priorities reflecting the oil-boom fiscal context that has reshaped Guyana's health-investment options."
              - "Do not pitch as if Guyana were resource-poor — substantial oil revenues since 2020 have shifted the health-financing environment significantly, and aid-recipient framings will be politically out-of-date."
