Polski system ochrony zdrowia — interesariusze:
  - Ministerstwo Zdrowia (Ministry of Health):
      - Jolanta Sobierańska-Grenda:
          - Title: Minister Zdrowia (Minister of Health) (od 24 lipca 2025)
          - Stakeholder engagement notes:
              - "Minister Zdrowia od 24 lipca 2025 w rządzie Donalda Tuska (koalicja KO + Trzecia Droga (PSL + Polska 2050) + Lewica), po rekonstrukcji rządu, w wyniku której z resortu odeszła Izabela Leszczyna; objęcie funkcji opisywane medialnie jako 'odpolitycznienie' resortu."
              - "Od 2017 r. prezes zarządu Szpitali Pomorskich w Gdańsku; doktor nauk społecznych w dyscyplinie ekonomia i finanse; MBA dla kadry medycznej; postrzegana jako jedna z najbardziej profesjonalnych osób zarządzających w polskim systemie ochrony zdrowia — profil menedżerski, nie partyjny."
              - "Owns kontrakty NFZ ze szpitalami i POZ, planowanie sieci szpitali (reformę sieci szpitali), reformę finansowania ochrony zdrowia, KPO Zdrowie, oraz dialog z samorządami zawodowymi (Naczelna Rada Lekarska, Naczelna Rada Pielęgniarek i Położnych, Naczelna Izba Aptekarska)."
              - "Mandat osadzony w trudnym budżetowo kontekście — wzrost składek na NFZ, deficyty placówek, ograniczenia limitów, oraz polityczne napięcia z Konfederacją i PiS w sprawie modelu finansowania."
              - "Hook: sieć szpitali, NFZ kontraktowanie, KPO Zdrowie, deficyty placówek, kadry medyczne, lista refundacyjna, e-zdrowie (eRecepta, IKP, P1) lądują; pitche centralistyczne, ignorujące samorząd wojewódzki (marszałek województwa, sejmiki) nie lądują."
          - Tone advice:
              - "Otwierać siecią szpitali, NFZ, KPO Zdrowie i kadrami medycznymi — to filary mandatu i jej menedżerski język z okresu Szpitali Pomorskich."
              - "Nie pitchować polityki politycznym wymiarze — Sobierańska-Grenda została powołana jako menedżer; framingi polityczne będą filtrowane lub przekierowywane do kancelarii premiera."
