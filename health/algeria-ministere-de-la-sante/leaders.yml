Système de santé algérien — parties prenantes:
  - Ministère de la Santé:
      - Mohamed Esseddik Aït Messaoudène:
          - Title: Ministre de la Santé (in the Tebboune government, following 2025-2026 ministerial reshuffle)
          - Stakeholder engagement notes:
              - "Ministre de la Santé in the President Abdelmadjid Tebboune government following a ministerial reshuffle in 2025-2026; replaced Abdelhak Saihi, who moved to the Travail, Emploi et Sécurité Sociale (Labour, Employment and Social Security) portfolio; assumed responsibilities with the public commitment to 'être à la hauteur des aspirations de l'État algérien' (El Moudjahid coverage of his prise de fonctions)."
              - "Owns Ministère policy and the network of CHU (Centres Hospitaliers Universitaires), EPH (Établissements Publics Hospitaliers), EPSP (Établissements Publics de Santé de Proximité) polyclinics, and 1,500+ primary care centres; coordination with CNAS on insurance benefits and Saidal on local pharmaceutical production; Algerian pharmaceutical-localisation policy; oncology national programmes (the SAFRO oncology congress 16th edition was previously chaired by his predecessor); primary-care strengthening; and African Union, Arab League and BRICS+ health diplomacy."
              - "Operates in a post-Hirak political context with President Tebboune's second term (re-elected 2024) and the post-oil-revenue-recovery fiscal framework that has expanded pharmaceutical-self-reliance and national health-infrastructure investment commitments."
              - "Hook: pharmaceutical localisation via Saidal, oncology national programme, hospital infrastructure modernisation, primary-care strengthening, maternal-and-child health, NCDs, climate-and-health, BRICS+ accession and African / Arab health cooperation land."
          - Tone advice:
              - "Ouvrir avec localisation pharmaceutique, modernisation hospitalière, oncologie et coopération africaine / BRICS+ — ce sont les cadres politiques du gouvernement Tebboune et les axes mandataires."
              - "Ne pas pitcher avec des framings culturels-français par défaut — la lexique de politique algérienne est en français et arabe mais politiquement distinct des positionnements liés à l'ancien colonisateur; les framings qui reconnaissent la souveraineté algérienne et le partenariat BRICS+ résonneront mieux."
