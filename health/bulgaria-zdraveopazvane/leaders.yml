Заинтересовани страни в българското здравеопазване:
  - Министерство на здравеопазването (Ministry of Health):
      - Михаил Околийски (Mihail Okoliyski) (служебен / caretaker):
          - Title: Министър на здравеопазването (Minister of Health) (от 19 февруари 2026, служебно правителство на Андрей Гюров)
          - Stakeholder engagement notes:
              - "Министър на здравеопазването в служебното правителство на Андрей Гюров, назначено от Президента Румен Радев на 19 февруари 2026 след оставката на коалиционното правителство на Росен Желязков на 11 декември 2025."
              - "Поема ресорта в продължителен политически период на нестабилност: седем парламентарни избора между април 2021 и края на 2024, повтарящи се служебни правителства, отложени структурни реформи в болничната мрежа и в спешната медицинска помощ."
              - "Предшественик Силви Кирилов (правителство Желязков, 16 януари 2025 – 11 декември 2025) — лекар-уролог с над 46 години опит, дългогодишен народен представител — оставя досиета: реформа на болничната мрежа, кадри, заплати, лекарствена политика."
              - "Hook: реформа на болничната мрежа, спешна медицинска помощ, лекарствена политика, кадри и заплати в здравеопазването, усвояване на средства от ЕС; стратегически дългосрочни питчове до следваща постоянна власт няма да кацат."
          - Tone advice:
              - "Започвай с реформа на болничната мрежа, кадри в здравеопазването, лекарствена политика и европейски фондове — това са оперативните приоритети на служебния етап."
              - "Не пишете дългосрочни мандатни ангажименти — служебното правителство е времево ограничено и стратегическите ангажименти ще бъдат отложени до следващото редовно правителство."
