Parties prenantes du système de santé tchadien:
  - Notes sur le Ministre de la Santé Publique de la République du Tchad:
      - Status: Identité substantive du Ministre du MSP sous la présidence de Mahamat Idriss Déby Itno (MPS — Mouvement Patriotique du Salut, élu en mai 2024 après la transition militaire 2021-2024 qui a suivi la mort de son père Idriss Déby Itno au front contre le FACT) à vérifier contre la Présidence (presidence.td), le Premier Ministre, le site du Ministère (sante-tchad.org) et l'Agence Tchadienne de Presse et d'Édition (ATPE). Tchadinfos, Alwihda Info et Tchad One sont des canaux complémentaires.
      - Implication: L'engagement sur la santé tchadienne nécessite (i) l'identification du titulaire actuel via les canaux officiels de N'Djamena, (ii) la reconnaissance de la crise humanitaire-sanitaire à l'Est — depuis avril 2023, plus d'un million de réfugiés soudanais ont fui les FAR-FSR au Tchad oriental (Ouaddaï, Sila, Wadi Fira, Ennedi-Est) générant l'une des plus grandes opérations humanitaires au monde sous coordination UNHCR-OMS-UNICEF-MSF-WFP —, et (iii) la lecture de la cartographie hospitalière (Hôpital Général de Référence Nationale à N'Djamena, Hôpital de la Mère et de l'Enfant, hôpitaux provinciaux des 23 provinces, hôpitaux humanitaires à Adré, Farchana, etc.).
      - Hook: crise sanitaire soudanaise à l'Est (la priorité opérationnelle dominante en 2025-2026), paludisme et lutte vectorielle, santé maternelle et infantile (mortalité maternelle parmi les plus élevées au monde), malnutrition aiguë sévère (MAS) — le Sahel tchadien et le Lac Tchad sont en crise nutritionnelle chronique —, choléra (épidémies récurrentes), polio (Tchad a connu des événements de poliovirus circulant dérivé de la vaccination), mpox, méningite (ceinture sahélienne), VIH, TB, et coordination humanitaire-développement nexus. Le bassin du Lac Tchad est exposé à Boko Haram avec impact sur l'accès aux services.
      - Tone: Ouvrir avec la crise soudanaise à l'Est, paludisme, MCH, malnutrition aiguë, choléra, polio, méningite et coordination humanitaire — priorités opérationnelles dominantes. Ne pas ignorer la crise soudanaise (centrale en 2025-2026) ni assumer une homogénéité épidémiologique entre le nord sahélien désertique et le sud soudanien-équatorial; le Tchad présente une diversité épidémiologique nord-sud très importante.
