Parties prenantes du système de santé gabonais:
  - Notes sur le Ministre de la Santé de la République Gabonaise:
      - Status: Identité substantive du Ministre de la Santé sous le gouvernement post-transition du Président Brice Clotaire Oligui Nguema (UDB — Union Démocratique des Bâtisseurs, élu en avril 2025 après le coup d'État du 30 août 2023 qui a mis fin au régime Ali Bongo Ondimba) à vérifier contre la Présidence de la République (presidence.ga), le Premier Ministre, le site du Ministère (sante.gouv.ga) et l'Agence Gabonaise de Presse (AGP). Gabonreview et L'Union sont des canaux complémentaires de vérification.
      - Implication: L'engagement sur la santé gabonaise nécessite (i) l'identification du titulaire actuel via les canaux officiels de Libreville, (ii) la reconnaissance du contexte post-transition — la CTRI a recomposé l'architecture politique et institutionnelle ; les framings basés sur l'ancienne doctrine PDG-Bongo (Omar Bongo puis Ali Bongo, 1967-2023) seront désalignés —, et (iii) la lecture de la cartographie hospitalière (CHU de Libreville, CHU mère-enfant Jeanne Ebori, CHU d'Owendo, hôpital régional de Port-Gentil, hôpitaux provinciaux des neuf provinces).
      - Hook: CNAMGS (Caisse Nationale d'Assurance Maladie et de Garantie Sociale — couverture obligatoire qui est une caractéristique structurelle distinctive du Gabon en Afrique centrale, couvrant fonctionnaires, économiquement faibles et secteur privé formel), paludisme (charge élevée), santé maternelle et infantile, NCDs (hypertension, diabète, drépanocytose), VIH (programme partenaire PEPFAR et Fonds Mondial), mpox (le Gabon a connu des flambées dans les zones forestières), tuberculose, préparation aux urgences (le Gabon a une longue expérience avec Ebola et la médecine d'urgence en zone forestière), surveillance one-health (réservoir animal du bassin du Congo), et restructuration post-transition. La rente pétrolière finance une part de la capacité mais la distribution inter-provinciale reste inégale.
      - Tone: Ouvrir avec CNAMGS-CUS, paludisme, MCH, NCDs, mpox et préparation aux urgences forestières, et coopération CEMAC-CEEAC — priorités opérationnelles et lignes durables du MS. Ne pas s'anchorer aux framings PDG-Bongo (la transition CTRI a rompu avec cette doctrine) ni ignorer la CNAMGS (caractéristique structurelle distinctive — beaucoup d'engagements externes la sous-estiment).
