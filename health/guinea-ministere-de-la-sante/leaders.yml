Parties prenantes du système de santé guinéen:
  - Notes sur le Ministre de la Santé et de l'Hygiène Publique de la République de Guinée:
      - Status: Identité substantive du Ministre de la Santé sous la transition CNRD (Comité National du Rassemblement pour le Développement) du Colonel Mamadi Doumbouya à vérifier contre la Présidence de la République (presidence.gov.gn), le Premier Ministre, le site du Ministère (sante.gov.gn) et l'Agence Guinéenne de Presse (AGP). La transition a connu plusieurs remaniements ministériels depuis le coup d'État du 5 septembre 2021; Mediaguinee et Guinéenews sont des canaux complémentaires de vérification.
      - Implication: L'engagement sur la santé guinéenne nécessite (i) l'identification du titulaire actuel via les canaux officiels de Conakry, (ii) la reconnaissance du contexte de transition militaire — la Guinée est suspendue de certains organes CEDEAO et l'agenda du retour à l'ordre constitutionnel conditionne la légitimité d'engagements long terme — et (iii) la lecture de la cartographie hospitalière (Hôpital National Donka et Hôpital Ignace Deen à Conakry; hôpitaux régionaux à Kindia, Mamou, Faranah, Kankan, Labé, Boké, N'Zérékoré).
      - Hook: paludisme et lutte vectorielle, santé maternelle et infantile (mortalité maternelle élevée), nutrition, NCDs (hypertension, diabète, drépanocytose endémique), préparation aux urgences (la Guinée a été l'épicentre de l'épidémie Ebola 2014-2016, a connu une flambée Marburg en 2021 et reste exposée à Lassa et mpox), tuberculose, VIH (partenaire PEPFAR), reconstruction du système post-Ebola et architecture ANSS de surveillance.
      - Tone: Ouvrir avec paludisme, MCH, nutrition, NCDs, préparation aux urgences (Marburg, Lassa, mpox), VIH et architecture ANSS — priorités durables et capital institutionnel post-Ebola. Ne pas s'anchorer exclusivement à Ebola (mémoire institutionnelle mais l'agenda actuel est plus large) ni proposer de réformes structurelles longues sans tenir compte du calendrier de transition CNRD.
