Omani health stakeholders / أصحاب المصلحة في النظام الصحي العماني:
  - Ministry of Health (وزارة الصحة):
      - H.E. Dr. Hilal bin Ali bin Hilal Al Sabti:
          - Title: Minister of Health of the Sultanate of Oman (since 16 June 2022)
          - Stakeholder engagement notes:
              - "Minister of Health since 16 June 2022 by Royal Decree of His Majesty Sultan Haitham bin Tariq; cardiothoracic surgeon by professional training; previously Senior Consultant Cardiothoracic Surgeon at Sultan Qaboos University Hospital (SQUH); Executive President of the Oman Medical Specialty Board (OMSB) from May 2015 until ministerial appointment; aged 49 at the time of appointment — distinctive clinical-academic credibility in a context where political appointments are more common."
              - "Active 2026: Health Care Management and Regulation Committee held its first meeting of 2026 (Times of Oman February 2026); welcomed Dr Hanan Balkhy, WHO EMRO Regional Director, at MoH (WHO Oman Office); led high-level meeting to boost health-sector cooperation (MededgeMEA coverage)."
              - "Owns MoH policy and budget, public hospital network (Royal Hospital, Khoula, Al Nahdha, Al Masarra and other Muscat-area hospitals), the primary health centre programme across Governorates, OMSB residency and specialty training continuity, SQUH coordination (under SQU and the Diwan of the Royal Court), Vision 2040 health-sector implementation, the National Health Strategy, and Oman's WHO EMRO, GCC Council of Health Ministers and Indian Ocean Rim Association health diplomacy."
              - "Hook: Vision 2040 health implementation, cardiothoracic and oncology specialist programmes (his clinical specialty area), primary-care strengthening, healthtech and AI integration, OMSB residency and training expansion, regional GCC health cooperation, and WHO EMRO partnership land."
          - Tone advice:
              - "Open with Vision 2040 implementation, cardiothoracic / oncology specialist programmes, OMSB residency and training expansion, primary care and GCC cooperation — these are his sustained authored 2022-2026 lines and his clinical-academic professional frame."
              - "Do not pitch as if SQUH were under direct MoH operational control — SQUH operates under Sultan Qaboos University governance, which sits under the Diwan of the Royal Court; pitches involving SQUH must include the SQU and Diwan as separate partners and respect that institutional separation."
