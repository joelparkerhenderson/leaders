Parties prenantes du système de santé centrafricain:
  - Notes sur le Ministre de la Santé Publique et de la Population de la République Centrafricaine:
      - Status: Identité substantive du Ministre du MSPP sous la présidence de Faustin-Archange Touadéra (MCU — Mouvement Cœurs Unis) à vérifier contre la Présidence (presidence-rca.cf), le Premier Ministre, le site du Ministère (sante.gouv.cf) et l'Agence Centrafricaine de Presse (ACAP). Corbeau News Centrafrique et RJDH (Réseau des Journalistes pour les Droits Humains) apportent un éclairage complémentaire dans un environnement médiatique restreint.
      - Implication: L'engagement sur la santé centrafricaine nécessite (i) l'identification du titulaire actuel via les canaux officiels de Bangui, (ii) la reconnaissance du contexte sécuritaire et politique — contrôle territorial fragmenté entre gouvernement (Bangui et axes), groupes armés (Coalition des Patriotes pour le Changement, ex-Séléka, Anti-balaka legacy) et présence russe (Africa Corps, ex-Wagner) qui appuie le gouvernement; framings qui assument un accès universel et stable seront inexacts —, et (iii) la lecture de la dépendance forte aux partenaires humanitaires (OMS, UNICEF, FNUAP, MSF — présence historique très significative —, ICRC, Fonds Mondial, Banque Mondiale, UE-MINUSCA-EUTM legacy).
      - Hook: mpox (la RCA est dans la zone de transmission active du clade I et participe à la réponse régionale CEEAC-CEMAC), conflit-blessures et chirurgie d'urgence, malnutrition aiguë sévère (MAS) et nutrition, santé maternelle et infantile (mortalité parmi les plus élevées au monde), paludisme et arboviroses, VIH et TB, accès humanitaire et coordination des partenaires, et reconstruction de l'architecture sanitaire dans les préfectures.
      - Tone: Ouvrir avec mpox, conflit-blessures, MCH, malnutrition aiguë, paludisme et coordination humanitaire — priorités opérationnelles en contexte de conflit. Ne pas ignorer le contexte sécuritaire (la majorité du territoire hors Bangui présente des défis d'accès), ni anchorer aux framings RDC (la RCA est un État souverain distinct avec sa propre architecture et ses propres partenaires, malgré la frontière partagée et certains croisements de l'épidémiologie One Health).
