Jamaican health stakeholders:
  - Ministry of Health and Wellness:
      - Dr. the Hon. Christopher Tufton (JLP):
          - Title: Minister of Health and Wellness (in the Andrew Holness JLP government)
          - Stakeholder engagement notes:
              - "Minister of Health and Wellness in the Andrew Holness JLP government; long-tenured in the role across multiple Holness cabinet cycles; PhD in international business and political economy; previously held the Industry, Investment and Commerce portfolio in earlier JLP cabinets — among the longest-serving members of the current Cabinet."
              - "Active 2025-2026 public agenda: called for 2026 to be 'Year of Mental Wellness' (Jamaica Gleaner, December 2025); announced a J$1-billion Health Infrastructure Maintenance Fund (Jamaica Observer, 13 May 2026); developing a menopause / andropause policy (Observer, 16 May 2026); pushed recruitment agenda for nurses, doctors and community health workers (Observer, 22 May 2026); moved to tighten financial operations in the public health sector (14 May 2026); reported that the National Health Fund spent J$11.5 billion delivering 3 million prescriptions (May 2026)."
              - "Owns Ministry policy, the four Regional Health Authorities (SERHA, NERHA, SRHA, WRHA), the NHF chronic-disease subsidies, public-private balance, primary-care strengthening through Type 3 to Type 5 Health Centres, the Compassionate Care framework, Jamaica's CARICOM and CARPHA leadership, and PAHO / WHO engagement."
              - "PMNCH board membership and global-health engagement profile — Tufton is a frequent multilateral voice on small-island NCD, mental-health and resilience agendas."
              - "Hook: mental wellness, health infrastructure maintenance, NCDs, menopause / andropause policy, NHF chronic-disease subsidies, workforce recruitment (including return-migration), and CARICOM / CARPHA / PAHO multilateral cooperation land."
          - Tone advice:
              - "Open with mental wellness, NCDs, NHF chronic-disease subsidies, infrastructure investment and the workforce-recruitment agenda — these are Tufton's authored 2025-2026 public lines."
              - "Do not pitch as if the Regional Health Authorities were Ministry subunits — the four RHAs operate hospitals with operational autonomy under statutory mandates; engagement on hospital programmes must include the relevant Regional Director."
