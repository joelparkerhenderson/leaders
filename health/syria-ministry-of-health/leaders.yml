Syrian health stakeholders:
  - Ministry of Health (MoH) — Transitional Government:
      - Musab Nazzal al-Ali (Transitional Government):
          - Title: Minister of Health (transitional government, post-December 2024)
          - Stakeholder engagement notes:
              - "Minister of Health in the Syrian transitional cabinet formed after the 8 December 2024 fall of Bashar al-Assad's regime to Hayat Tahrir al-Sham (HTS) led forces under Ahmed al-Sharaa (formerly known as Abu Mohammed al-Jolani); the transitional architecture was first established under interim Prime Minister Mohammed al-Bashir, then succeeded by the transitional government under a new constitutional declaration in March 2025 with al-Sharaa as Transitional President; verify currency against SANA (Syrian Arab News Agency, under new editorial direction), Enab Baladi, Syria Direct, Levant 24 and WHO Syria country office briefings since the cabinet has undergone successive reorganisations and the post-Assad institutional architecture is still being reconstituted."
              - "Owns the work of reconstituting MoH policy and budget, the Damascus University Hospital and Al-Mouwasat University Hospital, the hospital network across the fourteen governorates (Damascus, Rif Dimashq, Aleppo, Homs, Hama, Lattakia, Tartus, Idlib, Daraa, Sweida, Quneitra, Deir ez-Zor, Raqqa, Hasakah — under variable degrees of central authority given the AANES de facto administration in the northeast and the security mosaic of armed actors), pharmaceutical supply chain restoration (the pre-2011 Syrian pharmaceutical industry was a regional reference and reactivation is a sustained priority), donor coordination (WHO, UNICEF, WFP, UNFPA, UNHCR, IOM, MSF, ICRC, SARC, EU humanitarian aid, GCC bilateral — Saudi Arabia and UAE have re-engaged —, Turkish bilateral, Russian and Iranian engagement under recalibration), and the post-sanctions transition (US, UK and EU have lifted or eased sanctions in 2025 under specific frameworks to enable humanitarian and reconstruction activity)."
              - "Hook: health-system reconstruction and infrastructure rehabilitation, refugee and IDP return health planning (millions of Syrians displaced internally and externally — Türkiye, Lebanon, Jordan, Iraq, Egypt and Europe — are considering return), cholera and mpox outbreak response (Syria has had recurring cholera epidemics throughout the war), severe acute malnutrition, mental health and conflict-trauma services (one of the world's most acute mental-health burdens), conflict-injury rehabilitation and prosthetics, pharmaceutical industry reactivation, immunisation catch-up (polio risk, measles), and humanitarian-development nexus framing — these are the operational lines available for engagement."
          - Tone advice:
              - "Open with health-system reconstruction, refugee return, cholera outbreak response, mental health and trauma services, conflict-injury rehabilitation, pharmaceutical sector reactivation and humanitarian-development nexus — operational priorities and the framings that map to the transitional moment."
              - "Do not assume pre-2024 architecture (the Assad-era MoH organisational structures and leadership have been substantially recomposed; framings that assume continuity are inaccurate), do not ignore the AANES (northeast Syria operates under the Autonomous Administration of North and East Syria with its own health-administration structures distinct from Damascus; framings that assume Damascus monopoly are inaccurate), and do not ignore the sanctions transition (sanctions are being adjusted in 2025 with specific licensing and compliance requirements; routine commercial framings risk compliance issues)."
  - Notes on the Autonomous Administration of North and East Syria (AANES) Health Authority:
      - Status: The AANES (Kurdish-led, with Arab and Assyrian participation) administers the northeastern governorates (Hasakah, Raqqa, Deir ez-Zor partial, and parts of Aleppo) and operates its own Health Authority with its own hospital network, pharmaceutical supply and humanitarian-coordination structure with UN agencies and the SDF Coalition partners. Engagement on northeast Syrian health requires the AANES Health Authority as the operational counterpart for territory it administers. Verify current AANES Health Authority leadership against North Press Agency, Hawar News Agency and WHO Syria.
      - Implication: Engagement on Syrian health requires acknowledging the two de facto administrations (Transitional Government in Damascus; AANES in the northeast); framings must accommodate the de facto duality, the negotiations on integration that are under way between Damascus and AANES, and the practical access requirements for humanitarian operations.
