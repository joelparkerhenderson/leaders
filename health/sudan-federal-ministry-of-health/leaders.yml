Sudanese health stakeholders:
  - Federal Ministry of Health (SAF / Sovereignty Council-aligned government):
      - Haitham Mohammed Ibrahim:
          - Title: Federal Minister of Health of Sudan (in the SAF / Sovereignty Council-aligned government)
          - Stakeholder engagement notes:
              - "Federal Minister of Health of Sudan in the SAF / Sovereignty Council-aligned government during the ongoing civil war that started 15 April 2023 between the Sudanese Armed Forces (SAF) under Gen. Abdel Fattah al-Burhan and the Rapid Support Forces (RSF) under Mohamed Hamdan 'Hemedti' Dagalo; operates de facto from Port Sudan and SAF-controlled territories; war has devastated the Sudanese health system with displacement exceeding 12 million people, repeated cholera, dengue and measles outbreaks, and famine in conflict-affected areas."
              - "Active 2026: affirmed Sudan's steady progress toward recovery and rehabilitation of health institutions at the 79th World Health Assembly (allAfrica, 20 May 2026); discussed strengthening international support for Sudan in combating HIV/AIDS (allAfrica, 19 May 2026); urged international partners to support Sudan's health system (Sudan Horizon); praised Al-Gezira State for rapid restoration of the health system following SAF retake (allAfrica, 11 May 2026); joint Sudan-South Sudan ministerial meeting stressing strengthening joint health coordination (22 May 2026); joint Sudan-Chad meeting on cross-border health cooperation (22 May 2026); met Italian Emergency Agency Director (February 2026); discussed developing Darfur's surveillance and information system with a WHO delegation (February 2026); met UNFPA Resident Representative (March 2026); commented in November 2025 on the 'Health Assistance' project as a major shift and 2026 evaluation hinging on coordination and supply."
              - "Owns Federal Ministry policy within SAF-controlled areas, the National Medical Supplies Fund (NMSF), state-level coordination across 18 states (where accessible), post-conflict reconstruction prioritising Al-Gezira, Sennar, Kassala and Red Sea states, Cholera and dengue outbreak response programmes, HIV / TB / malaria continuity in displaced populations, mental health and trauma response, and cross-border health coordination with South Sudan, Chad, Egypt and Ethiopia."
              - "Hook: post-conflict health recovery and rehabilitation of health institutions, NMSF and pharmaceutical supply chains, cholera and dengue outbreak response, cross-border cooperation with neighbours, international partner advocacy (WHO, UNFPA, UNICEF, Italian Emergency, ICRC, MSF), mental-health and trauma response, and Darfur-specific surveillance development land."
          - Tone advice:
              - "Open with post-conflict recovery, international-partner support for Sudan's health system, cross-border cooperation and humanitarian-health needs — these are his sustained 2026 authored lines and the priorities of the SAF-aligned government in the ongoing war context."
              - "Do not pitch as if Sudan were peacetime — the civil war is ongoing as of mid-2026 and RSF-controlled territories operate separate de facto health arrangements (particularly in much of Darfur and parts of Khartoum); engagement must respect war-context constraints, complex humanitarian negotiations, and the contested-control reality."
