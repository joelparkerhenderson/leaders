Azerbaijani health stakeholders / Azərbaycan səhiyyə sahəsinin maraqlı tərəfləri:
  - Ministry of Health of the Republic of Azerbaijan (Azərbaycan Respublikası Səhiyyə Nazirliyi):
      - Teymur Yusif oghlu Musayev:
          - Title: Minister of Health of the Republic of Azerbaijan (under President Ilham Aliyev)
          - Stakeholder engagement notes:
              - "Minister of Health appointed by President Ilham Aliyev (Yeni Azərbaycan Partiyası, YAP); previously Acting Minister, then substantive ministerial appointment confirmed by Presidential Decree (apa.az, report.az, aztv.az coverage); confirmed in role in 2026 by attendance at the Regional Ecological Summit in Astana, Kazakhstan (AZERTAC, March 2026)."
              - "Active 2026: participation in Regional Ecological Summit Astana; coordination of Karabakh-region health-services reconstruction following Azerbaijan's recovery of formerly occupied territories in 2020 (Second Karabakh War) and September 2023 (one-day operation); modular hospitals and primary-care centres being deployed in Karabakh region as part of the post-conflict reconstruction; engagement on pandemic response framing ('situation of pandemic in Azerbaijan under control')."
              - "Owns Ministry of Health policy, TƏBİB (State Agency on Mandatory Health Insurance) single-payer governance under Azerbaijan's 2020-2021 mandatory insurance rollout, Analytical Expertise Center for medicines regulation, Karabakh-region health-infrastructure reconstruction programmes, SOCAR / SOFAZ-funded health infrastructure investment, oncology and cardiology centres, and COP29 (Baku November 2024) host-country health-and-climate legacy programmes; Azerbaijan's WHO Europe, Organisation of Turkic States (OTS) and BRICS+ engagement health diplomacy."
              - "Hook: Karabakh-region reconstruction, TƏBİB mandatory-insurance refinement, COP29 health-and-climate legacy, oncology and cardiology centres of excellence, Organisation of Turkic States cooperation, and BRICS+ engagement on health-cooperation land."
          - Tone advice:
              - "Open with Karabakh reconstruction, TƏBİB single-payer refinement, COP29 health-and-climate legacy and Organisation of Turkic States cooperation — these are the political-priorities of the Aliyev government on health and the operational levers Musayev controls."
              - "Do not pitch through Western-default framings — Azerbaijan operates multi-vector diplomacy with significant engagement with Türkiye, Israel, Russia, China and the West simultaneously; framings should accommodate that pluralism rather than assume Western alignment."
