Tuvaluan health stakeholders:
  - Notes on Minister of Health, Social Welfare and Gender Affairs of Tuvalu:
      - Status: Identity of the current Minister of Health, Social Welfare and Gender Affairs under the cabinet of Prime Minister Feleti Teo (in office since February 2024 after the January 2024 general election succeeded Kausea Natano) to be verified against tuvalu.tv and the Tuvalu Government Facebook page (which often serves as the primary official channel given the country's small size). Tuvalu is a Commonwealth realm under King Charles III represented by Governor-General Tofiga Vaevalu Falani.
      - Implication: Engagement on Tuvaluan health requires (i) identification of the current titleholder via official channels in Funafuti, (ii) recognition of Tuvalu's extreme climate exposure — nine low-lying coral atolls with maximum elevation ~5 metres above sea level, making Tuvalu the world's clearest case of climate-existential displacement risk; the Australia-Tuvalu Falepili Union treaty (signed November 2023, in force 2024) provides a unique climate-displacement migration pathway and is a defining policy frame —, (iii) Tuvalu's distinctive maintenance of diplomatic relations with Taiwan (one of the few sovereign states to do so), (iv) the very small population (~12,000) which means cabinet portfolios are often combined, and (v) the donor architecture (Australia DFAT — heavily prominent given the Falepili Union, New Zealand MFAT, World Bank, ADB, WHO WPRO, UNICEF, Japan JICA, Taiwan bilateral, EU).
      - Hook: NCDs (very high obesity, diabetes, hypertension — among the highest in WPRO), TB, MCH, climate-and-health (centrally — Tuvalu is the global reference case for climate-existential framing), water security (limited freshwater on atolls), Falepili Union migration-and-health pathway with Australia, mental health, immunisation, Princess Margaret Hospital capacity, Taiwanese medical cooperation, and PIF-PSIDS cooperation.
      - Tone: Open with climate-and-health (centrally — Tuvalu's global climate-displacement framing), NCDs, water security, Falepili Union architecture, Taiwanese cooperation and PIF-PSIDS — durable lines. Recognise the climate-existential dimension as central to all engagement framings, the Falepili Union as a new architecture-defining feature, and the Taiwan diplomatic relationship as a continuing policy choice.
