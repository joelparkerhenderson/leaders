South Sudanese health stakeholders:
  - Ministry of Health (MoH):
      - Hon. Yolanda Awel Deng Juach (SPLM):
          - Title: Minister of Health
          - Stakeholder engagement notes:
              - "Minister of Health in the Salva Kiir-led Revitalised Transitional Government of National Unity (R-TGoNU) established under the 2018 Revitalised Agreement on the Resolution of the Conflict in South Sudan (R-ARCSS); verify currency against the Office of the President of the Republic of South Sudan, MoH press communications and Eye Radio coverage, since cabinet changes occur in the context of repeatedly extended transitional arrangements."
              - "Owns MoH policy and budget, Juba Teaching Hospital (apex referral), Al Sabah Children's Hospital, the state-hospital network and primary-care facility network across the ten states (Central Equatoria, Eastern Equatoria, Jonglei, Lakes, Northern Bahr el Ghazal, Unity, Upper Nile, Warrap, Western Bahr el Ghazal, Western Equatoria) and the three administrative areas (Abyei, Pibor, Ruweng), donor coordination through the Health Pooled Fund (HPF — FCDO, USAID, EU, Sida, GAC), engagement with WHO, UNICEF, UNFPA, IOM, MSF and a large international-NGO consortium, and IGAD, AU and Arab League diplomacy."
              - "Hook: cholera, hepatitis E and mpox outbreak response (South Sudan has recurring multi-disease outbreaks driven by displacement, floods and weak WASH coverage), maternal-and-child mortality reduction (South Sudan has historically had some of the highest maternal mortality globally), measles and polio immunisation, conflict-injury and trauma surgical services, mental health and psychosocial support for war-affected populations, the Boma Health Initiative for community-level service delivery, and humanitarian-development nexus framing — these all land."
          - Tone advice:
              - "Open with outbreak response (cholera, hepatitis E, mpox, measles), maternal-and-child mortality, immunisation, conflict-injury and trauma services, Boma Health Initiative and humanitarian-development nexus — these are operational priorities in the R-TGoNU context."
              - "Do not bundle South Sudan with Sudan or assume a stable transition timeline — South Sudan seceded on 9 July 2011 and is a distinct sovereign state; the R-ARCSS has been repeatedly extended (most recently in 2024 by two years) and the political transition end-date is not fixed; framings that assume either error will be politely corrected."
  - Notes on Undersecretary, State Ministers of Health, and National Transitional Legislative Assembly Specialised Committee on Health Chair:
      - Status: Substantive identities to be verified against the Office of the President, the Council of Ministers, MoH press releases, the ten State Governors' offices, and the National Transitional Legislative Assembly committee allocations.
