Antigua and Barbuda health stakeholders:
  - Ministry of Health, Wellness and the Environment:
      - Sir Molwyn Joseph (ABLP):
          - Title: Minister of Health, Wellness and the Environment
          - Stakeholder engagement notes:
              - "Minister of Health in the Gaston Browne Antigua and Barbuda Labour Party (ABLP) government (re-elected in the January 2023 general election); long-serving ABLP cabinet member; Antigua and Barbuda is a Commonwealth realm under King Charles III represented by the Governor-General Sir Rodney Williams; verify currency against ab.gov.ag and Antigua Observer."
              - "Owns MoH policy and budget, Sir Lester Bird Medical Centre (SLBMC — the apex public facility, formerly Mount St. John's Medical Centre, in St. John's), the polyclinic and community-clinic network, the Adelin Medical Centre, the Hannah Thomas Hospital in Barbuda, coordination with the Barbuda Council (administratively distinct island governance via the Barbuda People's Movement), and CARICOM, CARPHA, OECS, ECCB, Commonwealth and PAHO diplomacy."
              - "Hook: non-communicable diseases (the Caribbean's high NCD burden is shared), mental health, climate-and-health (sargassum influx, sea-level rise, hurricane intensity), hurricane and disaster preparedness (Hurricane Irma 2017 destroyed much of Barbuda's infrastructure including health; reconstruction is ongoing), maternal-and-child health, Citizenship by Investment programme implications for health-system financing, and CARPHA-OECS regional cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, mental health, climate-and-health (especially sargassum and hurricane preparedness), Barbuda reconstruction, MCH and OECS-CARPHA cooperation — durable lines of the Ministry."
              - "Recognise the Barbuda Council's administrative distinctness for the sister island (the Barbuda People's Movement governs locally, and post-Irma reconstruction has political sensitivities) and do not conflate with other OECS states despite shared institutional patterns."
