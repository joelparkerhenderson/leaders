Côte d'Ivoire health stakeholders / Acteurs du système de santé ivoirien:
  - Ministère de la Santé, de l'Hygiène Publique et de la Couverture Maladie Universelle (MSHPCMU):
      - Pierre N'Gou Dimba (RHDP):
          - Title: Ministre de la Santé, de l'Hygiène Publique et de la Couverture Maladie Universelle de la République de Côte d'Ivoire
          - Stakeholder engagement notes:
              - "Ministre de la Santé, de l'Hygiène Publique et de la Couverture Maladie Universelle de Côte d'Ivoire sous le Président Alassane Ouattara (RHDP — Rassemblement des Houphouëtistes pour la Démocratie et la Paix) et le Premier ministre Robert Beugré Mambé; biographie publique disponible sur sante.gouv.ci."
              - "Active 2026 priorities: a souhaité faire de la qualité des soins la priorité de l'année 2026 (AIP — Agence Ivoirienne de Presse, février 2026); appelle à construire des systèmes de santé inclusifs avec les nouvelles technologies et les innovations dans le cadre de la souveraineté sanitaire (Abidjan.net et Connection Ivoirienne, mai 2026); a présenté la nouvelle Direction des Ressources Humaines de la Santé comme un levier de modernisation du système sanitaire (AIP); depuis Genève à l'OMS (mai 2026), a réaffirmé l'engagement de la Côte d'Ivoire à faire de la nutrition un pilier central de sa politique de santé maternelle et infantile (Connection Ivoirienne, 21 mai 2026)."
              - "Incident sécuritaire à Bôdô (AIP) après de violentes tensions, importants dégâts matériels et plusieurs interpellations enregistrés — le ministre a été exfiltré; illustre le contexte sécuritaire dans certaines zones du pays."
              - "Engagement international: a partagé l'expérience ivoirienne avec la 5e cohorte du stage résidentiel du Programme Kofi Annan en Leadership en santé mondiale (Abidjan.net) — positionnement Côte d'Ivoire comme référence régionale."
              - "Owns la politique du Ministère, l'administration de la CMU par la CNAM, l'approvisionnement pharmaceutique via la PSP, la régulation pharmaceutique via la DPM, l'Institut Pasteur de Côte d'Ivoire (IPCI), le réseau des CHU (Cocody, Treichville, Yopougon, Bouaké), et la diplomatie sanitaire de la Côte d'Ivoire à l'OMS Afrique, CEDEAO et UEMOA."
              - "Hook: CMU expansion, qualité des soins, ressources humaines de la santé, souveraineté sanitaire et innovations technologiques, nutrition maternelle et infantile, CEDEAO cooperation, Pasteur-IPCI mRNA-Africa programmes atterrissent."
          - Tone advice:
              - "Ouvrir avec CMU, qualité des soins, ressources humaines, souveraineté sanitaire et nutrition maternelle-infantile — ce sont les lignes autorales 2026 de Dimba et les marqueurs publics récurrents de sa communication."
              - "Ne pas pitcher en framings exclusivement Nord-Sud — la souveraineté sanitaire et la coopération africaine intra-régionale (Africa CDC, CEDEAO, UEMOA) sont des cadres explicites du discours ivoirien et tout framing qui les ignore sera reformulé."
