Ugandan health stakeholders:
  - Ministry of Health:
      - Hon. Dr. Jane Ruth Aceng Ocero (NRM):
          - Title: Minister of Health of the Republic of Uganda (since 2016)
          - Stakeholder engagement notes:
              - "Minister of Health since 2016 in the Yoweri Museveni (NRM) government, across two consecutive terms — one of the longest-serving Ugandan ministers in any portfolio; Senior Consultant Pediatrician; MBChB, Master of Medicine in Pediatrics (MMED), Master of Public Health (MPH), and Diploma in Public Administration and Management; politically based in Lira; launched re-election bid for her parliamentary seat in November 2025 against two opponents (New Vision coverage); member of Women in Global Health."
              - "Active 2026: announced Lubowa Specialized Hospital on track to open by end of 2026 (Nilepost) — flagship PPP-supported tertiary investment programme; blocked UVRI from Ebola testing (Daily Monitor) — controversial managerial intervention reflecting Ministry assertiveness over institute autonomy; applauded the National Health Laboratory and Diagnostic Services (NHLDS) for driving Uganda's diagnostic excellence; provided regular public Ebola updates."
              - "Career-defining Ebola response: led Uganda's pioneering Ebola Sudan virus response 2022-2023; coordinated Ebola Sudan vaccine clinical trials; managed subsequent mpox and SARS-CoV-2 responses; the Lubowa Specialised Hospital long-running tertiary-investment programme is the largest health-infrastructure project under her ministerial tenure."
              - "Owns Ministry of Health policy and budget, NDA (National Drug Authority) medicines regulation, the UVRI / NHLDS / CPHL public-health laboratory network, Mulago National Referral Hospital, Butabika National Referral Mental Hospital, District Health Office coordination across all districts, NHIS (National Health Insurance Scheme) pilot expansion, and Uganda's WHO Africa, East African Community (EAC) and AU CDC positioning."
              - "Hook: Ebola Sudan and Marburg outbreak preparedness (East African epicentre), NHIS rollout, Lubowa Specialised Hospital opening, mental-health expansion (Butabika modernisation), HIV / TB / malaria vertical programmes with PEPFAR / Global Fund / Gavi coordination, pharmaceutical localisation, and AU CDC / WHO Africa multilateral cooperation land."
          - Tone advice:
              - "Open with Ebola / Marburg preparedness, NHIS rollout, Lubowa Specialised Hospital and AU CDC cooperation — these are her sustained authored 2016-2026 lines and the pillars of her ministerial career."
              - "Do not assume single-actor Ministry framing — District Health Offices and PEPFAR / Global Fund / Gavi donor coordination are structurally embedded in Ugandan health delivery; framings must include district-level and donor partners as full participants."
