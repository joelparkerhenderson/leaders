Sistemul de sănătate românesc — părți interesate:
  - Ministerul Sănătății (Ministry of Health):
      - Cseke Attila (UDMR):
          - Title: Ministru al Sănătății (interimar) (Minister of Health, interim) (din mai 2026, în paralel cu funcția de Ministru al Dezvoltării)
          - Stakeholder engagement notes:
              - "Ministru al Sănătății în regim interimar din mai 2026 în guvernul Ilie Bolojan, după demisia ministrului Alexandru Rogobete (PSD) după aproximativ 10 luni de mandat în contextul ruperii parțiale a coaliției; păstrează în paralel funcția de Ministru al Dezvoltării — aranjament provizoriu până la reconfigurarea politică."
              - "UDMR (Uniunea Democrată Maghiară din România); jurist de profesie; carieră politică lungă cu multiple roluri ministeriale, inclusiv Ministru al Dezvoltării (din 2025) — al doilea mandat de gestionare a unei reuniuni mari de fonduri europene (PNRR)."
              - "Owns continuarea investițiilor PNRR în sănătate — semnarea unui pachet de 41 de acte adiționale pentru continuarea investițiilor esențiale din PNRR, prelungirea termenelor de proiect până în august 2026; supravegherea CNAS, ANMDMR și INSP; coordonarea cu Ministerul Finanțelor pentru bugetul de sănătate."
              - "Predecesorul Alexandru Rogobete (PSD, medic ATI) anunțase în 2026 schimbarea modului de finanțare pentru spitale, prioritățile post-moțiunii de cenzură, dublarea fondurilor europene pentru sistemul de sănătate în 2026, și concursuri pentru funcțiile-cheie din sistem — moștenire administrativă pe care Cseke Attila trebuie să o continue în interimat."
              - "Hook: PNRR Sănătate (spitale noi, dotări medicale, investiții esențiale), continuitate administrativă, finanțarea CNAS, salarii personal medical, fonduri europene în general, accesul la medicamente; pitchuri strategice pe termen lung vor fi amânate până la un ministru titular și o coaliție reconfigurată."
          - Tone advice:
              - "Deschideți cu PNRR Sănătate, continuitate administrativă și finanțare CNAS — sunt prioritățile interimatului și terenul pe care Cseke Attila este pregătit să decidă rapid."
              - "Nu propuneți reforme structurale de mandat — interimatul este timp-limitat și reformele structurale vor fi amânate pentru următorul ministru titular și ciclul de coaliție."
