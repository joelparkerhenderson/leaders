Σύστημα Υγείας Κύπρου — ενδιαφερόμενα μέρη:
  - Υπουργείο Υγείας (Ministry of Health):
      - Neophytos Charalambides:
          - Title: Υπουργός Υγείας (Minister of Health) (από 8 Δεκεμβρίου 2025)
          - Stakeholder engagement notes:
              - "Υπουργός Υγείας από 8 Δεκεμβρίου 2025 στην κυβέρνηση του Προέδρου της Δημοκρατίας Νίκου Χριστοδουλίδη, διαδεχόμενος τον Michael Damianos, ο οποίος μετακινήθηκε στο Υπουργείο Ενέργειας, Εμπορίου και Βιομηχανίας."
              - "Αναλαμβάνει το χαρτοφυλάκιο σε φάση όπου το ΓεΣΥ έχει ωριμάσει αρκετά μετά την εφαρμογή 2019-2020 αλλά παραμένουν ανοιχτά ζητήματα: ολοκλήρωση της αυτονομίας ΟΚΥπΥ, ενίσχυση της πρωτοβάθμιας φροντίδας, εξορθολογισμός συνταγογράφησης, και διαχείριση προϋπολογισμού €1,5 δισ. για το 2026 που αυξάνεται για την ενίσχυση του συστήματος."
              - "Owns την εποπτεία της HIO (Οργανισμός Ασφάλισης Υγείας) ως κρατικού αναδόχου ΓεΣΥ, της ΟΚΥπΥ ως αυτόνομου δημόσιου παρόχου, της Φαρμακευτικής Υπηρεσίας, των Ιατρικών Υπηρεσιών και Δημόσιας Υγείας, και της εκπροσώπησης Κύπρου σε επίπεδο ΕΕ (συμβούλιο EPSCO)."
              - "Hook: αυτονόμηση ΟΚΥπΥ, διακυβέρνηση ΓεΣΥ, χρόνια νοσήματα, ψυχική υγεία, εξειδικευμένη περίθαλψη, ευρωπαϊκή χρηματοδότηση Recovery and Resilience πιάνουν τόπο."
          - Tone advice:
              - "Εστίαση σε αυτονόμηση ΟΚΥπΥ, διακυβέρνηση ΓεΣΥ, χρόνια νοσήματα και πρωτοβάθμια φροντίδα — αυτές είναι οι ώριμες πτυχές του μεταρρυθμιστικού κύκλου του ΓεΣΥ."
              - "Μην προωθείτε πλαίσια που υποτιμούν τον δημόσιο τομέα — η αυτονόμηση ΟΚΥπΥ είναι κεντρική προτεραιότητα και ιδιωτικά-κεντρικά πλαίσια θα τύχουν εξονυχιστικού ελέγχου."
