Parties prenantes du système de santé mauritanien:
  - Notes sur le Ministre de la Santé de la République Islamique de Mauritanie:
      - Status: Identité substantive du Ministre de la Santé du gouvernement de Mohamed Ould Cheikh El Ghazouani (INSAF — El Insaf, parti au pouvoir) à vérifier contre la Présidence de la République (presidence.mr), le site du Ministère (sante.gov.mr) et l'Agence Mauritanienne d'Information (AMI). Le cabinet ministériel sous Ghazouani a connu plusieurs remaniements; les sources francophones (Cridem, Sahara Media) et arabophones (Alakhbar) sont les meilleurs canaux de vérification.
      - Implication: L'engagement sur la santé mauritanienne nécessite (i) l'identification du titulaire actuel via les canaux officiels de Nouakchott, (ii) la reconnaissance du caractère arabo-berbère et africain du pays — membre de la Ligue Arabe, de l'Union du Maghreb Arabe, de l'Union Africaine et historiquement du G5 Sahel — et (iii) la lecture de l'appui des partenaires (OMS, UNICEF, AFD, Banque Mondiale, Gavi, Fonds Mondial, partenaires arabes — Banque Islamique de Développement, AAAID — et chinois — l'Hôpital de l'Amitié sino-mauritanien).
      - Hook: paludisme et lutte vectorielle, santé maternelle et infantile (la mortalité maternelle reste élevée), nutrition et sécurité alimentaire (la Mauritanie est exposée aux cycles de sécheresse sahélien), NCDs (hypertension, diabète, drépanocytose), tuberculose, couverture santé universelle (la CNAM — Caisse Nationale d'Assurance Maladie — couvre les fonctionnaires et formels), et coopération arabe-africaine.
      - Tone: Ouvrir avec paludisme, santé maternelle et infantile, NCDs, nutrition, couverture universelle et coopération régionale — priorités durables du MS. Ne pas importer des framings sénégalais (Mauritanie est sur la rive nord du fleuve Sénégal mais distincte) ou maliens (frontière partagée mais identité distincte); reconnaître l'identité arabo-africaine et l'appartenance à la Ligue Arabe.
