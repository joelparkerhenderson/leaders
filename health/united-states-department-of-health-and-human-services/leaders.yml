US federal health stakeholders:
  - Department of Health and Human Services — Office of the Secretary:
      - Robert F. Kennedy Jr.:
          - Title: Secretary of Health and Human Services (26th; sworn in 13 February 2025)
          - X: https://x.com/SecKennedy
          - Stakeholder engagement notes:
              - "Sworn in 13 February 2025 as the 26th Secretary of HHS by Associate Justice Neil Gorsuch; the Make America Healthy Again (MAHA) executive order was signed the same day, framing the administration's health agenda."
              - "Pre-government career as an environmental lawyer (Riverkeeper, Waterkeeper Alliance) and as founder of Children's Health Defense; long-running public posture sceptical of vaccines, fluoridation, and pharmaceutical-industry influence on regulators."
              - "Has restructured HHS leadership rapidly through 2025-2026: dismissed CDC Director Susan Monarez in August 2025 after 28 days in post; accepted FDA Commissioner Marty Makary's resignation in May 2026; removed the two top USPSTF leaders in May 2026."
              - "FY27 HHS budget request released 3 April 2026 — $111.1bn discretionary, a $15.8bn (12.5%) reduction from FY26 enacted; vehicle for the MAHA programme restructuring."
              - "Hook: propositions framed around chronic-disease prevention, food and environmental contributors to disease, and reduced pharmaceutical and vaccine industry capture land; conventional public-health, vaccine-promotion, or industry-defending pitches will not."
          - Tone advice:
              - "Lead with chronic disease, environmental health, food policy, and scepticism of regulatory capture — these are the MAHA frame and Kennedy's authored priorities since the 1990s."
              - "Do not pitch conventional vaccine policy, fluoride, or pharma-industry framings — these are the explicit targets of his agenda and he will mark down anything that reads as defending the pre-2025 status quo."
  - Centers for Medicare & Medicaid Services (CMS):
      - Dr. Mehmet Oz:
          - Title: Administrator, Centers for Medicare & Medicaid Services (17th; confirmed and serving since 2025)
          - Stakeholder engagement notes:
              - "Sworn in as 17th CMS Administrator in 2025 after Senate confirmation; cardiothoracic surgeon; Professor Emeritus at Columbia University; former leader of the heart institute at New York-Presbyterian Medical Center."
              - "Two-decade prior career as host of The Dr Oz Show; unsuccessful 2022 Republican Senate candidate in Pennsylvania; brings the highest direct-to-consumer media reach of any senior HHS official."
              - "Owns the $1.7 trillion CMS budget — the largest agency in HHS — covering Medicare, Medicaid, CHIP, Marketplace, and the ACA exchanges; serves more than 160 million Americans."
              - "Public posture in 2026 anchored to TrumpRx (the government-sponsored discounted-drug platform) and to a Vice President Vance-led anti-fraud task force on Medicare and Medicaid; announced 160 new medications added to TrumpRx at a White House briefing 2 June 2026."
              - "Hook: TrumpRx pricing, Medicare and Medicaid fraud reduction, and direct-to-beneficiary communication propositions land; he is a media-fluent administrator who uses White House podiums tactically."
          - Tone advice:
              - "Lead with TrumpRx pricing, fraud detection, and beneficiary-facing communications — these are his authored public priorities and the framings he repeats at the podium."
              - "Do not pitch conventional CMS payment-reform or alternative-payment-model framings without an anti-fraud or pricing wrapper — Oz reads the brief through the MAHA / White House lens, not the pre-2025 CMMI tradition."
  - Food and Drug Administration (FDA):
      - Kyle Diamantas:
          - Title: Acting Commissioner of Food and Drugs (from May 2026; previously the FDA's top food regulator)
          - Stakeholder engagement notes:
              - "Named Acting Commissioner of the FDA in May 2026 after Marty Makary's resignation; previously the FDA's top food regulator under Makary."
              - "Inherits an FDA with eight acting officials including the Principal Deputy Commissioner and the Associate Commissioner for Minority Health vacancies — the depth chart is thin and the political timetable for a substantive Senate-confirmed Commissioner is unclear."
              - "Makary resigned in May 2026 over the administration's decision to authorise fruit-flavoured electronic cigarettes after President Trump reportedly pushed for faster vape approvals — Diamantas inherits this politically charged tobacco-product file."
              - "Hook: food-safety, food-additive, and tobacco-product propositions are the natural opening angles given his food-regulator background; biologics and accelerated-approval framings are higher-risk while the depth chart is being rebuilt."
          - Tone advice:
              - "Lead with food, additives, and tobacco-product framings — these are his subject-matter base and the topics where he can act without waiting for a substantive Commissioner."
              - "Do not pitch long-horizon biologics or device-approval strategy — acting status, vacant deputies, and an unsettled political brief mean strategic bets will be deferred."
  - Centers for Disease Control and Prevention (CDC):
      - Notes on the Centers for Disease Control and Prevention:
          - Status: As of June 2026 there is no Senate-confirmed CDC Director. Susan Monarez was confirmed in July 2025 and terminated in August 2025 after 28 days following a clash with Secretary Kennedy over vaccination policy. NIH Director Jay Bhattacharya additionally served as Acting CDC Director February-March 2026 while a substantive nominee was sought. As of June 2026 the agency is reported to have 11 acting directors overseeing operations and five top staff positions vacant.
          - Implication: Do not engage CDC as a single decision-making node during this period. Route policy and programme engagement through the HHS Office of the Secretary; route scientific-and-technical engagement through individual Center directors and named acting leads; verify any named CDC contact in writing within 30 days of engagement.
  - National Institutes of Health (NIH):
      - Jay Bhattacharya, MD, PhD:
          - Title: Director, National Institutes of Health (18th; sworn in 1 April 2025)
          - Stakeholder engagement notes:
              - "Senate-confirmed 25 March 2025; took the helm as 18th NIH Director 1 April 2025; first Indian-American to lead NIH; previously tenured Professor at Stanford Medical School, with research on population aging and chronic disease."
              - "Co-author of the Great Barrington Declaration (October 2020) — focused-protection alternative to lockdowns — which is the public position that brought him into the second Trump administration's orbit; long-running public posture against pandemic-era public-health orthodoxy."
              - "Also served as Acting Director of the CDC February to March 2026, retaining the NIH role concurrently, while a substantive CDC Director nomination was developed."
              - "Promised the House Appropriations subcommittee in March 2026 that, despite slow grant award pace, NIH would spend its full FY26 budget by year-end; appeared before Senate appropriators in May 2026 to defend NIH posture."
              - "Hook: chronic-disease research, health-economics framings, and focused-protection / public-health-reform propositions land; conventional pandemic-orthodoxy or NIH-Confederation-style defences will not."
          - Tone advice:
              - "Lead with chronic disease, health economics, and reform-of-public-health framings — these are his authored academic positions and the bridge to the MAHA agenda."
              - "Do not pitch as if NIH is unchanged from the pre-2025 institute model — Bhattacharya is a reformer with a position on public-health institutional capture, and reform-sceptical framings will fail."
  - Health Resources and Services Administration (HRSA):
      - Thomas J. Engels:
          - Title: Administrator, Health Resources and Services Administration
          - Stakeholder engagement notes:
              - "Administrator of HRSA, the primary federal agency for improving access to health care for the uninsured, isolated and medically vulnerable; FY26 enacted level $14.8bn including mandatory funding."
              - "HRSA owns the 340B Drug Pricing Program, Community Health Centers, Ryan White HIV/AIDS Program, Maternal and Child Health Bureau programmes, and rural-health programmes — a small-budget agency with disproportionate reach into underserved care."
              - "Acting Principal Deputy Administrator and Chief Medical Officer is Ann M. Sheehy, MD, MS — engagement on clinical-quality and rural-health technical questions runs through her office."
              - "Hook: 340B reform, community-health-centre digital and operational propositions, rural broadband-and-care propositions, and maternal-health programmes are the live agency priorities."
          - Tone advice:
              - "Lead with 340B, community health centres, rural health, and underserved populations — these are HRSA's authored mission and the dimensions on which it is judged."
              - "Do not pitch as if HRSA were a large operational agency — its leverage is programme design and grants, not direct delivery, and propositions that assume CMS-scale execution will not land."
  - Assistant Secretary for Technology Policy / Office of the National Coordinator for Health IT (ASTP/ONC):
      - Notes on ASTP/ONC:
          - Status: HHS reorganised the office in early 2026, ending the dual ASTP / ONC titling. ONC continues to operate as a staff division within the HHS Office of the Secretary, and the National Coordinator continues to report directly to the Secretary, but the Chief Technology Officer, Chief Artificial Intelligence Officer, and Chief Data Officer roles have been moved out of the office. The HTI-5 Proposed Rule (published 22 December 2025) and HTI-2 reflect a strategic pivot to a leaner FHIR-based certification programme and more aggressive information-blocking enforcement.
          - Implication: Engagement should be routed via the Office of the National Coordinator on certification, FHIR APIs, HTI rulemakings and information-blocking enforcement; and separately via the Office of the Secretary for AI, data, and cross-cutting digital strategy. Named post-holders for the post-reorganisation CTO / CAIO / CDO roles to be verified and added once HHS publishes substantive (non-acting) appointees.
  - Department of Veterans Affairs — Office of the Secretary:
      - Doug Collins:
          - Title: Secretary of Veterans Affairs (from 5 February 2025)
          - Stakeholder engagement notes:
              - "Sworn in as the 12th Secretary of Veterans Affairs 5 February 2025; former Republican Representative for Georgia's 9th Congressional District 2013-2021; Air Force Reserve chaplain (Lt Col); JD from John Marshall Law School."
              - "Designated Survivor for the 2026 State of the Union — high White House confidence as the Cabinet's veteran-affairs delivery face; Year One emphasis on wait-time reduction, community-care access expansion, hiring reform, and integrated EHR deployment."
              - "Launched a Veterans Health Administration reorganisation in early 2026 — described publicly by critics as a 'risky consolidation scheme'; testifying through 2026 to Senate Veterans' Affairs on the 21st-century VA health-care reorganisation."
              - "Partnered with CMS in 2026 on a $106m duplicate-billing recovery initiative; FY26 budget proposed a 4% increase for VA programmes; investing $800m in infrastructure improvements."
              - "Hook: community-care expansion, EHR Modernization (Oracle Health) delivery, hiring and workforce reform, and integrated benefits-and-health propositions land; siloed health-only pitches will not."
          - Tone advice:
              - "Lead with community-care access, EHR Modernization delivery, and benefits-plus-health integration — these are his authored Year-One narrative and his testimony framing."
              - "Do not pitch reform vehicles that look like 'another transformation programme' — his framing is consolidation and delivery, not new transformation overlay; reform-fatigue language will fail."
  - Veterans Health Administration (VHA):
      - Major General John Bartrum (USAF, ret.):
          - Title: Under Secretary for Health, Veterans Health Administration (Senate-confirmed)
          - Stakeholder engagement notes:
              - "Senate-confirmed as Under Secretary for Health, VHA; previously a senior advisor to Secretary Collins; retired Major General, US Air Force."
              - "Leads the largest integrated US health-care system — over nine million enrolled veterans and a national network of medical centres, community-based outpatient clinics, vet centres, and community-care contracts."
              - "Owns delivery of the Secretary's VHA reorganisation, the Oracle Health EHR Modernization roll-out resumption, and the community-care expansion which represents the largest single shift in VHA care-delivery posture in a decade."
              - "Dr Lee Payne was named Deputy Under Secretary for Health in February 2026 — clinical and policy partner for Bartrum and the natural engagement point for clinical-programme detail."
              - "Hook: VHA reorganisation, EHR Modernization, community-care contracting, and military-to-VA transition (DoD/VA interoperability) propositions land; the strategic chessboard is the integration of VA, DoD and community-care providers under one care plan."
          - Tone advice:
              - "Lead with VHA reorganisation, EHR Modernization (Oracle), community-care contracting, and DoD-to-VA continuity — these are the live programmes and his command-and-control framing."
              - "Do not pitch civilian-only or commercial-health frameworks unmodified — VHA's culture and workforce are military-adjacent, and lift-and-shift commercial pitches will be read as tone-deaf."
  - Senate Committee on Health, Education, Labor and Pensions (HELP):
      - Sen. Bill Cassidy, MD:
          - Title: Chairman, Senate Committee on Health, Education, Labor and Pensions (from January 2025; 119th Congress)
          - Stakeholder engagement notes:
              - "Republican Senator for Louisiana since 2015; gastroenterologist and hepatologist; co-founded the Greater Baton Rouge Community Clinic for the uninsured; the first physician to chair the Senate HELP Committee."
              - "Long-running personal authorship on mental health policy and on co-payment / surprise-billing reform (No Surprises Act); chaired HELP hearings on mental health in Louisiana in 2026; received a mental-health-policy award recognising the body of work."
              - "Launched the Senate HELP Republican Task Force to Eliminate Fraud in Federal Spending in 2026 — Medicare and Medicaid fraud, plus health-education grant oversight, are the live tracks."
              - "Supportive but conditional public posture on Secretary Kennedy's agenda — voted to confirm Kennedy but has used HELP hearings through 2026 to press on vaccine policy, NIH funding execution, and CDC continuity of operations."
              - "Hook: mental-health, fraud-detection, drug-pricing, and clinical-research-funding propositions land; he is a clinician-Senator who reads health policy through clinical-evidence lenses."
          - Tone advice:
              - "Lead with mental health, fraud reduction, drug pricing, and clinical-research-execution — these are his authored Chairman priorities and the topics on which he stages public hearings."
              - "Do not pitch as either a pure Trump-administration ally or a pure opposition figure — he uses HELP hearings to triangulate, and partisan framings either way will read as missing the room."
  - House Energy and Commerce Committee — Subcommittee on Health:
      - Rep. Morgan Griffith:
          - Title: Chairman, Subcommittee on Health, House Committee on Energy and Commerce (119th Congress)
          - Stakeholder engagement notes:
              - "Republican Representative for Virginia's 9th Congressional District since 2011; previously Majority Leader in the Virginia House of Delegates; long-tenured E&C member with deep Medicare and FDA authorising experience."
              - "Chair of the Subcommittee on Health in the 119th Congress; partners with full-committee Chair Brett Guthrie (R-KY) on public-health reauthorisations, FDA reforms, and Medicare policy markups in 2026."
              - "Constituency profile dominated by rural and Appalachian health, coal-country occupational disease, opioid policy, and Veterans health (large veteran population in south-west Virginia) — these shape his subcommittee priorities."
              - "Hook: rural-health access, FDA reform, public-health reauthorisations (Pandemic and All-Hazards Preparedness Act successors, opioid programmes), and Medicare-payment-policy propositions land; he is the natural authorising-track engagement point for any FDA or Medicare statutory change."
          - Tone advice:
              - "Lead with rural health, FDA modernisation, public-health reauthorisations, and Medicare statutory reform — these are his authored subcommittee priorities and the markups he runs."
              - "Do not pitch urban or Marketplace-centric framings without a rural-or-veteran overlay — Griffith's frame is south-west Virginia and the Appalachian rural economy."
