Partes interessadas do sistema de saúde guineense:
  - Notes sobre o Ministro da Saúde Pública da República da Guiné-Bissau:
      - Status: Identidade substantiva do Ministro da Saúde Pública num gabinete com rotação ministerial historicamente elevada sob a presidência de Umaro Sissoco Embaló (Madem G15) a verificar contra a Presidência da República (presidenciarepublica.gw), a Agência de Notícias da Guiné (ANG) e O Democrata. A política guineense conhece sucessivas crises desde a independência e a rotação ministerial é elevada — vários ministros em poucos anos.
      - Implication: O envolvimento na saúde guineense requer (i) identificação do titular atual via canais oficiais de Bissau e ANG, (ii) reconhecimento da instabilidade política e da rotação ministerial — framings de longo prazo são frágeis e podem ficar órfãos com remanejamentos —, (iii) leitura da arquitetura PALOP-CPLP — a cooperação portuguesa, brasileira e com Cabo Verde é uma alavanca técnica significativa — e (iv) acomodação da dependência forte de doadores (OMS, UNICEF, Banco Mundial, Fundo Global, Gavi, UE, AFD, OPEP).
      - Hook: paludismo (Guiné-Bissau tem alta carga e progresso variável), saúde materno-infantil (mortalidade materna e infantil entre as mais altas da África Ocidental), nutrição, NCDs, tuberculose, VIH (programa apoiado por Fundo Global e PEPFAR), surtos periódicos (cólera, sarampo), e cooperação CPLP-PALOP — Hospital Nacional Simão Mendes em Bissau e hospital regional Raoul Follereau como referências.
      - Tone: Abrir com paludismo, saúde materno-infantil, nutrição, NCDs, surtos e cooperação CPLP — prioridades operacionais do MSP. Não confundir com a República da Guiné (Conakry) — Estado distinto, língua oficial diferente (português vs. francês), histórias coloniais distintas (portuguesa vs. francesa); a confusão é frequente em framings externos e será educadamente corrigida.
