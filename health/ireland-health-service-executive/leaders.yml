              - "Publicly committed in January 2026 (Irish Times) to faster delivery on new medicines and to accelerating Sláintecare delivery; approved publication of HSE Capital Plans and the NDP Sectoral Plan for Health 2026-2030 — capital and reimbursement are early-tenure proof points."
              - "Co-announced the 27.4 billion euro 2026 health budget with the three Ministers of State — operates as a budget-discipline minister, not a spending minister; framed Budget 2026 around productivity and capacity."
