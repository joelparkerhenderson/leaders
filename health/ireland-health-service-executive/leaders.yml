              - "Lead with delivery, value-for-money, and a regulatory-or-reimbursement pathway — match her legal-and-Treasury-adjacent instincts and the Budget 2026 productivity framing."
              - "Avoid pitching transformation as a multi-year vision without near-term, measurable, in-this-Dáil deliverables — she will read that as a re-run of the Sláintecare delays she inherited."
