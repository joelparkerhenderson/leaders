Slovenské zdravotníctvo — zainteresované strany:
  - Ministerstvo zdravotníctva Slovenskej republiky (MZ SR):
      - Kamil Šaško (Hlas-SD):
          - Title: Minister zdravotníctva (Minister of Health) (od 10. októbra 2024)
          - Stakeholder engagement notes:
              - "Minister zdravotníctva v štvrtej vláde Roberta Fica (Smer-SD, Hlas-SD, SNS) od 10. októbra 2024; Hlas-SD; nahradil predchádzajúcu ministerku Zuzanu Dolinkovú (Hlas-SD), ktorá rezignovala v septembri 2024 po sérii konfliktov v rezorte."
              - "Narodený 5. novembra 1985 v Poprade; ekonomista; študoval Applied Science and Management na University of Sussex v Anglicku, neskôr získal titul v oblasti investičného bankovníctva v Londýne — netradičný profil pre slovenského ministra zdravotníctva (zvyčajne lekár alebo zdravotnícky manažér)."
              - "Owns zmluvy medzi MZ SR a tromi zdravotnými poisťovňami (VšZP, Dôvera, Union), dohodu o cenách bodov, liekovú politiku v spolupráci so ŠÚKL, sieť univerzitných a fakultných nemocníc, kategorizáciu liekov, e-zdravotníctvo (eRecept, ezdravie) a komunikáciu s komorami (SLK, SKSaPA, lekárnická komora)."
              - "Predstavil v máji 2026 'sedem kľúčových zmien' v liekovej politike — reforma kategorizácie liekov, dostupnosť moderných terapií pre deti a vážne chorých pacientov; lieková reforma je centrálnym dokumentom jeho mandátu a obsahom jeho najfrekventovanejších verejných vystúpení."
              - "Aktívny účastník ITAPA (digitalizácia verejnej správy) a Plánu obnovy a odolnosti SR pre zdravotníctvo — digitalizácia je jeho druhou stálou témou popri liekovej politike."
              - "Hook: lieková reforma a dostupnosť moderných liekov, sieť nemocníc, dohoda s poisťovňami, e-zdravotníctvo a digitalizácia, EÚ fondy (Plán obnovy) landujú; pitchy ignorujúce tri-poisťovňový systém nelandujú."
          - Tone advice:
              - "Otvor liekovou reformou, sieťou nemocníc a digitalizáciou — sú to verejne komunikované priority a Šaškove profesionálne (ekonomické a digitálne) silné stránky."
              - "Nepitchuj cez VšZP ako jediného plátcu — Slovensko má tri poisťovne v konkurenčnom prostredí, a framingy s jediným plátcom typu NHS budú opravené."
