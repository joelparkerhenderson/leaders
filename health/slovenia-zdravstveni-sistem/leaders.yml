Slovenski zdravstveni sistem — deležniki:
  - Ministrstvo za zdravje (Ministry of Health):
      - Tadej Ostrc (Demokrati):
          - Title: Minister za zdravje (Minister of Health) (od 4. junija 2026; predlagan s strani stranke Demokrati v koaliciji SDS-NSi-Demokrati)
          - Stakeholder engagement notes:
              - "Minister za zdravje v 16. vladi Republike Slovenije (Janša IV) od 4. junija 2026, dan ko je državni zbor potrdil mandat (centro-desna koalicija SDS-NSi-Demokrati s podporo SLS; Janez Janša je predsednik vlade že četrtič); ministra so na funkcijo predlagali Demokrati."
              - "Rojen 4. junija 1981 v Sloveniji; doktor stomatologije in specialist stomatološke protetike, hkrati pa politolog — kombinacija klinične zobozdravstvene prakse in politološkega izobraževanja je v slovenski politiki neobičajna; prvi mandat na ministrski funkciji."
              - "Mandatni prednostni cilji: učinkovita reorganizacija in digitalizacija slovenskega zdravstva, krepitev primarne zdravstvene oskrbe pod enakimi pogoji za vse prebivalce, in administrativna razbremenitev — še posebej družinske medicine."
              - "Politično občutljivi del mandata: javno napovedana vključitev zasebnih izvajalcev v javno mrežo za izboljšanje dostopnosti — politični potez, ki je v dnevih po prisegi sprožil opozorila NIJZ, opozicije (Svoboda, SD, Levica), sindikatov ter strokovne javnosti, da je potrebna previdnost in premišljenost."
              - "Owns prevzem in operativno upravljanje portfelja po štirih letih Svobodine vlade (predhodnica ministrica dr. Valentina Prevolnik Rupel je odšla aprila 2025); reorganizacija MZ, ZZZS, NIJZ in JAZMP je verjetno na dnevnem redu prvih mesecev mandata."
              - "Hook: digitalizacija zdravstva, primarno zdravstvo, javno-zasebno partnerstvo, zobozdravstvo (kot lastna stroka), čakalne dobe, RRF (sklad za okrevanje in odpornost) zdravstvo pristajajo."
          - Tone advice:
              - "Odpri z digitalizacijo, primarno oskrbo, čakalnimi dobami in javno-zasebnim partnerstvom — to so politične smernice nove koalicije in Ostrčevi avtorski prednostni cilji."
              - "Ne pristopaj kot da je javni sistem edina pot — vključitev zasebnikov je centralna politična linija nove vlade, vendar previdno: opozicija in sindikati so glasno proti, in pretirano zasebno-orientirani okvirji bodo politično kompromitirajoči."
