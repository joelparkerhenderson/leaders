Tajik health stakeholders:
  - Ministry of Health and Social Protection of the Population (MoHSPP):
      - Jamoliddin Abdullozoda (PDPT):
          - Title: Minister of Health and Social Protection of the Population
          - Stakeholder engagement notes:
              - "Minister of MoHSPP in the Emomali Rahmon government (PDPT — People's Democratic Party of Tajikistan, ruling); medical doctor; long-serving in the portfolio under the institutional continuity of the Rahmon era (President since 1992); verify currency against the Presidency (president.tj), the MoHSPP (moh.tj) and Khovar National Information Agency (khovar.tj); Asia-Plus and Radio Ozodi (RFE/RL Tajik Service) are independent canals."
              - "Owns MoHSPP policy and budget, the National Medical Centre 'Shifobakhsh' (apex public facility in Dushanbe), the National Centre for Tuberculosis, Lung Diseases and Thoracic Surgery, oblast hospital networks across Sughd, Khatlon, Gorno-Badakhshan Autonomous Region (GBAO) and Districts of Republican Subordination (DRS, Districts under direct national administration), the primary-care family-medicine network, social-protection programmes, and WHO Europe, CIS, SCO, ECO (Economic Cooperation Organisation), CAREC and Persian-cultural-area health diplomacy."
              - "Hook: tuberculosis and multidrug-resistant TB (Tajikistan has one of the highest MDR-TB burdens in the WHO European Region and is a Global Fund and USAID priority country), HIV, maternal and child health (Tajikistan has the highest fertility rate in Central Asia), non-communicable diseases, migration health (very large Tajik labour migration to Russia generates remittance-and-return dynamics with implications for HIV, TB and mental health), nutrition (iodine deficiency, stunting), polio surveillance, mpox preparedness, and Afghan-border health-security cooperation under SCO and the UN Country Team — these all land."
          - Tone advice:
              - "Open with TB-MDR, MCH, NCDs, migration health, nutrition, polio surveillance and Afghan-border health security — these are the operational priorities of the MoHSPP."
              - "Do not conflate Tajikistan with Uzbekistan or Kyrgyzstan (sovereign state with Persian-cultural identity — Tajik is a Persian language, distinct from Turkic neighbours — and its own architecture and policy autonomy) or reduce the engagement to Afghan-border framings (Afghanistan border affects security and migration but the MoHSPP agenda is much broader)."
  - Notes on Director-General National Medical Centre Shifobakhsh and Majlisi Namoyandagon Committee on Health Chair:
      - Status: Substantive identities to be verified against the Presidency, MoHSPP and Majlisi Namoyandagon (Assembly of Representatives) committee allocations.
