Bhutanese health stakeholders:
  - Ministry of Health (MoH):
      - Lyonpo Tandin Wangchuk (PDP):
          - Title: Minister of Health (since January 2024)
          - Stakeholder engagement notes:
              - "Minister of Health in the Tshering Tobgay (People's Democratic Party) government since January 2024 following the 9 January 2024 National Assembly election; engineer by training; serves under King Jigme Khesar Namgyel Wangchuck in Bhutan's constitutional Buddhist monarchy; the Bhutanese cabinet uses the honorific 'Lyonpo' for ministers."
              - "Owns MoH policy and budget, the Jigme Dorji Wangchuck National Referral Hospital (JDWNRH) in Thimphu, the Eastern Regional Referral Hospital in Mongar, the Central Regional Referral Hospital in Gelephu, the dzongkhag (district) hospitals and basic health unit (BHU) network across the twenty dzongkhags, the constitutional free-at-point-of-use commitment (Article 9 of the Constitution: the State shall provide free access to basic public health services), the Gross National Happiness-informed health-policy framing, traditional Sowa Rigpa (Bhutanese-Tibetan medicine) integration into the public system, referral arrangements to Indian tertiary hospitals under government-funded coverage for conditions beyond domestic capacity (a structural feature of Bhutanese referral pathways), and SAARC, BIMSTEC, WHO SEARO and WTO-LDC graduation transition diplomacy."
              - "Hook: GNH-aligned health-system framing (constitutionally embedded), mental health (a recognised national priority and unusual policy salience for a small state), non-communicable diseases (hypertension, diabetes, cancer), mother and child health, traditional Sowa Rigpa medicine, climate-and-health (Bhutan is one of the few carbon-negative countries with an active climate-health agenda recognised by WHO), digital health and tele-medicine for remote dzongkhag access, NCDs and tobacco/alcohol policy, and India-referral coordination — these all land."
          - Tone advice:
              - "Open with GNH-aligned framing, mental health, NCDs, MCH, Sowa Rigpa, climate-and-health, digital health and India-referral coordination — these are Bhutanese signature lines and the policy lens through which engagement is interpreted."
              - "Do not import Indian-system framings (Bhutan is a sovereign monarchy with distinct constitutional, cultural and Buddhist-philosophical orientation) or ignore the constitutional free-at-point-of-use commitment and the GNH lens — both will be politely but firmly corrected."
