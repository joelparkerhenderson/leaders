Sri Lankan health stakeholders:
  - Ministry of Health and Mass Media:
      - Hon. Dr. Nalinda Jayatissa (NPP / JVP):
          - Title: Minister of Health and Mass Media, Chief Government Whip and Cabinet Spokesperson (since November 2024)
          - Stakeholder engagement notes:
              - "Minister of Health and Mass Media, Chief Government Whip of the Government, and Cabinet Spokesperson since November 2024 in the Anura Kumara Dissanayake (NPP) government formed after the 21 September 2024 presidential election won by Dissanayake and the subsequent November 2024 parliamentary election that gave the NPP a supermajority; NPP / JVP; medical doctor; elected to the 10th Parliament from the Kalutara District; long-time JVP figure with parliamentary and public-policy experience."
              - "Delivered Sri Lanka's national statement at the General Discussion of the 79th World Health Assembly in Geneva on 19 May 2026 — significant international-platform appearance as Minister, articulating the NPP government's health-policy direction including universal health coverage, prevention and equity (Permanent Mission of Sri Lanka to the UN Geneva)."
              - "Multilateral and bilateral engagement: attended Tarique Rahman's oath ceremony in Bangladesh (February 2026, BSS News / Newswire); maintains visible posture on the Mass Media portfolio alongside Health, and as Cabinet Spokesperson, which gives him unusual cross-government communication weight in the Dissanayake cabinet."
              - "Owns the post-2022-economic-crisis reconstruction of medicine supply, NMRA reform agenda, State Pharmaceuticals Corporation (SPC) stabilisation, restoration of cancer-care services, oncology and other essential drugs procurement, maternal-and-child health continuation, NCD strategy, and the JVP / NPP equity-focused public-health framing."
              - "Hook: medicine supply restoration, oncology drugs procurement, NCDs, maternal-and-child health continuation, primary-care strengthening, NMRA reform, climate-and-health, and South Asian / SAARC and WHO SEARO cooperation land."
          - Tone advice:
              - "Open with medicine supply restoration, oncology drugs, equity-focused public health and SAARC / WHO SEARO cooperation — these are post-economic-crisis priorities and the NPP / JVP frame on health-as-public-good."
              - "Do not pitch with private-sector-led framings as the default — the NPP / JVP government's emerging public-health line emphasises public provision, regulation and equity; private-led framings will be politically discounted by the Cabinet Spokesperson and JVP base."
