Österreichisches Gesundheitswesen Stakeholder:
  - Bundesministerium für Arbeit, Soziales, Gesundheit, Pflege und Konsumentenschutz (Sozialministerium):
      - Korinna Schumann (SPÖ):
          - Title: Bundesministerin für Arbeit, Soziales, Gesundheit, Pflege und Konsumentenschutz (Federal Minister for Labour, Social Affairs, Health, Care and Consumer Protection) (seit 3. März 2025)
          - Stakeholder engagement notes:
              - "Bundesministerin im Stocker-Babler-Schumann-Kabinett (ÖVP-SPÖ-NEOS) seit dem 3. März 2025 nach langwieriger Regierungsbildung nach der Nationalratswahl September 2024; SPÖ; vorher Vorsitzende der GPA-Gewerkschaft und Vizepräsidentin des ÖGB."
              - "Gewerkschaftshintergrund (GPA, ÖGB) prägt das Mandat: Pflegeteil, Arbeitsbedingungen im Gesundheitswesen, KV-Verhandlungen, Sozialpartnerschaft als institutioneller Modus."
              - "Verantwortet das gesamte Sozialministerium-Portfolio: Arbeit, Soziales, Gesundheit, Pflege, Konsumentenschutz — eine der breitesten Ressorts der österreichischen Bundesregierung."
              - "Bund-Länder-Sozialversicherungs-Reformprozess Gesundheit soll laut Bundeskanzler Christian Stocker (ÖVP) im Juni 2026 fertig sein; Schumann hat einzelne Differenzen mit Stocker öffentlich gemacht — koalitionäre Spannungen auf der Gesundheits-Linie sind erkennbar."
              - "Hook: Pflegereform, Spitalsfinanzierung, Spitalsstruktur, ÖGK-Steuerung, Arbeitsbedingungen im Gesundheitswesen, Konsumentenschutz landen; Pitches, die das Bund-Länder-Sozialversicherungs-Dreieck ignorieren, landen nicht."
          - Tone advice:
              - "Mit Pflege, Spitalsfinanzierung, ÖGK-Reform und Arbeitsbedingungen einsteigen — das sind die SPÖ-Linien und ihr gewerkschaftlicher Hintergrund."
              - "Nicht zentralstaatlich pitchen, als wäre der Bund operativer Träger — Spitäler sitzen bei den Ländern via Landesgesundheitsfonds, die Versicherung in der Selbstverwaltung; Wien-zentrische Framings werden zurückgespielt."
