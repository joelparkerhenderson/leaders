Système de santé marocain — parties prenantes:
  - Ministère de la Santé et de la Protection Sociale:
      - Amine Tahraoui (RNI-aligned technocrat):
          - Title: Ministre de la Santé et de la Protection Sociale (since October 2024, in the second Akhannouch government)
          - Stakeholder engagement notes:
              - "Ministre de la Santé et de la Protection Sociale depuis octobre 2024 dans le deuxième gouvernement Akhannouch (RNI), succédant au Pr Khalid Aït Taleb; profil pré-politique inhabituel pour le portefeuille santé: chef de cabinet du Ministre de l'Agriculture sous Aziz Akhannouch; banquier d'affaires chez Attijari; Directeur Général du Groupe Aksal; Secrétaire Général de la Primature avant la nomination ministérielle — formation finance-corporate alignée avec la logique économique du gouvernement Akhannouch."
              - "Agenda public 2026: a annoncé 15 projets hospitaliers à livrer en 2026 dans différentes régions du Maroc (La Nouvelle Tribune); lancement en avril 2026 d'une nouvelle génération d'hôpitaux et de centres de santé dans la région Drâa-Tafilalet du Sud-Est pour désenclaver l'accès aux soins (Médias24, qui rapporte 70.000 habitants nouvellement desservis par un hôpital à Boumalne Dadès); défense des réformes devant le Parlement en mars 2026 (Médias24, Yabiladi); promesse d'un système plus moderne."
              - "Owns la mise en œuvre de la Loi-cadre 06.22 créant les Groupements Sanitaires Territoriaux comme autorités sanitaires régionales décentralisées; l'universalisation de l'AMO (y compris AMO Tadamon pour l'ancien RAMED); la réforme pharmaceutique et médicament via la DMP; l'expansion du réseau des CHU (cinq CHU plus CHU Tanger en projet); la coordination avec CNSS et CNOPS; et l'initiative de production pharmaceutique locale."
              - "Annonce d'une réforme multidimensionnelle (Le Matin.ma); poursuite de la réforme du système de santé annoncée par le Roi en 2021-2025 dans le cadre de la Royal Reform; rôle de défenseur public de la politique sanitaire gouvernementale dans les médias."
              - "Hook: universalisation AMO, décentralisation GST, infrastructure hospitalière (15 nouveaux en 2026), expansion CHU, fabrication pharmaceutique locale, santé mentale et santé numérique aterrissent."
          - Tone advice:
              - "Ouvrir avec universalisation AMO, décentralisation GST, livraison infrastructure hospitalière et expansion CHU — ce sont les lignes autoréales sostenues de Tahraoui et les priorités de la Royal Reform."
              - "Ne pas pitcher avec un cadre purement technocratique — Tahraoui est aligné RNI et opère dans la logique politique du gouvernement Akhannouch; les framings qui ignorent les priorités RNI (emploi, investissement, égalité régionale) n'aterriront pas."
