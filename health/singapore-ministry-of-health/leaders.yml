Singapore health stakeholders:
  - Ministry of Health (MOH):
      - Mr Ong Ye Kung (PAP):
          - Title: Minister for Health and Coordinating Minister for Social Policies (since 2021; retained in the Lawrence Wong PAP government formed May 2024 and after the 2025 general election)
          - Stakeholder engagement notes:
              - "Minister for Health since 2021 and Coordinating Minister for Social Policies in Lawrence Wong's PAP government (formed 15 May 2024 following Lee Hsien Loong's transition to Senior Minister; retained after the 2025 general election); PAP; previously Minister for Transport (2020-2021), Minister for Education (2018-2020), and Minister for Manpower (2015-2018) — senior PAP figure with broad portfolio experience across the social-policy ministries."
              - "Active 2026 public agenda: led Singapore's delegation to the 79th World Health Assembly in Geneva (May 2026); delivered the Committee of Supply 2026 speech in Parliament (5 March 2026) covering MOH priorities and budget; spoke at the Singapore Health Quality Service Awards; addressed the 3rd Singapore Primary Care Conference (15 May 2026); spoke at the National Medical Research Council Awards Ceremony and Research Symposium 2026 (22 May 2026); attended the NHG Health Musculoskeletal Day Fiesta (28 March 2026)."
              - "Owns the implementation of Healthier SG (the 2023 primary-care registration with family GP initiative — a defining preventive-care reform), the three-cluster restructuring of public delivery (NHG, SingHealth, NUHS), MediShield Life and CareShield Life premium policy, MediSave and MediFund governance via CPF Board coordination, MOH Holdings governance, HSA regulation, HPB prevention, ACE HTA, and the bilateral cooperation with WHO WPRO, ASEAN, ASEAN+3 and BRICS+ on health."
              - "Strategic priorities of the 2024-2029 term include preparing the system for an aged society (>20% population aged 65+ by 2030), Punggol General Hospital pipeline, dementia care, mental health, healthtech and AI integration, and public-health resilience post-Covid."
              - "Hook: Healthier SG implementation and outcomes, ageing-population services, dementia care, MediShield Life and CareShield Life policy, MOH Holdings governance, three-cluster reform, primary care, mental health, climate-and-health, healthtech and AI deployment, and ASEAN / WHO WPRO cooperation land."
          - Tone advice:
              - "Open with Healthier SG, ageing-population services, primary care, MediShield Life policy and ASEAN cooperation — these are his sustained 2021-2026 priorities and the PAP frame on health and social policy."
              - "Do not pitch as if MOH could authorise everything directly — the three clusters (NHG, SingHealth, NUHS) and MOH Holdings retain operational authority, and engagement on hospital programmes must include cluster CEOs as partners, not subordinates."
