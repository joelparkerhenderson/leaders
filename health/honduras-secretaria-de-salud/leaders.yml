Sistema de salud hondureño — partes interesadas:
  - Secretaría de Salud (SESAL):
      - Nasry Juan "Tito" Asfura Zablah (Partido Nacional):
          - Title: Presidente de la República y titular directo de la Secretaría de Salud (desde el 27 de enero de 2026)
          - Stakeholder engagement notes:
              - "Presidente de la República de Honduras desde el 27 de enero de 2026, tras la victoria del Partido Nacional en las elecciones generales de noviembre 2025; sucedió a Xiomara Castro (Libre); ex-Alcalde de Tegucigalpa con dos períodos."
              - "Tomó la decisión inusual de asumir personalmente la titularidad de la Secretaría de Salud, sin designar un Secretario titular separado — anunciado el 28 de enero de 2026 como medida para 'fortalecer el control directo sobre los servicios sanitarios'; Prensa Latina, La Prensa Honduras e Infobae confirmaron el arreglo."
              - "Estructura de apoyo: los tres Vicepresidentes (María Antonieta Mejía, Diana Herrera, Carlos Flores Guifarro) acompañan la cartera; Vice-Ministros operativos designados: Ángel Midence como Vice-Ministro de Redes Integradas de Servicios de Salud; José Miguel Castillo como Sub-Secretario de Proyectos e Inversión."
              - "Owns la rectoría operativa de SESAL, coordinación con IHSS, ARSA (Agencia de Regulación Sanitaria), redes hospitalarias departamentales, y el inicio del Plan Asfura de Salud — política sanitaria definida directamente desde la Presidencia, sin intermediación ministerial."
              - "Contexto operativo: Asfura asume después de cuatro años del gobierno de Xiomara Castro (Libre, 2022-2026), en el que José Manuel Matheu fue Ministro de Salud hasta 2023 (separado para acelerar metas y sustituido por Carlos Aguilar); el sistema enfrenta brechas de financiamiento, dengue endémico y desabasto crónico de insumos."
              - "Hook: infraestructura hospitalaria nueva, salud materno-infantil, dengue y vectores, cobertura sanitaria universal, IHSS reform aterrizan; los pitches deben canalizarse vía Vice-Ministros y Casa Presidencial, no vía un Secretario titular."
          - Tone advice:
              - "Abrir con infraestructura hospitalaria, IHSS, dengue, salud materno-infantil y prioridades del Plan Asfura de Salud — son las líneas explícitas del Presidente y la base del arreglo presidencial-directo."
              - "No buscar Secretario/a titular — la estructura es presidencial con Vice-Ministros operativos; cualquier framing que asuma una jefatura ministerial separada será corregido institucionalmente."
