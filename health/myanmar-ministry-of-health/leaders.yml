Myanmar health stakeholders:
  - Ministry of Health, Union Government of Myanmar (post-SAC-successor government, Min Aung Hlaing presidency):
      - Notes on Minister of Health, Union Government of Myanmar:
          - Status: The State Administration Council (SAC) was the military junta that governed Myanmar from 2021 to 2025 and was dissolved with the conclusion of the state of emergency at the end of July 2025. On 31 January 2026 the state of emergency formally ended; on 11 April 2026 a new parliament installed Min Aung Hlaing as the 11th President of the Republic of the Union of Myanmar; on 10 April 2026 the new Union Government of Myanmar was established with appointments to ministries including many individuals who had served in Min Aung Hlaing's previous SAC ministries. The substantive identity of the Minister of Health in the new Union Government should be verified against the Union Government List at moi.gov.mm and the Ministry of Health website at moh.gov.mm; the 2025-2026 general election context (held in phases) and the ongoing civil war between the SAC-successor government and the NUG-aligned resistance forces continue to shape political instability.
          - Implication: Engagement on Myanmar health requires acknowledging the dual administration structure — Min Aung Hlaing's Union Government in territories under SAC-successor control on one side, and the National Unity Government (NUG) parallel Ministry of Health serving resistance-controlled territories and ethnic-armed-organisation (EAO) areas on the other. The post-coup government remains politically isolated internationally, with most Western governments not recognising it. WHO Myanmar operates under cross-line access negotiations and humanitarian-corridor agreements. Any engagement must respect humanitarian-principles constraints, sanctions environment, and the practical access realities.
  - Notes on National Unity Government (NUG) Ministry of Health:
      - Status: The parallel NUG, formed in 2021 by elected MPs ousted in the February 2021 coup, operates a Ministry of Health serving the resistance-controlled territories and providing remote support to health workers in conflict-affected and EAO areas; the NUG Minister of Health's identity and current programmes should be verified against NUG official communications.
      - Implication: NUG engagement requires acknowledging the parallel-government structure and the international-recognition question; some Western governments engage NUG diplomatically without formally recognising it as the legitimate government of Myanmar.
