Kyrgyz health stakeholders:
  - Ministry of Health (MoH):
      - Erkin Checheybaev (Japarov-aligned):
          - Title: Minister of Health
          - Stakeholder engagement notes:
              - "Minister of Health in the Sadyr Japarov / Akylbek Japarov (Chair of Cabinet) government; medical doctor with public-administration background; verify currency against the Cabinet of Ministers (gov.kg), the MoH (med.kg) and Kabar Kyrgyz News Agency (kabar.kg), since cabinet changes occur with some frequency in the post-October-2020 Japarov era."
              - "Owns MoH policy and budget, the National Hospital in Bishkek, the Kyrgyz Research Institute of Cardiology and Internal Medicine, oblast and rayon hospital network across the seven oblasts (Batken, Chuy, Issyk-Kul, Jalal-Abad, Naryn, Osh, Talas) plus the cities of Bishkek and Osh, the Mandatory Health Insurance Fund (MHIF — the social-insurance financing arm), the State-Guaranteed Benefits Package (SGBP — the entitlement structure), the Den Sooluk reform programme legacy (the long-running PHC and financing reform supported by WHO Europe, World Bank, KfW, GIZ, USAID and Sida), and WHO Europe, EAEU, CIS, SCO, OTS (Organisation of Turkic States) and Türk PA health diplomacy."
              - "Hook: non-communicable diseases (hypertension, diabetes, cardiovascular burden), maternal and child health, MHIF strengthening and SGBP entitlement design, primary care and family-medicine reform (Kyrgyzstan was an early Central Asian adopter of family medicine), TB and TB/HIV coinfection (Kyrgyzstan has a sustained TB burden including MDR-TB), HIV, mental health, migration health (large Kyrgyz labour migration to Russia and Kazakhstan generates remittance-and-return dynamics), and OTS-Turkic cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, MCH, MHIF-SGBP, family-medicine PHC reform, TB-MDR/HIV, mental health and OTS-Turkic cooperation — these are durable MoH lines."
              - "Do not conflate Kyrgyzstan with Kazakhstan (sovereign states with distinct SGBP design, financing maturity and policy orientation despite shared Soviet inheritance) or import Russian framings (Kyrgyzstan is a multi-vector state in EAEU/SCO/CSTO with its own policy autonomy and increasing Turkic-OTS engagement)."
