Sistema Único de Saúde brasileiro — partes interessadas:
  - Ministério da Saúde:
      - Alexandre Padilha (PT):
          - Title: Ministro da Saúde (Minister of Health) (no governo Lula III)
          - Stakeholder engagement notes:
              - "Ministro da Saúde no governo Lula III (PT, coalizão); substituiu Nísia Trindade durante o mandato no segundo semestre de 2024 (assumiu efetivamente em 2024); PT; já havia sido Ministro da Saúde no governo Dilma Rousseff de 2011 a 2014 — único brasileiro contemporâneo a ocupar a pasta em dois mandatos não consecutivos."
              - "Médico sanitarista; PT; trajetória parlamentar como Ministro de Relações Institucionais e Ministro da Saúde; perfil PT-sanitarista alinhado ao consenso técnico-político do SUS."
              - "Owns o orçamento federal do SUS, a Política Nacional de Atenção Básica (PNAB), os programas Mais Médicos e Mais Especialistas, Farmácia Popular, vigilância em saúde via Fiocruz e ANVISA, ANS para saúde suplementar, e a articulação tripartite com CONASS (estados) e CONASEMS (municípios)."
              - "Posicionado publicamente em maio 2026: na 79ª Assembleia Mundial da Saúde defendeu resposta global à crise climática e redução das desigualdades em saúde; em audiência da Comissão da Câmara dos Deputados será ouvido sobre prioridades do Ministério para 2026; também criticou a gestão da pandemia no governo Bolsonaro."
              - "Elogiou publicamente a postura do senador Veneziano na condução do Orçamento da Saúde para 2026 — sinal de articulação ativa com a base aliada no Congresso."
              - "Hook: PNAB e Mais Médicos, Farmácia Popular, Fiocruz como ciência-e-tecnologia em saúde, ANVISA reform, mudanças climáticas e saúde, saúde indígena aterrissem; pitches que ignoram a estrutura tripartite SUS não aterrissem."
          - Tone advice:
              - "Abrir com PNAB, Mais Médicos, Farmácia Popular, Fiocruz, ANVISA reform e saúde climática — são suas linhas autorais e o frame PT-sanitarista do SUS."
              - "Não pitchear como se o Ministério decidisse a operação local — municípios são gestores plenos via Pactos Tripartite; centralização federal será recusada institucionalmente."
