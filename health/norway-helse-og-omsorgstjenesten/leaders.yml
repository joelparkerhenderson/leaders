Norske helse- og omsorgstjeneste interessenter:
  - Helse- og omsorgsdepartementet (HOD):
      - Jan Christian Vestre (Ap):
          - Title: Helse- og omsorgsminister (Minister of Health and Care Services) (fra 19. april 2024)
          - Stakeholder engagement notes:
              - "Helse- og omsorgsminister fra 19. april 2024 etter Ingvild Kjerkols avgang (forskningsetisk sak); beholdt portføljen i den mindre regjeringsomrokeringen 16. september 2025 etter den rødgrønne blokkens valgseier 8. september 2025."
              - "Født 1986 i Stavanger; tidligere næringsminister i Støre-regjeringen fra 2021 til april 2024; gründerprofil og stifter av møbelvirksomheten Vestre AS — uvanlig entreprenørbakgrunn for en Ap-helseminister."
              - "Arvet en helsesektor i langvarig fastlegekrise, vedvarende sykehusøkonomisk press og en uavklart digital infrastruktur (Helseplattformen-utfordringer i Midt-Norge); Nasjonal helse- og samhandlingsplan er rammen for hans periode."
              - "Holdt Helsetalen 2026 med signalfrasen 'Norge skal ha helse- og omsorgstjenester i verdensklasse' — politisk hovedlinje er kvalitetsambisjon kombinert med stram økonomisk ramme."
              - "Hook: fastlegeordningen, sykehusøkonomi, Helsefellesskap, samhandling kommune-HF, og hans industri-vekslende perspektiv på helsetjenestens innkjøpsmakt og verdiskaping lander; pitches som ignorerer fastlegekrisen lander ikke."
          - Tone advice:
              - "Åpn med fastlegeordningen, sykehusøkonomi, Helsefellesskap og industriell verdiskaping — disse er hans politiske kjernelinjer og hans gründerblikk på sektoren."
              - "Pitch ikke som om helsesystemet er en sentralt styrt enhet — Vestre vil henvise til RHF-styrene og kommunene; sentralistiske framings avvises."
  - Helsedirektoratet (Norwegian Directorate of Health):
      - Bjørn Guldvog:
          - Title: Helsedirektør (Director of Health), Helsedirektoratet (siden 2012; åremål fornyet)
          - LinkedIn: https://www.linkedin.com/in/bjørn-guldvog-31a0292/
          - Stakeholder engagement notes:
              - "Helsedirektør og øverste leder av Helsedirektoratet siden 2012 — den lengstsittende helsedirektøren i nyere norsk historie; åremål forlenget av regjeringen med seks år; lege utdannet fra Universitetet i Oslo i 1985."
              - "Forskningsbakgrunn fokusert på kvalitet, pasienterfaringer og effektivitet i helsetjenestene — institusjonell signatur er evidensorientert kvalitetsstyring snarere enn politisk profilering."
              - "Owns nasjonale faglige retningslinjer, pakkeforløp (kreft, psykisk helse, rus, hjerneslag), nasjonale handlingsprogrammer (kreft, demens, eldre), helseberedskap i sivil sektor, vaksinasjonsprogram i samarbeid med FHI, og kvalitetsindikatorer for helsetjenestene."
              - "Var en sentral aktør under Covid-19-responsen sammen med daværende FHI-direktør Camilla Stoltenberg — to-instans-modellen Helsedirektoratet/FHI definerte den norske faglige beredskapen."
              - "Hook: nasjonale faglige retningslinjer, pakkeforløp, kvalitetsindikatorer, beredskap, og samhandlingen mellom Helsedirektoratet og FHI lander; pitches som ignorerer det faglige fundamentet lander ikke."
          - Tone advice:
              - "Åpn med nasjonale retningslinjer, pakkeforløp, kvalitetsindikatorer og beredskap — disse er Helsedirektoratets kjernemandat og Guldvogs faglige stemme."
              - "Pitch ikke politisk-aktivistisk — Guldvog definerer rollen som faglig-uavhengig, og rene politiske framings vil bli reformulert til faglige spørsmål."
  - Folkehelseinstituttet (FHI; Norwegian Institute of Public Health):
      - Guri Rørtveit:
          - Title: Direktør, Folkehelseinstituttet (fra 2024)
          - Stakeholder engagement notes:
              - "Direktør for Folkehelseinstituttet fra 2024 etter at Gun Peggy Knudsen var konstituert direktør fra Camilla Stoltenbergs avgang 30. juni 2023; Stoltenberg gikk videre som konserndirektør i forskningskonsernet NORCE fra 1. oktober 2023."
              - "Akademisk-klinisk profil med bakgrunn i allmennmedisin og forskning — har vært professor i allmennmedisin ved Universitetet i Bergen og leder av Forskningsenheten for allmennpraksis i Bergen; allmennmedisinsk bakgrunn er uvanlig for en FHI-direktør og gir en samhandlings-ut-mot-kommunene tilt."
              - "Tiltrer etter en spenningsfylt FHI-periode etter Covid-19, hvor instituttets selvstendige faglige autoritet ble diskutert (overordnet diskusjon om FHI–Helsedirektoratet–HOD-treklangen) — Rørtveits oppgave er å gjenoppbygge institusjonell rolle og forskningsmessig profil."
              - "Owns smittevern og infeksjonsovervåking, vaksinasjonsprogram, ikke-smittsomme sykdommer, miljømedisin, helse- og levekårsundersøkelser, og helseregister-infrastruktur (Reseptregisteret, MFR, NPR i samarbeid med Direktoratet for e-helse)."
              - "Hook: smittevern, vaksiner, allmennmedisin og primærhelsetjenesteforskning, helseregister-bruk og folkehelse landingen er naturlig; politiske framings som drar FHI mot beslutningsutøvelse lander ikke."
          - Tone advice:
              - "Åpn med smittevern, vaksinasjonsprogram, allmennmedisinsk forskning og helseregistre — disse er FHIs kjerneoppdrag og Rørtveits faglige base."
              - "Pitch ikke FHI som politisk aktør — Rørtveit vil understreke instituttets vitenskapelige uavhengighet og avvise politisk-instrumentelle framings."
