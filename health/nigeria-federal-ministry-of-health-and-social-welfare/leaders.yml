Nigerian health stakeholders:
  - Federal Ministry of Health and Social Welfare (MoHSW):
      - Prof. Muhammad Ali Pate (APC-affiliated technocrat):
          - Title: Coordinating Minister of Health and Social Welfare (since August 2023, in the Tinubu administration)
          - Stakeholder engagement notes:
              - "Coordinating Minister of Health and Social Welfare since August 2023, appointed by President Bola Ahmed Tinubu in his initial Cabinet; the 'Coordinating Minister' title elevates the brief to a senior cross-government position bridging health and social welfare; previously served as Minister of State for Health under President Goodluck Jonathan 2011-2013."
              - "International background: CEO of Gavi the Vaccine Alliance 2019-2021; Director, Global Health at the World Bank Group; Julio Frenk Professor of Practice at the Harvard T.H. Chan School of Public Health — uniquely distinctive international-health background among Nigerian Ministers, comparable in profile to senior multilateral-agency veterans."
              - "Administrative team configuration: Iziaq Adekunle Salako serves as Minister of State for Health; Daju Kachollom is Permanent Secretary — providing political-administrative continuity to drive the Compact agenda."
              - "January 2026: addressed the National Traditional and Religious Leaders Summit on Health 'Crowning the Compact' at the Banquet Hall, Aso Rock Villa; March 2026: federal government to inject additional $346 million into HIV, TB and malaria programmes as part of broader co-financing strategy aligned with President Tinubu's directive to strengthen Nigeria's health system through increased local investment and reduced reliance on foreign aid; introduced new long-acting HIV-prevention injection (WHO Africa coverage)."
              - "Owns the Nigeria Health Sector Renewal Investment Initiative (the 'Compact' — a multi-year reform package), NHIA implementation under the 2022 NHI Act, PHC strengthening via NPHCDA, immunisation programmes, the local pharmaceutical manufacturing roadmap (Presidential Initiative for Unlocking the Healthcare Value Chain — PVAC), and Nigeria's WHO Africa, AU and BRICS+ health diplomacy."
              - "Hook: NHIA implementation, PHC strengthening, local pharmaceutical manufacturing, HIV/TB/malaria co-financing, mpox and outbreak preparedness, vaccine self-reliance, climate-and-health, primary-health-care workforce, and reduced reliance on foreign aid land."
          - Tone advice:
              - "Open with the Compact, local pharma manufacturing (PVAC), NHIA implementation, PHC strengthening, and Tinubu-era self-reliance framing — these are Pate's sustained, internationally-credible public lines, and his Gavi / World Bank / Harvard background makes him a natural counterpart for international health investors."
              - "Do not pitch as if the federal level were the operational buyer — Nigeria's 36 states own state hospitals and have autonomous State Commissioners for Health (Lagos and Kano in particular have independent reform agendas); framings that bypass States will be redirected through the National Council on Health."
