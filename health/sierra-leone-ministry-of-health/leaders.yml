Sierra Leonean health stakeholders:
  - Ministry of Health (MoH):
      - Dr. Austin Demby (SLPP-aligned, technocrat):
          - Title: Minister of Health (since 2022, continued through President Bio's second term)
          - Stakeholder engagement notes:
              - "Minister of Health since 2022, continued through President Julius Maada Bio's second term following the 2023 election; PhD, MPH; previously Sierra Leone field-station Director for the US Centers for Disease Control and Prevention and Acting Director of the Office of Global Health at the US Health Resources and Services Administration (HRSA); widely cited as a technocratic appointment with strong US public-health institutional ties; the Ministry was renamed from Ministry of Health and Sanitation (MoHS) to Ministry of Health (MoH) in 2024 as sanitation functions were re-allocated."
              - "Owns MoH policy and budget, Connaught Hospital (the apex tertiary facility in Freetown) and the regional referral hospital network (Bo Government Hospital, Kenema Government Hospital, Makeni Regional Hospital), the district hospitals and primary-care unit (PHU) network across the sixteen districts, the politically protected Free Healthcare Initiative (FHCI) for pregnant women, lactating mothers and children under five, the Community Health Worker (CHW) programme (a flagship since the post-Ebola reconstruction), PBSL oversight, NMSA supply-chain coordination, and donor engagement (World Bank, Global Fund, Gavi, WHO, USAID/PEPFAR, FCDO, GIZ)."
              - "Hook: FHCI sustainability and gradual expansion, primary health care strengthening, mpox and outbreak preparedness (Sierra Leone has invested heavily in surveillance, IPC and EOC capacity since the 2014–2016 Ebola outbreak), CHW programme (including supervision and digitisation), maternal-and-child mortality reduction (a sustained Bio-government priority), health-financing reform (Sierra Leone is working towards a more sustainable mix of revenue streams), NCDs, and donor-coordination architecture — these all land."
          - Tone advice:
              - "Open with FHCI, PHC, CHW programme, outbreak preparedness, maternal-and-child health, health-financing reform and donor coordination — these are Demby's signature lines and the Bio government's health priorities."
              - "Do not anchor exclusively to the 2014–2016 Ebola outbreak — it is part of institutional memory but the Ministry's current agenda is FHCI sustainability, PHC and NCDs; framings that reduce Sierra Leonean health to Ebola will be politely redirected to current priorities."
  - Notes on Deputy Minister, Chief Medical Officer, Permanent Secretary, Registrar PBSL, Director NMSA, and Parliamentary Committee on Health Chair:
      - Status: Substantive identities to be verified against the Office of the President, MoH press releases, and Parliament of Sierra Leone committee allocations.
