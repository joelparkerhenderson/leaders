i-Kiribati health stakeholders:
  - Notes on Minister of Health and Medical Services of the Republic of Kiribati:
      - Status: Identity of the current Minister of Health and Medical Services under the cabinet of President Taneti Maamau (TKP — Tobwaan Kiribati Party, re-elected for his third term in October 2024) to be verified against president.gov.ki and Kiribati Updates.
      - Implication: Engagement on i-Kiribati health requires (i) identification of the current titleholder via official channels in South Tarawa, (ii) recognition of Kiribati's distinctive geography — 33 atolls and one raised limestone island (Banaba), spread across more than 3.5 million square kilometres of ocean, the only state straddling all four hemispheres and crossing the International Date Line — which creates extreme logistical challenges for inter-island health service delivery, (iii) the 2019 diplomatic switch from Taiwan to the People's Republic of China and the resulting reorientation of bilateral cooperation including Chinese medical missions, (iv) climate-existential framing (Kiribati is one of the world's most climate-exposed states with President Tong's earlier 'migration with dignity' framework a historical reference), and (v) donor architecture (Australia DFAT, New Zealand MFAT, World Bank, ADB, WHO WPRO, UNICEF, Japan JICA, Chinese bilateral, EU).
      - Hook: NCDs (very high obesity, diabetes, hypertension), TB (sustained burden), MCH, climate-and-health (centrally — sea-level rise, ocean acidification, water security), water and sanitation (limited freshwater resources on atolls), mental health and suicide prevention, immunisation, dengue, leptospirosis, Tungaru Central Hospital reconstruction and capacity, and PIF-PSIDS-MSG cooperation.
      - Tone: Open with NCDs, TB, MCH, climate-and-health (centrally), water security, mental health and PIF-PSIDS cooperation — durable lines. Recognise the Taiwan-China switch and Chinese bilateral engagement, the extreme atoll geography, and Kiribati's leading role in Pacific climate diplomacy.
