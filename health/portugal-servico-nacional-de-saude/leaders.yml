SNS Portugal stakeholders:
  - Ministério da Saúde:
      - Ana Paula Martins (PSD / AD):
          - Title: Ministra da Saúde (Minister of Health) (desde 2 de abril de 2024; reconduzida no XXV Governo Constitucional empossado em 5 de junho de 2025)
          - Stakeholder engagement notes:
              - "Ministra da Saúde no XXIV Governo Constitucional desde a posse de 2 de abril de 2024 (governo Montenegro I, AD); reconduzida no XXV Governo Constitucional empossado em 5 de junho de 2025 após a eleição antecipada de 18 de maio de 2025; uma das poucas continuidades pessoais entre os dois governos AD."
              - "Farmacêutica de formação; antiga Bastonária da Ordem dos Farmacêuticos; perfil técnico-profissional num pasta tradicionalmente médica — a assinatura institucional é regulação profissional, política do medicamento e gestão hospitalar."
              - "Herda a reforma das Unidades Locais de Saúde (ULS) iniciada em 2024 e o Estatuto do SNS de 2022 que criou a Direção Executiva do SNS; articula com o Diretor Executivo Álvaro Almeida o equilíbrio política–operação, sob escrutínio constante da Assembleia da República onde o governo é minoritário."
              - "Desafios mandatários públicos: falta de médicos de família, listas de espera cirúrgicas, urgências e maternidades sob pressão recorrente, execução do PRR Saúde, e tensões trabalhistas com Fnam, SIM e SEP — o orçamento da Saúde é politicamente exposto à fronteira esquerda (PS, BE, PCP, Livre)."
              - "Hook: ULS-isação, médico de família para todos, urgências, PRR Saúde, política do medicamento, e profissões da saúde aterrissam; pitches centrados em hospitais privados sem integração no SNS não aterrissam."
          - Tone advice:
              - "Liderar com ULS-isação, médico de família para todos, PRR Saúde e profissões da saúde — são as linhas mandatárias do governo Montenegro II e o seu background farmacêutico."
              - "Não enquadrar como ministra clínica — Martins é farmacêutica de formação e antiga Bastonária; framings clínico-hospitalares puros serão reformulados em chave reguladora e profissional."
  - Direção Executiva do Serviço Nacional de Saúde (DE-SNS):
      - Álvaro Almeida:
          - Title: Diretor Executivo do Serviço Nacional de Saúde
          - Stakeholder engagement notes:
              - "Diretor Executivo do SNS sucedendo a António Gandra d'Almeida (primeiro Diretor Executivo, nomeado pelo XXIII Governo Constitucional em 2022); a Direção Executiva foi criada pelo Estatuto do SNS de 2022 (Decreto-Lei n.º 52/2022) como função quasi-CEO da operação SNS."
              - "Conselho de Gestão inclui Ana Margarida de Oliveira, Ana Rangel, Carla Catarino, Hélder Teixeira de Sousa e Maria Helena Martins — equipa que partilha a operação executiva do sistema com a Ministra da Saúde."
              - "Owns a nomeação dos órgãos de gestão dos hospitais e centros de saúde (ULS), a contratação com as Unidades Locais de Saúde, o cumprimento dos objetivos de acesso e produção, e a coordenação operacional entre os hospitais públicos."
              - "Sede da Direção Executiva foi inaugurada no Porto — escolha geográfica deliberada para descentralizar a gestão SNS de Lisboa e sinalizar mudança institucional face ao histórico modelo das ARS."
              - "Hook: contratos-programa com as ULS, gestão da produção e do acesso, listas de espera cirúrgicas, urgências, e definição de prioridades operacionais aterrissam; pitches que ignoram a camada operacional DE-SNS e tentam ir diretamente ao Ministério não aterrissam."
          - Tone advice:
              - "Liderar com contratos-programa ULS, gestão da produção, acesso e listas de espera — são as alavancas operacionais que a Direção Executiva efetivamente aciona."
              - "Não enquadrar a DE-SNS como subunidade do Ministério — é um órgão estatutário com autoridade operacional própria; framings que a tratam como secretaria-geral serão corrigidos institucionalmente."
  - INFARMED (Autoridade Nacional do Medicamento e Produtos de Saúde):
      - Rui Santos Ivo:
          - Title: Presidente do Conselho Diretivo, INFARMED (desde 2019; reconduzido para novo mandato de três anos com início em 1 de janeiro de 2026)
          - Stakeholder engagement notes:
              - "Presidente do Conselho Diretivo do INFARMED desde 2019; reconduzido para um novo mandato de três anos com início em 1 de janeiro de 2026; novo Conselho Diretivo inclui Raquel Ascenção (Vice-Presidente) e Eduardo Costa (Vogal)."
              - "Eleito Presidente do Conselho de Administração da European Medicines Agency (EMA) em março de 2025 — projeção europeia inusual para uma presidência da INFARMED e alavanca de influência na rede regulatória europeia; combina presidência nacional com presidência da EMA Management Board."
              - "Owns a autorização e a vigilância de medicamentos de uso humano e veterinário, dispositivos médicos (MDR/IVDR), cosméticos, e a coordenação portuguesa nas comissões científicas da EMA (CHMP, PRAC, PDCO)."
              - "Distinguido como 'Profissional do Ano - Rotary' pelo trabalho regulador — reconhecimento público raro para o cargo e sinal de capital reputacional para a posição internacional."
              - "Hook: regulação de medicamentos, MDR/IVDR, terapias avançadas (ATMP), reforma farmacêutica europeia, escassez de medicamentos, e governação europeia da EMA aterrissam; pitches que não considerem a perspetiva europeia não aterrissam."
          - Tone advice:
              - "Liderar com dimensão europeia (EMA Management Board), reforma farmacêutica europeia, MDR/IVDR e ATMP — são os eixos da agenda Santos Ivo e da sua plataforma EMA."
              - "Não enquadrar a INFARMED como autoridade puramente nacional — Santos Ivo opera na EMA como Presidente do Conselho de Administração e os framings puramente domésticos serão reformulados em chave europeia."
