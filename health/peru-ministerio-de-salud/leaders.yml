Sistema de salud peruano — partes interesadas:
  - Ministerio de Salud (MINSA):
      - Dr. Juan Carlos Velasco Guerrero:
          - Title: Ministro de Salud (Minister of Health) (desde marzo de 2026, gobierno de José María Balcázar)
          - Stakeholder engagement notes:
              - "Ministro de Salud desde marzo de 2026 en el gobierno del Presidente José María Balcázar, juramentado tras la renuncia del Ministro Luis Quiroz Avilés; cirujano, con doctorado en Salud Pública por la Universidad Nacional Federico Villarreal — perfil clínico-técnico en un Ministerio caracterizado por alta rotación."
              - "Trayectoria reciente: Presidente Ejecutivo del Instituto Nacional de Salud (INS) entre noviembre 2025 y marzo 2026; Superintendente Nacional de Salud (Susalud) entre noviembre 2021 y noviembre 2025 — cinco años en el regulador del sistema, lo que le da conocimiento institucional inusual al asumir el cargo."
              - "Asume en un contexto de extrema inestabilidad política: múltiples Presidentes en ocho años desde Castillo (2021-2022), Boluarte (2022-2024), Jerí (2025) y ahora Balcázar (2026); rotación ministerial alta; desabasto de medicamentos en establecimientos públicos; listas de espera prolongadas; conflictividad social en regiones."
              - "Owns la rectoría del sistema de salud, la coordinación con EsSalud (sub-sistema de seguridad social), el Seguro Integral de Salud (SIS), DIGEMID, Susalud, INS, y la articulación con las Direcciones Regionales de Salud (DIRESAS) en un país con fuerte heterogeneidad geográfica."
              - "Hook: medicamentos y desabasto, EsSalud reform, expansión SIS, fortalecimiento del primer nivel, atención materno-infantil en Sierra y Selva, sustancias controladas y enfermedades emergentes (Bordetella, hantavirus regional) aterrizan; pitches estratégicos de largo plazo son difíciles dado el ciclo corto."
          - Tone advice:
              - "Abrir con desabasto de medicamentos, EsSalud, SIS, fortalecimiento del primer nivel y atención regional — son los problemas operativos prioritarios en un ciclo ministerial corto y altamente politizado."
              - "No proponer reformas estructurales — el ciclo político hace inviables los compromisos de largo plazo; framings de continuidad institucional fallarán y serán postergados al próximo ministro o gobierno."
