Egyptian health stakeholders / أصحاب المصلحة في النظام الصحي المصري:
  - Ministry of Health and Population (وزارة الصحة والسكان):
      - Dr. Khaled Abdel Ghaffar:
          - Title: Minister of Health and Population and Deputy Prime Minister of Egypt (continuing after 4 February 2026 cabinet reshuffle)
          - Stakeholder engagement notes:
              - "Minister of Health and Population and Deputy Prime Minister of Egypt; continued in role after the 4 February 2026 cabinet reshuffle (Egypt Today coverage); previously served as Minister of Higher Education and Scientific Research before being transferred to the Health portfolio; oral-and-dental-medicine academic; widely regarded as one of Egypt's leading academic figures in his field (Egypt Today, MoHP biography)."
              - "Public lines 2026: state targets raising healthy life expectancy to 75 years by 2030; called publicly for stronger local drug manufacturing (Daily News Egypt, 20 May 2026); reported on Egypt's 'red zones' shrinking and birth-rate decline as a public-health-success indicator (Egypt Today); attended the IARC 2026 conference."
              - "Owns MoHP policy and the Universal Health Insurance (UHI) Law implementation since 2018 — a phased rollout starting with Port Said, Luxor, Ismailia, South Sinai, Aswan, etc., transitioning the country from segmented public delivery toward a single-payer-public-provider model with UHIA as payer and GAHC as public provider; EDA medicines regulation; UPA unified-procurement reforms; the Cancer-Free Egypt initiative; presidential Decent Life initiative health components; and Egypt's WHO EMRO, African Union and BRICS+ health diplomacy."
              - "Dual mandate as Deputy Prime Minister gives him unusually senior cross-government weight on health-related fiscal and infrastructure decisions; the academic-medicine background distinguishes him from political appointees."
              - "Hook: UHI rollout governorate-by-governorate, local pharmaceutical manufacturing and EDA fast-track approvals, oncology and chronic-disease national programmes, maternal-and-child mortality reduction, Cancer-Free Egypt, Decent Life rural-health investment, digital-health (My Health), and BRICS+ / AU / WHO EMRO multilateral cooperation land."
          - Tone advice:
              - "Open with UHI rollout, local pharmaceutical manufacturing, Cancer-Free Egypt, Decent Life and the 2030 healthy-life-expectancy target — these are the strategic priorities and his sustained public lines as Deputy PM and Health Minister."
              - "Do not assume that the entire country has migrated to UHI — the rollout is governorate-phased and most of Egypt still operates under the pre-UHI segmented arrangement; pitches must align with the specific phase of the targeted geography, and engagement on procurement may require UPA in parallel to UHIA."
