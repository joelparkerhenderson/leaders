Maltese health system stakeholders:
  - Ministry for Health and Active Ageing:
      - Jo Etienne Abela (PL):
          - Title: Minister for Health and Active Ageing (from January 2024)
          - Stakeholder engagement notes:
              - "Minister for Health and Active Ageing in the second Robert Abela Labour government since January 2024; PL (Partit Laburista); born 29 November 1975 in Gozo; surgeon by background with consultancy training in Glasgow, specialising in oesophageal and pancreatic surgery — the youngest consultant surgeon in Scotland during his Glasgow appointment."
              - "Studied medicine and surgery at the University of Malta (1993-1999) and worked at St Luke's Hospital and later at Mater Dei Hospital before entering politics; brings clinical-surgical credibility into a portfolio that has historically been led by non-clinicians and was previously held by Chris Fearne until early 2024."
              - "Announced strengthened cross-border healthcare and rare-disease commitments February 2026; made PEP and PrEP free of charge January 2026 — a clearly public-health-progressive line on HIV prevention and infectious disease."
              - "Active international profile: addressed the MedTech World Dubai 2026 Conference; met UAE Minister for Health and Prevention Ahmed bin Ali Al Sayegh — positioning Malta as a Mediterranean medical-innovation hub and rare-disease referral centre."
              - "Hook: rare diseases, cross-border healthcare, medical innovation hub, active ageing, PEP/PrEP and infectious disease prevention, Mater Dei modernisation, Gozo service planning, and surgical innovation land; vendor-only pitches without clinical content do not."
          - Tone advice:
              - "Lead with rare diseases, cross-border healthcare, active ageing, surgical innovation and Mediterranean med-tech hub framing — these are his clinical-surgical and strategic priorities and his international speaking topics."
              - "Do not pitch as if the portfolio were 'Health' only — 'and Active Ageing' is a co-headline; framings that ignore the ageing-population services miss the explicit ministerial brief."
