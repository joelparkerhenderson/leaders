Các bên liên quan đến hệ thống y tế Việt Nam / Vietnamese health system stakeholders:
  - Bộ Y tế (Ministry of Health):
      - Đào Hồng Lan:
          - Title: Bộ trưởng Bộ Y tế (Minister of Health) (nhiệm kỳ 2026-2031, được Quốc hội phê chuẩn ngày 8 tháng 4 năm 2026; tiếp tục từ nhiệm kỳ 2021-2026)
          - Stakeholder engagement notes:
              - "Bộ trưởng Bộ Y tế từ năm 2022 (Quyền Bộ trưởng từ tháng 7/2022, được Quốc hội phê chuẩn cho nhiệm kỳ 2021-2026 vào tháng 10/2022); tái bổ nhiệm cho nhiệm kỳ 2026-2031 vào ngày 8 tháng 4 năm 2026 tại kỳ họp đầu Quốc hội khóa XVI — tiếp tục lãnh đạo Bộ Y tế qua hai nhiệm kỳ."
              - "55 tuổi tính đến năm 2026; quê Hải Phòng; Thạc sĩ Kinh tế và Cử nhân Quản lý Sản xuất Công nghiệp Kinh doanh — là Bộ trưởng Y tế thứ ba là nữ trong lịch sử Việt Nam sau Trần Thị Trung Chiến và Nguyễn Thị Kim Tiến, và là Bộ trưởng Y tế đầu tiên không có nền tảng đào tạo chuyên môn y khoa."
              - "Ủy viên Ban Chấp hành Trung ương Đảng khóa XIV, Ủy viên Ban Cán sự Đảng Chính phủ, Bí thư Đảng ủy Bộ Y tế, và đại biểu Quốc hội khóa XVI nhiệm kỳ 2026-2031 — vị trí Đảng và Quốc hội củng cố thẩm quyền chính trị của bà."
              - "Owns chính sách Bộ Y tế và Kế hoạch trung hạn 2026-2030; phối hợp với BHXH Việt Nam về thực hiện BHYT (~92% dân số được bao phủ); giám sát DAV về quản lý thuốc và NIHE về dịch tễ; chương trình truyền thông 'Vì một Việt Nam khỏe mạnh hơn 2026' (khám bệnh miễn phí cộng đồng tại Hải Phòng tháng 5/2026); cải cách hệ thống bệnh viện công lập; vai trò của Việt Nam trong WHO Tây Thái Bình Dương và ASEAN."
              - "Hành động biểu tượng: thắp hương tri ân các lãnh đạo Bộ Y tế tiền nhiệm — biểu thị sự tôn trọng truyền thống Bộ trong văn hóa chính trị Việt Nam."
              - "Hook: BHYT mở rộng, cải cách bệnh viện công lập, y tế cơ sở (commune health stations), dược phẩm, kiểm soát thuốc lá và rượu, chuyển đổi số y tế, hợp tác ASEAN và BRICS+ landings."
          - Tone advice:
              - "Mở đầu với BHYT, y tế cơ sở, cải cách bệnh viện, chuyển đổi số và hợp tác khu vực — đây là khung diễn ngôn nhất quán của Bộ Y tế dưới sự lãnh đạo của Bộ trưởng Lan và là các trục chính sách bà giữ vững qua hai nhiệm kỳ."
              - "Đừng pitch như thể Bộ Y tế là người mua duy nhất — BHXH Việt Nam thực hiện BHYT một cách độc lập về mặt thể chế; mọi đàm phán về thanh toán và hợp đồng nhà cung cấp phải bao gồm BHXH như đối tác trực tiếp."
