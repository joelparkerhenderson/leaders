Nederlands zorgstelsel stakeholders:
  - Ministerie van Volksgezondheid, Welzijn en Sport (VWS):
      - Sophie Hermans (VVD):
          - Title: Minister van Volksgezondheid, Welzijn en Sport (Minister of Health, Welfare and Sport) (per 23 februari 2026)
          - Stakeholder engagement notes:
              - "Minister van VWS in het kabinet-Jetten, beëdigd 23 februari 2026; VVD; eerder in het demissionaire kabinet-Schoof Minister van Klimaat en Groene Groei en viceminister-president; meer dan zeven jaar Tweede Kamerlid voor de VVD met portefeuille langdurige zorg en preventie."
              - "Treedt aan in een crisismandaat: na de val van het kabinet-Schoof in juni 2025 (vertrek PVV-bewindspersonen) en de korte opeenvolging van VWS-ministers (Agema PVV, Van Hijum NSC, Jansen NSC, Tieman BBB) was VWS feitelijk een jaar lang niet beleidsmatig gestuurd; Hermans' eerste opdracht is herstel van uitvoeringsregie."
              - "Mirjam Sterk (CDA) levert het tweede VWS-bewindspersoon van het kabinet-Jetten (actualiteit verifiëren); de VVD-CDA-combinatie op VWS spiegelt de bredere coalitie Jetten (D66-VVD-CDA-GL-PvdA) op het terrein zorg."
              - "Aanpalend dossier: uitvoering van het Integraal Zorgakkoord (IZA), de afronding van de IZA-cyclus 2022-2026 en de overgang naar de opvolgende sectorafspraak — een politiek bepalend moment in haar eerste maanden."
              - "Hook: IZA-uitvoering, GGZ-wachtlijsten, personeel V&V, passende zorg en preventie landen; vendor pitches die de zorgverzekeraars, NZa en Zorginstituut als routering negeren landen niet."
          - Tone advice:
              - "Open met IZA-uitvoering, passende zorg en arbeidsmarktproblematiek — dit zijn de centrale frames van het kabinet-Jetten op VWS en sluiten aan op Hermans' Kamerverleden over langdurige zorg en preventie."
              - "Niet pitchen alsof VWS direct kan inkopen of besluiten over individuele zorgcontracten — Hermans zal doorverwijzen naar ZN, NZa en Zorginstituut; centralistische framings worden expliciet teruggewezen."
  - Nederlandse Zorgautoriteit (NZa):
      - Geranne Engwirda:
          - Title: Voorzitter Raad van Bestuur, Nederlandse Zorgautoriteit (per 1 januari 2024)
          - Stakeholder engagement notes:
              - "Voorzitter Raad van Bestuur van de NZa per 1 januari 2024; opvolger van Marian Kaljouw (voorzitter 2015-2023, daarna VVD-Eerste Kamerlid) na een interim-periode onder Karina Raaijmakers."
              - "Owns het tariefkader voor de gehele Zvw-zorg, de markttoezichtsrol (zorgplicht zorgverzekeraars, toegankelijkheid), de monitoring van het IZA, en de NZa-rol in vroegtijdige signalering van financiële risico's bij zorgaanbieders en zorgverzekeraars."
              - "Pakt het NZa-mandaat op in een fase waarin de zorgplicht van zorgverzekeraars onder druk staat (GGZ-wachttijden, SEH-beschikbaarheid, huisartsenzorg) en waarin het Integraal Zorgakkoord een centrale rol gaf aan de NZa als 'scheidsrechter' over realisatie."
              - "Publieke positie 2025-2026 (via NVZ-felicitatie en de Tweede Kamer-toelichtingen): voorstander van een ander stelsel van beschikbaarheidsbijdragen voor SEH en acute zorg, in lijn met de Kaljouw-erfenis — institutionele continuïteit op acute-zorg-bekostiging."
              - "Hook: tariefbeschikkingen, zorgplicht zorgverzekeraars, SEH/acute zorg, IZA-monitoring, en signalering van financieel-instabiele aanbieders landen; pitches voor 'meer markt' of 'minder regulering' worden via de wettelijke NZa-rol gefilterd."
          - Tone advice:
              - "Open met tariefkader, zorgplicht, acute zorg en IZA-monitoring — dit zijn de kernhandvatten van de NZa en de plekken waar Engwirda publiek positie kiest."
              - "Niet de NZa als deregulerende bondgenoot voorstellen — de NZa is een wettelijke toezichthouder met een uitvoeringstaak, en framings die regulering zien als probleem worden afgewezen."
  - Zorginstituut Nederland (ZIN):
      - Mark Janssen:
          - Title: Bestuursvoorzitter (Voorzitter Raad van Bestuur), Zorginstituut Nederland (per 1 oktober 2024)
          - Stakeholder engagement notes:
              - "Bestuursvoorzitter van Zorginstituut Nederland per 1 oktober 2024; opvolger van Sjaak Wijma, die het Zorginstituut verliet na een overgangsperiode; bestuurlijke carrière in medisch-specialistische zorg en langdurige zorg vóór de benoeming."
              - "Owns het basispakket van de zorgverzekering (de wettelijke 'pakketbeoordeling'), de pakketadviezen aan de Minister van VWS, de HTA-functie voor geneesmiddelen en hulpmiddelen, de kwaliteitsregistraties via het Register, en de coördinatie van het programma Passende Zorg."
              - "Passende Zorg is het centrale programma van het Zorginstituut sinds 2022 — gedragen door het Kader Passende Zorg en uitgewerkt via de zorgvraag-domein-aanpak; Janssen zet het programma voort als de inhoudelijke ruggegraat van het IZA."
              - "Profiel: bestuurder met praktijkverleden in de zorg, niet primair klinisch onderzoeker — leunt op de Kwaliteitsraad en het ZIN-apparaat voor inhoudelijke evidence."
              - "Hook: pakketbeoordeling, HTA, passende zorg, kwaliteitsregistraties en de overgang van IZA-afspraken naar pakketbesluiten landen; pitches die het basispakket als ondergeschikte besluitvormingslaag presenteren landen niet."
          - Tone advice:
              - "Open met passende zorg, pakketbeoordeling en HTA — dit is de Zorginstituut-taal en sluit aan op Janssens institutionele rol als hoeder van het basispakket."
              - "Niet pitchen zonder evidence-base — Zorginstituut beoordeelt structureel op effectiviteit, kosteneffectiviteit en stand van wetenschap en praktijk, en marketing-driven proposities worden inhoudelijk gefileerd."
  - Inspectie Gezondheidszorg en Jeugd (IGJ):
      - Monique Vogelzang:
          - Title: Inspecteur-Generaal Gezondheidszorg en Jeugd (Inspector-General for Healthcare and Youth) (per 19 januari 2026)
          - Stakeholder engagement notes:
              - "Inspecteur-Generaal van de IGJ per 19 januari 2026; opvolger van Marina Eckenhausen die de IGJ in 2025 verliet; eerder directeur-generaal Politie en Veiligheidsregio's bij het ministerie van Justitie en Veiligheid (sinds april 2020) en inspecteur-generaal van het Onderwijs."
              - "Bestuurlijk profiel zonder klinische of zorginhoudelijke achtergrond — opleiding Kunst- en Cultuurwetenschappen Erasmus Universiteit Rotterdam; benoeming via de Algemene Bestuursdienst (ABD)-route, niet via de medische professie."
              - "Owns het toezicht op de kwaliteit, veiligheid en toegankelijkheid van zorg en jeugdhulp; de IGJ-onderzoeken bij calamiteiten en de IGJ-rol in de uitvoering van het IZA op kwaliteit en toezicht."
              - "Treedt aan in een fase met sterke politieke aandacht voor toezicht op jeugdzorg (Wet verbetering beschikbaarheid jeugdzorg), op GGZ-instellingen en op medisch-specialistische zorg na verschillende publieke calamiteiten."
              - "Hook: toezichtkader, jeugdzorg, GGZ-toezicht, IGJ-rol in IZA-uitvoering en transparantie van kwaliteitsinformatie landen; pitches die toezicht als hindernis framen landen niet."
          - Tone advice:
              - "Open met toezichtkader, jeugdzorg, GGZ-toezicht en transparantie — dit zijn de gebieden waarop Vogelzang publiek positie zal kiezen en waar haar bestuurlijke-toezichthouder-profiel werkt."
              - "Niet veronderstellen dat IGJ een sectorpartner is — IGJ is een onafhankelijke rijksinspectie met een toezichthoudende rol; framings die IGJ als adviseur of bondgenoot positioneren worden gecorrigeerd."
  - Rijksinstituut voor Volksgezondheid en Milieu (RIVM):
      - Isabel Arends:
          - Title: Directeur-Generaal, Rijksinstituut voor Volksgezondheid en Milieu (per 1 april 2026)
          - Stakeholder engagement notes:
              - "Directeur-Generaal van het RIVM per 1 april 2026; opvolger van Hans Brug; benoemd door VWS in december 2025 — een bestuurlijke wisseling parallel aan de aantreding van het kabinet-Jetten in februari 2026."
              - "Inhoudelijke leiding van het RIVM in de fase na Jaap van Dissel — Van Dissel verliet als directeur van het Centrum Infectieziektebestrijding (CIb) in april 2024 en werd opgevolgd door Menno de Jong per 1 mei 2024; Arends bouwt op die operationele opvolging voort."
              - "Owns de RIVM-portefeuille van infectieziektebestrijding, het Rijksvaccinatieprogramma, milieu- en leefomgevingsmonitoring, gezondheidsmonitoring (Volksgezondheid Toekomst Verkenning), en de wetenschappelijke advisering aan VWS, RVS en Tweede Kamer."
              - "Treedt aan in een institutionele fase waarin RIVM en het beoogde Bundesinstitut-achtige BIPAM-debat in Duitsland resoneren — de Nederlandse discussie loopt over de afbakening tussen RIVM en de GGD'en en over de wetenschappelijke autonomie van het RIVM ten opzichte van VWS."
              - "Hook: infectieziektebestrijding, Rijksvaccinatieprogramma, milieu- en gezondheidsmonitoring, modellering, GGD-coördinatie en wetenschappelijke advisering aan VWS landen; politieke framings die RIVM richting beleidsuitvoering trekken landen niet."
          - Tone advice:
              - "Open met wetenschappelijke advisering, surveillance, vaccinatie en milieu-gezondheid — dit zijn de kerntaken van het RIVM en de gebieden waarop een nieuwe Directeur-Generaal haar profiel bouwt."
              - "Niet RIVM als beleidsmaker behandelen — RIVM is een kennisinstituut met onafhankelijke wetenschappelijke rol; framings die RIVM in een uitvoerende positie zetten worden afgehouden."
  - College ter Beoordeling van Geneesmiddelen (CBG):
      - Prof. dr. Ton de Boer:
          - Title: Voorzitter, College ter Beoordeling van Geneesmiddelen (Medicines Evaluation Board)
          - Stakeholder engagement notes:
              - "Voorzitter van het College ter Beoordeling van Geneesmiddelen; klinisch farmacoloog van professie; voorzittersfunctie sluit aan op een academisch-farmacologische lijn van CBG-voorzitterschap."
              - "Owns de Nederlandse zijde van de Europese geneesmiddelenbeoordeling: het CBG vertegenwoordigt Nederland in de wetenschappelijke comités van de European Medicines Agency (CHMP, PRAC, PDCO, CAT, COMP), en is nationale autoriteit voor zelfstandige Nederlandse handelsvergunningen."
              - "Het College telt sinds 5 februari 2026 Dr. Beitske Smink onder de nieuw beëdigde leden; de institutionele continuïteit van het College onder De Boers voorzitterschap blijft de gangbare basis voor de Nederlandse rol in EMA-besluitvorming."
              - "Schrijft de publieke 'Voorzitterscolumn' over geneesmiddelen op cbg-meb.nl — een herkenbare communicatiestijl gericht op transparantie over CBG-besluiten en op publiek vertrouwen in geneesmiddelenregulatie."
              - "Hook: EMA-comitéwerk (CHMP/PRAC), ATMP (gen- en celtherapieën), antibioticaresistentie, geneesmiddelentekorten en Nederlandse handelsvergunningen landen; commerciële marketinggesprekken zonder wetenschappelijk dossier landen niet."
          - Tone advice:
              - "Open met EMA-comitéwerk, ATMP, antibioticaresistentie en geneesmiddelentekorten — dit zijn De Boers wetenschappelijke en publieke prioriteiten."
              - "Niet de CBG-rol verwarren met die van Zorginstituut (HTA) of NZa (tarief) — CBG beoordeelt veiligheid en werkzaamheid, niet vergoeding of prijs; rol-overschrijdende framings worden gecorrigeerd."
