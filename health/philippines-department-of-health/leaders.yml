Philippine health stakeholders:
  - Department of Health (DOH):
      - Dr. Teodoro 'Ted' J. Herbosa:
          - Title: Secretary of Health (since 6 June 2023)
          - Stakeholder engagement notes:
              - "Secretary of Health appointed by President Bongbong Marcos Jr. on 5 June 2023; took oath the following day; Filipino physician with surgery and emergency-medicine background; previously served as DOH Officer-in-Charge in the early Covid-19 period and as Special Adviser to the National Task Force Against Covid-19."
              - "In January 2026, Herbosa publicly dismissed rumours of his impending replacement, stating 'there's no truth to that' and that no Cabinet revamp was planned (Manila Bulletin and Philippine Daily Inquirer coverage); has maintained his position through repeated political-speculation cycles."
              - "In July 2025, Herbosa and five other DOH officials were charged with multiple corruption cases before the Office of the Ombudsman over P44.6 million worth of mental-health drugs, stemming from allegations of irregular allocation of government-procured psychiatric medications to the Rotary Club of Quezon City — proceedings ongoing as of mid-2026 but have not displaced him from office."
              - "Owns UHC (Universal Health Care Act 2019) implementation including Province-wide and City-wide Integrated Health Systems (P/CIHS), PhilHealth premium and benefits design, FDA regulation, the national vaccine programme (post-Dengvaxia trust-rebuilding), HFEP (Health Facilities Enhancement Program) infrastructure investment, and the Philippines's WHO WPRO and ASEAN positioning on health."
              - "Hook: UHC implementation, PhilHealth benefits expansion, mental-health policy implementation under the Universal Mental Health Act, climate and health, dengue surveillance, HIV / AIDS programmes, pharmacy access, and OFW health coverage land."
          - Tone advice:
              - "Open with UHC implementation (P/CIHS), PhilHealth benefits, mental-health policy, vaccine-confidence rebuilding, and climate-health — these are Herbosa's sustained 2023-2026 priorities and his ongoing political defence narrative."
              - "Do not assume Local Government Unit (LGU) compliance — even under UHC, LGUs retain significant operational discretion; framings that bypass LGUs at scale will be redirected through Provincial / City Health Officers and PhilHealth."
