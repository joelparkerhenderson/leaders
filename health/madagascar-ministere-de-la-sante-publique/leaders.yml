Système de santé malgache — parties prenantes:
  - Ministère de la Santé Publique (MINSANP):
      - Prof. Zely Arivelo Randriamanantany:
          - Title: Ministre de la Santé Publique de Madagascar (Gouvernement Rajaonarison, sous le Président Andry Rajoelina)
          - Stakeholder engagement notes:
              - "Ministre de la Santé Publique de Madagascar dans le Gouvernement Rajaonarison sous le Président Andry Rajoelina; profil officiel disponible sur msanp.gov.mg / index.php/ministre et sur la page Wikipédia du Gouvernement Rajaonarison; profil académique-clinique avec parcours d'enseignement universitaire (Pr Zely Arivelo Randriamanantany)."
              - "Owns la politique du MINSANP et son budget, la coordination avec les 22 Directions Régionales de la Santé Publique (DRSP) couvrant l'ensemble des régions de Madagascar, l'Agence du Médicament de Madagascar (AMM) pour la régulation pharmaceutique, l'Institut Pasteur de Madagascar (IPM — centre de référence régional reconnu pour la recherche sur le paludisme, la peste, la fièvre de la vallée du Rift et autres pathologies endémiques), le réseau des Centres Hospitaliers Universitaires à Antananarivo (CHU HJRA — Hôpital Joseph Ravoahangy Andrianavalona, CHU JRB Befelatanana, CHU Soavinandriana, CHU Joseph Ravoahangy Andrianavalona, Anjanamasina), la réponse aux épidémies récurrentes (peste annuelle dans les Hauts-Plateaux et certaines provinces, paludisme endémique, cholera occasionnel), et la diplomatie sanitaire de Madagascar à l'OMS Afrique, la Commission de l'océan Indien (COI), la SADC et l'Union africaine."
              - "Hook: peste et paludisme endémiques (Madagascar est le pays au monde avec la plus forte incidence annuelle de peste humaine), Institut Pasteur de Madagascar programmes de recherche, mise en œuvre de la Couverture Médicale Universelle (UMC), formation des cadres de santé, coopération COI et SADC, et reconstruction post-cyclones (Madagascar est régulièrement touché par des cyclones tropicaux qui endommagent les infrastructures sanitaires) atterrissent."
          - Tone advice:
              - "Ouvrir avec peste / paludisme endémiques, IPM, Couverture Médicale Universelle et coopération COI / océan Indien — ce sont les axes structurants du portefeuille malgache et les marqueurs spécifiques de l'insularité tropicale."
              - "Ne pas pitcher en framings purement français — Madagascar a diversifié ses partenariats stratégiques vers la Chine, l'Inde, la Russie et les BRICS+ sous Rajoelina; les framings exclusivement franco-occidentaux ne reflèteront pas la diplomatie multi-vectorielle actuelle du gouvernement malgache."
