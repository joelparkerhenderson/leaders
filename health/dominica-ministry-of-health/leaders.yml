Dominican (Commonwealth of Dominica) health stakeholders:
  - Ministry of Health, Wellness and Social Services:
      - Hon. Dr. Cassanni Laville (DLP):
          - Title: Minister of Health, Wellness and Social Services
          - Stakeholder engagement notes:
              - "Minister of Health in the Roosevelt Skerrit Dominica Labour Party (DLP) government — Skerrit has been Prime Minister since 8 January 2004, one of the longest-serving Caribbean Prime Ministers; medical doctor; the Commonwealth of Dominica is a republic (since 3 November 1978 independence) with President as Head of State (currently Sylvanie Burton, first woman and first indigenous Kalinago President, sworn in October 2023); verify currency against dominica.gov.dm and GIS Dominica."
              - "Owns MoH policy and budget, the Dominica China Friendship Hospital in Roseau (rebuilt with Chinese assistance after Hurricane Maria devastation in 2017), Princess Margaret Hospital legacy facilities, the Marigot Hospital, the Portsmouth Hospital, the polyclinic and health-centre network across the ten parishes, the Kalinago Territory health services (Dominica is home to the Kalinago indigenous community), and CARICOM, CARPHA, OECS, ECCB, Commonwealth, and PAHO diplomacy."
              - "Hook: non-communicable diseases (Caribbean NCD burden), mental health, climate-and-health and resilience-reconstruction (Hurricane Maria 2017 destroyed much of the country including health infrastructure — Dominica has positioned itself as the world's first 'climate-resilient nation' and the health-resilience dimension is prominent), Citizenship by Investment-financed health investments (the CBI programme has funded significant health infrastructure), Kalinago indigenous health, OECS Pharmaceutical Procurement Service participation, and CARPHA-OECS regional cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, mental health, climate-and-health (centrally — Dominica's climate-resilient nation positioning), Hurricane Maria reconstruction legacy, CBI-financed health investments, Kalinago indigenous health and OECS-CARPHA cooperation — durable lines."
              - "Never confuse the Commonwealth of Dominica (English-speaking CARICOM-OECS island state, ~70,000 population, republic) with the Dominican Republic (Spanish-speaking, ~11 million population, shares Hispaniola with Haiti — distinct sovereign state with radically different system); the confusion is extremely common externally and is politically and operationally embarrassing."
