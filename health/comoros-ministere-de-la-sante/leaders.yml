Parties prenantes du système de santé comorien:
  - Notes sur le Ministre de la Santé de l'Union des Comores:
      - Status: Identité substantive du Ministre de la Santé, de la Solidarité, de la Protection sociale et de la Promotion du Genre à vérifier contre la Présidence de l'Union (beit-salam.km), les communications du Gouvernement de l'Union (gouv.km) et l'Agence Comores Presse. Le remaniement ministériel sous la présidence d'Azali Assoumani peut avoir modifié la titularité; les sources francophones et arabophones régionales sont les meilleurs canaux de vérification.
      - Implication: L'engagement sur la santé comorienne nécessite (i) l'identification du titulaire actuel via les canaux officiels de Moroni, (ii) la reconnaissance de la structure fédérale à trois îles (Ngazidja-Grande Comore, Ndzuwani-Anjouan, Mwali-Mohéli) — chacune avec sa Direction de la Santé sous l'autorité du Gouverneur insulaire — et (iii) la coordination avec les partenaires (OMS, UNICEF, Gavi, AFD, Banque Mondiale, Fonds Mondial) qui assurent une part substantielle du financement et de l'assistance technique.
      - Hook: paludisme et progrès vers l'élimination (les Comores ont fait des avancées notables avec un partenariat chinois sur l'artémisinine), santé maternelle et infantile (mortalité maternelle et néonatale élevées historiquement), nutrition et sécurité alimentaire, NCDs, coordination inter-îles, surveillance épidémiologique (chikungunya, dengue), et appui des partenaires internationaux.
      - Tone: Ouvrir avec paludisme, santé maternelle et infantile, nutrition, NCDs et coordination inter-îles — priorités durables du MSSPSPG. Ne pas négliger la structure fédérale à trois îles ni confondre l'Union des Comores avec Mayotte (département français revendiqué par l'Union — un point politiquement sensible à éviter en framing).
