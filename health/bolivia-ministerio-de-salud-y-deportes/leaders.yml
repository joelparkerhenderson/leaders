Sistema de salud boliviano — partes interesadas:
  - Ministerio de Salud y Deportes (MSyD):
      - Marcela Flores Zambrana:
          - Title: Ministra de Salud y Deportes (Minister of Health and Sports) (en funciones, 2026)
          - Stakeholder engagement notes:
              - "Ministra de Salud y Deportes con actividad pública sostenida en mayo-junio 2026 — iniciativas sobre donación de sangre, recomendaciones sanitarias, y conducción del Ministerio en un período de continuidad de los gobiernos del MAS-IPSP."
              - "Posesionó a dos viceministros: Dr. José Luis Ríos Cambeses como Viceministro de Gestión del Sistema Nacional de Salud y Dra. Roxana Elizabeth Salamanca Kacic como Viceministra de Promoción, Vigilancia Epidemiológica y Medicina Tradicional — equipo configurado para el ciclo 2026-2030."
              - "Presentó el Plan de Salud 2026-2030 como marco estratégico decenal del Ministerio; el plan impulsa el Sistema Único de Salud (SUS, ley de 2019) y la integración operacional con la Caja Nacional de Salud para reducir fragmentación."
              - "Owns la rectoría del Sistema Único de Salud (SUS), la coordinación con los nueve SEDES (Servicios Departamentales de Salud), AGEMED, INLASA, y las cajas de seguridad social en salud; coordina con la OPS / OMS y la Organización Andina de Salud (Convenio Hipólito Unanue)."
              - "Hook: SUS, Plan de Salud 2026-2030, atención primaria, medicina tradicional, recursos humanos en salud, donación de sangre, enfermedades vectoriales (dengue, chikungunya), y vacunación rutinaria aterrizan."
          - Tone advice:
              - "Abrir con el SUS, el Plan 2026-2030, atención primaria y medicina tradicional — son las líneas vigentes del Ministerio y los marcos discursivos a los que la Ministra recurre públicamente."
              - "No pitchear como si la salud fuera federal-centralizada — los nueve SEDES bajo autonomía departamental tienen autoridad operativa significativa; centralismo paceño será corregido."
