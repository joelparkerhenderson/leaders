Partes interesadas del sistema de salud ecuatoguineano:
  - Notes sobre el Ministro de Sanidad y Bienestar Social de la República de Guinea Ecuatorial:
      - Status: Identidad sustantiva del Ministro de Sanidad bajo la presidencia de Teodoro Obiang Nguema Mbasogo (PDGE — Partido Democrático de Guinea Ecuatorial, en el poder desde 1979) a verificar contra la Presidencia (presidenciage.com), Guinea Ecuatorial Press (guineaecuatorialpress.com) y la Agencia de Prensa de Guinea Ecuatorial (APGE). La visibilidad externa del gabinete ecuatoguineano es limitada y el ciclo de remaniements es opaco para observadores externos.
      - Implication: El involucramiento en la salud ecuatoguineana requiere (i) identificación del titular actual vía canales oficiales de Malabo, (ii) reconocimiento del sistema PDGE-dominante y del rol decisivo de la Presidencia, (iii) lectura de la dualidad territorial Río Muni continental (capital política y económica en parte en Bata) e Bioko insular (capital nacional Malabo, mayor parte de la infraestructura sanitaria), y (iv) consideración de la cooperación cubana en recursos humanos clínicos — una característica distintiva del sistema desde décadas.
      - Hook: paludismo (Guinea Ecuatorial ha sido un campo de ensayo notable para vacuna PfSPZ con Sanaria en Bioko), salud materno-infantil, NCDs, cooperación cubana en recursos humanos, perfil epidemiológico del Golfo de Guinea (Marburg ha aparecido en países vecinos), HIV, TB, y CPLP-OMS AFRO-CEMAC en diplomacia sanitaria. El petróleo financia capacidad pero la cobertura efectiva permanece desigual entre zonas urbanas y rurales.
      - Tone: Abrir con paludismo (incluida la innovación de vacuna), MCH, NCDs, cooperación cubana y CPLP-CEMAC — prioridades operativas y áreas donde Guinea Ecuatorial tiene perfil reconocible. No importar framings cameruneses ni gaboneses (Estado hispanohablante distinto en una región mayoritariamente francófona y con arquitectura institucional propia) ni proponer estructuras políticas competitivas (sistema PDGE-dominante; framings de pluralismo serán filtrados).
