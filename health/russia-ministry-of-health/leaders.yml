Russian Federation health stakeholders / Министерство здравоохранения Российской Федерации:
  - Ministry of Health of the Russian Federation (Минздрав России):
      - Mikhail Murashko / Михаил Альбертович Мурашко:
          - Title: Minister of Health of the Russian Federation (Министр здравоохранения Российской Федерации) (since 21 January 2020)
          - Stakeholder engagement notes:
              - "Minister of Health of the Russian Federation since 21 January 2020 in the Mikhail Mishustin government; retained across the 2024 presidential cycle and into Putin's V term; physician by training; previously Head of Roszdravnadzor (Federal Service for Surveillance in Healthcare) from 2015 to 2020 — extensive regulatory background before assuming the ministerial role."
              - "Active throughout 2026: working meetings with President Putin at the Federal Centre for Disaster Medicine at the Pirogov National Medical and Surgical Centre (April 2026); addressed the 79th World Health Assembly in Geneva (May 2026) defending Russia's position on global health policy; led an official three-day visit to Sri Lanka (4-7 May 2026); previous official trip to Ethiopia (19 March 2026)."
              - "Public-policy line: announced in May 2026 (African Initiative news agency) that Russia has groundwork for a vaccine against the new Ebola strain — signal of biomedical-sovereignty agenda and Russian-vaccine export ambition particularly toward Africa and BRICS partners; framing aligns with the post-2022 sanctions-and-localisation period."
              - "Owns the federal Minzdrav portfolio, coordination with Rospotrebnadzor and Roszdravnadzor, FMBA (Federal Medical-Biological Agency), the network of federal medical centres, the national projects 'Healthcare' and 'Demography', OMS (Obligatory Medical Insurance) governance through FOMS, post-sanctions pharmaceutical localisation, and the Russian medical-cooperation portfolio in BRICS, Africa, the CIS and SCO countries."
              - "Hook: Russian vaccine and biomedical sovereignty, national projects ('Healthcare', 'Demography'), BRICS / Africa / SCO cooperation, pharmaceutical localisation, oncology and cardiology national networks, paediatric centres, and disaster-medicine infrastructure (Pirogov NMSP Centre) land."
          - Tone advice:
              - "Lead with national projects, biomedical sovereignty, BRICS-Africa cooperation, federal-regional integration, and Russian vaccine science — these are the Murashko / Putin V-era public lines and the foreign-cooperation portfolio he personally leads."
              - "Do not pitch via Western multilateral frames or sanctions-bypass language — engagement is politically calibrated, and Western-framed or sanctions-circumvention-framed proposals will be filtered or rebuffed by the Foreign Ministry and Presidential Administration."
