Nauruan health stakeholders:
  - Notes on Minister for Health of the Republic of Nauru:
      - Status: Identity of the current Minister for Health under the cabinet of President David Adeang (in office since October 2023) to be verified against naurugov.nr and the Nauru Bulletin. Nauru's small parliamentary system means cabinet portfolios are concentrated among a handful of MPs and ministers frequently hold multiple portfolios.
      - Implication: Engagement on Nauruan health requires (i) identification of the current titleholder via official channels in Yaren District (Nauru has no official capital but Yaren is where government functions are concentrated), (ii) recognition of Nauru's distinctive history — phosphate-mining wealth-and-collapse legacy (Nauru was once one of the wealthiest per-capita states; the depletion of phosphate left lasting health and environmental damage), (iii) the January 2024 diplomatic switch from Taiwan to the People's Republic of China and the resulting bilateral reorientation, (iv) the offshore processing legacy (the Australian Regional Processing Centre on Nauru for asylum seekers has been a defining feature of Australian-Nauruan relations and has had health-system spillover effects), and (v) the very small population (~12,000 — the world's third-smallest sovereign by area and population).
      - Hook: NCDs (Nauru historically had the highest obesity and diabetes rates in the world), TB, MCH, climate-and-health (rising sea levels and small-island vulnerability), kidney disease and dialysis (a major burden — the diabetes legacy is severe), mental health, immunisation, Republic of Nauru Hospital capacity, Australian and Chinese bilateral cooperation, and PIF-PSIDS cooperation.
      - Tone: Open with NCDs (centrally — Nauru is the global reference case for the NCD crisis), diabetes and renal disease, mental health, climate-and-health and PIF-PSIDS cooperation — durable lines. Recognise the Taiwan-China switch (2024), the phosphate-economy historical legacy and the Australian Regional Processing Centre dimension which are politically sensitive.
