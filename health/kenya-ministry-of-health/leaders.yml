Kenyan health stakeholders:
  - Ministry of Health:
      - Aden Duale (UDA):
          - Title: Cabinet Secretary for Health (since 2024 Cabinet reconstitution under President Ruto)
          - Stakeholder engagement notes:
              - "Cabinet Secretary for Health in the William Ruto (UDA) government; appointed in 2024 after the dissolution and reconstitution of the Cabinet following the June 2024 anti-Finance-Bill protests; UDA; previously Leader of Majority in the National Assembly during Uhuru Kenyatta's second term; long-time North Eastern Kenya political figure with strong Somali-community political base; replaced Susan Nakhumicha Wafula in the Health portfolio."
              - "Active 2026 lines: briefed Senate on progress on health reforms, NHIF claims and service delivery (Ministry of Health website); comments to Hiiraan Online (June 2026) that Kenyan Somalis have gained new freedoms under President Ruto — political-frame statements combining community positioning with health-portfolio communications; raised the Ministry's case for enhanced funding for public-health priorities."
              - "Owns the SHA / SHIF rollout (replacing NHIF since 2023-24 under the Social Health Insurance Act), the Primary Healthcare Fund implementation, NHIF legacy claims backlog resolution, KEMSA supply chain reform, KEMRI research portfolio, and national-county coordination on Universal Health Coverage via the Council of Governors and the National Health Conference."
              - "Kenya hosting the World Health Summit Regional Meeting 2026 — Duale is the political host of the convening, positioning Kenya as a regional health-policy hub; coordinates Kenya's WHO Africa, AU and EAC health diplomacy."
              - "Hook: SHA / SHIF rollout, NHIF claims resolution, KEMSA supply-chain reform, county-national coordination via Council of Governors, primary healthcare networks, climate-and-health, HIV / TB / malaria programmes, Universal Health Coverage, and World Health Summit hosting land."
          - Tone advice:
              - "Open with SHA / SHIF rollout, NHIF claims resolution, county coordination, UHC and the World Health Summit hosting — these are the live Ruto-era reform priorities and Duale's authored political lines as a senior UDA figure."
              - "Do not pitch as if counties were administrative subunits — under the 2010 Constitution Kenya's 47 counties are constitutionally autonomous on health delivery, and CEC-Health Members hold operational authority; framings that bypass counties via the Council of Governors will be redirected."
