Sistema de salud nicaragüense — partes interesadas:
  - Ministerio de Salud (MINSA):
      - Notes on Ministerio de Salud:
          - Status: Martha Verónica Reyes Álvarez fue Ministra de Salud desde abril 2020 (asunción durante la pandemia COVID-19) hasta octubre 2024, cuando el régimen Ortega-Murillo oficializó su "renuncia" mediante publicación en La Gaceta el 23 de octubre de 2024 — Reyes fue la quinta funcionaria de alto nivel en abandonar el régimen en cuatro meses, según reportajes de Infobae, Confidencial, Nicaragua Investiga y Coyuntura.co. Desde entonces, el cargo de Ministro/a titular ha estado en transición o vacante, y la identidad sustantiva del sucesor o sucesora debe verificarse en comunicaciones oficiales del régimen (El 19 Digital, La Gaceta, Asamblea Nacional, MINSA).
          - Implication: El engagement con la jefatura del MINSA debe rutearse vía la Casa Presidencial (co-presidencia Daniel Ortega - Rosario Murillo) y las direcciones operativas del Ministerio (Vice-Ministerios y SILAIS) hasta la confirmación oficial de un Ministro o Ministra titular. La política sanitaria operativa está controlada políticamente por el régimen FSLN; cualquier framing técnico debe respetar la centralización institucional y la limitada transparencia de información sanitaria. La cooperación cubana (Misión Médica) sigue siendo activa y su coordinador/a debe identificarse como interlocutor relevante.
