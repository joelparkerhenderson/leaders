Fijian health stakeholders:
  - Ministry of Health and Medical Services (MHMS):
      - Hon. Dr. Atonio Lalabalavu (PAP):
          - Title: Minister of Health and Medical Services (since December 2022)
          - Stakeholder engagement notes:
              - "Minister of Health and Medical Services in the Sitiveni Rabuka coalition government (People's Alliance Party — PAP — with National Federation Party and SODELPA as coalition partners) since the formation of the cabinet after the 14 December 2022 general election that ended Frank Bainimarama's 16-year rule; medical doctor by training; serves under President Wiliame Katonivere (Fiji is a republic since the 1987 coups); verify currency against fiji.gov.fj, health.gov.fj and Fiji Sun."
              - "Owns MHMS policy and budget, the Colonial War Memorial Hospital (CWM Hospital — the apex tertiary public facility in Suva), the Lautoka Hospital (Western Division apex), the Labasa Hospital (Northern Division apex), the divisional and sub-divisional hospital network across the four divisions (Central, Western, Northern, Eastern) and 14 provinces, the rural and area health centre network, Fiji Pharmaceutical and Biomedical Services for procurement, the College of Medicine, Nursing and Health Sciences at Fiji National University and the Fiji School of Medicine legacy, and Pacific Islands Forum (Fiji hosts the PIF Secretariat in Suva), Melanesian Spearhead Group, ACP, Commonwealth, and WHO Western Pacific Region (WPRO) diplomacy."
              - "Hook: non-communicable diseases (Fiji has one of the highest NCD burdens in WPRO with diabetes, hypertension, cardiovascular and renal disease at very high prevalence — the iTaukei population in particular has high rates), tuberculosis, dengue and arbovirus outbreaks (Fiji has periodic dengue epidemics), climate-and-health (Fiji is a leading Pacific voice on climate and small-island vulnerability), maternal-and-child health, mental health, kidney disease and dialysis (a notable epidemic), tobacco control, sugar tax and food policy, PIF Secretariat hosting role on regional health architecture, and Australian (DFAT) and New Zealand (MFAT) bilateral cooperation — these all land."
          - Tone advice:
              - "Open with NCDs (especially diabetes and renal disease), tobacco control, climate-and-health (Fiji is a leading Pacific climate voice), dengue, mental health and PIF cooperation — durable lines."
              - "Recognise Fiji's role as Central Pacific health hub (PIF Secretariat in Suva, the Fiji National University Pacific reach, and Fiji's serving as referral destination for several smaller Pacific states), the iTaukei (indigenous Fijian) and Indo-Fijian community dynamics that can affect policy framing, and the post-Bainimarama political reorientation of the Rabuka government."
