Albanian health stakeholders:
  - Ministria e Shëndetësisë dhe Mbrojtjes Sociale (Ministry of Health and Social Protection):
      - Notes on Minister of Health and Social Protection:
          - Status: Albana Koçiu (PS) served as Minister of Health and Social Protection of Albania from September 2023 to September 2025, when she moved to the Ministry of Internal Affairs portfolio (where she served until March 2026 before leaving the government in a Cabinet reshuffle). The substantive identity of the current Minister of Health and Social Protection in the Edi Rama (PS) government for the post-September-2025 and post-March-2026 cabinet cycle should be verified against the Council of Ministers listing at kryeministria.al and current Albanian media (RTSH, Top Channel, Reporter.al, Politiko.al).
          - Implication: Engagement on the Albanian health portfolio should be routed through the Permanent Secretariat / Deputy Minister of Health, the Director of the Fondi i Sigurimit të Detyrueshëm të Kujdesit Shëndetësor (FSDKSH, statutory health insurance fund), and the CEO of QSU Nënë Tereza Tirana (the main academic-tertiary referral hospital) until the substantive Minister identity is confirmed and added to this register. Albania's ongoing EU accession negotiations, the Rama government's broader reform programme, and recent EU-funded social-care investments (€3.1 million per UNICEF) frame the post-2025 health-portfolio agenda.
