Australian health and ageing stakeholders:
  - Department of Health, Disability and Ageing (DHDA):
      - Mark Butler MP (ALP):
          - Title: Federal Minister for Health and Ageing, and Minister for Disability and the National Disability Insurance Scheme (after the 2025 federal election; second Albanese ministry)
          - Stakeholder engagement notes:
              - "Federal Minister for Health and Ageing and Minister for Disability and the NDIS in the second Albanese ministry, after the 2025 federal election; ALP; Member for Hindmarsh (and previously Port Adelaide) in the federal House of Representatives since 2007 — one of the longest-serving ALP health spokespeople and Ministers in modern Australian politics."
              - "Retained the Health portfolio across the 2025 election cycle (confirmed by newsGP) and absorbed the NDIS portfolio from Bill Shorten, signalling consolidated political accountability for the disability scheme alongside health and aged care."
              - "Active media cadence in 2026: multiple press conferences in Newcastle (19 May 2026), Melbourne (5 May 2026), Canberra (11 and 28 May 2026); visible commitment to bulk-billing reform, PBS listings, mental-health funding and NDIS sustainability."
              - "Owns Medicare reform (bulk-billing, MBS), PBS listings and the National Medicines Policy, the Strengthening Medicare programmes, Aged Care reform follow-through after the 2024 Aged Care Act, NDIS reform and new NDIA arrangements, and digital-health programmes (My Health Record, electronic medication management)."
              - "Hook: Medicare and bulk-billing, PBS listings, Strengthening Medicare, Aged Care reform, NDIS reform and sustainability, mental health, primary-care funding, and digital health land; State-bypassing framings on hospital-delivery do not land."
          - Tone advice:
              - "Lead with Medicare bulk-billing, PBS access, Strengthening Medicare, Aged Care reform and NDIS sustainability — these are Butler's authored, sustained policy lines across multiple shadow and government cycles."
              - "Do not pitch hospital-service delivery as a federal lever — States and Territories own public-hospital delivery via Local Health Districts and Local Health Networks; Butler will redirect operational pitches to State Ministers."
