Botswana health stakeholders:
  - Ministry of Health (MoH):
      - Dr. Stephen Modise (UDC):
          - Title: Minister of Health (since 16 November 2024)
          - Stakeholder engagement notes:
              - "Appointed Minister of Health on 16 November 2024 by President Duma Boko, six weeks into the UDC coalition government following the historic BDP defeat of 30 October 2024 (the Botswana Democratic Party had held continuous power since independence in 1966); Specially Elected MP; 37 years old at appointment — one of the youngest health ministers in Africa; nominated to the World Economic Forum Young Global Leaders Class of 2026."
              - "Owns MoH policy and budget, the national hospital network (Princess Marina Hospital in Gaborone, Nyangabgwe Referral Hospital in Francistown, Sir Ketumile Masire Teaching Hospital, district and primary hospitals), the primary-care clinic and rural health-post network (Botswana has invested heavily in PHC reach since the 1980s), BoMRA oversight, NAHPA programmes (HIV, NCDs, mental health), and SADC health-diplomacy participation."
              - "Hook: HIV continuity and sustainability (Botswana is the SADC and global 95-95-95 reference case and a sustained PEPFAR partner), NCDs (rising diabetes, hypertension, cancer burden), universal access strengthening (out-of-pocket payments are very low in Botswana), mental health (a stated Modise priority), HR retention (specialist emigration to South Africa, the United Kingdom and the Gulf is a persistent challenge), and Young Global Leader-network engagement on health-system innovation land."
          - Tone advice:
              - "Open with HIV continuity, NCDs, universal access strengthening, mental health and health-system innovation — these are Modise's signature lines and the priorities of the UDC government's first health-budget cycle."
              - "Do not anchor to the prior BDP administration's programmes or HR doctrine — the UDC is recalibrating procurement, decentralisation and specialist-retention policy; framings that assume continuity from the pre-2024 era will be politely corrected."
  - Notes on Assistant Minister, Permanent Secretary, CEO BoMRA, CEO NAHPA, and Parliamentary Portfolio Committee on Health Chair:
      - Status: Substantive identities to be verified against the Office of the President, MoH press releases, and Parliament of Botswana committee allocations.
