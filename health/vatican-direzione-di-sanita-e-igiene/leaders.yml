Stakeholder del sistema sanitario vaticano:
  - Notes sullo Stato della Città del Vaticano e la Santa Sede in materia di salute:
      - Status: Lo Stato della Città del Vaticano (SCV) è il più piccolo Stato sovrano al mondo (~0,49 km², ~800 abitanti residenti) e gestisce la sanità interna tramite la Direzione di Sanità e Igiene del Governatorato. La Santa Sede — soggetto giuridico distinto rappresentante universale della Chiesa Cattolica — esercita attraverso il Dicastero per il Servizio dello Sviluppo Umano Integrale (riformato sotto Papa Francesco e proseguito sotto Papa Leone XIV) la pastorale della salute a livello universale, coordinando la rete sanitaria cattolica globale che gestisce circa il 26% delle strutture sanitarie del mondo. I due piani sono distinti ma coordinati e la corretta lettura richiede di non confonderli.
      - Implication: L'engagement sanitario con il Vaticano richiede (i) la distinzione non-negoziabile tra Stato della Città del Vaticano (sanità interna ai residenti — clero, religiose, Guardia Svizzera Pontificia, dipendenti laici e loro familiari; il servizio è gestito tramite convenzioni con strutture sanitarie italiane di prossimità, prevalentemente Policlinico Gemelli, Ospedale Pediatrico Bambino Gesù — quest'ultimo struttura della Santa Sede sotto governance autonoma del Bambino Gesù come Ente Ospedaliero — e San Giovanni di Dio) e Santa Sede (pastorale e advocacy universale via Dicasteri); (ii) il riconoscimento che Sua Santità Papa Leone XIV è stato eletto l'8 maggio 2025 succedendo a Papa Francesco (deceduto il 21 aprile 2025), e che le nomine a livello di Curia, Governatorato e Dicasteri sono soggette al nuovo pontificato; (iii) la lettura dell'Anno Santo 2025 (Giubileo della Speranza, indetto da Francesco e proseguito da Leone XIV) come evento di massa con implicazioni sanitarie per Roma e SCV.
      - Hook: per lo SCV interno — sanità dei residenti, anziani e longevità (la popolazione vaticana è invecchiata, in particolare il clero e le religiose), salute occupazionale (Guardia Svizzera, dipendenti del Governatorato), gestione sanitaria di eventi di massa (pellegrinaggi del Giubileo 2025); per la Santa Sede universale — advocacy sui sistemi sanitari universali, salute materno-infantile globale, lebbra (storicamente), HIV/AIDS, dignità del fine vita e cure palliative, salute mentale, accesso ai farmaci essenziali e diritto alla salute come componente dello sviluppo umano integrale.
      - Tone: Per qualunque engagement è essenziale distinguere SCV (sanità interna) da Santa Sede (pastorale universale via Dicasteri); la confusione tra i due livelli è comune e indica scarsa familiarità con il particolarissimo ordinamento. La pastorale della salute della Santa Sede si esprime in chiave teologico-antropologica (dignità della persona, vita, sviluppo umano integrale); framings puramente tecnico-finanziari saranno integrati con questa cornice. Riconoscere il nuovo pontificato Leone XIV e la continuità dell'agenda dello sviluppo umano integrale.
