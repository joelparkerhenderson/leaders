Malaysian health stakeholders / Pemegang taruh sistem kesihatan Malaysia:
  - Kementerian Kesihatan Malaysia (KKM, Ministry of Health):
      - Dato' Dr. Dzulkefly Ahmad (PH / AMANAH):
          - Title: Minister of Health (since 12 December 2023, in the Anwar Ibrahim unity government)
          - Stakeholder engagement notes:
              - "Minister of Health since 12 December 2023 in the Anwar Ibrahim Pakatan Harapan-led unity government (PH-BN-GPS-GRS); AMANAH (component of PH); replaced Dr Zaliha Mustafa; previously served as Minister of Health 2018-2020 under the Mahathir PH government — returning to the portfolio with institutional memory; medical doctor by training; spoken of as 'a voice of reassurance for Malaysia's healthcare' by DAP Malaysia."
              - "Active 2026 priorities: marked 2026 as year for implementing health-system reforms including further digitalisation (Malaysian Business 'Know Your Minister'); expects 10% cut to Health Ministry's budget (CodeBlue, May 2026); Ministry to submit counter-proposal on the cuts (FMT, May 2026); publicly stated that Malaysia's private healthcare spending is set to surpass public spending 'soonest' (CodeBlue, January 2026) — a structural-trend warning."
              - "Owns KKM policy and budget; oversight of NPRA (medicines and devices), IMR (research), MMC (medical council); primary-care reform; hospital-based EMR rollout (Healthcare IT News reports expansion of Total HIS to 16 hospitals); state-coordination via State Health Departments (Selangor, Johor, Penang, Sabah, Sarawak prominent); and Malaysia's ASEAN, WHO WPRO and BRICS+ health diplomacy."
              - "Hook: budget-defence and health-financing reform, private-public balance, EMR / HIS expansion across federal hospitals, primary-care strengthening (Klinik Kesihatan modernisation), dialysis and NCD programmes, dengue and vector-borne disease, climate-and-health adaptation, and ASEAN health-cooperation land."
          - Tone advice:
              - "Open with budget-defence, private-public balance, EMR / HIS expansion, primary-care reform and ASEAN cooperation — these are the live 2026 issues, his sustained authored public lines, and the technical-credibility platform his medical-doctor background supports."
              - "Do not assume Sabah and Sarawak align with peninsular Malaysia on health planning — under MA63 / IGC arrangements the two East Malaysian states retain distinct constitutional health-policy autonomy, and engagement must route through State Ministers / State Health Directors there."
