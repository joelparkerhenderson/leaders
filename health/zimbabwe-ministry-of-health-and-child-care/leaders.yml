Zimbabwean health stakeholders:
  - Ministry of Health and Child Care (MoHCC):
      - Dr. Douglas Mombeshora (ZANU-PF):
          - Title: Minister of Health and Child Care (since September 2023)
          - Stakeholder engagement notes:
              - "Minister of Health and Child Care in the Mnangagwa Second Republic cabinet appointed September 2023; medical doctor by training; long-serving ZANU-PF politician with previous portfolios including Lands and Rural Resettlement and Higher and Tertiary Education; led the Zimbabwe delegation to the 78th World Health Assembly (May 2025) and 79th WHA (May 2026); elected Chair of the SADC Ministerial Committee on Health."
              - "Owns MoHCC policy and budget, the Central Hospitals network (Parirenyatwa Group of Hospitals, Sally Mugabe Central Hospital — formerly Harare Central, Mpilo Central Hospital, United Bulawayo Hospitals, Chitungwiza Central), the provincial-and-district hospital network across the ten provinces (Bulawayo, Harare, Manicaland, Mashonaland Central, Mashonaland East, Mashonaland West, Masvingo, Matabeleland North, Matabeleland South, Midlands), MCAZ oversight, NAC AIDS levy and programmes, mission-hospital MoUs, and SADC and African Union health diplomacy."
              - "Hook: HIV/AIDS programme continuity (Zimbabwe is a PEPFAR partner and a recognised AIDS Levy success case with ~95-95-95 progress), cervical cancer (a sustained presidential priority — Zimbabwe has high HPV-driven incidence), maternal and child health (the MoHCC under Mombeshora has pushed maternity-fee removal in public facilities), non-communicable diseases (hypertension, diabetes, cancers), primary health care strengthening through Village Health Workers, SADC One Health and trans-frontier cooperation, mission-hospital partnerships land."
          - Tone advice:
              - "Open with HIV continuity, cervical cancer, maternal and child health, primary care strengthening, and SADC One Health — these are sustained MoHCC priorities and Mombeshora's signature lines as SADC Health Chair."
              - "Do not assume blanket sanctions — Zimbabwe is under selective US (OFAC SDN) and EU sanctions on specified individuals and entities, not blanket country-wide prohibition; framings that assume universal sanctions are inaccurate and will be rejected; legitimate humanitarian, health and development engagement is permitted and routinely occurs."
  - Notes on Deputy Minister, Permanent Secretary, CEO MCAZ, CEO NAC, and Portfolio Committee Chair:
