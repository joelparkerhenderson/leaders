Ελληνικό σύστημα υγείας — ενδιαφερόμενα μέρη:
  - Υπουργείο Υγείας (Ministry of Health):
      - Adonis Georgiadis (ΝΔ):
          - Title: Υπουργός Υγείας (Minister of Health) (από Ιανουάριο 2024)
          - Stakeholder engagement notes:
              - "Υπουργός Υγείας από Ιανουάριο 2024 στη δεύτερη κυβέρνηση Μητσοτάκη, διαδεχόμενος Θάνο Πλεύρη; προηγουμένως Υπουργός Ανάπτυξης και Επενδύσεων (2019-2023) και Υπουργός Εργασίας και Κοινωνικών Υποθέσεων (Ιούνιος 2023-Ιανουάριος 2024); Αντιπρόεδρος της Νέας Δημοκρατίας."
              - "Ανακοίνωσε τον Ιανουάριο 2026 5.000 μόνιμες προσλήψεις στο ΕΣΥ — η σταθερή πολιτική γραμμή του μανδάτου είναι η αύξηση μόνιμου προσωπικού, οι απογευματινές χειρουργικές επεμβάσεις, και η μείωση των λιστών αναμονής."
              - "Καινοτομίες ε-υγείας: ενιαίος ιατρικός φάκελος για κάθε πολίτη, εθνικό κέντρο θεραπείας καρκίνου, ψηφιακές αναλύσεις δεδομένων υγείας — εξαγγελίες με πολιτικά εμβληματικό βάρος και ευρωπαϊκή χρηματοδότηση (RRF)."
              - "Παρενέβη Μάιο 2026 σε υπόθεση «φακελάκι» (informal payment) σε νοσοκομείο μετά από καταγγελία ασθενούς με καρκίνο — δείκτης συνεχιζόμενης εστίασης σε διαφθορά και ηθική σε ΕΣΥ."
              - "Hook: ΕΣΥ προσλήψεις, λίστες αναμονής, απογευματινά χειρουργεία, ενιαίος ιατρικός φάκελος, εθνικό κέντρο καρκίνου, RRF / Ταμείο Ανάκαμψης πιάνουν τόπο."
          - Tone advice:
              - "Εστίαση στις προσλήψεις, λίστες αναμονής, ενιαίο ιατρικό φάκελο και αντικαρκινική στρατηγική — αυτές είναι οι εμβληματικές πολιτικές γραμμές του μανδάτου και σταθερά κορυφαία σημεία του δημόσιου λόγου του."
              - "Μην τον προσεγγίζετε ως άτυπο επιχειρηματικό συνομιλητή — ο Γεωργιάδης κυβερνά με υψηλή πολιτική προβολή και θα ενσωματώσει κάθε επικοινωνία στην προσωπική δημόσια στρατηγική του."
