Système de santé camerounais — parties prenantes:
  - Ministère de la Santé Publique (MINSANTE):
      - Dr. Manaouda Malachie (RDPC):
          - Title: Ministre de la Santé Publique du Cameroun
          - Stakeholder engagement notes:
              - "Ministre de la Santé Publique du Cameroun sous le Président Paul Biya et le Premier ministre Joseph Dion Ngute; RDPC (Rassemblement Démocratique du Peuple Camerounais); profil officiel sur spm.gov.cm; longue tenure au portefeuille de la santé publique."
              - "Active 2026 priorities: lancement de l'exécution du budget ministériel 2026 (389 milliards FCFA) le 29 janvier au Palais des Congrès de Yaoundé sous le signe du changement et de la performance (News du Cameroun, ActuCameroun); a présidé la session stratégique du Programme Élargi de Vaccination (PEV) pour 2026 (Afrique Media, 13 mars 2026); a déclaré que 'le système de santé camerounais a enregistré une avancée majeure, jamais vue en Afrique' (ActuCameroun, 15 mars 2026); à Genève en mai 2026, sortie remarquée sur l'injustice sanitaire mondiale (ActuCameroun); honoré à Genève pour l'engagement du Cameroun au sein de l'OMS comme 3ème Vice-Président du Conseil exécutif de l'OMS (Yaoundeinfo, 25 mai 2026) et reçut un certificat d'appréciation du Directeur général de l'OMS Tedros Adhanom Ghebreyesus."
              - "Visite directe à l'hôpital Laquintinie de Douala (avril 2026, visible sur la page Facebook officielle de l'hôpital); communications publiques sur la proximité de l'État avec les grandes figures de la culture camerounaise (MINSANTE)."
              - "Owns la politique du MINSANTE et son budget 389 milliards FCFA 2026, la mise en œuvre de la Couverture Santé Universelle (CSU), le Centre Pasteur du Cameroun (Yaoundé — recherche vaccin et sciences biomédicales), le Programme Élargi de Vaccination, les hôpitaux centraux et régionaux, les 10 délégations régionales de la Santé Publique, et la diplomatie sanitaire du Cameroun à l'OMS, CEMAC, CEEAC et Africa CDC."
              - "Hook: CSU, performance budgétaire 2026, PEV, vaccinations rouvrant après le COVID legacy, Centre Pasteur de Yaoundé programmes, gestion des crises Anglophone et insécuritaire, leadership africain à l'OMS via la 3ème Vice-Présidence du Conseil exécutif, et coopération Africa CDC atterrissent."
          - Tone advice:
              - "Ouvrir avec CSU, performance budgétaire, PEV et leadership africain à l'OMS — ce sont ses lignes autorales sostenues et son cadre discursif en 2026."
              - "Ne pas pitcher en framings qui ignorent la crise anglophone — les régions du Nord-Ouest et du Sud-Ouest nécessitent des cadres spécifiques de reconstruction et de cohésion sociale; les framings qui flattent uniquement les zones francophones seront politiquement incomplets."
