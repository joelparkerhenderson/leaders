Partes interessadas do sistema de saúde cabo-verdiano:
  - Notes sobre o Ministro da Saúde de Cabo Verde:
      - Status: Identidade substantiva do Ministro da Saúde no governo MpD a verificar contra governo.cv, minsaude.gov.cv, a Agência Inforpress, A Nação e Expresso das Ilhas. O ciclo eleitoral cabo-verdiano (legislativas 2026) pode ter implicações para a titularidade.
      - Implication: O envolvimento na saúde cabo-verdiana requer (i) identificação do titular atual via canais oficiais da Praia, (ii) reconhecimento da geografia de arquipélago — dez ilhas (Santo Antão, São Vicente, São Nicolau, Sal, Boa Vista, Maio, Santiago, Fogo, Brava, Santa Luzia desabitada) — com logística sanitária inter-ilhas particular e capacidade hospitalar concentrada na Praia (Hospital Dr. Agostinho Neto) e Mindelo (Hospital Baptista de Sousa), e (iii) leitura da inserção lusófona (CPLP, PALOP-TL) e da cooperação com Portugal, Brasil e parceiros tradicionais (UE, Banco Mundial, OMS, Luxemburgo bilateral, Cuba bilateral).
      - Hook: cobertura universal de saúde (Cabo Verde tem investido em CUS de forma sustentada), doenças não transmissíveis (hipertensão, diabetes, cancros), saúde mental, arboviroses (dengue e zika) — surtos recorrentes ligados ao Aedes —, saúde materno-infantil, evacuação inter-ilhas, recursos humanos (retenção e formação cruzada com Portugal e Brasil), e cooperação CPLP.
      - Tone: Abrir com cobertura universal, NCDs, saúde mental, arboviroses, saúde materno-infantil e cooperação CPLP — prioridades duradouras do MS. Não importar framings continentais (Cabo Verde tem logística e perfil epidemiológico próprios de arquipélago) nem ignorar a lusofonia (PALOP-TL e CPLP são alavancagem efetiva para cooperação técnica).
