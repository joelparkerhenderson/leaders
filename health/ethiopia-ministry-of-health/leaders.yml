Ethiopian health stakeholders:
  - Ministry of Health (MoH):
      - H.E. Dr. Mekdes Daba Feyssa, MD, MPH (Prosperity Party):
          - Title: Minister of Health, Federal Democratic Republic of Ethiopia (since 2024)
          - Stakeholder engagement notes:
              - "Minister of Health since 2024 in the Abiy Ahmed (Prosperity Party) government; obstetrician and gynaecologist by training; medical degree from Hawassa University; OB/GYN residency at Addis Ababa University; Master of Public Health; immediately prior to the ministerial role served as Team Lead at the WHO Deputy Director-General's Office in Geneva and held positions at WHO Headquarters — distinctive WHO-Geneva background among African health ministers."
              - "Active 2026 public agenda: implementing new innovation initiatives for Universal Health Coverage (ENA late June 2026); met EU Delegation on strengthening Ethiopia's health system and supporting Marburg response efforts (MoH news 2026); spoke at Ethiopian Red Cross Society events (28 May 2026) on the need for stronger collaboration among government institutions and partners to address today's health and humanitarian challenges."
              - "International representation: attended IAEA General Conference 2026 as Minister of Public Health; represented Ethiopia at the joint meeting of Ministers of Health of the African and Caribbean Regions (African Union, September 2025); active in International Institute for Primary Health Care - Ethiopia governance."
              - "Owns the post-conflict reconstruction of Tigray, Amhara and Oromia health infrastructure after the 2020-2022 war and the ongoing Amhara / Oromia instability; the Universal Health Coverage 2030 roadmap; HEP (Health Extension Program) modernisation; CBHI / SHI integration; EPSS supply chain reform; EFDA medicines regulation; Marburg and other Viral Haemorrhagic Fever outbreak preparedness; and cooperation with WHO Africa, AU CDC, and BRICS+ health diplomacy."
              - "Hook: post-conflict health reconstruction, UHC innovation, HEP modernisation, CBHI / SHI integration, Marburg and other outbreak preparedness, local pharmaceutical manufacturing, climate-and-health adaptation, and WHO Africa / AU multilateral diplomacy land."
          - Tone advice:
              - "Open with UHC innovation, HEP modernisation, post-conflict reconstruction, Marburg preparedness and AU / WHO Africa cooperation — these are her sustained authored 2026 public lines and her WHO-Geneva-background frame."
              - "Do not pitch as if Ethiopia were uniform — conflict-affected regions (Tigray, Amhara, parts of Oromia) require specific reconstruction-and-recovery framings distinct from stable regions like Addis Ababa, Sidama, South Ethiopia and Dire Dawa."
