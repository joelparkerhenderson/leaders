Sistema de salud dominicano — partes interesadas:
  - Ministerio de Salud Pública y Asistencia Social (MSP):
      - Dr. Víctor Atallah (PRM):
          - Title: Ministro de Salud Pública y Asistencia Social (Minister of Public Health and Social Assistance) (desde enero de 2024 por Decreto 36-24)
          - Stakeholder engagement notes:
              - "Ministro de Salud Pública y Asistencia Social designado por Decreto Presidencial 36-24 en enero de 2024 por el Presidente Luis Abinader (PRM), reemplazando al Dr. Daniel Rivera; PRM; juramentado por el Ministro Santos Echavarría en el Ministerio de la Presidencia."
              - "Graduado Magna Cum Laude en Medicina del Instituto Tecnológico de Santo Domingo (INTEC); posgrado en Medicina Interna, Cardiología, Cardiología Nuclear y Cardiología Intervencionista en Lenox Hill Hospital afiliado a Cornell Medical School en Nueva York; diplomas del American Board of Internal Medicine y Nuclear Cardiology, y certificaciones del American College of Cardiology — formación clínica internacional de alto nivel."
              - "Fundador y presidente de la Fundación Víctor Atallah, entidad sin fines de lucro; participó en la construcción del centro de asistencia médica para víctimas de la tragedia de Jimaní (2004), centro que más tarde sirvió como punto de atención primaria tras el terremoto de Haití de 2010 — la respuesta tuvo cobertura en New York Times, Wall Street Journal y People Magazine."
              - "En mayo de 2026 asumió la Presidencia de la 79ª Asamblea Mundial de la Salud (WHA79) en Ginebra — primera vez que la República Dominicana asume esta presidencia, hito diplomático sanitario para el país; en la reunión de Roma destacó los avances dominicanos en nutrición y sistemas alimentarios sostenibles (Diario Libre)."
              - "Owns la rectoría del MSP; articulación con Servicio Nacional de Salud (SNS), SENASA y SISALRIL; juramentó a Julio César Landrón como nuevo Director del SNS; coordinación con UNICEF, OPS, FAO y el Plan Internacional de Alimentación Escolar."
              - "Hook: presidencia de la WHA79, nutrición y sistemas alimentarios, articulación SNS-SENASA-SISALRIL, atención primaria, política farmacéutica, infraestructura hospitalaria y respuesta a emergencias humanitarias (Haití) aterrizan."
          - Tone advice:
              - "Abrir con presidencia de la Asamblea Mundial de la Salud, nutrición, atención primaria y articulación financiera-delivery — son las líneas de mandato y la proyección internacional dominicana."
              - "No tratar al MSP como el único actor del sistema — SNS es el prestador estatal, SENASA y las ARS son aseguradores; cualquier framing debe respetar la separación financiera-delivery establecida en la Ley 87-01."
