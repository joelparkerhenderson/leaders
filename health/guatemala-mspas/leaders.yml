Sistema de salud guatemalteco — partes interesadas:
  - Ministerio de Salud Pública y Asistencia Social (MSPAS):
      - Dr. Joaquín Barnoya Pérez:
          - Title: Ministro de Salud Pública y Asistencia Social (Minister of Public Health and Social Assistance) (desde julio de 2024)
          - Stakeholder engagement notes:
              - "Ministro de Salud Pública y Asistencia Social desde julio de 2024 en el gobierno de Bernardo Arévalo de León (Movimiento Semilla); designado por el Presidente Arévalo tras la renuncia de Óscar Cordón Cruz el 13 de junio de 2024 por motivos personales."
              - "Médico, investigador de prestigio internacional en control del tabaco; la OPS / OMS Guatemala reconoció el 20-23 de febrero de 2026 su liderazgo en la decisión de Estado que consolida la posición internacional de Guatemala en el control del tabaco — distinción que articula su capital reputacional con el mandato."
              - "Mensaje inaugural al personal del MSPAS: 'Solo soy una persona más del equipo y vengo a trabajar con ustedes' — perfil técnico y horizontal, contrastante con perfiles políticos previos del Ministerio en gobiernos anteriores."
              - "Sobrevivió interpelación en el Congreso de la República con nueve acuerdos que pusieron fin al proceso — superó políticamente un momento de tensión temprano en el mandato, característica de la difícil relación Ejecutivo-Legislativo en Guatemala."
              - "En mayo-junio 2026 desarrolló con apoyo técnico de OPS / OMS Guatemala una misión técnica para acelerar el fortalecimiento de la atención primaria para respuesta a enfermedades no transmisibles; participación personal en la misión 25-28 de mayo 2026."
              - "Hook: control del tabaco (su área de investigación), NCDs y atención primaria, salud materno-infantil y reducción de desnutrición crónica, infraestructura hospitalaria, cooperación con OPS / OMS y otros donantes aterrizan."
          - Tone advice:
              - "Abrir con control del tabaco, NCDs, atención primaria y cooperación OPS — son las líneas autorales de Barnoya, sus reconocimientos internacionales y los marcos discursivos verificables en sus apariciones públicas."
              - "No buscar atajos políticos ni framings partidarios — Barnoya opera explícitamente como técnico-académico, rechaza partidarismo y se distancia de prácticas históricas de captura del Ministerio."
