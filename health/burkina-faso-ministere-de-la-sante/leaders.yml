Système de santé burkinabè — parties prenantes:
  - Ministère de la Santé et de l'Hygiène Publique (MSHP):
      - Dr. Robert Lucien Jean-Claude Kargougou:
          - Title: Ministre de la Santé et de l'Hygiène Publique du Burkina Faso (in the Traoré transition government)
          - Stakeholder engagement notes:
              - "Ministre de la Santé et de l'Hygiène Publique dans le gouvernement de transition sous le Capitaine Président Ibrahim Traoré (au pouvoir depuis le 30 septembre 2022); biographie officielle sur sante.gov.bf; médecin de profession; cérémonie d'installation médiatisée par sante.gov.bf."
              - "Active 2026 agenda: évaluation des performances 2025 et tracé des priorités 2026-2030 du système de santé (leFaso.net, Pravda Burkina Faso, mars 2026); a déclaré 2026 comme l'année de consolidation des acquis 2025; présidé la première édition du FONAFIS (Forum National sur le Financement de la Santé) à Ouagadougou le 18 mars 2026 (BurkinaInfo) — première édition d'un forum institutionnel sur le financement durable de la santé; accueil du premier bébé de 2026 au CHU de Bogodogo le 1er janvier 2026 (Faso7, Pravda BF) — geste symbolique de proximité institutionnelle; communication au Conseil des ministres du 19 février 2026 (Burkina24)."
              - "Owns la politique du MSHP, la mise en œuvre du Couverture Maladie Universelle via la CNAMU, la régulation pharmaceutique via l'ANRP, le système de Gratuité des soins pour les enfants de moins de 5 ans et les femmes enceintes (instauré depuis 2016), les CHU Yalgado Ouédraogo et CHU Bogodogo et autres hôpitaux universitaires, la coordination des 13 Directions Régionales de la Santé, la réponse sanitaire dans les régions du Nord, du Sahel, de l'Est, de la Boucle du Mouhoun et du Centre-Nord affectées par l'insurrection JNIM/ISGS, et la diplomatie sanitaire AES (Alliance des États du Sahel — Burkina Faso, Mali, Niger formellement créée 2023-2024) et post-retrait de la CEDEAO."
              - "Hook: souveraineté sanitaire, Gratuité des soins, CMU rollout, FONAFIS financing innovation, AES sanitaire cooperation, north/east regions insurgency-affected health response, et formation de cadres locaux atterrissent."
          - Tone advice:
              - "Ouvrir avec souveraineté sanitaire, FONAFIS, Couverture Maladie Universelle, Gratuité et coopération AES — ce sont les lignes autoréais du gouvernement de transition burkinabè et le cadre discursif du président Traoré."
              - "Ne pas pitcher en framings français / CEDEAO traditionnels — le Burkina Faso s'est retiré de la CEDEAO en janvier 2024 et a reformulé sa diplomatie autour de l'AES (Alliance des États du Sahel); les framings ouest-africains traditionnels et les framings français ne reflèteront pas la nouvelle réalité politique."
