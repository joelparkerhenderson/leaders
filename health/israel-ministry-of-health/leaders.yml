Israeli health stakeholders:
  - Ministry of Health (משרד הבריאות):
      - Haim Katz (Likud):
          - Title: Minister of Health (and concurrently Minister of Tourism, Minister of Construction and Housing, Minister of Welfare) (since 24 November 2025 Knesset confirmation)
          - Stakeholder engagement notes:
              - "Minister of Health, confirmed by the Knesset on 24 November 2025 along with multiple other portfolios; Likud MK; took the Health, Welfare, Tourism and Construction-and-Housing portfolios after ultra-Orthodox parties (UTJ, Shas) withdrew from the Netanyahu coalition over the draft-law crisis; serves four ministries simultaneously per Times of Israel and Israel Democracy Institute coverage."
              - "Long-time Likud political figure with focus on labour, welfare and pensions; not a clinician; succession from Uriel Buso (Shas), who exited the government in July 2025 — the appointment to Health was administrative-political rather than substantive-clinical, reflecting coalition mechanics rather than health-policy intent."
              - "Israel Democracy Institute described the situation prior to confirmation as 'a ministry with no minister'; the Public Health Services Committee responsible for the 2026 Health Basket was appointed after a weeks-long delay due to the leadership vacuum (Haaretz, November 2025)."
              - "Owns the 2026 Public Health Basket revision (cancer treatments lead the 2026 basket; new mental-health drugs added per Haaretz February 2026), Kupot Holim contracts, government-hospital operations and budget, and the post-7-October-2023 health-system reconstruction in southern and northern border communities (Soroka, Galilee Medical Center, etc.)."
              - "Hook: Health Basket revision, Kupot Holim financing, hospital workforce, mental health, post-conflict trauma care, Soroka and northern hospitals' recovery, and Gaza-Lebanon hostage-related public-health files land; multi-portfolio framings can also bridge into tourism-and-health (medical tourism) and construction (hospital infrastructure)."
          - Tone advice:
              - "Open with Health Basket revision, Kupot Holim financing, post-conflict trauma and southern/northern hospital recovery — these are the live political and operational files of the coalition health portfolio."
              - "Do not assume a full-time clinical focus — Katz oversees four ministries; substantive clinical policy will route through the Director-General of the Ministry and Public Health Services rather than the Minister personally."
