Saint Lucian health stakeholders:
  - Ministry of Health, Wellness and Elderly Affairs:
      - Hon. Moses Jn. Baptiste (SLP):
          - Title: Minister of Health, Wellness and Elderly Affairs (since July 2021)
          - Stakeholder engagement notes:
              - "Minister of Health in the Philip J. Pierre Saint Lucia Labour Party (SLP) government since the SLP's victory in the 26 July 2021 general election that ended Allen Chastanet's UWP government; long-serving SLP parliamentarian; Saint Lucia is a Commonwealth realm under King Charles III represented by Governor-General Errol Charles; verify currency against govt.lc and Saint Lucia Times."
              - "Owns MoH policy and budget, the Owen King EU Hospital (OKEU — the apex public facility in Castries opened in 2017 with EU financing to replace Victoria Hospital; operationalisation has been a long-running policy frame), St. Jude Hospital in Vieux Fort (a reconstruction story — the original burned in 2009 and the long reconstruction has been politically significant), the Soufrière Hospital, Dennery Hospital, polyclinics and wellness centres across the eleven districts, and CARICOM, CARPHA, OECS, ECCB, OIF (Saint Lucia is a Francophone-Creole observer of the Organisation Internationale de la Francophonie), Commonwealth and PAHO diplomacy."
              - "Hook: non-communicable diseases (high Caribbean burden), mental health (Saint Lucia has invested in mental-health reform), elderly affairs and ageing (the portfolio explicitly includes Elderly Affairs reflecting the ageing demographic), OKEU operationalisation and capacity expansion, St. Jude Hospital reconstruction completion, Hurricane and disaster preparedness, climate-and-health, MCH, and CARPHA-OECS regional cooperation — these all land."
          - Tone advice:
              - "Open with NCDs, mental health, elderly affairs, OKEU operationalisation, St. Jude reconstruction, climate-and-health and CARPHA cooperation — durable lines."
              - "Recognise OECS-CARICOM distinctness from other Caribbean states and the Francophone-Creole cultural particularity (Kwéyòl/Patwa is widely spoken; OIF observer status reflects this) — both shape framings."
