Stakeholders del sistema de salut andorrà:
  - Ministeri de Salut:
      - Helena Mas Cucurull (DA):
          - Title: Ministra de Salut (Minister of Health)
          - Stakeholder engagement notes:
              - "Ministra de Salut al Govern de Xavier Espot Zamora (Demòcrates per Andorra — DA, Cap de Govern des de 2019, reelegit a les eleccions del 2 d'abril de 2023); el Principat d'Andorra és un coprincipat parlamentari amb dos coprínceps (el President de la República Francesa Emmanuel Macron i el Bisbe d'Urgell Joan-Enric Vives Sicília); verificar la titularitat actual contra govern.ad i Andorra Difusió."
              - "Owns la política i el pressupost del Ministeri de Salut, l'Hospital Nostra Senyora de Meritxell a Escaldes-Engordany via el SAAS (Servei Andorrà d'Atenció Sanitària, l'operador públic), la xarxa de centres d'atenció primària, el finançament via CASS (Caixa Andorrana de Seguretat Social, l'asseguradora pública obligatòria), els acords transfronterers amb hospitals espanyols (Barcelona, Vall d'Hebron, Sant Pau) i francesos (Toulouse, Foix) per a serveis altament especialitzats que excedeixen la capacitat domèstica, i la diplomàcia OMS Europa, Consell d'Europa, OSCE i UE (Acord d'Associació en negociació amb implicacions sanitàries)."
              - "Hook: salut digital i interoperabilitat (Andorra té dimensió manejable per a pilot a escala-país), no-comunicables (Andorra té una de les esperances de vida més altes del món i un patró d'envelliment d'NCDs), salut mental, longevitat i envelliment actiu, esquí-medicina i emergències de muntanya (un nínxol distintiu), cobertura transfronterera, i Acord d'Associació UE — aterren."
          - Tone advice:
              - "Obrir amb salut digital, NCDs, salut mental, longevitat, esquí-medicina i Acord d'Associació UE — són les línies durables del Ministeri."
              - "No importar framings espanyols o francesos (Andorra és un Estat sobirà amb arquitectura institucional pròpia, coprincipat parlamentari, finançament CASS i operació SAAS distintius), ni ignorar la CASS (el finançament és asseguradora-públic obligatori, no NHS-pur tipus britànic, i framings d'NHS s'hauran de corregir)."
  - Notes sobre Director SAAS, Director CASS i President Comissió Afers Socials del Consell General:
      - Status: Identitats substantives a verificar contra govern.ad, SAAS, CASS i Consell General.
