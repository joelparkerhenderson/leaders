Système de santé français stakeholders:
  - Ministère de la Santé, des Familles, de l'Autonomie et des Personnes handicapées:
      - Stéphanie Rist (Renaissance):
          - Title: Ministre de la Santé, des Familles, de l'Autonomie et des Personnes handicapées (Minister of Health, Families, Autonomy and Disability) (depuis le 26 février 2026)
          - Stakeholder engagement notes:
              - "Nommée Ministre de la Santé, des Familles, de l'Autonomie et des Personnes handicapées par décret du 26 février 2026 dans le gouvernement Lecornu II; auparavant Députée du Loiret depuis 2017 et figure parlementaire majeure de Renaissance sur les sujets de santé."
              - "Rhumatologue de profession au CHU d'Orléans avant l'élection; auteure de la 'loi Rist' (2023) ouvrant l'accès direct à certaines professions paramédicales et l'expérimentation des infirmiers en pratique avancée — l'identité parlementaire est l'accès aux soins et la délégation de tâches."
              - "Camille Galliard-Minier (Renaissance) est Ministre déléguée chargée de l'Autonomie et des Personnes handicapées auprès d'elle depuis le 26 février 2026; le périmètre intègre famille, autonomie et handicap, redonnant cohérence parcours de vie."
              - "Arrive dans un contexte d'instabilité gouvernementale post-juin 2024 (Attal, Barnier, Bayrou, Lecornu I, Lecornu II) et de tension PLFSS — la fenêtre politique est courte et le cadrage budgétaire dur."
              - "Hook: accès aux soins, délégation de tâches, professions paramédicales, autonomie, PLFSS 2027 et financement hospitalier post-Ségur aterrissent; pitches purement vendeurs de plateformes sans ancrage parlementaire risquent d'être renvoyés au cabinet."
          - Tone advice:
              - "Liderar avec accès aux soins, délégation de tâches et professions paramédicales — ce sont ses lignes d'auteure parlementaire et le pont entre médecine clinique et politique publique."
              - "Ne pas pitcher sur la centralisation du système — Rist est venue à la politique par la pratique hospitalière régionale et le langage technocratique parisien sera rebondi vers l'ancrage territorial."
      - Camille Galliard-Minier (Renaissance):
          - Title: Ministre déléguée chargée de l'Autonomie et des Personnes handicapées (Minister Delegate for Autonomy and Disability) (depuis le 26 février 2026)
          - Stakeholder engagement notes:
              - "Nommée Ministre déléguée chargée de l'Autonomie et des Personnes handicapées le 26 février 2026, auprès de la Ministre Stéphanie Rist, dans le gouvernement Lecornu II."
              - "Périmètre: politique de l'autonomie (grand âge, dépendance), politique du handicap, pilotage du virage domiciliaire, articulation avec la Caisse nationale de solidarité pour l'autonomie (CNSA)."
              - "Le portefeuille a circulé entre rattachement à la Santé et autonomie séparée selon les remaniements depuis 2017; le rattachement actuel à un grand ministère Santé-Famille-Autonomie-Handicap restitue une cohérence parcours de vie."
              - "Hook: virage domiciliaire, financement de la branche autonomie de la sécurité sociale, soutien aux aidants, accessibilité, prévention de la perte d'autonomie."
          - Tone advice:
              - "Lider avec autonomie à domicile, prévention de la perte d'autonomie, branche autonomie de la sécurité sociale et soutien aux aidants — ce sont les axes structurants du portefeuille."
              - "Ne pas pitcher des solutions hospitalo-centrées ou cliniques sans dimension sociale et domiciliaire — le périmètre est explicitement médico-social, pas sanitaire pur."
  - Haute Autorité de Santé (HAS):
      - Pr Lionel Collet:
          - Title: Président, Haute Autorité de Santé (depuis 2022)
          - Stakeholder engagement notes:
              - "Président de la HAS depuis 2022; oto-rhino-laryngologiste et audiologiste; ancien Président de l'Université Claude-Bernard Lyon 1; ancien Président de la Conférence des présidents d'université (CPU)."
              - "Sous sa présidence, le Collège pilote les orientations stratégiques, la programmation et la mise en œuvre des missions confiées à la HAS par le législateur — évaluation des médicaments (Commission de la transparence), évaluation des dispositifs médicaux (CNEDiMTS), recommandations de bonne pratique, certification des établissements de santé, accréditation des médecins, évaluation médico-économique."
              - "Profil universitaire et institutionnel plutôt que clinique-spécialiste: la palanca naturale de la HAS sous Collet est la qualité, l'équité d'accès, la pertinence des soins, et la convergence avec les pratiques européennes (EUnetHTA, EU HTA Regulation)."
              - "Hook: HTA, réglement HTA européen, pertinence des soins, certification, recommandations de bonne pratique, évaluation médico-économique aterrissent; les marques vendeurs sans dossier scientifique solide seront durement examinées."
          - Tone advice:
              - "Lider avec preuve scientifique, HTA européenne, pertinence des soins et qualité — ce sont les axes méthodologiques de la HAS et la culture universitaire de Collet."
              - "Ne pas pitcher une transformation par la technologie sans dossier scientifique — la HAS est gardienne de l'evidence-based medicine et tout framing qui contourne la méthodologie sera rebattu."
  - Agence nationale de sécurité du médicament et des produits de santé (ANSM):
      - Pre Catherine Paugam-Burtz:
          - Title: Directrice générale, Agence nationale de sécurité du médicament et des produits de santé (depuis le 1er novembre 2024)
          - Stakeholder engagement notes:
              - "Nommée Directrice générale de l'ANSM par décret paru le 1er novembre 2024, succédant à la Dre Christelle Ratignier-Carbonneil partie diriger l'ARS Grand Est le 15 juin 2025."
              - "Professeure des universités-praticienne hospitalière; spécialiste d'anesthésie-réanimation; auparavant Directrice générale adjointe de l'AP-HP et figure académique de l'anesthésie-réanimation française."
              - "L'ANSM régule les médicaments, les dispositifs médicaux (MDR/IVDR), les produits cosmétiques, le matériovigilance et la pharmacovigilance; opère dans le réseau européen (EMA, HMA) où l'ANSM est l'une des cinq grandes agences."
              - "Profil clinique-académique au lieu du profil scientifique-pharmaceutique de Ratignier-Carbonneil — bascule attendue vers les enjeux dispositifs médicaux, hospitalo-pharmaceutiques et terapies innovantes."
              - "Hook: MDR/IVDR, dispositifs médicaux innovants, thérapies géniques et cellulaires (ATMP), pénuries de médicaments, réforme pharmaceutique européenne, articulation hôpital-industrie aterrissent."
          - Tone advice:
              - "Lider avec dispositifs médicaux, ATMP, articulation hôpital-industrie et dimension européenne — son profil clinique d'AP-HP et anesthésie-réanimation oriente l'ANSM vers les sujets hospitaliers."
              - "Ne pas pitcher uniquement sur le médicament de ville sans dimension hospitalière ou européenne — son profil et ses réseaux orientent vers l'hôpital et l'EMA/HMA."
  - Caisse nationale de l'Assurance Maladie (CNAM):
      - Thomas Fatôme:
          - Title: Directeur général, Caisse nationale de l'Assurance Maladie
          - Stakeholder engagement notes:
              - "Directeur général de la CNAM; haut fonctionnaire de carrière passé par la Direction de la sécurité sociale (DSS) et le cabinet du Président de la République sur les sujets santé / sécurité sociale; profil DSS classique."
              - "Auditionné par la Commission des Affaires sociales de l'Assemblée nationale en février 2026 sur les propositions de la CNAM 'charges et produits' pour 2027 (le rapport annuel qui structure le PLFSS); voix institutionnelle centrale sur l'ONDAM et la maîtrise médicalisée."
              - "Engagé fin février 2026 dans une reprise des négociations conventionnelles avec les syndicats médicaux (les négos s'étaient tendues fin 2025 sur les revalorisations et l'accès aux soins); annonce d'une reprise des discussions à partir de fin mars 2026."
              - "Owns la convention médicale, la convention pharmaceutique, la convention dentaire, les conventions infirmières et orthophonistes; la COG État-CNAM; la stratégie de virage ambulatoire et de pertinence."
              - "Hook: conventions, pertinence, ONDAM, articles 51 (expérimentations innovantes en santé), Mon espace santé côté Assurance Maladie, et les négociations en cours aterrissent; les pitches qui contournent la convention médicale ne aterrissent pas."
          - Tone advice:
              - "Lider avec convention médicale, pertinence, ONDAM, articles 51 et négociations en cours — ce sont les leviers que Fatôme actionne et que la Commission des Affaires sociales scrute."
              - "Ne pas tenter d'instrumentaliser la CNAM comme acheteur libre — Fatôme rappellera que la CNAM est partenaire conventionnel des professions et de l'État, pas client souverain."
  - Santé publique France:
      - Notes on Santé publique France:
          - Status: Dr Caroline Semaille a été nommée Directrice générale par intérim par arrêté du 26 janvier 2026 jusqu'au 30 juin 2026; elle n'a pas sollicité le renouvellement de son mandat et quittera l'agence le 30 juin 2026. Épidémiologiste et infectiologue de formation, elle a également exercé à l'ANSES. Le recrutement de son successeur substantif est en cours.
          - Implication: L'engagement opérationnel avec Santé publique France au-delà du 30 juin 2026 dépend de la nomination d'un Directeur/trice général/e substantif. Pour les sujets de surveillance, de prévention et de communication en santé publique, router l'engagement via la Direction de la prévention et la Direction des maladies infectieuses, en attendant la nomination substantielle. La période d'intérim est explicitement signalée comme une fenêtre de mise sous tutelle politique de l'agence et le contexte politique doit informer l'engagement.
