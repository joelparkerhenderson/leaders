Danske sundhedsvæsen interessenter:
  - Sundhedsministeriet (Ministry of Health):
      - Ida Auken (S):
          - Title: Sundheds- og Kirkeminister (Minister of Health and Ecclesiastical Affairs) (per 3. juni 2026)
          - Stakeholder engagement notes:
              - "Sundheds- og kirkeminister i regeringen Mette Frederiksen III fra 3. juni 2026 (S, SF, M, RV — mindretalsregering); overtog sundhedsområdet fra Sophie Løhde (V) ved ministerial overdragelse i Indenrigs- og Sundhedsministeriet samme dag."
              - "Teolog og præst af uddannelse; medlem af Folketinget siden 2007; miljøminister i Helle Thorning-Schmidts regering 2011-2014 for SF; skiftede partitilhørsforhold fra SF over Radikale Venstre til Socialdemokratiet i 2021 — det fælles træk er en grøn-progressiv-pragmatisk linje med høj kommunikativ profil."
              - "Tiltræder på ressort efter Sophie Løhdes tre-årige periode i Indenrigs- og Sundhedsministeriet (2022-2026) under Frederiksen II; Sundhedsreformen 2024, Robusthedsplanen og indsatsen for at sikre nær adgang til en læge er den arvede ramme."
              - "Portefeuilleopdeling i Frederiksen III er ny: sundhedsområdet udskilles fra indenrigsområdet, som Pia Olsen Dyhr (SF) overtager som økonomi- og indenrigsminister; signalerer at sundhed får en selvstændig politisk position i den nye regering."
              - "Hook: Sundhedsreformens videre implementering, Nære Sundhedsvæsen, sundhedspersonalets vilkår, klimasundhed og grøn omstilling i sundhedsvæsenet lander; pitches der ignorerer det regionale selvstyre lander ikke."
          - Tone advice:
              - "Åbn med Sundhedsreformens implementering, Nære Sundhedsvæsen, sundhedspersonalets vilkår og bæredygtighed i sundhedsvæsenet — disse er regeringen Frederiksen III's overordnede linjer."
              - "Pitch ikke som om Sundhedsministeriet kan diktere regional drift — Auken vil henvise til Danske Regioner og regionsrådsformændene; centralistiske framings afvises."
  - Sundhedsstyrelsen (Danish Health Authority):
      - Jonas Egebart:
          - Title: Direktør, Sundhedsstyrelsen (per 1. oktober 2023)
          - Stakeholder engagement notes:
              - "Direktør for Sundhedsstyrelsen siden 1. oktober 2023; afløste Søren Brostrøm, som i 2023 blev senior advisor ved WHO efter at have ledet styrelsen 2015-2023 (herunder Covid-19-perioden)."
              - "Bestyrelsesmæssig profil med erfaring fra hospitalssektoren (Sjællands Universitetshospital og Sjælland-administrationen) før direktørposten; ikke en politisk-administrativ outsider men en sundhedsfaglig insider."
              - "Owns de nationale sundhedsfaglige retningslinjer, kapacitetsplanlægning, vaccinationsprogrammer (i samarbejde med SSI), den nationale forebyggelsesindsats, og Sundhedsstyrelsens rolle i implementeringen af Sundhedsreformen 2024."
              - "Sundhedsstyrelsen er forfatter af centrale visioner som Nære Sundhedsvæsen og Robusthedsplanen — Egeberts rolle er at oversætte disse rammer til konkret sundhedsfaglig vejledning til regioner og kommuner."
              - "Hook: sundhedsfaglige retningslinjer, kapacitetsplanlægning, forebyggelse, vaccinationsprogrammer, og Sundhedsreformens faglige understøttelse lander; pitches der negligerer det sundhedsfaglige fundament lander ikke."
          - Tone advice:
              - "Åbn med sundhedsfaglige retningslinjer, forebyggelse, kapacitetsplanlægning og Sundhedsreformens implementering — disse er Sundhedsstyrelsens kernebrand."
              - "Pitch ikke Sundhedsstyrelsen som tilsynsorgan — det er Styrelsen for Patientsikkerhed; rolle-forveksling vil blive korrigeret."
