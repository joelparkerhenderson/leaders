Jordanian health stakeholders:
  - Ministry of Health (وزارة الصحة):
      - Dr. Ibrahim Al-Budour:
          - Title: Minister of Health (since August 2025, in the Jaafar Hassan government, by Royal Decree)
          - Stakeholder engagement notes:
              - "Minister of Health appointed in a government reshuffle by Royal Decree issued by His Majesty King Abdullah II under Prime Minister Jaafar Hassan in August 2025 (Arab News, August 2025); succeeded Dr. Firas Hawari who had served as Minister of Health since 29 March 2021 across multiple governments and through the Covid-19 response."
              - "Owns Ministry of Health policy and budget, the Comprehensive Health Centre (CHC) programme rollout (a Hawari-era initiative that Al-Budour has inherited and now implements at scale), the Civil Insurance Programme covering the uninsured Jordanian population, JFDA regulation, the King Hussein Cancer Center (KHCC) and Jordan University Hospital and King Abdullah University Hospital coordination, and Jordan's WHO EMRO and UNRWA Health humanitarian-coordination role as a major refugee-host country."
              - "Operates in a region of complex political-humanitarian dynamics — Jordan hosts large Syrian, Palestinian and Iraqi refugee populations; UNRWA Health programme coordination is structural to the Jordanian health-portfolio brief; the post-October-2023 Gaza humanitarian context further intensified cross-border health coordination demands."
              - "Hook: Comprehensive Health Centres (CHC) rollout, Civil Insurance Programme reform, JFDA regulation and pharmaceutical access, KHCC oncology national strategy, refugee health coordination (UNRWA, UNHCR, WHO), and WHO EMRO multilateral cooperation land."
          - Tone advice:
              - "Open with CHC rollout, Civil Insurance Programme, KHCC oncology, refugee-health coordination and EMRO cooperation — these are the institutional priorities of the Jordanian Ministry of Health and the political signature of the post-August-2025 Hassan-cabinet health portfolio."
              - "Do not pitch as if MoH could direct RMS (Royal Medical Services) or KHCC unilaterally — RMS and KHCC operate under royal patronage with substantial institutional autonomy; engagement on those programmes must include their respective leadership as full partners."
