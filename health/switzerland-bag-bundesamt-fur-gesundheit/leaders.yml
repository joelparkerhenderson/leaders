Schweizerisches Gesundheitswesen / Système de santé suisse — stakeholders:
  - Eidgenössisches Departement des Innern (EDI / DFI / FDHA):
      - Elisabeth Baume-Schneider (SP, Jura):
          - Title: Bundesrätin / Conseillère fédérale, Vorsteherin EDI / Cheffe DFI (Federal Councillor, head of the Federal Department of Home Affairs) (since 1 January 2024; Federal Councillor since 1 January 2023)
          - Stakeholder engagement notes:
              - "Federal Councillor since 1 January 2023; head of the Federal Department of Home Affairs (EDI / DFI / FDHA — which includes BAG / FOPH for federal Health policy) since 1 January 2024, succeeding Alain Berset (SP); previously headed the Federal Department of Justice and Police (FDJP / DFJP) in 2023; Sozialdemokratische Partei (SP / PS); from canton Jura — first Jurassic Federal Councillor."
              - "First Romand woman to chair EDI / DFI in recent decades; pre-federal career as Conseillère d'État du Jura with social-welfare, education and culture portfolios; teacher and social worker background; multilingual French / German political identity."
              - "Reported by blue News to have been internally against the Federal Council's 2025 health-insurance-premium-increase decision but had to remain publicly silent due to collegial governance — illustrative of Swiss Federal Council collegiality constraints on the Health portfolio."
              - "Active 2026: participation in Fribourg 2026 cultural events with Jura representation; Council of Europe meetings on home-affairs portfolio; UN Commission on the Status of Women representation; Coe portfolio overlaps with EDI / DFI on social and health affairs."
              - "Owns federal Health policy via BAG (Bundesamt für Gesundheit / Federal Office of Public Health), the KVG / LAMal premium framework and risk-equalisation, Swissmedic regulation (medicines and devices), national vaccine policy, EU bilateral health-cooperation files, the eHealth (DEP / EPD electronic patient record) rollout, and the federal-cantonal coordination via GDK / CDS."
              - "Hook: KVG premium reform, hospital planning federal-cantonal coordination, mental health, eHealth (DEP / EPD), gender-equality-in-health, climate-and-health, antibiotic resistance, EU bilateral health agreements, and pharmaceutical access land."
          - Tone advice:
              - "Open with KVG premium reform, eHealth (DEP / EPD), federal-cantonal coordination, mental health and EU bilateral health-cooperation — these are the federal levers and Baume-Schneider's social-democratic frame."
              - "Do not pitch as if Switzerland were federally led — the 26 cantons are constitutionally and operationally sovereign on hospital and primary-care delivery; framings that bypass cantonal Gesundheitsdirektor:innen via GDK / CDS will be redirected."
