Sistema de salud paraguayo — partes interesadas:
  - Ministerio de Salud Pública y Bienestar Social (MSPBS):
      - Dra. María Teresa Barán Wasilchuk (ANR-PC):
          - Title: Ministra de Salud Pública y Bienestar Social (Minister of Public Health and Social Welfare) (desde el 15 de agosto de 2023)
          - Stakeholder engagement notes:
              - "Ministra de Salud Pública y Bienestar Social desde el 15 de agosto de 2023 en el gobierno de Santiago Peña (ANR-Partido Colorado), juramentada en la ceremonia de asunción presidencial; cirujana y especialista en Medicina Familiar; experiencia extensa en salud pública y servicio comunitario; nacida el 25 de agosto de 1970."
              - "Anteriormente había sido Encargada de Despacho del MSPBS antes de la asunción titular — continuidad institucional inusual en Paraguay, donde la rotación ministerial suele ser alta."
              - "Owns la rectoría del sistema, la articulación con IPS (Instituto de Previsión Social), DINAVISA (Dirección Nacional de Vigilancia Sanitaria), SENEPA (Servicio Nacional de Erradicación del Paludismo), el Sistema de Protección Social, la Agenda de Salud Digital del MSPBS (Conectatón 2026), y la Misión imPACT 2026 (IAEA / OMS) para fortalecer la respuesta nacional al cáncer."
              - "Presentó al Gabinete Social en 2026 avances y desafíos del Ministerio para el año; ha enfatizado públicamente la importancia de la coordinación interinstitucional para alcanzar interoperabilidad en iniciativas de salud digital."
              - "Hook: salud digital e interoperabilidad, atención primaria, cáncer (imPACT 2026), enfermedades vectoriales (dengue, chikungunya), articulación intersectorial con MEC y MTESS, reforma del IPS aterrizan; pitches que ignoran el IPS no aterrizan."
          - Tone advice:
              - "Abrir con salud digital, interoperabilidad, cáncer (imPACT), atención primaria y articulación intersectorial — son las prioridades visibles del Ministerio en 2026 y las líneas en las que la Ministra ha invertido capital político."
              - "No pitchear como si el MSPBS fuera el único pagador — el IPS tiene autonomía estatutaria y arquitectura institucional propia; framings unitarios serán corregidos en clave dual MSPBS-IPS."
