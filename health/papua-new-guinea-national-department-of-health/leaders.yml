Papua New Guinea health stakeholders:
  - National Department of Health (NDoH):
      - Hon. Elias Kapavore (Pangu Pati):
          - Title: Minister for Health
          - Stakeholder engagement notes:
              - "Minister for Health in the James Marape (Pangu Pati) coalition government (Marape PM since May 2019, re-elected following the 2022 general election); medical doctor by background; PNG is the largest Pacific Island sovereign state by population (~10 million) and a Commonwealth realm under King Charles III represented by Governor-General Sir Bob Dadae; verify currency against pmnec.gov.pg, health.gov.pg, Post-Courier, The National (PNG) and EMTV Online."
              - "Owns NDoH policy and budget, the Port Moresby General Hospital (apex tertiary public facility), Angau Memorial Hospital (Lae), Mount Hagen Hospital, Goroka General Hospital, Madang Provincial Hospital, the network of provincial hospitals across the twenty-two provinces (including the Autonomous Region of Bougainville which has its own Bougainville Department of Health under the autonomy arrangements), Provincial Health Authorities (PHAs — the decentralised structure that integrates provincial hospitals with rural health services and has substantial operational autonomy under the National Health Plan 2021-2030), the church-health-services partnership (Catholic, Lutheran, United Church and Anglican networks provide a substantial share of rural care under MoU), and Pacific Islands Forum, Melanesian Spearhead Group (MSG), ACP, Commonwealth, and WHO Western Pacific Region (WPRO) diplomacy."
              - "Hook: tuberculosis and multidrug-resistant TB (PNG has one of the highest MDR-TB burdens in WPRO and is a Global Fund priority country with specific Daru/Western Province TB-XDR situation), HIV (a sustained epidemic with high prevalence among key populations), maternal and child health (PNG has the worst maternal mortality in the Pacific), non-communicable diseases (rising hypertension, diabetes), malaria (a sustained burden — PNG is on the WHO Asia Pacific Malaria Elimination Network), polio surveillance (PNG had a circulating vaccine-derived polio outbreak in 2018), mpox preparedness, immunisation gaps, church-health-services partnership, PHA decentralisation, and Bougainville post-autonomy health arrangements — these all land."
          - Tone advice:
              - "Open with TB-MDR, HIV, MCH, malaria, NCDs, polio surveillance, immunisation, church-health partnerships and PHA decentralisation — durable lines of NDoH and the Marape government's health priorities."
              - "Recognise PNG's continental-scale geography (the third-largest island country with diverse epidemiology and logistical challenges), the PHA decentralisation architecture (Provincial Health Authorities have substantial operational authority — framings that assume centralised control will be inaccurate), the church-health-services structural role, and Bougainville's post-2019-referendum autonomy trajectory which has health-administration implications."
  - Notes on Secretary NDoH and Parliamentary Permanent Committee on Health Chair:
