Sistema General de Seguridad Social en Salud (Colombia) — partes interesadas:
  - Ministerio de Salud y Protección Social (Minsalud):
      - Guillermo Alfonso Jaramillo Martínez (Pacto Histórico / Colombia Humana):
          - Title: Ministro de Salud y Protección Social (Minister of Health and Social Protection) (desde el 1 de mayo de 2023)
          - Stakeholder engagement notes:
              - "Ministro de Salud y Protección Social desde el 1 de mayo de 2023 en el gobierno de Gustavo Petro (Pacto Histórico), sucediendo a Carolina Corcho durante la primera gran crisis de la reforma de salud; Pacto Histórico / Colombia Humana; médico de profesión, con experiencia política previa como Ministro de Salud bajo Ernesto Samper, ex-Gobernador de Tolima y ex-Alcalde de Ibagué."
              - "Bajo investigaciones múltiples en 2026: la Procuraduría General abrió investigación por presunta participación en política tras un evento del 31 de mayo de 2026 en Coyaima, Tolima (ordenada por el procurador delegado Esiquio Manuel Sánchez Herrera el 25 de mayo de 2026); además, investigaciones por presunto nepotismo en contratos familiares (~3 mil millones de pesos según denuncias) y cuestionamientos por la gestión ministerial."
              - "Confirmó públicamente que no renunciará al Ministerio y que no podrá ser candidato presidencial en las elecciones de 2026 — anclaje firme en la gestión Petro hasta el fin del mandato; el Ministerio respondió institucionalmente a las denuncias defendiendo su gestión."
              - "Owns la implementación operativa del nuevo modelo de gestión de la salud (intervención de EPS, fortalecimiento de ADRES como pagador único, transformación territorial), la fórmula UPC, política farmacéutica, y la mediación con las EPS intervenidas (Sanitas, EPS Sura, Nueva EPS, entre otras)."
              - "Hook: reforma de salud Petro, intervención EPS, ADRES como pagador único, modelo preventivo y territorial, UPC, política farmacéutica, legado COVID en gestión territorial aterrizan; pitches que defienden el statu quo de EPS no aterrizan."
          - Tone advice:
              - "Abrir con reforma de salud Petro, modelo preventivo y territorial, ADRES como pagador y UPC — son los frames discursivos sostenidos del Ministerio y las líneas autorales del gobierno."
              - "No abordar como interlocutor de bajo perfil — Jaramillo opera en un contexto político conflictivo, con alta exposición mediática y múltiples procesos abiertos; cualquier framing debe anticipar el escrutinio público inmediato."
