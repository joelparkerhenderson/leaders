Чинители на здравствениот систем на Северна Македонија:
  - Министерство за здравство (МЗ):
      - Арбен Таравари (ВЛЕН):
          - Title: Министер за здравство (Minister of Health)
          - Stakeholder engagement notes:
              - "Министер за здравство во владата на Христијан Мицкоски (ВМРО-ДПМНЕ) формирана по парламентарните избори од 8 мај 2024, потврдена од Собранието во јуни 2024; претставник на албанската коалиција ВЛЕН во владата (ВМРО-ДПМНЕ-ВЛЕН-ЗНАМ коалиција); медицински доктор по професија; претходно градоначалник на Гостивар (2017-2024); верифицирајте тековност против vlada.mk, zdravstvo.gov.mk, МИА (Македонска Информативна Агенција) и Прес 24."
              - "Owns политиката и буџетот на МЗ, Универзитетскиот Клинички Центар Мајка Тереза во Скопје (врвната референтна установа), Општата болница '8-ми септември' во Скопје, специјалистичките клиники, општи и специјалистички болници низ осумте плански региони (Скопски, Полошки, Североисточен, Источен, Југоисточен, Вардарски, Пелагониски, Југозападен), мрежата на здравствени домови за примарна заштита, Фондот за здравствено осигурување на Северна Македонија (ФЗОСМ — задолжителното осигурување), и дипломатија СЗО Европа, ЕУ-пристапни преговори, Берлин процес, ЦЕФТА и НАТО (Северна Македонија е членка на НАТО од 27 март 2020)."
              - "Hook: реформа на ФЗОСМ (одржливост, пакет на услуги), сёмундствата кои не се пренесуваат — НКД (срцеви, дијабет, рак — Северна Македонија има значителен товар), ментално здравје, онкологија и достапност на специјализирани третмани (значителна емиграција на пациенти за специјализирани третмани во Турција, Бугарија и поразвиените соседи), дигитализација и интероперабилност, реформа на капацитетот на човечките ресурси (емиграцијата на медицинскиот персонал е сериозен проблем), ЕУ-пристапно прилагодување на здравствените регулативи (acquis), и регионална соработка преку Берлин процесот и Западнобалкански Здравствен Форум — сите овие слетуваат."
          - Tone advice:
              - "Отворете со реформа на ФЗОСМ, NCDs, ментално здравје, онкологија, дигитализација, кадровски капацитет и ЕУ-пристап — линиите на Таравари и приоритетите на владата Мицкоски."
              - "Користете го името 'Северна Македонија' (не само 'Македонија') — името на земјата е официјално Република Северна Македонија по Преспанскиот договор од 17 јуни 2018; неупотребата на префиксот политички е сензитивна особено во билатералните контексти со Грција. Не игнорирајте го дискурсот за бугарските малцинства што го обликува ЕУ-пристапниот процес."
  - Notes за Директор ФЗОСМ, Директор на Клинички Центар Мајка Тереза и Претседател на Комисија за здравство во Собрание:
      - Status: Суштинските идентитети треба да се верифицираат против vlada.mk и sobranie.mk.
