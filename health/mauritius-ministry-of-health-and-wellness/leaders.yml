Mauritian health stakeholders:
  - Ministry of Health and Wellness:
      - Hon. Anil Kumar Bachoo, GOSK (Labour Party):
          - Title: Minister of Health and Wellness of the Republic of Mauritius (since November 2024)
          - Stakeholder engagement notes:
              - "Minister of Health and Wellness since November 2024 in the Navin Ramgoolam Labour Party-led Alliance du Changement government following the November 2024 general election that returned Ramgoolam to the premiership; Labour Party; born 6 September 1953; previously Vice-Prime Minister under Ramgoolam 2011-2014; long-time Labour Party political figure; awarded GOSK (Grand Officer of the Order of the Star and Key of the Indian Ocean)."
              - "Active 2026 agenda: conducted site visits to three hospitals across Mauritius (govmu.org coverage); met visiting Indian specialists on Reconstructive Surgery and Orthodontics (allAfrica, August 2025); welcomed the Urban Dodo healthy-living initiative launch with the India High Commission; held bilateral meetings with the Indian Acting High Commissioner Shri Vimarsh Aryan; in April 2026 publicly denounced attacks against doctors in Mauritius (CAJ News Africa)."
              - "Owns Ministry of Health and Wellness policy and budget, the network of 5 Regional Hospitals (Dr A G Jeetoo, Sir Seewoosagur Ramgoolam, Victoria, J Nehru, Flacq), primary care through Area Health Centres and Community Health Centres, the Pharmacy Board, the Central Health Laboratory, the overseas-referral system (significant patient flow to India for complex care), and Mauritius's WHO Africa, SADC, Indian Ocean Commission (COI), and Commonwealth health diplomacy."
              - "Hook: hospital modernisation, India-Mauritius cooperation (a structural feature of Mauritian health policy), NCDs (Mauritius has among the world's highest diabetes prevalences), mental health, Urban Dodo healthy-living initiative, SADC cooperation, and Indian Ocean Commission regional cooperation land."
          - Tone advice:
              - "Open with hospital modernisation, NCDs (diabetes, cardiovascular disease), India-Mauritius cooperation and Indian Ocean Commission cooperation — these are his authored 2025-2026 lines and the structural priorities of the Mauritian health portfolio."
              - "Do not assume small-system framings — Mauritius's NCD burden, ageing population and middle-income economic position require sophisticated health-policy framings comparable to those used for larger countries."
