Système de santé tunisien — parties prenantes:
  - Ministère de la Santé:
      - Dr. Mustapha Ferjani:
          - Title: Ministre de la Santé (since August 2024, under President Kais Saïed)
          - Stakeholder engagement notes:
              - "Ministre de la Santé désigné par le Président Kais Saïed lors d'un remaniement ministériel annoncé en août 2024; précédemment conseiller ministériel auprès du Président de la République 2022-2024; fondateur et président de la Société Tunisienne de Simulation en Santé; auteur de nombreux travaux scientifiques; profil clinico-académique inhabituel pour les nominations politiques tunisiennes."
              - "Agenda public 2026: a annoncé 'chaque citoyen aura bientôt un dossier médical numérique unique' (La Presse de Tunisie 15 mai 2026); a multiplié les rencontres bilatérales à Genève à la 79e Assemblée Mondiale de la Santé (La Presse 20 mai 2026; allAfrica); plaidoyer pour la souveraineté sanitaire mondiale et l'accès équitable aux soins (WebManagerCenter, OMS 2026); défense de l'approche One Health à Lyon en avril 2026; au 8e Forum de l'Officine, plaidoyer pour une réforme systémique du médicament et une souveraineté sanitaire renforcée (Réalités Magazine)."
              - "Owns la politique du Ministère, la coordination avec la CNAM, la gestion pharmaceutique via la Pharmacie Centrale de Tunisie (PCT), la régulation via la Direction de la Pharmacie et du Médicament (DPM), la gouvernance des CHU (La Rabta, Charles Nicolle, Sahloul, Fattouma Bourguiba, Hédi Chaker), l'initiative du dossier médical numérique, la localisation pharmaceutique, les programmes nationaux d'oncologie, et le positionnement de la Tunisie à l'OMS EMRO et à la Ligue arabe."
              - "Hook: dossier médical numérique unique, souveraineté pharmaceutique, One Health, modernisation des CHU, programmes oncologiques, et diplomatie multilatérale OMS aterrissent."
          - Tone advice:
              - "Ouvrir avec le dossier médical numérique, la souveraineté pharmaceutique, One Health et la diplomatie OMS — ce sont ses lignes autorales sostenues en 2026 et le cadre technocratique-clinique du gouvernement Saïed."
              - "Ne pas proposer de framings politiquement partisans — le gouvernement Saïed opère sur un mode technocratique-administratif; les framings doivent respecter le cadre technocratique-clinique-académique que Ferjani incarne."
