Solomon Islands health stakeholders:
  - Notes on Minister of Health and Medical Services of the Solomon Islands:
      - Status: Identity of the current Minister of Health and Medical Services to be verified against pmc.gov.sb, parliament.gov.sb, Solomon Star and SIBC; the Jeremiah Manele (OUR Party — Ownership, Unity and Responsibility) coalition government has been in office since 2 May 2024 following the 17 April 2024 general election, succeeding the Manasseh Sogavare government. Solomon Islands is a Commonwealth realm under King Charles III represented by Governor-General Sir David Vunagi.
      - Implication: Engagement on Solomon Islands health requires (i) identification of the current titleholder via official channels in Honiara, (ii) recognition of the China-bilateral shift (the country switched diplomatic recognition from Taiwan to the People's Republic of China in September 2019 and signed a security cooperation framework with China in April 2022 — China is now a major bilateral partner alongside Australia, New Zealand, Japan and the EU; this geopolitical context shapes development cooperation framings), (iii) the post-2021 Honiara riots reconstruction context (the November 2021 unrest had health-infrastructure impacts), (iv) the archipelago architecture (~900 islands, second-most populous Melanesian state) with the National Referral Hospital in Honiara as the apex facility and provincial hospitals in Gizo, Auki, Kirakira and others, and (v) the donor architecture (Australia DFAT, New Zealand MFAT, World Bank, ADB, WHO WPRO, UNICEF, Japan JICA, Chinese bilateral, EU).
      - Hook: malaria (Solomon Islands has one of the highest malaria burdens in WPRO and is a sustained Global Fund and Asia Pacific Malaria Elimination Network priority), tuberculosis, maternal and child health, non-communicable diseases (rising obesity, diabetes), dengue and arboviruses, climate-and-health (sea-level rise, cyclones — Solomon Islands is highly climate-exposed), water and sanitation, mental health, MSG and PIF regional cooperation.
      - Tone: Open with malaria, MCH, NCDs, TB, climate-and-health, dengue and PIF-MSG regional cooperation — durable lines. Recognise the Manele coalition's policy direction and the China-bilateral shift, the post-Honiara-riots reconstruction context, and the continental-scale archipelago challenges.
