Stakeholder des liechtensteinischen Gesundheitssystems:
  - Notes zum liechtensteinischen Gesundheitsminister (Ministerium für Gesellschaft, Bildung, Sport und Kultur mit Gesundheitsressort):
      - Status: Substantive Identität des Ministers mit Gesundheitsressort in der nach den Landtagswahlen vom 9. Februar 2025 gebildeten Regierung — die VU (Vaterländische Union) ist als stärkste Partei aus den Wahlen hervorgegangen mit Brendan Wanger als Regierungschef und einer VU-FBP-Koalitionsregierung — zu verifizieren gegen regierung.li, llv.li (Liechtensteinische Landesverwaltung), Liechtensteiner Vaterland, Liechtensteiner Volksblatt und Radio Liechtenstein. In der Vorgängerregierung (Risch-Regierung 2021-2025) war Manuel Frick (FBP) Minister für Gesellschaft, Bildung, Sport und Kultur (mit Gesundheitsressort); die Ressortzuteilung in der neuen Regierung kann geändert sein.
      - Implication: Engagement im liechtensteinischen Gesundheitssystem erfordert (i) die Verifikation des aktuellen Titelinhabers über die offiziellen Kanäle in Vaduz, (ii) das Verständnis der konstitutionellen Erbmonarchie unter dem Fürsten Hans-Adam II. und Erbprinz Alois als Stellvertreter, (iii) die Anerkennung der Mitgliedschaft im EWR (Europäischer Wirtschaftsraum — Liechtenstein ist EWR-Mitglied seit 1995, was die Anwendbarkeit relevanter EU-Gesundheitsregulatorik wie Medizinprodukte und Arzneimittelzulassung regelt) und der Zollunion mit der Schweiz, und (iv) das KVG-System (Krankenversicherungsgesetz) mit obligatorischer Krankenversicherung als Finanzierungsmodell — distinkt vom NHS-Modell und vom österreichischen Sozialversicherungsmodell.
      - Hook: nicht-übertragbare Krankheiten (Liechtenstein gehört zu den Ländern mit der höchsten Lebenserwartung weltweit), psychische Gesundheit, Langlebigkeit und aktives Altern, digitale Gesundheit und Interoperabilität (die kleine Skala erlaubt Pilotprojekte auf Staatsebene), Krankenversicherungsmarkt (LKV Liechtensteinische Krankenversicherung als grosser Anbieter, plus Schweizer Anbieter), Spitalkooperation mit der Schweiz (insbesondere mit dem Kantonsspital Graubünden, dem Universitätsspital Zürich und dem St. Galler Spitalverbund — Liechtenstein hat selbst kein eigenes Akutspital, das Landesspital Vaduz ist eine kleinere Einrichtung), und EWR-regulatorische Ausrichtung (Medizinprodukteverordnung MDR, IVDR, Arzneimittelrecht).
      - Tone: Mit NCDs, Langlebigkeit, psychische Gesundheit, digitale Gesundheit, EWR-Regulatorik und Schweiz-Spitalkooperation eröffnen — dauerhafte Linien des Ministeriums. Liechtenstein nicht mit der Schweiz verwechseln (souveräner Staat mit eigener Architektur trotz Zollunion und enger Spitalkooperation; die Verwechslung ist häufig und peinlich) und nicht den EWR ignorieren (Liechtenstein ist EWR-Mitglied, nicht EU-Mitglied — relevant für die regulatorische Einbettung).
