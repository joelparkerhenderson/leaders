Sistema de saúde moçambicano — partes interessadas:
  - Ministério da Saúde (MISAU):
      - Dr. Ussene Hilário Isse (Frelimo):
          - Title: Ministro da Saúde de Moçambique
          - Stakeholder engagement notes:
              - "Ministro da Saúde de Moçambique no governo Frelimo; médico cirurgião especialista; perfil oficial no portaldogoverno.gov.mz e no misau.gov.mz; biografia médico-académica."
              - "Active 2026 priorities: 'O Ministro da Saúde, Ussene Isse, afirmou que o sistema enfrenta desafios mas continua a responder' (Parlamento.mz, O País Moçambique); 'Ussene Isse exige maior rigor na gestão de medicamentos em Moçambique' (MMO News, maio 2026); 'MINISTRO DA SAÚDE USSENE ISSE INSURGE-SE CONTRA CORRUPÇÃO NA CADEIA DE MEDICAMENTOS' (CMAM news) — combate à corrupção na cadeia de abastecimento de medicamentos como linha mandatária definidora."
              - "O governo de Moçambique instituiu 'mês da planificação' para maior eficiência e transparência no sector da saúde (AIM News, 10 outubro 2025) — reforma de planeamento institucional do MISAU sob liderança de Isse."
              - "Owns a política do MISAU, a reforma da cadeia de abastecimento de medicamentos via CMAM, o Instituto Nacional de Saúde (INS), Hospital Central de Maputo e Hospital Central de Beira, a coordenação das 10 Direcções Provinciais de Saúde, a resposta de saúde nas províncias do norte afectadas pela insurgência (Cabo Delgado, Nampula, Niassa), a reconstrução de infra-estruturas pós-ciclones (Idai 2019, Daniel 2025 e outros), e o posicionamento de Moçambique na OMS África, SADC e CPLP."
              - "Hook: medicamentos e combate à corrupção (uma linha mandatária definidora), resposta de saúde em Cabo Delgado, preparação contra mpox, continuidade HIV / TB / malária pós-mudanças da política PEPFAR (Moçambique tem a maior prevalência adulta de HIV na SADC), reconstrução de infra-estruturas de saúde pós-ciclones, e cooperação CPLP atterissem."
          - Tone advice:
              - "Abrir com medicamentos e anti-corrupção, resposta de Cabo Delgado, continuidade HIV e cooperação CPLP — são as linhas autoréais sostenidas de Isse em 2026 e as prioridades estruturais do sector."
              - "Não assumir uniformidade nacional — Cabo Delgado, Nampula e Niassa requerem framings específicos do contexto de insurgência e deslocamento interno; framings que ignoram essa heterogeneidade serão politicamente incompletos."
