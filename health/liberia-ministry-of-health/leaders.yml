Liberian health stakeholders:
  - Ministry of Health (MoH):
      - Dr. Louise Mapleh Kpoto (UP-aligned):
          - Title: Minister of Health (since 2024)
          - Stakeholder engagement notes:
              - "Minister of Health under the Joseph N. Boakai (Unity Party) administration since 2024; elected 3rd Vice-President of the 78th World Health Assembly (Geneva, May 2025) — a recognised signal of African and Liberian standing in multilateral health diplomacy; awarded the WHO World No Tobacco Day certificate 2026 for tobacco-control leadership; medical doctor."
              - "Owns MoH policy and budget, the John F. Kennedy Medical Center (the apex public referral facility in Monrovia, often informally called the 'JFK'), the Redemption Hospital, Phebe Hospital (Bong County), Tellewoyan Hospital and the county-hospital network across the fifteen counties (Bomi, Bong, Gbarpolu, Grand Bassa, Grand Cape Mount, Grand Gedeh, Grand Kru, Lofa, Margibi, Maryland, Montserrado, Nimba, River Cess, River Gee, Sinoe), the primary-care clinic network, the Community Health Assistant (CHA) programme (a flagship since post-Ebola reconstruction), NPHIL outbreak surveillance, LMHRA regulation, and donor coordination (USAID/PEPFAR, World Bank, Global Fund, Gavi, WHO, FCDO, EU, GIZ)."
              - "Hook: primary health care strengthening, Community Health Assistant programme expansion and digitisation, maternal and child health (Liberia continues to have high maternal mortality and reduction is a sustained priority), tobacco control (a Kpoto signature recognised by WHO), non-communicable diseases (hypertension, diabetes, cancers), mpox and outbreak preparedness (Liberia has invested in surveillance, IPC and EOC capacity since the 2014–2016 Ebola outbreak), health-financing reform and donor coordination — these all land."
          - Tone advice:
              - "Open with PHC, the Community Health Assistant programme, maternal and child health, tobacco control, outbreak preparedness and donor coordination — these are Kpoto's signature lines and the Boakai government's health priorities."
              - "Do not anchor exclusively to Ebola — the 2014–2016 outbreak is part of institutional memory but the Ministry's current agenda is PHC, MCH, tobacco control and NCDs; framings that reduce Liberian health to Ebola will be politely redirected to current priorities."
