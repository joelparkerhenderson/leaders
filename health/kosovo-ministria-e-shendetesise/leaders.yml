Stakeholderët e sistemit shëndetësor në Kosovë:
  - Ministria e Shëndetësisë (MSH):
      - Arben Vitia (LVV):
          - Title: Ministër i Shëndetësisë (Minister of Health)
          - Stakeholder engagement notes:
              - "Ministër i Shëndetësisë në qeverinë e Albin Kurtit (LVV — Lëvizja Vetëvendosje) që nga marsi 2021 (qeveria Kurti II); vazhdon në qeverinë e formuar pas zgjedhjeve parlamentare të 9 shkurtit 2025 (LVV dolën si forca më e madhe por pa shumicë absolute; bisedimet për formimin e qeverisë vazhduan për disa muaj); doktor mjeksh me përvojë komunale dhe parlamentare; verifikoni aktualitetin kundër kryeministri-ks.net, msh.rks-gov.net, Koha Ditore dhe KosovaPress."
              - "Owns politikat dhe buxhetin e MSH, Qendrën Klinike Universitare të Kosovës (QKUK) në Prishtinë (qendra terciare e referencës), Spitalet Rajonale të Pejës, Gjakovës, Mitrovicës, Prizrenit, Gjilanit, Ferizajt, rrjetin e qendrave të mjekësisë familjare nëpër 38 komunat (përveç katër komunave veriore me shumicë serbe që operojnë sistem paralel të mbështetur nga Beogradi), Shërbimin Spitalor dhe Klinik Universitar të Kosovës (SHSKUK), Agjencinë e Kosovës për Produktet dhe Pajisjet Mjekësore (AKPPM), Fondin për Sigurimin Shëndetësor (i krijuar me Ligjin për Sigurimet Shëndetësore por jo ende plotësisht funksional), dhe diplomacinë OBSH Europë, Këshilli i Evropës, BE (Marrëveshja për Stabilizim-Asociim), dhe partneritetin me USAID, GIZ, Lux-Dev, Sida, FCDO."
              - "Hook: reforma e sigurimit shëndetësor (Fondi i Sigurimit Shëndetësor nuk është ende plotësisht funksional dhe është çështje politike e theksuar), forcimi i kujdesit parësor (PHC), sëmundjet jo-ngjitëse (zemra-vaskulare, diabet, kanceri), shëndeti mental (përfshirë traumat e luftës), onkologjia, transplantimi (Kosova mbështetet në mjeku jashtë vendi për disa transplante), shëndeti i nënës dhe fëmijës, kapaciteti i resurseve njerëzore (emigrimi i mjekëve drejt Gjermanisë është sfidë e madhe), digjitalizimi shëndetësor, dhe procesi i integrimit në BE — të gjitha këto zbresin."
          - Tone advice:
              - "Hapni me reformën e sigurimit shëndetësor, forcimin e PHC, NCDs, shëndetin mental, onkologjinë, kapacitetin e resurseve njerëzore dhe procesin e BE-së — këto janë linjat dalluese të Vitias dhe prioritetet e qeverisë Kurti."
              - "Mos shpërfillni situatën në veri (katër komunat veriore — Mitrovica Veriore, Zubin Potok, Zveçan, Leposaviq — operojnë me strukturë paralele shëndetësore të mbështetur nga Beogradi, çka është një sfidë operative dhe politike e thellë) dhe mos sillni framing serb (Kosova është shtet sovran që ka shpallur pavarësinë më 17 shkurt 2008; trajtimi i saj si pjesë e Serbisë do të refuzohet politikisht)."
  - Notes mbi Drejtorin QKUK, Drejtorin AKPPM dhe Kryetarin e Komisionit për Shëndetësi në Kuvend:
      - Status: Identitetet substantive duhet të verifikohen kundër msh.rks-gov.net dhe kuvendikosoves.org.
