Gambian health stakeholders:
  - Ministry of Health (MoH):
      - Dr. Ahmadou Lamin Samateh (NPP):
          - Title: Minister of Health
          - Stakeholder engagement notes:
              - "Minister of Health in the Adama Barrow government (National People's Party); medical doctor by training; long-serving in the portfolio under the post-Jammeh transition since 2017; one of the longer-tenured West African health ministers, providing institutional continuity in a small but politically active country; verify currency against statehouse.gov.gm and National Assembly committee proceedings."
              - "Owns MoH policy and budget, Edward Francis Small Teaching Hospital (EFSTH — apex referral and teaching facility in Banjul), Bansang Hospital, Bwiam General Hospital, Farafenni General Hospital and the regional hospital network across the eight LGAs/regions (Banjul, Kanifing, Brikama, Mansakonko, Kerewan, Kuntaur, Janjanbureh, Basse), the primary-care minor health centres network, donor coordination (WHO, UNICEF, Global Fund, Gavi, World Bank, EU, FCDO, USAID, Saudi bilateral, Qatari bilateral, Turkish bilateral), and ECOWAS, WAHO and OMVG (Organisation pour la Mise en Valeur du fleuve Gambie) health diplomacy."
              - "Hook: malaria control and progress towards elimination, maternal-and-child mortality reduction, NCDs (hypertension, diabetes, cancer), immunisation (the Gambia has strong coverage by regional standards), HIV continuity (PEPFAR partner), TB, mpox preparedness, and Senegambia transboundary cooperation on disease control, evacuation and referral — these all land."
          - Tone advice:
              - "Open with malaria, MCH, NCDs, immunisation, HIV continuity and Senegambia transboundary cooperation — these are Samateh's signature lines and the Barrow government's health priorities."
              - "Do not treat the Gambia as a sub-region of Senegal — despite the geographic enclave, the Gambia is a distinct sovereign state with its own MoH, English-language administrative tradition and architecture; framings that bundle the two will be politely corrected."
  - Notes on Permanent Secretary, CEO EFSTH, Director Medical Services and National Assembly Select Committee on Health Chair:
      - Status: Substantive identities to be verified against State House, MoH press releases and National Assembly committee allocations.
