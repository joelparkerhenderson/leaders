Kuwaiti health stakeholders / أصحاب المصلحة في النظام الصحي الكويتي:
  - Ministry of Health (وزارة الصحة):
      - Dr. Ahmad Abdulwahab Al-Awadhi:
          - Title: Minister of Health of the State of Kuwait
          - Stakeholder engagement notes:
              - "Minister of Health of the State of Kuwait; serves under HH the Amir Sheikh Mishal Al-Ahmad Al-Jaber Al-Sabah and the Council of Ministers; ministerial leadership engaged in substantial 2025-2026 administrative reform of the health sector."
              - "In May 2026 His Highness the Amir received Minister Al-Awadhi, who presented to HH the newly appointed Health Ministry Undersecretary Sheikh Dr. Salman Khalifah Al-Sabah (Kuwait News Agency KUNA, May 2026) — extension of the senior leadership team and indication of continued royal-court-aligned administrative reform direction."
              - "In December 2025 Al-Awadhi issued 11 ministerial decrees to strengthen governance and modernise the health sector, covering the public health, technical, private and pharmaceutical control sectors (Kuwait Times coverage); substantive administrative-reform agenda focused on governance modernisation, sector regulation and decree-based change in the absence of a regularly convened National Assembly."
              - "Owns MoH policy and budget, the public hospital network (Mubarak Al-Kabeer, Al-Adan, Al-Amiri, Farwaniya, Al-Sabah, Al-Razi, Jaber, Jahra, New Maternity), Kuwait Cancer Control Centre, Pharmaceutical and Health Stores, Public Health Department, primary health centres and Polyclinics, and Kuwait's WHO EMRO, GCC Council of Health Ministers, Arab League and OIC health diplomacy."
              - "Hook: governance modernisation (Dec 2025 decrees), public hospital network expansion (Jaber and Jahra in particular), oncology national programme (Kuwait Cancer Control Centre), pharmaceutical-control modernisation, healthtech and AI, sovereign-wealth-funded health-infrastructure investment, and 'New Kuwait 2035' Vision implementation land."
          - Tone advice:
              - "Open with governance modernisation, public hospital network development, oncology and healthtech — these are the live 2025-2026 priorities and his authored decree-based reform agenda."
              - "Do not assume rapid political timelines — Kuwait's National Assembly cycles are volatile and the Amir has historically suspended parliamentary sessions; major legislative health reforms therefore depend on Amiri Decree, and engagement should anticipate the decree-based reform pathway."
