Kalaallit Nunaani peqqissutsimut tunngaviusut / Greenland health stakeholders:
  - Naalakkersuisut Peqqissutsimut Naalakkersuisoqarfik (Ministry of Health):
      - Anna Wangenheim:
          - Title: Naalakkersuisoq for Health and Persons with Disabilities (Minister of Health and Persons with Disabilities) (in the Nielsen cabinet)
          - Stakeholder engagement notes:
              - "Naalakkersuisoq for Health and Persons with Disabilities in the Jens-Frederik Nielsen (Demokraatit) cabinet formed in 2025; combined portfolio reflects small-population system architecture in which health and disability are administered together."
              - "Public statement May 2026: Greenlanders are not 'guinea pigs' for US research interests — explicit rejection of suggestions that US-administration-aligned research initiatives could enrol Greenlandic citizens without local consent and oversight; positioned health policy as a sovereignty question in the context of Trump-administration statements about US interest in Greenland."
              - "Owns operational steering of Sundhedsvæsenet (Peqqissutsimut Sulinerit), the bilateral patient-care arrangements with Denmark (referrals to Rigshospitalet and other Danish university hospitals for specialist care), telemedicine programmes to remote settlements, suicide-prevention strategy, and mental health, alcohol and tobacco public-health programmes."
              - "Context: Greenland's geography (16 inhabited settlements, no inter-settlement road network, severe weather windows) makes telemedicine, retrieval medicine and aeromedical evacuation operational defaults rather than auxiliaries."
              - "Hook: telemedicine, mental health and suicide prevention, substance abuse policy, maternal and child health, Inuit cultural-adapted care models, DK-GL bilateral arrangements, and sovereignty-in-research land; US-market framings do not."
          - Tone advice:
              - "Lead with telemedicine, mental health and suicide prevention, Inuit cultural-adapted care, and bilateral DK-GL arrangements — these are the operational and political priorities of the small-population, geographically dispersed health system."
              - "Do not pitch as if Greenland were a US-market segment — Wangenheim has made the sovereignty-in-research point explicitly; US-style commercial framings will be politically charged in the current Trump-administration period."
