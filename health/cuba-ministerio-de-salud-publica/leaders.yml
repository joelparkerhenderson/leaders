Sistema de salud cubano — partes interesadas:
  - Ministerio de Salud Pública (MINSAP):
      - Dr. José Ángel Portal Miranda (PCC):
          - Title: Ministro de Salud Pública (Minister of Public Health) (desde 2018)
          - Stakeholder engagement notes:
              - "Ministro de Salud Pública desde 2018; Partido Comunista de Cuba (PCC); médico de profesión y diputado a la Asamblea Nacional del Poder Popular; ha encabezado MINSAP a lo largo del periodo de crisis sostenida del sistema sanitario cubano, agudizado por la profundización del embargo estadounidense, la pandemia COVID-19 y la crisis económica cubana 2020-2026."
              - "Declaró a Associated Press en febrero de 2026 que el sistema de salud cubano está 'al borde del colapso' por el bloqueo estadounidense sobre suministros petroleros (cibercuba.com); en marzo de 2026 (Pravda ES vía Victor Ternovsky) abordó los esfuerzos estadounidenses por dejar al pueblo cubano sin atención médica; en mayo de 2026 recorrió hospitales en rehabilitación en Santiago de Cuba para constatar la reapertura de servicios clave (Cubadebate)."
              - "Owns la rectoría del Sistema Nacional de Salud, las brigadas médicas internacionales (Venezuela, Honduras hasta 2024, Belize, Italia, México, Argelia, Sudáfrica y otros países, como activo diplomático y principal fuente de divisas extranjeras de Cuba), la articulación con BioCubaFarma para la producción nacional de medicamentos y vacunas (SOBERANA, Abdala, CIMAvax), la formación médica en la Escuela Latinoamericana de Medicina (ELAM), y la representación cubana en OMS / OPS."
              - "Intervino en la sesión especial de la Asamblea Mundial de la Salud y en sesiones plenarias regulares; activo en la diplomacia sanitaria del Sur Global; voz pública en la celebración del 50 Aniversario de la Sociedad cubana de Salud Pública."
              - "Hook: brigadas médicas, BioCubaFarma vacunas y biotecnología (incluyendo terapias contra el cáncer), formación médica internacional ELAM, bloqueo y acceso a medicamentos, atención primaria 'modelo cubano' del médico de familia, diplomacia OMS / OPS, y cooperación Sur-Sur aterrizan."
          - Tone advice:
              - "Abrir con brigadas médicas, BioCubaFarma, atención primaria modelo cubano, formación ELAM y bloqueo estadounidense — son los frames discursivos sostenidos de MINSAP en el contexto político actual y las líneas autorales del Ministro."
              - "No proponer marcos comerciales o de cooperación con organismos vinculados al bloqueo estadounidense — la posición política es explícita y los framings vinculados a Washington serán rechazados; las vías legítimas de cooperación son Sur-Sur, ALBA-TCP, BRICS+, sistemas ONU y OPS / OMS."
