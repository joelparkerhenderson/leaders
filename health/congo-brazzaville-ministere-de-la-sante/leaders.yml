Parties prenantes du système de santé congolais (Brazzaville):
  - Notes sur le Ministre de la Santé et de la Population de la République du Congo (Brazzaville):
      - Status: Identité substantive du Ministre du MSP sous la présidence de Denis Sassou-Nguesso (PCT — Parti Congolais du Travail, au pouvoir 1979-1992 puis depuis 1997) à vérifier contre la Présidence (presidence.cg), le Premier Ministre, le site du Ministère (sante.gouv.cg) et l'Agence Congolaise d'Information (ACI). Les Dépêches de Brazzaville sont une source officielle de référence et Vox Congo apporte un éclairage complémentaire.
      - Implication: L'engagement sur la santé congolaise (Brazzaville) nécessite (i) la distinction non-négociable avec la République Démocratique du Congo (Kinshasa) — la confusion entre Congo-Brazzaville (capitale Brazzaville, ~6 millions d'habitants, PCT, francophone CEMAC) et Congo-Kinshasa (RDC, capitale Kinshasa, ~100 millions d'habitants, SADC) est très fréquente et embarrassante —, (ii) l'identification du titulaire actuel via les canaux officiels de Brazzaville, et (iii) la lecture de la cartographie hospitalière (CHU de Brazzaville, CHU de Pointe-Noire — la capitale économique pétrolière —, hôpitaux des douze départements).
      - Hook: paludisme, mpox (le Congo est dans la zone de transmission active du clade I et clade Ib qui circule en Afrique centrale), Ebola et Marburg en surveillance One Health (le bassin du Congo est un réservoir filovirus reconnu et le Congo participe à la surveillance régionale CEMAC), santé maternelle et infantile, NCDs (hypertension, diabète, drépanocytose endémique), tuberculose, VIH (partenaire PEPFAR et Fonds Mondial), nutrition, et coopération CEMAC-CEEAC-OIF en diplomatie sanitaire. La rente pétrolière finance une part de la capacité.
      - Tone: Ouvrir avec paludisme, mpox, Ebola/Marburg en One Health (le rôle régional est reconnu), MCH, NCDs, VIH et coopération CEMAC-CEEAC — priorités opérationnelles et lignes durables du MSP. Ne JAMAIS confondre Congo-Brazzaville et Congo-Kinshasa (RDC) — vérifier toujours le pays correct avant d'engager; les deux Congos sont des États souverains distincts avec des systèmes de santé, des partenaires et des structures politiques radicalement différents.
