Tanzanian health stakeholders / Wadau wa Mfumo wa Afya wa Tanzania:
  - Ministry of Health (Wizara ya Afya):
      - Hon. Mohamed Mchengerwa (CCM):
          - Title: Minister of Health, United Republic of Tanzania (since 17 November 2025)
          - Stakeholder engagement notes:
              - "Minister of Health since 17 November 2025 in President Samia Suluhu Hassan's post-election Cabinet reshuffle, following the 29 October 2025 General Election that returned CCM with a landslide majority; CCM; 46 years old at appointment; Member of Parliament for Rufiji Constituency in the Pwani Region; replaced Jenista Mhagama who was dropped from Cabinet in the November 2025 reshuffle and subsequently died at Dodoma on 11 December 2025."
              - "Family connection reported in The EastAfrican and Africanews: identified as son-in-law of President Hassan — politically distinctive context for a Cabinet appointment."
              - "Inherits the 2025/26 Tanzania Health Budget priorities established under his predecessor: 28,000 health workers recruitment, nine referral hospitals investment, AI investment, local pharmaceutical (drug) and ARV manufacturing — all framed amid donor-policy shifts including reduced USAID and other donor financing (per TanzaniaInvest coverage of the FY 2025/26 budget); ongoing engagement with the international medical tourism positioning announced in 2026 (Tanzania launched international health clinic to boost medical tourism, per Prokerala)."
              - "Owns Ministry of Health policy and budget, coordination with PORALG (President's Office Regional Administration and Local Government) on primary-care delivery, TMDA medicines regulation, NHIF and iCHF (improved Community Health Fund) insurance reform, the network of referral hospitals (Muhimbili National Hospital, KCMC Moshi, Bugando Medical Centre, Mbeya Zonal Referral Hospital), coordination with the Zanzibar Ministry of Health (Zanzibar operates a separate Ministry under semi-autonomous arrangements), and Tanzania's WHO Africa, SADC and East African Community (EAC) health positioning."
              - "Hook: 28,000 health-worker recruitment, nine-referral-hospital investment programme, ARV local manufacturing, AI in health (a Hassan-government priority), NHIF reform, mpox and other outbreak preparedness, post-donor-shift self-reliance positioning, and SADC / EAC cooperation land."
          - Tone advice:
              - "Open with health-worker recruitment, referral hospital investment, NHIF / iCHF reform, ARV manufacturing and SADC / EAC cooperation — these are the 2025/26 Tanzania Health Budget priorities and the political signature of the post-election Hassan cabinet."
              - "Do not assume single-actor MoH framing — PORALG operationally controls primary-care delivery via local government, and Zanzibar has a separate Ministry of Health with its own policy authority; framings must include PORALG and (for Zanzibar-affecting matters) Zanzibar-Ministry partners."
