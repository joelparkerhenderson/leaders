日本の医療システム関係者 / Japanese health system stakeholders:
  - Ministry of Health, Labour and Welfare (厚生労働省 Kōrōshō):
      - Ueno Kenichirō / 上野 賢一郎 (LDP):
          - Title: Minister of Health, Labour and Welfare (厚生労働大臣 Kōsei Rōdō Daijin) (since 21 October 2025)
          - Stakeholder engagement notes:
              - "Minister of Health, Labour and Welfare in the Sanae Takaichi Cabinet from 21 October 2025; LDP (自民党); took office at a time when Japan's medical-care, long-term-care and pharmaceutical-pricing systems are all under acute pressure from population ageing and labour shortage."
              - "Takaichi became Prime Minister in October 2025 succeeding Shigeru Ishiba, marking a change in LDP intra-party direction; Ueno's portfolio is one of the most operationally consequential in the new cabinet."
              - "Owns the next Shinryō Hōshū (medical fee schedule) revision cycle through the Chuikyo advisory council, MHLW policy on long-term care insurance (Kaigo Hoken), pharmaceutical pricing policy, vaccine and infectious-disease policy, workforce-import policy through the technical-trainee and Specified-Skilled-Worker visa frameworks, and pension policy."
              - "Sectoral context: severe shortage of medical and care workforce, hospital consolidation (regional medical care vision / 地域医療構想), drug pricing pressure on innovative therapies, the digital My Number Health Insurance Card rollout, and post-Covid MHLW credibility-rebuilding are recurring policy lines."
              - "Hook: Shinryō Hōshū revision, long-term care insurance reform, workforce import, pharmaceutical pricing, regional medical care planning (chiiki iryō kōsō), digital health (Online Shihō, マイナ保険証 My Number Health Insurance Card) land; pitches that ignore the Chuikyo / Diet-budget cycle do not land."
          - Tone advice:
              - "Open with Shinryō Hōshū revision, long-term care, workforce, pharmaceutical pricing and digital health (My Number Health Insurance Card) — these are the MHLW levers and the current Takaichi-cabinet operational priorities."
              - "Do not pitch as if MHLW were a single buyer or hospital operator — Japan's universal coverage is delivered by ~3,000 insurers contracting with predominantly private not-for-profit hospitals through uniform fees set via Chuikyo; MHLW sets the rules, not the contracts."
