Canadian health portfolio stakeholders / Acteurs du portefeuille santé canadien:
  - Health Canada / Santé Canada:
      - Marjorie Michel (LPC):
          - Title: Minister of Health / Ministre de la Santé (in the Mark Carney 28-member Cabinet, sworn in 2025)
          - Stakeholder engagement notes:
              - "Federal Minister of Health in the Mark Carney (LPC) 28-member Cabinet sworn in 2025 following the LPC's 2025 federal election win; LPC; born in Haiti; elected federal MP for Papineau, Quebec in 2025 — the seat previously held by Justin Trudeau."
              - "Pre-political background includes health-system and community-organisation work; entering the Health portfolio with a Quebec urban-Haitian-diaspora political base and an explicit Carney-government economic-policy framing of health."
              - "Reaffirmed in 2026 the federal commitment to drug safety, pharmaceutical-pricing reform and a new federal approach on drugs framed publicly as 'save lives, reduce cost and build the economy'; delivered remarks at C.D. Howe Institute in May 2026 on 'Health and Economic Prosperity: Opportunities for Canada'."
              - "Owns the federal share of the Canada Health Transfer and FPT (Federal-Provincial-Territorial) relationships, the Canadian Drug Agency (CDA-AMC, formerly CADTH), the post-Trudeau pharmacare and dental-care implementation envelopes, the federal role in non-insured health benefits for First Nations and Inuit (NIHB), and regulatory oversight of medicines and devices."
              - "Hook: pharmacare implementation, dental care, drug pricing, FPT health funding, Indigenous health (NIHB), federal medicines and devices regulation, AI in health, and the Carney health-and-economic-prosperity framing land; province-bypassing framings do not."
          - Tone advice:
              - "Lead with pharmacare and dental-care implementation, drug pricing reform, FPT funding, Indigenous health, and the health-economic-prosperity framing — these are the federal priorities of the Carney mandate and Michel's authored line."
              - "Do not pitch as if federal Health Canada were the operational buyer of services — Michel will route operational questions to provincial Ministers and emphasise that federal levers are framework and funding, not service delivery."
