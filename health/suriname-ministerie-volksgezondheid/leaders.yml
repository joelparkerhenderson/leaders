Surinaams gezondheidssysteem — belanghebbenden:
  - Ministerie van Volksgezondheid:
      - Notes on Minister van Volksgezondheid:
          - Status: De huidige identiteit van de Minister van Volksgezondheid in het tweede Santokhi-kabinet (beëdigd na de verkiezingen van 2025) moet nog worden bevestigd. Amar Ramadhin (VHP), die de portefeuille bezette van 2020 tot 2025, kan zijn behouden, vervangen, of opgevolgd — officiële Surinaamse regeringsmededelingen moeten worden geraadpleegd om de actualiteit vast te stellen.
          - Implication: Engagement op het Ministerie van Volksgezondheid niveau moet gerouteerd worden via de Permanente Vertegenwoordiger of Directeur van het Ministerie tot een substantief Minister publiekelijk wordt bevestigd en aan dit register toegevoegd.
