Parties prenantes du système de santé monégasque:
  - Département des Affaires Sociales et de la Santé:
      - Christophe Robino:
          - Title: Conseiller de Gouvernement-Ministre des Affaires Sociales et de la Santé (Government Councillor-Minister of Social Affairs and Health)
          - Stakeholder engagement notes:
              - "Conseiller de Gouvernement-Ministre des Affaires Sociales et de la Santé sous l'autorité du Ministre d'État (chef du gouvernement nommé par le Prince Souverain Albert II); l'architecture monégasque place un Conseiller-Ministre à la tête de chaque grand département gouvernemental sous l'autorité du Ministre d'État, qui à son tour répond au Prince Souverain; vérifier la titularité actuelle contre le Gouvernement Princier (gouv.mc), le Palais Princier (palais.mc), Monaco-Matin et Monaco Info."
              - "Owns la politique sanitaire monégasque, le Centre Hospitalier Princesse Grace (CHPG — l'hôpital public principal en cours de reconstruction sur le site historique), la Direction de l'Action Sanitaire (DASS), la Caisse de Compensation des Services Sociaux (CCSS) qui gère la couverture maladie obligatoire, la convention sanitaire bilatérale avec la France qui structure le recours au CHU Pasteur de Nice et à d'autres établissements français pour certaines spécialités, et la diplomatie OMS Europe, Conseil de l'Europe (Monaco est membre depuis 2004) et ONU."
              - "Hook: maladies non transmissibles (cardiovasculaires, oncologie — le CHPG a une réputation oncologique régionale), recherche médicale et le Centre Scientifique de Monaco, longévité et santé du vieillissement (Monaco a une des plus hautes espérances de vie au monde), santé mentale, recherche cardiologique (Institut Monégasque de Médecine Sportive), reconstruction du CHPG (projet à long terme), et coopération franco-monégasque sur les soins hautement spécialisés — atterrissent."
          - Tone advice:
              - "Ouvrir avec NCDs, oncologie CHPG, recherche médicale et Centre Scientifique de Monaco, longévité et santé du vieillissement, et coopération franco-monégasque — lignes durables du Département."
              - "Ne pas confondre Monaco et France (Monaco est un État souverain bien que la convention sanitaire bilatérale crée une interdépendance opérationnelle pour les soins spécialisés) ni ignorer la CCSS (Monaco est sur un modèle assurance-maladie obligatoire avec employeur-employé, distinct du modèle NHS britannique ou du modèle français Sécurité Sociale; framings NHS-pur seront corrigés)."
  - Notes sur Directeur DASS, Directeur CHPG et Président Commission Affaires Sociales du Conseil National:
      - Status: Identités substantives à vérifier contre gouv.mc et conseilnational.mc.
