Iraqi health stakeholders / أصحاب المصلحة في النظام الصحي العراقي:
  - Ministry of Health of Iraq (وزارة الصحة):
      - Dr. Saleh Mahdi al-Hasnawi (independent):
          - Title: Minister of Health of Iraq (since 28 October 2022, in the Mohammed Shia' al-Sudani government)
          - Stakeholder engagement notes:
              - "Minister of Health since 28 October 2022 in the Mohammed Shia' al-Sudani government formed after the prolonged government-formation crisis following the October 2021 election (Coordination Framework arrangement); psychiatrist; professor and public-health expert at the University of Kufa; independent politician; previously served as Minister of Health 2010-2014 in the Maliki government — returning to the portfolio with institutional memory and reform credentials."
              - "Operates in a continuing-recovery context: war-damaged infrastructure (particularly Nineveh, Anbar, Salah ad-Din), displaced populations and IDPs, ongoing reconstruction, and major international-partner engagement (WHO EMRO, World Bank, USAID, UNICEF, ICRC) for both rebuilding and ongoing humanitarian needs."
              - "Active 2026: Iraq launched the Dhamani digital health insurance platform and services (Iraqi News coverage) — flagship digital-and-financing reform of the al-Sudani term, designed to expand coverage and modernise claims; the Ministry has made positive progress in tackling drugs and antisocial behaviour (IINA News); conducted inspection visits to hospitals (Facebook coverage 2026); held meetings with international counterparts and partner agencies."
              - "Owns federal Ministry of Health policy, coordination with the Kurdistan Regional Government Ministry of Health (the KRG operates a separate Ministry under constitutional federalism), the Iraqi Drug Regulatory Authority, the Iraqi Centre for Disease Control, governorate Health Directorates (15 federal governorates plus 4 KRG governorates), federal teaching hospitals, the post-conflict reconstruction of Nineveh and Anbar health facilities, oncology and TB programmes, mental health, and WHO EMRO, Arab League and OIC health diplomacy."
              - "Recognised internationally: featured in JAMA Global Health profile 'Iraqi Health Minister Works to Reform, Restore Neglected System'; speaker at Global Forum on Urbanization and Health; UNESCO and Al-Rafidain Center for Dialogue profile."
              - "Hook: Dhamani digital health insurance rollout, oncology and TB programmes, post-conflict reconstruction in Nineveh / Anbar / Salah ad-Din, Iraqi Drug Authority reform, mental health (his clinical specialty), and federal-KRG coordination land."
          - Tone advice:
              - "Open with Dhamani digital health insurance, oncology, mental health, post-conflict reconstruction and federal-KRG coordination — these are his sustained authored lines and his psychiatry / public-health professional frame."
              - "Do not assume federal-Iraq uniformity — the KRG operates its own Ministry of Health independently under constitutional federalism, and Sunni-majority governorates (Anbar, Nineveh, Salah ad-Din) require post-conflict-recovery-specific framings distinct from southern and central Iraqi engagement."
