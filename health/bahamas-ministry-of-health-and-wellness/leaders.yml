Bahamian health stakeholders:
  - Ministry of Health and Wellness (MoHW):
      - Hon. Dr. Michael Darville (PLP):
          - Title: Minister of Health and Wellness (since September 2021)
          - Stakeholder engagement notes:
              - "Minister of Health and Wellness in the Philip Davis Progressive Liberal Party (PLP) government since the PLP victory in the September 2021 general election; medical doctor by training; long-serving PLP parliamentarian representing Pineridge constituency in Grand Bahama; The Bahamas is a constitutional parliamentary democracy with King Charles III as Head of State represented by the Governor-General."
              - "Owns MoHW policy and budget, the Princess Margaret Hospital in Nassau (the apex tertiary public facility), the Rand Memorial Hospital in Freeport on Grand Bahama, the Sandilands Rehabilitation Centre (psychiatric and rehabilitation), the Family Island clinic and community-health network spanning the 16 inhabited Family Islands (Abaco, Acklins, Andros, Berry Islands, Bimini, Cat Island, Crooked Island, Eleuthera, Exuma, Grand Bahama, Inagua, Long Island, Mayaguana, New Providence, Ragged Island, San Salvador), the Public Hospitals Authority (PHA) operations, the National Health Insurance Authority (NHIA) phased rollout (the NHI is a sustained PLP policy commitment), and CARICOM (Caribbean Community), CARPHA (Caribbean Public Health Agency) and PAHO diplomacy."
              - "Hook: National Health Insurance rollout (the central political and operational priority), primary-care strengthening, non-communicable diseases (the Bahamas has high obesity, diabetes, hypertension and cardiovascular disease burden — among the highest in the Caribbean), mental health and substance use, hurricane preparedness and post-Hurricane Dorian (2019) reconstruction for Abaco and Grand Bahama (a sustained challenge), air-medical evacuation and inter-island referral architecture (structural for the archipelago), cancer services and oncology referral to the US, and CARPHA-led regional cooperation — these all land."
          - Tone advice:
              - "Open with NHI rollout, NCDs, mental health, hurricane preparedness and reconstruction, air-medical evacuation, and CARPHA-CARICOM cooperation — these are durable MoHW priorities and the Davis-government signature lines."
              - "Do not treat the Bahamas as a single-island state (the archipelago structure with inter-island referral and air-medical evacuation is foundational to the system design), do not conflate with Jamaica or Trinidad (distinct sovereign CARICOM members with different economic, demographic and epidemiological profiles), and do not ignore the NHI rollout (a sustained PLP political commitment that frames most policy framings)."
