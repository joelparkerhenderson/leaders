Qatari health stakeholders / أصحاب المصلحة في النظام الصحي القطري:
  - Ministry of Public Health (وزارة الصحة العامة):
      - H.E. Mansoor bin Ebrahim bin Saad Al Mahmoud:
          - Title: Minister of Public Health of the State of Qatar (since 12 November 2024)
          - Stakeholder engagement notes:
              - "Minister of Public Health since 12 November 2024 by Emiri Decree of His Highness Sheikh Tamim bin Hamad Al Thani, succeeding H.E. Dr. Hanan Mohamed Al Kuwari (who served as Minister of Public Health 2016-2024 and now serves as Advisor to the Prime Minister for Public Health Affairs)."
              - "Pre-ministerial background distinctive among health portfolios: served as Chief Executive Officer of Qatar Investment Authority (QIA) from September 2018 to November 2024, when he was succeeded at QIA by Mohammed Al-Sowaidi; prior roles include CEO Qatar Museums, CEO Qatar Development Bank, and Director of the Investment Affairs Office for the Prime Minister and Minister of Foreign Affairs — an investment-and-finance background unusual for a Minister of Public Health, aligned with Qatar's sovereign-wealth-funded strategic-investment approach to health."
              - "Active 2025-2026: announced comprehensive reforms (Qatar Tribune); leads the National Health Strategy 2024-2030 implementation; maintains and extends the elevated international standing of Qatar's MoPH in WHO Executive Board engagement initiated by Dr. Al Kuwari (Qatar previously chaired the WHO Executive Board)."
              - "Owns MoPH policy and budget, the WHO Executive Board / WHO Eastern Mediterranean engagement, HMC (Hamad Medical Corporation) coordination, PHCC (Primary Health Care Corporation) coordination, Sidra Medicine coordination, QCHP (Qatar Council for Healthcare Practitioners) licensing, Qatar Red Crescent humanitarian-health partnership, and Qatar's WHO EMRO, GCC, BRICS+, ASEAN-GCC and OIC health diplomacy."
              - "Hook: National Health Strategy 2024-2030 implementation, healthtech and AI integration in HMC and Sidra, primary-care expansion via PHCC, health financing innovation and sovereign-wealth-funded investment, WHO multilateral diplomacy, and BRICS+ / GCC cooperation land."
          - Tone advice:
              - "Open with National Health Strategy 2024-2030, healthtech and AI, primary care, sovereign-wealth-funded investment in health, WHO multilateral diplomacy and BRICS+ / GCC cooperation — these align with his investment-and-finance background and Qatar's strategic-investment-in-health framing."
              - "Do not pitch as if Qatar were resource-constrained — Qatar's sovereign-wealth-backed health investment ecosystem provides distinctive options for innovation, biotech and digital health; framings that assume resource scarcity will be politically discordant with the Emir's Vision 2030 and the National Health Strategy 2024-2030."
