Učesnici crnogorskog zdravstvenog sistema:
  - Ministarstvo zdravlja:
      - Vojislav Šimun (PES):
          - Title: Ministar zdravlja (Minister of Health)
          - Stakeholder engagement notes:
              - "Ministar zdravlja u Vladi Milojka Spajića (PES — Pokret Evropa Sad!) od oktobra 2023, formiranoj nakon parlamentarnih izbora od 11. juna 2023; ljekar po obrazovanju; služi u kabinetu Predsjednika Vlade Spajića pod Predsjednikom Republike Jakovom Milatovićem (PES, pobjednikom predsjedničkih izbora 2023. protiv Mila Đukanovića čime je okončana njegova višedecenijska dominacija); provjerite tekuće stanje protiv gov.me i Vijesti."
              - "Owns politiku i budžet Ministarstva zdravlja, Klinički centar Crne Gore u Podgorici (vrhovna tercijarna ustanova), Specijalnu bolnicu za psihijatriju u Kotoru — Dobrota, opšte bolnice u Beranama, Cetinju, Nikšiću, Pljevljima, Baru, Bijelom Polju, Kotoru, Risnu (Institut Vrmac), domove zdravlja u 25 opština, Fond za zdravstveno osiguranje (FZO — obavezno osiguranje), Institut za javno zdravlje (IJZ — koordinator nadzora i javnog zdravlja), Agenciju za ljekove (CALIMS), i diplomatiju SZO Europa, pristupne pregovore sa EU (Crna Gora je najnapredniji kandidat u regionu — pregovori u završnoj fazi sa svim klasterima otvorenim), Berlinski proces, CEFTA i NATO (Crna Gora je članica NATO od 5. juna 2017)."
              - "Hook: harmonizacija sa zdravstvenim acquis-om EU (centralni prioritet jer su pregovori u završnoj fazi), reforma FZO i održivost finansiranja, sömentse koje se ne prenose (NCDs — kardiovaskularne, dijabetes, rak), mentalno zdravlje, onkologija i pristup specijalizovanim tretmanima (značajan odlazak pacijenata u Srbiju, Tursku i razvijenije zemlje EU za specijalizovane tretmane), digitalizacija i interoperabilnost, kadrovska politika (emigracija medicinskog osoblja u Njemačku i druge EU zemlje je hroničan problem), turistička medicina (priobalje), zdravstvena bezbednost i nadzor — sve ove linije slijeću."
          - Tone advice:
              - "Otvorite sa EU acquis-harmonizacijom, reformom FZO, NCDs, mentalnim zdravljem, onkologijom, kadrovskom politikom i digitalizacijom — to su linije Šimuna i prioriteti Vlade Spajić-PES-PES."
              - "Ne mješajte Crnu Goru sa Srbijom (Crna Gora je suverena država od referenduma 3. juna 2006, sa sopstvenom institucionalnom arhitekturom, članica NATO i kandidat za EU; framingovi koji impliciraju srpsku jurisdikciju biće politički neprihvatljivi) i prepoznajte EU pristupnu poziciju kao centralnu — najnapredniji kandidat u regionu."
  - Notes o Direktoru FZO, Direktoru Kliničkog centra Crne Gore, Direktoru Instituta za javno zdravlje i Predsjedniku Odbora za zdravstvo u Skupštini:
      - Status: Suštinski identiteti se verifikuju protiv gov.me i skupstina.me.
