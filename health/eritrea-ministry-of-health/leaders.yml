Eritrean health stakeholders:
  - Ministry of Health (MoH):
      - Amina Nurhussien:
          - Title: Minister of Health
          - Stakeholder engagement notes:
              - "Long-serving Minister of Health in the President Isaias Afwerki Cabinet (PFDJ single-party state); one of the longest-serving women cabinet ministers in the Horn of Africa; verify currency against shabait.com Ministry of Information communications and WHO Eritrea country office briefings, since cabinet announcements in Asmara are infrequent and external reporting is limited."
              - "Owns MoH policy and budget, Orotta National Referral Hospital and Halibet Hospital in Asmara, the zoba referral hospitals across the six zobas (Anseba, Debub, Gash-Barka, Maekel, Northern Red Sea, Southern Red Sea), the primary-care clinic network, EPHARMECOR procurement and pharmaceutical supply, the malaria-elimination drive (Eritrea has had recognised successes in reducing malaria burden), TB and HIV programmes, MCH programmes, and IGAD, WHO Africa and African Union health diplomacy."
              - "Hook: maternal and child health, malaria control and elimination drive, TB and TB/HIV coinfection, HIV continuity, NCDs, immunisation (Eritrea reports relatively strong coverage despite resource constraints), and IGAD regional cooperation land; large structural-reform framings will be filtered through a sovereignty-and-self-reliance lens consistent with the PFDJ ideological posture."
          - Tone advice:
              - "Open with maternal and child health, malaria, TB, immunisation, NCDs and IGAD cooperation — these are durable MoH priorities and align with the Afwerki government's self-reliance framing."
              - "Do not assume open international-NGO access or import Ethiopian framings — Eritrea is selective on INGO operations under the 2005 NGO regulation framework and is institutionally and politically distinct from Ethiopia despite the shared history; both will be politely corrected."
  - Notes on Director-General of MoH operations, Director-General of MoH regulatory functions, and Head of EPHARMECOR:
      - Status: Substantive identities to be verified against shabait.com and direct MoH communications; external visibility of senior Eritrean officials is limited.
