Sistema de salud panameño — partes interesadas:
  - Ministerio de Salud (MINSA):
      - Dr. Fernando Boyd Galindo (Realizando Metas):
          - Title: Ministro de Salud (Minister of Health) (en el gobierno de José Raúl Mulino desde el 1 de julio de 2024)
          - Stakeholder engagement notes:
              - "Ministro de Salud desde el 1 de julio de 2024 en el gobierno de José Raúl Mulino (Realizando Metas — coalición sucesora del cortizismo); cirujano dental, Doctor of Dental Surgery por la Universidad de Panamá (1979); especialidad en Periodoncia por la University of Pennsylvania (1983); perfil clínico-académico, no partidista tradicional."
              - "Defiende públicamente la integración del sistema de salud (MINSA + CSS — Caja de Seguro Social), una agenda política central del mandato Mulino; en intervenciones recientes ha hablado de 'llevar al patio de la casa la atención de salud' en la transformación de la atención primaria, frase recurrente en su comunicación pública."
              - "Bajo presión presupuestal explícita: 'En muchos hospitales tenemos solo para avanzar 6 meses' (declaración a La Prensa Panamá en el ciclo presupuestario 2026) — la gestión 2026 está marcada por urgencia fiscal y priorización de medicamentos, especialidades y vacantes para internos médicos."
              - "Posición pública en la Asamblea Nacional sobre cuestionamientos de gestión: 'No encubrimos a nadie' (La Estrella, sobre presunto encubrimiento en denuncias) — postura defensiva ante interpelaciones, sin renuncia."
              - "Owns la rectoría del sistema, integración con CSS, política farmacéutica, vacancias para internos médicos, ICGES (Instituto Conmemorativo Gorgas), atención primaria, salud fronteriza (Darién — migración irregular), y articulación con OPS / OMS en respuesta a brotes."
              - "Hook: integración MINSA-CSS, atención primaria comunitaria, medicamentos, ICGES research, salud fronteriza Darién, salud materno-infantil, y modernización hospitalaria aterrizan."
          - Tone advice:
              - "Abrir con integración MINSA-CSS, atención primaria, presión presupuestal y modernización — son los frames discursivos sostenidos del mandato Boyd Galindo y sus líneas autorales."
              - "No proponer marcos que ignoren la CSS — los pitches deben respetar la dualidad operativa del sistema y la autonomía estatutaria de la Caja de Seguro Social."
