Federated States of Micronesia health stakeholders:
  - Notes on Secretary of the Department of Health and Social Affairs of the Federated States of Micronesia:
      - Status: Identity of the current Secretary of the DHSA under the cabinet of President Wesley Simina (in office since 11 May 2023 after election by Congress) to be verified against gov.fm and Kaselehlie Press.
      - Implication: Engagement on FSM health requires (i) identification of the current Secretary via official channels in Palikir on Pohnpei, (ii) recognition of the federal structure with four distinct States — Pohnpei, Chuuk, Kosrae and Yap — each with its own Governor and State Department of Health Services operating with substantial autonomy under the FSM Constitution; framings that assume centralised federal monopoly will be inaccurate, (iii) the renewed Compact of Free Association (COFA) with the United States signed in 2023 and approved in March 2024, providing ~$3.3 billion over 20 years (2024-2043), continued US medical-system access for FSM citizens including via Hawaii and Guam referral, and US Public Health Service support, and (iv) the very wide-spread geography across the central-Pacific archipelago (~600 islands across more than 2,500 km of ocean) creating substantial inter-state and inter-island logistical challenges.
      - Hook: NCDs (very high obesity, diabetes, hypertension), tuberculosis (a sustained burden — Chuuk has historical TB-MDR clusters), maternal-and-child health, COFA-financed health architecture and US-Hawaii-Guam referral pathway, climate-and-health (low-lying atoll states in Chuuk and Yap; sea-level rise existential), water and sanitation, mental health, immunisation, dengue, leptospirosis, and PIF-PSIDS cooperation. State-level health-administration variability is significant (Chuuk has different challenges from Yap).
      - Tone: Open with COFA-renewal architecture, NCDs, TB, MCH, US-referral pathway, climate-and-health and PIF cooperation — durable lines. Recognise the four-state federal structure with substantial State autonomy (framings that assume federal monopoly will need correction) and the COFA US-bilateral architecture as defining feature.
