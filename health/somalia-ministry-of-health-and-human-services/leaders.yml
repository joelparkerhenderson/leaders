Somali health stakeholders:
  - Federal Ministry of Health and Human Services (MoHHS):
      - Dr. Ali Haji Adam Abubakar:
          - Title: Federal Minister of Health and Human Services
          - Stakeholder engagement notes:
              - "Federal Minister of Health and Human Services in the Hassan Sheikh Mohamud (HSM) administration; medical doctor; serving in a security-affected federal cabinet under the Office of Prime Minister Hamza Abdi Barre (or successor — verify); verify currency against villasomalia.gov.so, opm.gov.so and the Federal MoHHS press communications."
              - "Owns FGS MoHHS policy and budget, Banadir Regional Hospital, Erdogan Research and Training Hospital (Turkish-built and operated under partnership) and other Mogadishu federal-controlled facilities, coordination with the Federal Member State (FMS) Ministries of Health — Puntland, Jubaland, South West, Galmudug, Hirshabeelle — donor coordination (WHO, UNICEF, Global Fund, Gavi, World Bank, EU, FCDO, USAID, Turkish bilateral, Qatari bilateral), the Essential Package of Health Services (EPHS) rollout, polio surveillance and immunisation, mpox and cholera outbreak response, and African Union, IGAD and Arab League health diplomacy."
              - "Hook: primary health care and EPHS rollout, polio (Somalia has had circulating vaccine-derived poliovirus events and remains a surveillance priority), immunisation, mpox and outbreak preparedness, cholera control, maternal-and-child mortality reduction, nutrition (sustained drought and conflict drive food insecurity), and federal-state coordination — these all land."
          - Tone advice:
              - "Open with EPHS, polio and immunisation, outbreak preparedness, maternal-and-child mortality, nutrition and federal-state coordination — these are MoHHS priorities under the HSM administration."
              - "Do not assume unitary jurisdiction or open security access — the FGS-FMS distribution of authority under the Provisional Constitution and the security situation in South-Central Somalia (Al-Shabaab presence in rural areas) are central to feasibility of any framing."
  - Notes on Federal Member State Ministers of Health (Puntland, Jubaland, South West, Galmudug, Hirshabeelle):
      - Status: Each FMS has its own Minister of Health operating semi-autonomously under the federal architecture; substantive identities to be verified against each FMS Presidency website and regional press (Garowe Online for Puntland; Goobjoog for Jubaland; Hiiraan Online; Radio Dalsan).
  - Notes on Somaliland Ministry of Health Development (MoHD):
      - Status: Somaliland declared independence in 1991 and is not internationally recognised, but operates as a substantive de facto administration in the north (Hargeisa-based) with its own Minister of Health Development; engagement on northern Somali health requires acknowledging this de facto duality and using the Somaliland MoHD as the operational counterpart for territory it administers (Awdal, Maroodi Jeex, Togdheer, Sahil, Sanaag and contested Sool); verify currency against somaliland.gov.so.
