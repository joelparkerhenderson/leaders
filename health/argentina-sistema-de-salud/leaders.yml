Sistema de salud argentino — partes interesadas:
  - Ministerio de Salud:
      - Mario Iván Lugones (LLA):
          - Title: Ministro de Salud (Minister of Health) (en el gobierno de Javier Milei, LLA)
          - Stakeholder engagement notes:
              - "Ministro de Salud en el gobierno de Javier Milei (La Libertad Avanza, gobierno asumido el 10 de diciembre de 2023); médico, especialista en Cardioangiología y Salud Pública; egresado de la Universidad de Buenos Aires (1972); miembro de la Sociedad Argentina de Cardiología y otras organizaciones del sector salud."
              - "Defendió públicamente la salida formal de Argentina de la Organización Mundial de la Salud — decisión emblemática del gobierno Milei en política sanitaria internacional; salió a dar explicaciones tras el anuncio formal en 2026."
              - "Anunció en mayo 2026 un programa nacional para diagnóstico y tratamiento del ACV (accidente cerebrovascular) en Argentina; en abril 2026 declaró 'Hoy PAMI está pagando, la plata llegó' — política emblemática sobre la sostenibilidad del PAMI."
              - "Participó en Argentina Week en Nueva York (marzo 2026) presentando propuestas argentinas en investigación clínica, producción farmacéutica y servicios de salud de alta calidad; preside el Consejo Federal de Salud (COFESA) con ministros provinciales."
              - "Hook: política farmacéutica, PAMI, Obras Sociales, salida de la OMS, programas verticales (ACV, oncología), inversión extranjera y exportación de servicios sanitarios aterrizan; pitches centrados en sistema público integrado no aterrizan dentro del marco de desregulación."
          - Tone advice:
              - "Abrir con desregulación, inversión privada, programas focalizados y reforma de PAMI / Obras Sociales — son las líneas del gobierno Milei y el marco discursivo de Lugones en sus apariciones públicas."
              - "No pitchear como si la OMS o el sistema público fueran el marco institucional — el gobierno Milei se ha alejado explícitamente de ambos; framings de 'cobertura universal' al estilo OPS / OMS serán políticamente disonantes."
