Sistema de salud costarricense — partes interesadas:
  - Ministerio de Salud:
      - Notes on Ministerio de Salud:
          - Status: La administración de Laura Fernández (PPSD) asumió la Presidencia de Costa Rica el 8 de mayo de 2026 tras ganar la elección general de febrero 2026 (y segunda vuelta en abril 2026); Fernández había sido Ministra de la Presidencia y Planificación bajo Rodrigo Chaves, quien le sucede como Ministro de la Presidencia y Hacienda en el nuevo gobierno. La identidad confirmada del nuevo Ministro/a de Salud bajo Fernández no está aún registrada en este repositorio; Mary Munive (PPSD, Vicepresidenta y Ministra de Salud bajo Chaves 2022-2026) finalizó su período el 8 de mayo de 2026.
          - Implication: Hasta confirmar la designación con fuentes oficiales, el engagement debe rutearse vía la Presidencia (donde Rodrigo Chaves ocupa Presidencia y Hacienda), la Presidencia Ejecutiva de la Caja Costarricense de Seguro Social (CCSS, pilar operativo del sistema), y la rectoría del Ministerio de Salud a través de su Viceministerio técnico. La CCSS opera con autonomía estatutaria y es el actor central del sistema; cualquier engagement sobre prestaciones, EBAIS, hospitales o aseguramiento debe involucrar a la Presidencia Ejecutiva CCSS.
