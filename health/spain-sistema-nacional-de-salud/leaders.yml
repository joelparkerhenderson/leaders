Sistema Nacional de Salud stakeholders:
  - Ministerio de Sanidad (Ministry of Health):
      - Mónica García Gómez (Sumar / Más Madrid):
          - Title: Ministra de Sanidad (Minister of Health) (desde 21 de noviembre de 2023)
          - Stakeholder engagement notes:
              - "Anestesióloga del Hospital 12 de Octubre desde 2004; Licenciada en Medicina y Cirugía por la Universidad Complutense de Madrid; Máster en Gestión Clínica por la Escuela Nacional de Sanidad."
              - "Toma de posesión como Ministra de Sanidad el 21 de noviembre de 2023 en el tercer gobierno Sánchez tras la entrada de Sumar en la coalición, en representación de Más Madrid; nacida en Madrid en 1974."
              - "Anunció en diciembre de 2025 una norma a principios de 2026 para limitar la colaboración público-privada en Sanidad — la línea más definitoria del mandato y la principal fricción política con las CCAA gobernadas por el PP."
              - "Lideró la posición española en la 79ª Asamblea Mundial de la Salud en Ginebra (mayo 2026) impulsando una alianza Europa-América sobre atención primaria; el 40 aniversario de la Ley General de Sanidad (abril 2026) marcó el aniversario simbólico de su mandato."
              - "Como Presidenta nata del Consejo Interterritorial del SNS, articula la negociación CCAA-Estado sobre cartera común de servicios, financiación finalista (kö-tipo) y Estrategia de Salud Digital del SNS."
              - "Hook: atención primaria, salud pública, regulación de la colaboración público-privada, salud mental y sostenibilidad financiera del SNS aterrizan; propuestas que olvidan el marco autonómico o priorizan el sector privado no aterrizan."
          - Tone advice:
              - "Liderar con atención primaria, salud pública y refuerzo de lo público — son las líneas de su mandato y de Más Madrid / Sumar en sanidad."
              - "No proponer marcos centrados en el sector privado o que tensen con las CCAA del PP — son su línea política explícita y la propuesta será rechazada de raíz."
      - Javier Padilla Bernáldez:
          - Title: Secretario de Estado de Sanidad (Secretary of State for Health) (desde 28 de noviembre de 2023)
          - LinkedIn: https://es.linkedin.com/in/padillajavier
          - Stakeholder engagement notes:
              - "Nombrado Secretario de Estado de Sanidad por Real Decreto 986/2023 de 28 de noviembre de 2023; médico de familia con trayectoria principalmente en centros de salud de la Comunidad de Madrid."
              - "Perfil intelectual reconocido en salud pública y atención primaria; autor habitual en medios y libros sobre determinantes sociales y política sanitaria; pareja política natural de García en la articulación del programa Sumar / Más Madrid en Sanidad."
              - "La Secretaría de Estado dirige las funciones de salud pública, coordinación interterritorial, alta inspección, planificación sanitaria, desarrollo y actualización de la cartera común de servicios del SNS, ordenación profesional, política farmacéutica (precio y financiación de medicamentos), y coordinación de la política de trasplantes (ONT)."
              - "Cierre del ciclo de la pandemia y reforma de la salud pública estatal son hilos visibles de su mandato: reforzar el papel del Centro Nacional de Epidemiología, la coordinación con AEMPS, y la articulación con la red europea (HMA, ECDC)."
              - "Hook: atención primaria, salud pública estatal, política farmacéutica (precio y financiación), cartera común de servicios y ordenación profesional aterrizan; propuestas de digitalización que omitan el marco autonómico no aterrizan."
          - Tone advice:
              - "Liderar con atención primaria, determinantes sociales, política farmacéutica equitativa y salud pública estatal reforzada — son sus líneas autorales y de la Secretaría."
              - "No plantear propuestas de salud digital o ordenación profesional sin haber leído el marco autonómico — Padilla conoce el detalle competencial y las propuestas centralistas serán rebotadas."
  - Agencia Española de Medicamentos y Productos Sanitarios (AEMPS):
      - María Jesús Lamas Díaz:
          - Title: Directora, Agencia Española de Medicamentos y Productos Sanitarios
          - Stakeholder engagement notes:
              - "Directora de la AEMPS confirmada y vigente en orden de 21 de enero de 2026; farmacéutica de formación; trayectoria previa en la propia AEMPS antes de asumir la dirección."
              - "Preside el Management Group de la red de Heads of Medicines Agencies (HMA) de la UE — proyección europea inusual para una dirección de la AEMPS y palanca de influencia en la red regulatoria europea."
              - "La AEMPS regula medicamentos de uso humano y veterinario, productos sanitarios, cosméticos y productos de cuidado personal; autoriza ensayos clínicos; coordina farmacovigilancia y vigilancia de productos sanitarios."
              - "Posición pública reciente: Europa tiene potencial para ser líder en I+D — eje del mandato reciente de la AEMPS sobre competitividad regulatoria, MDR / IVDR y reforma farmacéutica europea."
              - "Hook: regulación de productos sanitarios (MDR/IVDR), ensayos clínicos, reforma farmacéutica europea, autorización condicional, terapias avanzadas (ATMP) y farmacovigilancia aterrizan; su rol HMA hace que las propuestas con dimensión europea sean naturalmente bienvenidas."
          - Tone advice:
              - "Liderar con dimensión europea (HMA, EMA), reforma farmacéutica europea, terapias avanzadas y competitividad regulatoria de la UE — son los ejes de su agenda autoral y la palanca HMA."
              - "No proponer marcos exclusivamente nacionales sin engranaje con la red europea — Lamas opera en HMA y los marcos puramente domésticos serán reformulados en clave europea."
  - Instituto de Salud Carlos III (ISCIII):
      - Marina Pollán:
          - Title: Directora, Instituto de Salud Carlos III
          - Stakeholder engagement notes:
              - "Directora del ISCIII; epidemióloga; trayectoria de investigación en el Centro Nacional de Epidemiología (CNE), parte estructural del ISCIII; perfil científico-académico al frente del instituto."
              - "El ISCIII actúa como entidad pública de investigación adscrita al Ministerio de Sanidad: financia la investigación biomédica (Acción Estratégica en Salud), gestiona el CNE y el Centro Nacional de Microbiología, y coordina la Red Española de Agencias de Evaluación de Tecnologías Sanitarias (RedETS)."
              - "Coordinadora reciente de iniciativas de vigilancia epidemiológica post-pandemia y de fortalecimiento de la red CIBER (centros de investigación biomédica en red)."
              - "Hook: financiación de investigación biomédica, vigilancia epidemiológica, evaluación de tecnologías sanitarias (RedETS), CIBER, y colaboración con universidades y hospitales académicos aterrizan."
          - Tone advice:
              - "Liderar con investigación biomédica, epidemiología, vigilancia post-pandemia y evaluación de tecnologías sanitarias — son las líneas autorales del ISCIII y su propio perfil científico."
              - "No proponer marcos centrados exclusivamente en innovación industrial o vendedor — su lente es academia y salud pública; el lenguaje vendor-céntrico será reformulado en clave científica."
  - Organización Nacional de Trasplantes (ONT):
      - Beatriz Domínguez-Gil González:
          - Title: Directora General, Organización Nacional de Trasplantes (desde 2017; renovada por Resolución de 19 de mayo de 2026 publicada en BOE)
          - Stakeholder engagement notes:
              - "Directora General de la ONT desde 2017, sucediendo a Rafael Matesanz tras 28 años al frente; doctora en Medicina, especialista en Nefrología; integrada en el equipo de la ONT como facultativo durante más de una década antes de la dirección."
              - "Renovación publicada en BOE el 19 de mayo de 2026 (resolución de la Subsecretaría sobre la convocatoria de libre designación de 16 de febrero de 2026) — continuidad confirmada con horizonte plurianual."
              - "Expresidenta de la European Donation and Transplant Coordination Organization (EDTCO) y consejera europea de la International Transplantation Society — la ONT es referencia internacional ('modelo español') y Domínguez-Gil su cara académica e internacional."
              - "Owns el sistema español de donación y trasplantes — primer país del mundo en tasa de donación por millón de habitantes desde principios de los 1990s; coordina los equipos de trasplante regionales, mantiene el registro nacional, y representa a España en redes europeas (CoE, EU FACT)."
              - "Hook: ampliación de la donación en asistolia (DCD), trasplante pediátrico, donación de vivo, gestión del registro nacional, y proyectos europeos sobre células y tejidos aterrizan; propuestas que choquen con el 'modelo español' no aterrizan."
          - Tone advice:
              - "Liderar con donación en asistolia, modelo español, dimensión europea y resultados de tasa de donación — son su discurso autoral y la palanca académica de la ONT."
              - "No proponer marcos que rompan la coordinación nacional o introduzcan lógica de mercado en la donación — el modelo español es altruista y coordinado, y cualquier framing comercial será rebotado."
  - Cortes Generales — Comisión de Sanidad del Congreso de los Diputados:
      - Agustín Santos Maraver (Sumar):
          - Title: Presidente, Comisión de Sanidad del Congreso de los Diputados (XV Legislatura)
          - Stakeholder engagement notes:
              - "Diputado de Sumar; número dos de la lista de Sumar en las elecciones generales de julio 2023; ex Embajador de España ante Naciones Unidas — perfil de diplomático y política exterior, no clínico."
              - "Elegido Presidente de la Comisión de Sanidad del Congreso con 19 votos; Mesa configurada como paritaria y bipartidista — Modesto Pose Mesura (PSOE) Vicepresidente Primero y Elvira Velasco Morillo (PP) Vicepresidenta Segunda."
              - "Su presidencia da a Sumar la palanca parlamentaria coherente con la titularidad de la cartera de Sanidad (García) — eje político común sobre atención primaria, salud pública y regulación público-privada."
              - "Hook: comparecencias parlamentarias sobre cartera común de servicios, salud pública, salud digital, política farmacéutica y financiación sanitaria son la palanca natural; las posiciones de Sumar / Más Madrid sobre lo público marcan la línea editorial de la Comisión."
          - Tone advice:
              - "Liderar con cartera común de servicios, salud pública, atención primaria y dimensión internacional (su trayectoria ONU) — son sus ejes naturales y los de Sumar."
              - "No tratar la Comisión como neutral entre Gobierno y oposición — la presidencia es de Sumar y el lenguaje político de defensa de lo público se va a usar; framings vendor-céntricos serán cuestionados públicamente."
