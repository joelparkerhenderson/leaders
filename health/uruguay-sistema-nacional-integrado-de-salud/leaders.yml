Sistema Nacional Integrado de Salud (Uruguay) — partes interesadas:
  - Ministerio de Salud Pública (MSP):
      - Dra. Cristina Lustemberg (FA):
          - Title: Ministra de Salud Pública (Minister of Public Health) (desde el 1 de marzo de 2025)
          - Stakeholder engagement notes:
              - "Ministra de Salud Pública desde el 1 de marzo de 2025 en el gobierno de Yamandú Orsi (Frente Amplio), juramentada el día de la asunción presidencial tras la victoria del FA en las elecciones de noviembre 2024; pediatra de profesión; previamente diputada del Frente Amplio."
              - "Definió equipo completo del MSP y de ASSE al asumir el cargo — uno de los primeros gabinetes técnicos articulados del gobierno Orsi, con conformación pública anunciada por Ámbito."
              - "Presentó conjuntamente con la OPS el Informe Anual 2025 destacando avances en salud en Uruguay (10 de abril de 2026) — alto perfil regional y multilateral; representó al Uruguay en foros panamericanos."
              - "Owns la rectoría del Sistema Nacional Integrado de Salud (SNIS), FONASA, ASSE (Administración de los Servicios de Salud del Estado), JUNASA, los contratos con IAMC mutualistas, la política de primera infancia (su especialidad pediátrica), salud mental, y el Fondo Nacional de Recursos para medicamentos de alto costo."
              - "Hook: SNIS reform, primera infancia (Estrategia Nacional para la Infancia y la Adolescencia), salud mental, FONASA sostenibilidad, IAMC contratos, medicamentos de alto costo (Fondo Nacional de Recursos) aterrizan."
          - Tone advice:
              - "Abrir con SNIS, primera infancia, salud mental y FONASA — son las líneas Frente Amplio del nuevo gobierno y su área de especialización pediátrica."
              - "No tratar ASSE e IAMC como si fueran lo mismo — son dos pilares con cultura institucional distinta dentro del SNIS unificado; el reconocimiento del dual public-mutualist es estructural."
