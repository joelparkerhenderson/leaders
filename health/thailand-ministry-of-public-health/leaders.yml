Thai health stakeholders:
  - Ministry of Public Health (กระทรวงสาธารณสุข):
      - Notes on Minister of Public Health:
          - Status: The second Anutin Charnvirakul (Bhumjaithai) cabinet was royally endorsed and sworn in on 6 April 2026 at Dusit Palace, following Anutin's re-election as 32nd Prime Minister of Thailand on 19 March 2026 with 293 House votes after the February 2026 snap election. The 35-member cabinet is shared between Bhumjaithai (the larger partner, with 192 seats) and Pheu Thai (junior partner, with 74 seats), with 16 backing parties in total. The substantive identity of the Minister of Public Health in the second Anutin cabinet should be verified against thaigov.go.th and contemporary Bangkok Post / The Nation Thailand coverage. Somsak Thepsuthin (Pheu Thai) had served as Minister of Public Health under the earlier Srettha Thavisin and Paetongtarn Shinawatra governments and introduced the Decade-Long Strategy to Enhance Thailand's Healthcare Workforce; under the new Anutin-Bhumjaithai-led arrangement the portfolio likely transferred to a Bhumjaithai or other coalition appointee.
          - Implication: Engagement on Thai health-policy matters should be routed via the Permanent Secretary MoPH, the Secretary-General NHSO (the UCS single-payer administrator), and MoPH Department-level Director-Generals until the substantive Minister of Public Health is publicly confirmed and added to this register. The coalition arithmetic and political-cycle volatility through 2025-2026 (Srettha removal August 2024; Paetongtarn removal mid-2025; Anutin first cabinet from September 2025; Anutin second cabinet from April 2026) suggest continued political volatility on Health-related decisions during the early Anutin II period.
