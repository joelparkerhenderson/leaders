Parties prenantes du système de santé djiboutien:
  - Ministère de la Santé (MSP):
      - Dr Ahmed Robleh Abdilleh (RPP-UMP):
          - Title: Ministre de la Santé (Minister of Health)
          - Stakeholder engagement notes:
              - "Ministre de la Santé du gouvernement de Djibouti sous la présidence d'Ismaïl Omar Guelleh (RPP-UMP, au pouvoir depuis 1999); médecin; petit cabinet ministériel d'un État de moins d'un million d'habitants à forte concentration urbaine autour de Djibouti-Ville; vérifier la titularité contre le Secrétariat Général du Gouvernement, La Nation et l'Agence Djiboutienne d'Information."
              - "Owns la politique et le budget du MSP, l'Hôpital Général Peltier (référence à Djibouti-Ville), l'Hôpital Cheiko, l'Hôpital Bouffard (français, sous accord bilatéral), les centres médicaux communautaires (CMC) des cinq régions (Ali Sabieh, Arta, Dikhil, Obock, Tadjourah) plus Djibouti-Ville, la CAMME (centrale d'achat de médicaments), l'INSPD (institut de santé publique), la coordination avec l'Hôpital Bouffard (Service de Santé des Armées français), et la diplomatie sanitaire IGAD, Union Africaine, Ligue Arabe et OMS AFRO."
              - "Hook: paludisme et lutte vectorielle, tuberculose et TB-VIH, VIH (Djibouti est partenaire PEPFAR), santé maternelle et infantile, NCDs, urgences sanitaires de la Corne de l'Afrique (frontière éthiopienne-érythréenne, port stratégique pour l'aide humanitaire), nutrition, et coopération avec les bases militaires alliées (Camp Lemonnier US, base française, base chinoise) sur la sécurité sanitaire et la surveillance maritime atterrissent."
          - Tone advice:
              - "Ouvrir avec paludisme, TB, VIH, santé maternelle et infantile, NCDs, urgences régionales et coopération militaire-sanitaire — ce sont les priorités durables du MSP et le contexte stratégique de Djibouti."
              - "Ne pas importer des framings éthiopiens ou somaliens — Djibouti est sovereignement distinct, de très petite taille, à forte présence francophone et avec une économie liée au port et aux bases; les framings de pays voisin seront poliment redressés."
  - Notes sur Secrétaire Général MSP, Directeur de la CAMME, Directeur INSPD et Président de la Commission Santé de l'Assemblée Nationale:
      - Status: Identités substantives à vérifier contre le Secrétariat Général du Gouvernement, les communications du MSP et les attributions de commission à l'Assemblée Nationale.
