Bosnian and Herzegovinian health stakeholders / BiH zdravstveni sistem — interesne strane:
  - Federal Ministry of Health, Federation of Bosnia and Herzegovina (Federalno ministarstvo zdravstva FBiH):
      - Nediljko Rimac (HDZ BiH-aligned):
          - Title: Federal Minister of Health, Federation of Bosnia and Herzegovina (per official Federal Ministry of Health website, currency to 25 March 2026)
          - Stakeholder engagement notes:
              - "Federal Minister of Health of the Federation of Bosnia and Herzegovina per the official Federal Ministry of Health website fbihvlada.gov.ba (last updated 25 March 2026); HDZ BiH-aligned by the cantonal-ethnic distribution arrangements of the post-2022-election coalition government in the Federation; medical-administrative background."
              - "Owns the Federal-level Ministry of Health policy (FBiH-entity-level only, not state-level), coordination with the 10 Cantonal Ministries of Health and their Cantonal Health Insurance Funds (Una-Sana, Posavski, Tuzla, Zenica-Doboj, Bosansko-Podrinjski, Srednjobosanski, Hercegovačko-Neretvanski, Zapadno-Hercegovački, Sarajevski, Kanton 10 — Hercegbosanski), articulation with the Republika Srpska Minister of Health and Social Welfare on cross-entity matters, the Brčko District health services, and the State-level Council of Ministers on EU-accession matters and pharmaceutical regulation."
              - "Hook: EU accession health-acquis alignment under Chapter 28 (consumer and health protection), pharmaceutical regulation harmonisation between FBiH, RS and Brčko, hospital-sector financing reform, oncology and cardiology centres at UKCS Sarajevo and UKC Banja Luka, Sinopharm and other Chinese investment in BiH health (Sarajevo Times coverage of multi-million-dollar Chinese investment), and SEEHN (South-Eastern European Health Network) regional cooperation land."
          - Tone advice:
              - "Open with EU acquis alignment, UKCS and UKC Banja Luka centres of excellence, cantonal-coordination and pharmaceutical regulation harmonisation — these are the federal-level (FBiH-entity-level) levers within Rimac's competence under the Dayton constitutional structure."
              - "Do not pitch as if BiH were a single national customer — the Dayton-era fragmentation across two entities (FBiH and RS), ten cantons inside FBiH, Brčko District separate, and the State-level Council of Ministers with limited health competence is structural; framings must respect this constitutional asymmetry and the political-ethnic complexity of cross-entity coordination."
