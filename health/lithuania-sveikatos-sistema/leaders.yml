Lietuvos sveikatos sistema — suinteresuotosios šalys:
  - Sveikatos apsaugos ministerija (SAM):
      - Marija Jakubauskienė:
          - Title: Sveikatos apsaugos ministrė (Minister of Health) (nuo 2024 m. gruodžio 12 d.)
          - Stakeholder engagement notes:
              - "Sveikatos apsaugos ministrė nuo 2024 m. gruodžio 12 d., prisaikdinta Lietuvos Respublikos Seime; akademinė karjera — biomedicinos mokslų daktarė, asocijuota profesorė ir Vilniaus universiteto Medicinos fakulteto Sveikatos mokslų instituto direktorė iki ministrės kadencijos."
              - "Užėmusi pareigas po 2024 m. spalio Seimo rinkimų ir suformuotos koalicinės vyriausybės; politinis kontekstas reiškia trumpą kadenciją ir prioritetinę veiklą per pirmuosius dvejus metus."
              - "Owns Valstybinės ligonių kasos (VLK) biudžeto derybas su Sveikatos apsaugos ministerija ir socialiniais partneriais, paslaugų krepšelio peržiūrą, Valstybinės vaistų kontrolės tarnybos (VVKT) ir Higienos instituto priežiūrą, EU lėšų (RRF) panaudojimą sveikatos sektoriuje."
              - "Aktyvi Baltijos sveikatos politikos dialoge — 2026 m. gegužės mėnesį Vilniuje vyko 20-asis Baltijos politinis dialogas, sutelkęs Estijos ir Latvijos sveikatos ministerius; regioninė koordinacija yra ministrės darbotvarkės dalis."
              - "Aktyvi tarptautinėje politikoje: oficialūs vizitai į Japoniją; reagavimas į Hantaviruso atvejus regione kaip viešosios sveikatos politikos rodiklis."
              - "Hook: VLK paslaugų krepšelis, slaugos ir gydytojų trūkumas, regioninių ligoninių konsolidacija, e. sveikata, Baltijos bendradarbiavimas (Latvija, Estija) ir RRF investicijos nuleidžia; pitch, kuris ignoruoja VLK kaip pirkėją, nenuleidžia."
          - Tone advice:
              - "Pradėk nuo VLK krepšelio, gydytojų trūkumo, regioninių ligoninių, e. sveikatos ir Baltijos bendradarbiavimo — tai centrinės politinės linijos su trumpu kadencijos laikrodžiu."
              - "Nesiūlyk centralizuotos ministerijos kaip pirkėjo — Lietuva veikia per VLK kaip vienintelį PSD pirkėją; framingai, ignoruojantys VLK, bus pataisyti į teisingą architektūrą."
