Sistema de salud mexicano — partes interesadas:
  - Secretaría de Salud:
      - David Kershenobich Stalnikowitz:
          - Title: Secretario de Salud (Secretary of Health) (desde 1 de octubre de 2024)
          - Stakeholder engagement notes:
              - "Secretario de Salud desde 1 de octubre de 2024, posesionado simultáneamente con el inicio del sexenio de Claudia Sheinbaum (Morena); médico internista, gastroenterólogo y hepatólogo; egresado de la Facultad de Medicina de la UNAM; doctorado en Medicina por la Universidad de Londres."
              - "Carrera de referencia en hepatología — Director General del Instituto Nacional de Ciencias Médicas y Nutrición Salvador Zubirán durante muchos años; figura académica con alta credibilidad clínica internacional, contraste con perfiles políticos del sexenio anterior (López-Gatell, Alcocer)."
              - "Equipo principal anunciado al inicio del gabinete: Eduardo Clark García Dobarganes como Subsecretario de Integración y Desarrollo del Sector Salud; Alejandro Svarch Pérez como Director General — anuncio formal en la cuenta oficial de Salud México."
              - "Owns la rectoría sanitaria federal, IMSS-Bienestar (federal-estatal con convenios), política farmacéutica vía COFEPRIS y compras consolidadas, los once Institutos Nacionales de Salud, vacunación universal, y la respuesta a sarampión y enfermedades emergentes — particularmente con el Mundial de Fútbol 2026 (México, EE.UU., Canadá) como evento sanitario centinela público."
              - "Garantía pública: protección contra sarampión para turistas y población durante el Mundial 2026 — línea pública prominente del mandato; encabezó la primera sesión ordinaria del Consejo de Salubridad General en 2026."
              - "Hook: IMSS-Bienestar federalización, política farmacéutica y desabasto, vacunación, Institutos Nacionales, salud mental, salud digital, Mundial 2026 como contingencia sanitaria aterrizan; pitches centrados solo en IMSS o solo en sector privado no aterrizan."
          - Tone advice:
              - "Abrir con IMSS-Bienestar, política farmacéutica, vacunación, Institutos Nacionales y la sanidad del Mundial 2026 — son sus líneas de mandato y su lengua clínico-académica."
              - "No proponer marcos que ignoren la segmentación IMSS / IMSS-Bienestar / ISSSTE / privado — Kershenobich corregirá públicamente cualquier framing unitario; la segmentación es estructural y políticamente significativa en el sexenio Sheinbaum."
