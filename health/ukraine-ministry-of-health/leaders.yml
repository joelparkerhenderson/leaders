Ukrainian health stakeholders / Заінтересовані сторони системи охорони здоров'я України:
  - Ministry of Health of Ukraine (Міністерство охорони здоров'я України, MOZ):
      - Viktor Liashko / Віктор Кирилович Ляшко:
          - Title: Minister of Health of Ukraine (since 20 May 2021; reappointed 17 July 2025)
          - Stakeholder engagement notes:
              - "Minister of Health of Ukraine since 20 May 2021 in the Denys Shmyhal government; reappointed 17 July 2025 in a Cabinet reorganisation under President Volodymyr Zelenskyy that consolidated wartime continuity in key portfolios; previously Chief State Sanitary Doctor of Ukraine (Chief Sanitary Doctor) during the early Covid-19 pandemic response; physician-epidemiologist by training; SID-US board member."
              - "Active 2026 agenda: Ministry of Health of Ukraine and WHO discussed strategic priorities for humanitarian response in 2026 (Cabinet of Ministers, kmu.gov.ua); working visit to Donetsk region (February 2026, Donetsk Regional State Administration) — visible field presence in war-affected territories despite continuing security risks."
              - "Owns wartime health system continuity, EHR rollout and digital integration via e-Health platform, NHSU (National Health Service of Ukraine) administering the Programme of Medical Guarantees as single payer, post-Ohmatdyt-bombing rebuilding of the National Specialized Children's Hospital after the July 2024 Russian missile strike, pharmaceutical supply (sanctions-affected and donor-mediated), mental-health and PTSD national response, prosthetics and rehabilitation for war casualties and amputees, and EU-accession alignment of Ukrainian health legislation with EU acquis."
              - "International partner network: USAID (Health Reform Support Project), WHO Europe and WHO Ukraine, EU4Health, World Bank, Global Fund, GAVI, Sphere standards partners; Liashko's bilateral diplomacy is dense, continuous and aligned with the broader Zelenskyy government's Western-integration line."
              - "Hook: wartime health-system continuity, Ohmatdyt rebuilding, mental health and PTSD (war-veteran and civilian), prosthetics and rehabilitation, NHSU Programme of Medical Guarantees, pharmaceutical supply, EU-accession health legislation, and donor coordination land."
          - Tone advice:
              - "Open with wartime continuity, Ohmatdyt rebuilding, mental health and PTSD, prosthetics and rehabilitation, and EU-accession alignment of health legislation — these are Liashko's sustained authored lines and the priority files of the Zelenskyy-Shmyhal government in the continuing war context."
              - "Do not pitch as if peace conditions were normal — every Ukrainian health-policy decision is shaped by ongoing Russian aggression, infrastructure damage, occupied territories (parts of Donetsk, Luhansk, Zaporizhzhia, Kherson, Crimea) and large internally-displaced-person populations; pitches that ignore the war context will be politically tone-deaf."
