Belize health stakeholders:
  - Ministry of Health and Wellness:
      - Hon. Kevin Emmanuel Bernard (PUP):
          - Title: Minister of Health and Wellness (in the second John Briceño PUP government, since March 2025; previously also during the first PUP term 2020-2025)
          - Stakeholder engagement notes:
              - "Minister of Health and Wellness in the second John Briceño (PUP) government following the PUP re-election in March 2025; retained the portfolio from the first Briceño term (2020-2025) — continuous tenure across two electoral cycles, unusual for the regional norm."
              - "At the 79th World Health Assembly (May 2026), Belize called for global health solidarity and supported Taiwan's participation in international health discussions — Bernard delivered the national statement, indicating Belize's distinctive foreign-policy alignment within Central America."
              - "Defended the Cuban medical missions publicly — a long-standing PUP policy that brings Cuban doctors and nurses to support service delivery in remote and underserved areas, particularly in the Toledo and Cayo Districts."
              - "Owns the universal health coverage agenda, KHMH (Karl Heusner Memorial Hospital) and the four regional hospital networks, primary-care strengthening through health centres, Cuban-mission cooperation, climate-and-health programmes, and Belize's CARICOM and PAHO positioning."
              - "Hook: universal health coverage, KHMH modernisation and infrastructure, Cuban-mission cooperation, climate change and health (Belize is highly climate-vulnerable), non-communicable diseases, primary care, and the Taiwan-Belize cooperation portfolio land."
          - Tone advice:
              - "Lead with universal coverage, KHMH, Cuban-mission cooperation, climate health and the Taiwan partnership — these are the sustained PUP policy lines and Bernard's authored speaking points."
              - "Do not pitch in US-aligned framings — Belize's foreign-policy stance, including support for Taiwan and defence of Cuban medical missions, makes US-administration-aligned framings politically incongruent."
