Stakeholder del sistema sanitario sammarinese:
  - Segretariato di Stato per la Sanità e la Sicurezza Sociale:
      - Mariella Mularoni (PDCS):
          - Title: Segretaria di Stato per la Sanità e la Sicurezza Sociale (Minister of Health and Social Security)
          - Stakeholder engagement notes:
              - "Segretaria di Stato per la Sanità e la Sicurezza Sociale nel Congresso di Stato della Repubblica di San Marino formato dopo le elezioni politiche del 9 giugno 2024 (vinte dalla coalizione PDCS-PSD-Libera-RETE); San Marino è una repubblica parlamentare con due Capitani Reggenti che servono come Capi di Stato congiunti per sei mesi a rotazione (1 aprile-30 settembre e 1 ottobre-31 marzo); verificare la titolarità attuale contro esteri.sm, congresso.sm e San Marino RTV (libertas.sm)."
              - "Owns la politica sanitaria sammarinese, l'Ospedale di Stato a Cailungo via l'Istituto per la Sicurezza Sociale (ISS — il pagatore-fornitore unico che riunisce assicurazione e operatore in una sola entità pubblica), la rete dei centri di salute territoriali nei nove castelli, le convenzioni con strutture sanitarie italiane di prossimità (in particolare Rimini, Cesena e Bologna in Emilia-Romagna, ma anche centri di alta specializzazione in tutta Italia) per servizi che eccedono la capacità domestica, l'industria farmaceutica sammarinese (San Marino ha una storica industria farmaceutica), e la diplomazia OMS Europa, Consiglio d'Europa e UE (Accordo di Associazione in negoziazione)."
              - "Hook: malattie non trasmissibili (cardiovascolari, oncologiche), longevità e invecchiamento attivo (San Marino ha una delle più alte aspettative di vita al mondo), salute mentale, salute digitale e interoperabilità (la dimensione del paese consente piloti a scala-nazione), cooperazione transfrontaliera con l'Emilia-Romagna, l'industria farmaceutica sammarinese, e Accordo di Associazione UE — atterrano."
          - Tone advice:
              - "Aprire con NCDs, longevità e invecchiamento, salute mentale, salute digitale, cooperazione transfrontaliera con l'Emilia-Romagna e Accordo di Associazione UE — linee durevoli del Segretariato."
              - "Non confondere San Marino con l'Italia (Stato sovrano con architettura istituzionale propria, sebbene la lingua e numerose convenzioni bilaterali creino interdipendenza operativa) né ignorare il modello pagatore-fornitore ISS (unico in Europa; framings NHS-puro o assicurazione-pura saranno corretti)."
  - Notes su Direttore Generale ISS, Direttore Sanitario e Presidente Commissione Affari Interni del Consiglio Grande e Generale:
      - Status: Identità sostantive da verificare contro esteri.sm e consigliograndeegenerale.sm.
