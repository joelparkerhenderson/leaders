Sistema de salud chileno — partes interesadas:
  - Ministerio de Salud (Minsal):
      - Dra. May Chomalí Garib (Ind.):
          - Title: Ministra de Salud (Minister of Health) (desde el 11 de marzo de 2026, gobierno de José Antonio Kast)
          - Stakeholder engagement notes:
              - "Ministra de Salud desde el 11 de marzo de 2026 en el gobierno de José Antonio Kast (Partido Republicano), tras la asunción presidencial que sucedió a Gabriel Boric (Frente Amplio); designada como independiente; cirujana egresada de la Facultad de Medicina de la Universidad de Chile, con posgrados en Epidemiología y Salud Pública y diplomado en Gestión en Salud."
              - "Hasta enero de 2026 fue Directora Ejecutiva del Centro Nacional en Sistemas de Información en Salud (CENS), institución dedicada a la interoperabilidad y modernización digital del sistema chileno — perfil técnico-digital inusual para un Ministerio históricamente dominado por epidemiólogos o gestores clínicos."
              - "Hija del odontólogo Juan Chomalí, dentista de los expresidentes Jorge Alessandri y Eduardo Frei Montalva; hermana del Cardenal Fernando Chomalí, Arzobispo de Santiago — perfil familiar con conexiones eclesiales y políticas relevantes."
              - "Sucedió a Dra. Ximena Aguilera Sanhueza (2022-2026), quien dejó un balance de gestión marcado por la salida de la pandemia, recuperación del sistema y presión sostenida sobre listas de espera; Aguilera continuó como integrante de la Comisión de Conexión Social de la OMS."
              - "Owns el ciclo presupuestario 2026-2030 del Minsal, las redes asistenciales del SNSS, FONASA, Superintendencia de Salud, ISP, Cenabast, GES (Garantías Explícitas en Salud), salud mental, listas de espera quirúrgicas, reforma ISAPRES y la agenda de transformación digital del sistema (su campo de especialización en CENS)."
              - "Hook: transformación digital, interoperabilidad, listas de espera, GES, reforma ISAPRES post-fallos de la Corte Suprema, Cenabast, salud mental aterrizan; pitches que ignoran el segmento ISAPRES no aterrizan."
          - Tone advice:
              - "Abrir con transformación digital, interoperabilidad, listas de espera y reforma ISAPRES — son su campo de especialización (CENS) y las prioridades políticas del gobierno Kast en salud."
              - "No pitchear como si FONASA fuera el único pagador — el sistema dual FONASA-ISAPRES es estructural y políticamente sensible; framings unitarios serán corregidos en clave dual."
