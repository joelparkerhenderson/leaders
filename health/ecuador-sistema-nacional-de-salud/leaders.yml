Sistema Nacional de Salud (Ecuador) — partes interesadas:
  - Ministerio de Salud Pública (MSP):
      - Jaime Bernabé Erazo (ADN):
          - Title: Ministro de Salud Pública (Minister of Public Health) (desde el 27 de abril de 2026, séptimo Ministro de Salud del gobierno Noboa)
          - Stakeholder engagement notes:
              - "Designado Ministro de Salud Pública el 27 de abril de 2026 por el Presidente Daniel Noboa Azín (Acción Democrática Nacional, ADN) — séptimo Ministro de Salud en menos de dos años de gobierno; precedido por Edgar José Lama von Buchwald (febrero-mayo 2025; renunció tras tres meses para presidir el Consejo Directivo del IESS) y varios Ministros intermedios."
              - "Asume en un contexto de severa volatilidad institucional del MSP: desabasto de medicamentos en la red pública, deuda histórica con prestadores, episodios de violencia en hospitales públicos, brotes de dengue, crisis financiera del IESS, y presión política sostenida desde la Asamblea Nacional."
              - "Owns la rectoría del Sistema Nacional de Salud, la coordinación con IESS, ARCSA, ACESS, política farmacéutica, redes integradas de servicios de salud, y la respuesta a emergencias sanitarias regionales (zonal coordinations)."
              - "El Diario notó al 27 de abril de 2026 que el reto del nuevo titular es la continuidad y la conducción del sector tras siete cambios ministeriales en el mismo gobierno; expectativas modestas sobre reformas estructurales mientras el ciclo de rotación se mantenga."
              - "Hook: desabasto de medicamentos, deuda hospitalaria, IESS reform, fortalecimiento de primer nivel, dengue y vectores, vacunación rutinaria aterrizan; pitches estratégicos de largo plazo serán difíciles dado el ciclo ministerial corto."
          - Tone advice:
              - "Abrir con desabasto de medicamentos, deuda hospitalaria, primer nivel y emergencias — son las prioridades operativas en un ciclo ministerial corto y altamente politizado del gobierno Noboa."
              - "No proponer reformas estructurales de largo plazo — el ciclo de rotación ministerial reciente (siete Ministros) sugiere que asuntos estratégicos serán postergados a un ministro futuro o al próximo gobierno."
