České zdravotnictví — zúčastněné strany:
  - Ministerstvo zdravotnictví ČR (MZČR):
      - Adam Vojtěch (ANO):
          - Title: Ministr zdravotnictví (Minister of Health) (ve druhé vládě Andreje Babiše)
          - Stakeholder engagement notes:
              - "Ministr zdravotnictví ve druhé vládě Andreje Babiše (ANO-SPD-Motoristé sobě), sestavené po vítězství ANO ve volbách do Poslanecké sněmovny v říjnu 2025; ANO; vrací se na pozici, kterou již zastával 2017-2020 a 2020-2021 v první Babišově vládě (rezignoval během pandemie COVID-19 a později znovu jmenován)."
              - "Vystřídal Vlastimila Válka (TOP 09), který resort vedl čtyři roky ve Fialově vládě 2021-2025 a v lednu 2026 představil hlavní změny zdravotnické legislativy od ledna 2026 a zhodnotil uplynulé čtyři roky v čele Ministerstva zdravotnictví — přebírá Válkovu poreformní agendu."
              - "Owns smluvní vztahy mezi MZČR a sedmi statutárními zdravotními pojišťovnami (VZP a šest zaměstnaneckých/sektorových), dohodovací řízení o úhradách zdravotní péče, lékovou politiku ve spolupráci se SÚKL, síť fakultních nemocnic, a vyjednávání s Českou lékařskou komorou o platech a pracovních podmínkách."
              - "Pacientská rada pro období 2026-2030 byla v 2026 nově jmenována — Vojtěch má v ní zakotvenu spolupráci s pacientskými organizacemi jako institucionalizovaný hlas resortu."
              - "Hook: úhradová politika, dohodovací řízení, lékové reformy, fakultní nemocnice, digitalizace zdravotnictví (eRecept, ePreskripce), čerpání EU fondů na obnovu, pacientská zkušenost landují; pitche, které ignorují vícepojišťovnický systém, nelandují."
          - Tone advice:
              - "Otevři s úhradami, lékovou politikou, fakultními nemocnicemi a digitalizací — to jsou klasické MZČR páky a Vojtěchova oblast z prvního období na resortu."
              - "Nepředpokládej jediného plátce — VZP je jen jedna ze sedmi pojišťoven, a pitche, které předpokládají model jediného plátce typu NHS, budou opraveny do vícepojišťovnické logiky."
