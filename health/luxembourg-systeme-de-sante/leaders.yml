Système de santé luxembourgeois — parties prenantes:
  - Ministère de la Santé et de la Sécurité sociale (M3S):
      - Martine Deprez (CSV):
          - Title: Ministre de la Santé et de la Sécurité sociale (Minister of Health and Social Security) (depuis le 17 novembre 2023)
          - Stakeholder engagement notes:
              - "Ministre de la Santé et de la Sécurité sociale dans le gouvernement Frieden (coalition CSV-DP) depuis le 17 novembre 2023; CSV (Chrëschtlech Sozial Vollekspartei); profil technique combinant santé et sécurité sociale dans un seul portefeuille — caractéristique luxembourgeoise."
              - "A représenté le Luxembourg à la 79e Assemblée mondiale de la santé à Genève (17-19 mai 2026), à la Conférence sur la santé mentale et l'inclusivité à Nicosie (janvier 2026), au Conseil EPSCO (mars 2026 avec Marc Spautz) et à la 12e réunion ministérielle de l'initiative des petits États à Riga (juin 2026)."
              - "Pression budgétaire majeure: l'assurance maladie-maternité prévoit un déficit de 126,5 millions d'euros en 2026 — la stabilisation financière de la CNS et la maîtrise des coûts hospitaliers sont des dossiers dominants du mandat."
              - "Lance régulièrement des appels aux jeunes pour rejoindre le secteur de la santé — la pénurie de personnel et l'attractivité du secteur (notamment dans un marché transfrontalier qui dépend des travailleurs venant de France, Belgique et Allemagne) sont des préoccupations publiques explicites."
              - "Owns la politique hospitalière (CHL, CHEM, CHdN, HRS), les conventions CNS, la santé mentale, la santé numérique (DSP, eSanté), le PRR Luxembourg pour la santé, et la coordination transfrontalière sur la mobilité des patients et des professionnels."
              - "Hook: déficit CNS, hôpitaux, santé mentale, professionnels de la santé transfrontaliers, e-santé, et Initiative des petits États aterrissent."
          - Tone advice:
              - "Ouvrir avec déficit CNS, hôpitaux, santé mentale, recrutement transfrontalier et coopération internationale (OMS, petits États) — ce sont ses dossiers de mandat dominants et ses lignes publiques."
              - "Ne pas pitcher comme si CNS et M3S étaient une seule entité — la CNS est l'assureur statutaire avec son comité directeur propre; les framings centralistes seront ramenés à la structure bismarckienne luxembourgeoise."
