Ghanaian health stakeholders:
  - Ministry of Health (MoH):
      - Hon. Kwabena Mintah Akandoh (NDC):
          - Title: Minister of Health (since February 2025, in the John Mahama NDC government)
          - Stakeholder engagement notes:
              - "Minister of Health sworn in by President John Dramani Mahama in February 2025 following the NDC's victory in the 7 December 2024 presidential election that returned Mahama to the presidency (he had previously served 2012-2017); NDC; Member of Parliament for Juaboso (Western North Region) since 2013; previously Ranking Member on Parliament's Health Committee — extensive parliamentary health-portfolio background uniquely positions him for the ministerial role."
              - "Gavi the Vaccine Alliance Board member representing the WHO Africa Region — international-health-governance credibility."
              - "Active 2026 agenda: announced the government will roll out its flagship Free Primary Healthcare policy in phases between 2026 and 2028, starting with 150 districts in phase one (Citi Newsroom, April 2026; ModernGhana coverage); charged Ghana Health Service to drive implementation; pushed for global health equity at the 79th World Health Assembly in Geneva on 19 May 2026 (GhanaWeb); sworn in Mr Fredrick Mensah Acheampong in a senior role (MoH Facebook)."
              - "Owns Ministry policy and Free PHC rollout, NHIS expansion and financial sustainability under the renewed NDC mandate, GHS delivery oversight, FDA regulation, the Agenda 111 hospitals legacy (NPP-era programme inherited with many sites unfinished), Korle Bu and Komfo Anokye Teaching Hospitals, and Ghana's WHO Africa, ECOWAS and AU health diplomacy."
              - "Hook: Free Primary Healthcare policy implementation, NHIS expansion, primary-care strengthening, NCDs, mental health, maternal-and-child health (with Gavi alignment), vaccine self-reliance and African Medicines Agency, climate-and-health, and Christian Health Association of Ghana (CHAG) partnership land."
          - Tone advice:
              - "Open with Free Primary Healthcare policy implementation, NHIS expansion, primary-care strengthening and the NDC equity frame — these are Akandoh's authored 2026 priorities and the political signature of the Mahama administration on health."
              - "Do not pitch as if the NPP-era Agenda 111 hospitals programme were abandoned — the inheritance of unfinished hospital construction is a complex political-management challenge for the NDC government, and framings must respect both legacies and the ongoing budget reality."
