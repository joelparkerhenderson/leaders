Aotearoa New Zealand health stakeholders:
  - Manatū Hauora (Ministry of Health):
      - Hon Simeon Brown (National):
          - Title: Minister of Health (from January 2025)
          - Stakeholder engagement notes:
              - "Minister of Health from January 2025 in the Christopher Luxon (National-ACT-NZ First) coalition; National; took over the Health portfolio from Hon Shane Reti in a January 2025 Cabinet reshuffle; previously held the Transport, Auckland, and Local Government portfolios."
              - "Mandate framed around accessibility, reducing wait times, strengthening frontline health services, and delivering against the Government Health Targets — the explicit ministerial vocabulary used in 2026 Budget releases and Beehive media."
              - "Announced February 2026: AI scribes introduced in emergency departments throughout the country — first major minister-led digital-health policy of his tenure; April 2026 announced new Te Whatu Ora Board Chair and Board members in a refresh of the Health NZ governance structure."
              - "Budget 2026 publicly framed as 'record health funding with patients at the centre' — the political headline of his Health portfolio year."
              - "Owns the Te Whatu Ora accountability framework, the post-disestablishment-of-Te-Aka-Whai-Ora Hauora Māori arrangements (Hauora Māori Advisory Committees and Iwi-Māori Partnership Boards remain), Pharmac, Medsafe, and the national priority on workforce and infrastructure investment."
              - "Hook: wait times, workforce shortages, AI in clinical settings, hospital infrastructure investment, Te Whatu Ora accountability, Government Health Targets, and Pharmac pharmaceutical access land; the post-Pae Ora institutional rearrangement is a sensitive zone — pitches must respect Hauora Māori Advisory Committee and IMPB roles."
          - Tone advice:
              - "Lead with wait times, workforce, frontline service strengthening, hospital infrastructure, AI scribes and Government Health Targets — these are Brown's authored target-frame priorities and recurring public lines."
              - "Do not pitch as if Hauora Māori has been removed from the system — Te Aka Whai Ora was disestablished in 2024 but Hauora Māori Advisory Committees and IMPBs remain statutory; treaty-blind framings will be marked down by Te Pāti Māori, Labour and Greens opposition."
