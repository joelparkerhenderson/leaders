Libyan health stakeholders:
  - Ministry of Health, Government of National Stability (GNS — eastern HoR-aligned government):
      - Dr. Othman Abduljalil:
          - Title: Minister of Health, Government of National Stability (eastern HoR-aligned government)
          - Stakeholder engagement notes:
              - "Minister of Health in the Government of National Stability (GNS, the eastern Libyan government aligned with the House of Representatives in Tobruk, parallel to the UN-recognised Government of National Unity in Tripoli under PM Abdul Hamid Dbeibah); Wikipedia confirms his role as of February 2026; previously appointed by Fathi Bashagha and continued in the GNS after the post-Bashagha succession; described in Libya Review as the official spokesperson for the GNS government for an extended period."
              - "Active 2025-2026 agenda: pledged new health facilities in southern Libya (Libya Review); inaugurated a new medical facility in Al-Kufra (Libya Review); led post-September-2023 Derna catastrophic floods reconstruction (six hospitals in flood-hit Derna resumed service per Prokerala) — although Derna sits in eastern Libya under HoR / Haftar control, the disaster response was a major cross-government coordination test."
              - "Authorities in the east have suspended employees for interacting with the Dbeibah government in Tripoli (Libya Observer) — illustrating the structural tension of the two-government arrangement."
              - "Owns GNS Ministry policy and budget, eastern Libya hospital reconstruction (Derna, Benghazi Medical Center, Bayda, Tobruk), southern Libya health-access expansion (Al-Kufra, Murzuq, Sebha — although Sebha and Murzuq have shifting control), and coordination with WHO Libya, Egypt, UAE, Russia and Turkey in the divided-government context."
              - "Hook: post-Derna 2023 floods reconstruction, southern Libya health access expansion, Egypt-Libya cooperation, cross-government coordination on shared infectious-disease surveillance and pharmaceutical supply, and meeting at Egypt Health Tourism International Conference (Ecomedical) land."
          - Tone advice:
              - "Open with eastern-Libya hospital reconstruction, southern access expansion, post-Derna recovery, and Egypt cooperation — these are the sustained GNS health priorities and Abduljalil's authored public lines."
              - "Do not assume a single Libyan counterpart — engagement on Libyan health requires acknowledging the two-government structure (GNU under Dbeibah in Tripoli; GNS in the east); framings that ignore this structural duality will be politically incomplete and may compromise on-the-ground access in one half of the country."
  - Notes on Ministry of Health, Government of National Unity (GNU — Tripoli):
      - Status: The Government of National Unity (UN-recognised, PM Abdul Hamid Dbeibah, Tripoli-based) operates a parallel Ministry of Health. The substantive identity of the GNU Minister of Health for 2026 must be verified against gov.ly, mohgov.ly and Tripoli-based Libyan press; the two-government structure means that engagement on Libyan health requires bridging both Tripoli (GNU) and Benghazi/Tobruk (GNS) sides, or accepting partial geographical coverage.
      - Implication: Routing decisions on Libyan health engagement must account for the parallel-government structure. WHO Libya office in Tripoli has tended to coordinate with both governments in humanitarian response.
