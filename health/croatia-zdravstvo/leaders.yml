Hrvatski sustav zdravstva — dionici:
  - Ministarstvo zdravstva (Ministry of Health):
      - Irena Hrstić (HDZ):
          - Title: Ministrica zdravstva (Minister of Health) (u Vladi Andreja Plenkovića III; provjeriti aktualnost datuma imenovanja)
          - Stakeholder engagement notes:
              - "Ministrica zdravstva u trećoj Vladi Andreja Plenkovića (koalicija HDZ – Domovinski pokret – HSLS – nacionalne manjine, mandat od 17. svibnja 2024); HDZ; preuzima portfelj u razdoblju u kojem je EPPO 2024. otvorio istragu protiv prethodnog Ministra zdravstva i sedmero drugih osoba u vezi s nabavom medicinske robotike."
              - "Profil tehnokratsko-stručan u resoru s povijesnim političkim turbulencijama u Hrvatskoj — Ministarstvo zdravstva tradicionalno je u središtu sudskih i medijskih istraga oko nabava i upravljanja kliničkim bolničkim centrima."
              - "Owns reformu bolničke mreže prema dokumentu 'Reforma zdravstvenog sustava', povlačenje sredstava iz Nacionalnog plana oporavka i otpornosti (NPOO) za zdravstvo, ugovorne odnose s HZZO-om, te integraciju digitalnog zdravstva (e-Zdravstvo, e-Recept)."
              - "Hook: konsolidacija bolničke mreže, EU sredstva (NPOO Zdravstvo), nedostatak liječničkog kadra (osobito specijalista), dugotrajne liste čekanja, modernizacija HZZO ugovaranja, suradnja s liječničkim komorama; pitchi koji ignoriraju EPPO kontekst su rizični."
          - Tone advice:
              - "Otvori s reformom bolničke mreže, EU sredstvima (NPOO), listama čekanja, kadrovima i digitalnim zdravstvom — to su strateški prioriteti Plenkovićeva mandata na ovom resoru."
              - "Ne pristupaj Ministarstvu izvan konteksta EPPO istrage 2024 oko medicinske robotike — pitanja nabave i integriteta su politički osjetljiva i medijski izložena."
