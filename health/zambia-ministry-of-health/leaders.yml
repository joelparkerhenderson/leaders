Zambian health stakeholders:
  - Ministry of Health:
      - Hon. Dr. Alex Katakwe (UPND):
          - Title: Minister of Health of the Republic of Zambia (since 13 March 2026, sworn in 14 March 2026)
          - Stakeholder engagement notes:
              - "Minister of Health appointed by President Hakainde Hichilema on 13 March 2026 (State House press release) and sworn in at State House Lusaka on 14 March 2026 (Lusaka Times coverage); UPND; Member of Parliament for Solwezi East constituency in North-Western Province; succeeded Hon. Dr. Elijah Julaki Muchima who was relieved of his duties on 18 February 2026 — Muchima had served from 22 July 2024 to 18 February 2026 in the Hichilema government."
              - "Owns Ministry of Health policy and budget, NHIMA NHIS rollout (Zambia's National Health Insurance Scheme has been expanding since 2018), ZAMRA medicines regulation, ZNPHI public-health institute, UTH Lusaka and provincial hospital network coordination, the drug-availability emergency priority (President Hichilema specifically directed the new Minister of Health to ensure drug availability in hospitals per Mwebantu coverage of the swearing-in), and Zambia's WHO Africa, SADC and AU CDC positioning."
              - "Operates under early-mandate pressure: presidential dismissal of the predecessor over performance issues sets a high bar; drug-availability is the explicit presidential directive at appointment."
              - "Hook: drug-availability emergency response (presidential directive), NHIS expansion and financial sustainability, mpox preparedness (regional concern), HIV / TB / malaria post-PEPFAR-policy-changes continuity (Zambia hosts a major HIV-positive cohort), UTH and provincial hospital modernisation, and SADC regional cooperation land."
          - Tone advice:
              - "Open with drug-availability, NHIS, HIV continuity post-PEPFAR-changes and SADC cooperation — these are the priorities under presidential directive at his appointment and the structural priorities of the Zambian health system."
              - "Do not assume political stability of the Health portfolio — the February 2026 dismissal of the predecessor and the pattern of Cabinet changes in the Hichilema government suggest the role is under active political pressure; long-horizon commitments must be calibrated accordingly."
