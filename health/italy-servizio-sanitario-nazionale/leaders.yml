Servizio Sanitario Nazionale italiano — stakeholder:
  - Ministero della Salute:
      - Orazio Schillaci:
          - Title: Ministro della Salute (Minister of Health) (dal 22 ottobre 2022)
          - Stakeholder engagement notes:
              - "Ministro della Salute nel governo Meloni dal 22 ottobre 2022 — incarico tecnico-accademico non parlamentare; Professore ordinario di Medicina Nucleare all'Università di Roma Tor Vergata, di cui è stato Rettore dal 2019 fino alla nomina ministeriale."
              - "Nato il 27 aprile 1966 a Roma con origini calabresi; precedente Direttore Dipartimento di Biomedicina e Prevenzione dell'Università Tor Vergata e Preside della Facoltà di Medicina e Chirurgia; profilo medico-accademico in un governo politicamente polarizzato."
              - "Owns l'attuazione del PNRR Salute, il rinnovo dei contratti di lavoro del personale sanitario, la riforma della medicina del territorio (Case e Ospedali di Comunità, COT), la coordinazione con la Conferenza Stato-Regioni, e la rappresentanza italiana in sede UE (Consiglio EPSCO, EMA Management Board, OMS)."
              - "Linea di mandato pubblica: 'svolta verso una sanità più predittiva e personalizzata' — valorizza la medicina di precisione, la genomica, l'intelligenza artificiale clinica e la formazione professionale come pilastri di riforma."
              - "Operatività recente (giugno 2026): riferisce in Senato sulla peste suina africana — un esempio della componente di sicurezza alimentare e biosicurezza del ressort, oltre alla sanità ospedaliera."
              - "Hook: PNRR Salute, Case di Comunità, medicina di precisione, peste suina africana e biosicurezza, AIFA reform, formazione e contratti del personale sanitario, IRCCS atterriscono; pitch che ignorano il livello regionale non atterriscono."
          - Tone advice:
              - "Aprire con PNRR Salute, Case di Comunità, medicina di precisione, contratti del personale e IRCCS — sono le linee di mandato di Schillaci e il suo orizzonte professionale medico-accademico."
              - "Non proporre framing che bypassano le Regioni — Schillaci coordina la Conferenza Stato-Regioni e qualsiasi proposta centralizzata sarà rinviata agli Assessori regionali; la regionalizzazione costituzionale del 2001 è il fatto da rispettare."
