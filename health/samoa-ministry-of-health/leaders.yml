Samoan health stakeholders:
  - Notes on Minister of Health of the Independent State of Samoa:
      - Status: Identity of the current Minister of Health to be verified against samoagovt.ws, parliament.gov.ws and Samoa Observer; the Samoan political landscape has been turbulent during 2025 with parliamentary instability under the Fiamē Naomi Mataʻafa (FAST — Faʻatuatua i le Atua Samoa ua Tasi) government that came to office in 2021, internal FAST splits and possible early-election dynamics, so cabinet composition is subject to change; the O le Ao o le Malo (Head of State) is Va'aletoa Sualauvi II.
      - Implication: Engagement on Samoan health requires (i) identification of the current titleholder via official channels in Apia, (ii) recognition of the 2019 measles outbreak legacy that killed dozens of children and exposed immunisation-coverage gaps — measles catch-up and routine-immunisation rebuild remain a sustained policy priority —, (iii) the distinction between the Independent State of Samoa (sovereign PIF state) and American Samoa (US unincorporated territory with its own Department of Health under the US health architecture), and (iv) the donor architecture (WHO WPRO, UNICEF, Australia DFAT, New Zealand MFAT, Japan JICA, China bilateral, Taiwan no longer present after the 2024 switch).
      - Hook: non-communicable diseases (very high obesity, diabetes, cardiovascular and renal burden — among the highest in WPRO), measles immunisation gaps and post-2019-outbreak rebuild, maternal-and-child health, mental health and youth mental health, climate-and-health (Samoa is a leading Pacific climate voice and hosted the SIDS Conference in 2014), dengue and arboviruses, water security and sanitation, the Tupua Tamasese Meaole Hospital reconstruction and capacity strengthening, and PIF-PSIDS regional cooperation.
      - Tone: Open with NCDs, immunisation and measles rebuild, MCH, mental health, climate-and-health and PIF-PSIDS cooperation — durable lines and the Samoan health priorities. Distinguish carefully from American Samoa (the confusion is common externally and indicates limited familiarity) and recognise the 2019 measles outbreak as foundational policy memory.
