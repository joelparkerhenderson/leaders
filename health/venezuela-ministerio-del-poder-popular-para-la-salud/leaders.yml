Sistema de salud venezolano — partes interesadas:
  - Ministerio del Poder Popular para la Salud (MPPS):
      - Dra. Nuramy Josefa Gutiérrez González (PSUV):
          - Title: Ministra del Poder Popular para la Salud (Minister of Health) (designada en enero de 2026)
          - Stakeholder engagement notes:
              - "Designada Ministra del Poder Popular para la Salud en enero de 2026 por la Vicepresidenta Ejecutiva Delcy Rodríguez, reemplazando a Magaly Gutiérrez Viña, quien había desempeñado el cargo desde febrero de 2022."
              - "Magaly Gutiérrez Viña continúa al frente del Instituto Venezolano de los Seguros Sociales (IVSS) — la rotación interna del PSUV mantiene un equipo coherente en el sector salud y seguridad social, sin salida del bloque institucional bolivariano."
              - "Asume bajo el lanzamiento del 'Plan por la Salud y la Vida 2026' del Gobierno Bolivariano, anunciado el 13 de enero de 2026 por la Presidencia, enfocado en el despliegue de las Misiones del sector en las calles del país para fortalecer la atención integral."
              - "Contexto operativo: emergencia humanitaria compleja persistente desde 2015-2017; deterioro de infraestructura hospitalaria; éxodo de personal médico documentado por la FMV; cooperación cubana mantenida vía Misión Barrio Adentro; sanciones estadounidenses afectando importación de medicamentos e insumos."
              - "Hook: Plan por la Salud y la Vida 2026, Misiones (Barrio Adentro), atención primaria, medicamentos básicos, vacunación, cooperación con Cuba / Rusia / Irán / China, y la presencia internacional venezolana en la 79ª Asamblea Mundial de la Salud aterrizan."
          - Tone advice:
              - "Abrir con el Plan por la Salud y la Vida 2026, las Misiones, la atención primaria y la cooperación Sur-Sur — son las líneas oficiales del gobierno bolivariano y los marcos discursivos del PSUV en salud que la Ministra reproducirá públicamente."
              - "No proponer cooperación con organismos estadounidenses o vinculados a las sanciones de Washington — la política sanitaria está fuertemente politizada y los framings vinculados a la administración estadounidense serán rechazados; las vías legítimas son OMS, OPS, Cuba, Rusia, Irán y China."
