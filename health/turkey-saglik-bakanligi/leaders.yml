T.C. Sağlık Bakanlığı paydaşlar / Turkish Republic Ministry of Health stakeholders:
  - T.C. Sağlık Bakanlığı (Ministry of Health):
      - Prof. Dr. Kemal Memişoğlu (AKP):
          - Title: Sağlık Bakanı (Minister of Health) (since 2 July 2024)
          - Stakeholder engagement notes:
              - "Sağlık Bakanı (Minister of Health) appointed by President Recep Tayyip Erdoğan on 2 July 2024 in the 67th Government, replacing Fahrettin Koca; born 1966; AKP-affiliated; physician with academic background — Hacettepe University Faculty of Medicine (1990), general-surgery specialty at Okmeydanı Training and Research Hospital (1995), Associate Professor of General Surgery (2008), Professor of General Surgery (2016)."
              - "Previously Provincial Health Director of Istanbul 2016-2024 — long executive experience managing the largest provincial health system in Turkey, overseeing the post-2018 city-hospitals expansion in Istanbul (Başakşehir Çam ve Sakura, etc.) and the Covid-19 response."
              - "Active 2026 public lines: announced 26,673 personnel hires following the 2026 KPSS exam (announced via Anadolu Ajansı); 'Dumansız Türkiye' (smoke-free Turkey) anti-tobacco campaign; 12 city hospitals under construction (interview with CNN Türk); addressed TBMM Genel Kurulu on the 2026 Ministry budget."
              - "Owns the Şehir Hastaneleri PPP network, Aile Hekimliği (family-medicine) reform, SGK coordination on Genel Sağlık Sigortası, TİTCK regulatory file, post-2023-earthquake health-infrastructure rebuilding in southeast Anatolia, the long-running Sağlıkta Dönüşüm Programı (SDP) continuation, and Turkey's WHO Europe, OIC and BRICS+ health diplomacy."
              - "Hook: city hospitals, family medicine reform, health workforce expansion, tobacco control, earthquake health reconstruction, R&D and biotechnology (TÜSEB), digital health (e-Nabız), and Turkey's international health-cooperation positioning land."
          - Tone advice:
              - "Open with Şehir Hastaneleri, family medicine reform, workforce hiring, smoke-free Turkey, and earthquake health reconstruction — these are Memişoğlu's authored 2026 public lines and the AKP-government policy frame."
              - "Do not pitch as if regional or provincial structures had autonomy — Turkey's system is centralised under Sağlık Bakanlığı with strong vertical control from Bakan to İl Sağlık Müdürlükleri; provincial-autonomy framings will be redirected to central decision-making."
