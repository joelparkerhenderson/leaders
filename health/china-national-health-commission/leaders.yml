中华人民共和国卫生健康利益相关方 / People's Republic of China health stakeholders:
  - National Health Commission (国家卫生健康委员会 NHC):
      - Lei Haichao / 雷海潮:
          - Title: Minister of the National Health Commission (国家卫生健康委员会主任 Guojia Weisheng Jiankang Weiyuanhui Zhuren) and concurrently CCP Committee Secretary of NHC
          - Stakeholder engagement notes:
              - "Minister of the National Health Commission of the People's Republic of China and concurrently CCP Committee Secretary of NHC — combining administrative and party leadership of the central health portfolio in a single appointment, signalling NHC's elevated political weight in the post-pandemic governance configuration."
              - "Led the Chinese delegation to the 79th World Health Assembly in Geneva (May 2026) — head-of-delegation status; visited the Hong Kong SAR 12-13 January 2026, including a delegation to HKU (University of Hong Kong) and HKUMed; attended a joint meeting with Hong Kong and Macao health officials on 20 January 2026 — coordinated regional engagement is a structural feature of his agenda."
              - "Public policy line at WHA 2026: 'Healthy China, not just China' — articulated multilateral engagement intent, signalling China's interest in global-health rules-and-norms participation; aligns with the State Council target announced October 2025 to raise average life expectancy to around 80 years within five years."
              - "Owns NHC steering of provincial health commissions, the national hospital reform programme (tiered hospital system reform), the integrated 'three-medical-linkage' (三医联动 yiliao-yibao-yiyao) coordination with NHSA (procurement, reimbursement) and NMPA (regulation), traditional Chinese medicine integration into the universal health system, primary-care strengthening (jiceng yiliao), and national disease-control coordination with the NDCPA."
              - "Hook: 'Healthy China 2030', three-medical-linkage reform, hospital-tier reform, primary-care strengthening, HK-Macao-Mainland health coordination (with Greater Bay Area integration), global-health multilateral participation, and traditional-Chinese-medicine and innovation-medicine policy land."
          - Tone advice:
              - "Open with 'Healthy China 2030', three-medical-linkage, primary-care strengthening, HK-Macao-Mainland coordination and global-health multilateralism — these are Lei's authored public-policy framings and the public lines he repeats at international fora."
              - "Do not pitch through commercial-Western-pharma frames without engaging NHSA on procurement (VBP) and reimbursement (NRDL) and NMPA on regulation — China's three-medical-linkage reforms have changed the commercial logic of the market, and pitches that ignore them will be marked as out-of-date."
