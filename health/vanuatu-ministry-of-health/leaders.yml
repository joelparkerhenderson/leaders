ni-Vanuatu health stakeholders:
  - Notes on Minister of Health of the Republic of Vanuatu:
      - Status: Identity of the current Minister of Health under the Prime Minister Jotham Napat government (Napat became PM in early 2025 following the January 2025 election that succeeded the Charlot Salwai government — and Vanuatu has experienced frequent Vote-of-No-Confidence-driven turnover) to be verified against gov.vu and Vanuatu Daily Post; Vanuatu is a parliamentary republic with a President as Head of State.
      - Implication: Engagement on ni-Vanuatu health requires (i) identification of the current titleholder via official channels in Port Vila — given the historically frequent cabinet reshuffles, this verification step is essential —, (ii) recognition of Vanuatu's bilingual English-French heritage as a former Anglo-French condominium (New Hebrides) and its OIF (Organisation Internationale de la Francophonie) and Commonwealth membership, (iii) the December 2024 earthquake in Port Vila that damaged government buildings including health infrastructure, (iv) the kastom and customary-leader role alongside formal government structures, and (v) the donor architecture (Australia DFAT, New Zealand MFAT, France bilateral, World Bank, ADB, WHO WPRO, UNICEF, Japan JICA, Chinese bilateral).
      - Hook: malaria (elimination drive — Vanuatu has made significant progress and aims at elimination by 2030 with NDoH and APMEN cooperation), tuberculosis, NCDs (rising obesity, diabetes), maternal-and-child health, climate-and-health (Vanuatu is one of the world's most disaster-prone countries and a leading Pacific climate-and-loss-and-damage voice — Vanuatu drove the 2023 UN General Assembly resolution on the International Court of Justice climate advisory opinion), cyclone preparedness, December 2024 earthquake recovery, dengue and arboviruses, water and sanitation, mental health, and PIF-MSG-PSIDS cooperation.
      - Tone: Open with malaria-elimination drive, NCDs, climate-and-health (centrally — Vanuatu's global climate leadership), earthquake recovery, MCH and PIF-MSG cooperation — durable lines. Recognise the bilingual heritage and OIF membership, the kastom dimension of governance, and the political fluidity that frames any sustained engagement.
