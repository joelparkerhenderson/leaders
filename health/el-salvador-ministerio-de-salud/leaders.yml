Sistema de salud salvadoreño — partes interesadas:
  - Ministerio de Salud (MINSAL):
      - Dr. Francisco José Alabi Montoya (NI):
          - Title: Ministro de Salud (Minister of Health) (continuidad en el segundo mandato Bukele desde 1 de junio de 2024; en el cargo desde 2020)
          - Stakeholder engagement notes:
              - "Ministro de Salud desde 2020 cuando asumió durante la gestión de la pandemia COVID-19; continúa en el segundo mandato del Presidente Nayib Bukele (Nuevas Ideas, NI), iniciado el 1 de junio de 2024 — uno de los ministros de más larga continuidad en el gabinete oficialista."
              - "Según encuesta de Infobae de mayo 2026, Defensa, Educación y Salud están entre los tres ministerios que impulsan la imagen del gabinete; Alabi tiene un 39% de penetración y un 31% de valoración favorable — figura altamente visible del gabinete y aliado político cercano del Ejecutivo."
              - "Informó en junio 2026 que se adquirieron más equipos especializados para estudios diagnósticos en estos años que en toda la historia previa del Ministerio de Salud — narrativa de modernización tecnológica como eje comunicacional principal del mandato."
              - "Polémicas: el medio 'Salud con lupa' reportó una controversia sobre una oficina ministerial valorada en más de US$50.000 en plena emergencia sanitaria — episodio que afectó la imagen pero no la posición política dentro del gobierno Bukele."
              - "Owns la rectoría del MINSAL, la coordinación con ISSS (Instituto Salvadoreño del Seguro Social), DNM (Dirección Nacional de Medicamentos), INS El Salvador, las redes integrales e integradas de servicios de salud (RIIS), y la articulación con cooperantes (OPS, BID, Banco Mundial)."
              - "Hook: digitalización del sistema, equipos médicos modernos, infraestructura hospitalaria nueva (Hospital El Salvador, hospitales regionales), atención primaria comunitaria, salud materno-infantil y la agenda 'salud de calidad' del Plan Fin de Año aterrizan."
          - Tone advice:
              - "Abrir con modernización tecnológica, infraestructura hospitalaria y resultados visibles — son las líneas comunicacionales del gobierno Bukele en salud y los marcos discursivos que Alabi repite públicamente."
              - "No invocar críticas a la gestión o cooperación con organismos opositores al gobierno — el contexto político está fuertemente polarizado y los framings críticos serán bloqueados o no avanzarán políticamente."
