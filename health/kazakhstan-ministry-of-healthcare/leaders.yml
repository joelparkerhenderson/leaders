Kazakh health stakeholders / Қазақстандық денсаулық сақтау саласындағы мүдделі тараптар:
  - Ministry of Healthcare of the Republic of Kazakhstan (Қазақстан Республикасы Денсаулық сақтау министрлігі):
      - H.E. Dr. Akmaral Alnazarova / Ақмарал Әлназарова (Amanat-aligned):
          - Title: Minister of Healthcare of the Republic of Kazakhstan (since February 2024)
          - Stakeholder engagement notes:
              - "Minister of Healthcare since February 2024 in the Olzhas Bektenov government under President Kassym-Jomart Tokayev; pediatrician by training; born 16 February 1971 in Kyzylorda; holds a degree in pediatrics from Almaty State Institute of Medicine and a degree in economics from Korkyt Ata Kyzylorda University; senior career in oblast health administration before the ministerial role; received by President Tokayev in 2026 (silkwaytv.kz exclusive coverage)."
              - "Owns Ministry of Healthcare policy and budget, FSMS (Social Health Insurance Fund) single-payer governance, the Republican Centre for Health Development and the network of Scientific Centres (Cardiology Astana, Oncology, Pediatrics and Pediatric Surgery), the digital-health agenda with UNDP collaboration (UNDP Kazakhstan and Ministry of Healthcare strengthened cooperation in digitalisation per UNDP press release), Vision 2050 health-sector implementation, the 'Salamatti Qazaqstan' (Healthy Kazakhstan) programme, and Kazakhstan's WHO Europe, SCO, CSTO, EAEU and OIC health diplomacy."
              - "Hook: FSMS single-payer reform, digital health and AI integration (with UNDP partnership), Scientific Centres expansion (Cardiology Centre Astana is an internationally cited centre of excellence), oncology national programme, primary-care strengthening through 'Salamatti Qazaqstan', and SCO / CSTO / EAEU cooperation land."
          - Tone advice:
              - "Open with FSMS reform, digital health (UNDP-partnered), Scientific Centres of excellence and Salamatti Qazaqstan programme — these are her sustained 2024-2026 priorities and the President Tokayev-era reform direction."
              - "Do not pitch as if engagement could bypass FSMS — the single-payer logic is structural in Kazakhstan, and any provider-financing arrangement must include FSMS as the formal counterparty."
