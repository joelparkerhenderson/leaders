Nepalese health stakeholders:
  - Ministry of Health and Population (MoHP) — स्वास्थ्य तथा जनसंख्या मन्त्रालय:
      - Hon. Nisha Mehta:
          - Title: Minister of Health and Population, Federal Democratic Republic of Nepal (Balendra Shah Cabinet, finalised March 2026)
          - Stakeholder engagement notes:
              - "Minister of Health and Population in the Balendra Shah Cabinet finalised in March 2026 (Kathmandu Post coverage of the 15-minister cabinet on 27 March 2026; The Annapurna Express confirmation); AIIMS New Delhi alumna; Master's degree in nursing from University of Gwalior, India; previously worked at Birat Teaching Hospital in Biratnagar — clinical-academic profile unusual for Nepali health ministers, who are typically party-political appointees."
              - "Owns federal MoHP policy, vertical programmes (immunisation, TB, HIV, malaria, family planning), DoHS coordination with the seven Provinces, DDA pharmaceutical regulation, Health Insurance Board administration of NHIP, and Nepal's WHO SEARO and SAARC health diplomacy; donor coordination with USAID, UK FCDO, WHO, UNICEF, Gavi, World Bank and ADB."
              - "Operates in a constitutionally devolved arrangement: under the 2015 Constitution, health delivery devolved to the seven Provinces (each with its own Ministry of Social Development / Health) and 753 Local Levels — the federal MoHP role is policy, vertical programmes, and tertiary referral, not direct delivery."
              - "Hook: NHIP expansion, federal-provincial coordination, immunisation (post-Covid legacy and routine), TB and HIV programmes, mental health, climate-and-health (Nepal is highly climate-vulnerable including earthquake and flood preparedness), and donor coordination land."
          - Tone advice:
              - "Open with NHIP, federal-provincial coordination, climate-and-health (earthquake / flood / monsoon health emergencies) and donor coordination — these are the priority files of MoHP in the 2026 federalised governance context."
              - "Do not pitch as if MoHP were the operational buyer — Provinces and 753 Local Levels run delivery under the 2015 Constitution; framings must include provincial Ministries of Social Development and Local Government health committees as partners."
