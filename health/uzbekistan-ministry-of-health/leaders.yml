Uzbek health stakeholders:
  - Ministry of Health of the Republic of Uzbekistan:
      - Eldor Adilov:
          - Title: Minister of Health of the Republic of Uzbekistan (since May 2026)
          - Stakeholder engagement notes:
              - "Minister of Health of the Republic of Uzbekistan appointed in May 2026 (UzDaily 'Eldor Adilov Appointed Uzbekistan Health Minister'); succeeded Asilbek Khudayarov who led the Ministry from November 2024 (after serving as acting minister from January the same year) and was transferred to another position in a Mirziyoyev government reshuffle (Gazeta.uz 'President of Uzbekistan reshuffles Health Ministry leadership' 5 May 2026; Zamin.uz 'New Appointment at the Ministry of Health: Minister Replaced' 5 May 2026); appointment confirmed by Ministry of Health press communication."
              - "Owns Ministry of Health policy and budget, the State Sanitary and Epidemiological Welfare Service oversight, the Republican Clinical Hospitals coordination (Tashkent Medical Academy hospitals, Republican Cancer Center, Republican Cardiac Center, Republican Children's Hospital, Republican Maternal-and-Child Care Centre), the 14 oblast Health Departments (Andijan, Bukhara, Fergana, Jizzakh, Karakalpakstan, Kashkadarya, Khorezm, Namangan, Navoiy, Samarkand, Sirdaryo, Surkhandarya, Tashkent City, Tashkent Region), the State Health Insurance Fund piloting and rollout under the Mirziyoyev modernisation programme, and Uzbekistan's WHO Europe, SCO (Shanghai Cooperation Organisation), ECO (Economic Cooperation Organisation), and CIS health diplomacy."
              - "Hook: State Health Insurance Fund rollout (a flagship reform), Mirziyoyev-era modernisation implementation, oncology and cardiology centres of excellence (the Republican Cancer Center and Republican Cardiac Center are regional references), primary-care strengthening through Family Polyclinics, Aral Sea ecological-health legacy programmes (a distinctive Uzbek priority given the environmental catastrophe), SCO and BRICS+ cooperation, and Central Asian regional cooperation land."
          - Tone advice:
              - "Open with State Health Insurance Fund rollout, modernisation reform, oncology and cardiology centres, SCO cooperation and Aral Sea health programmes — these are sustained Uzbek priorities and the Mirziyoyev-era reform direction that Adilov is expected to implement."
              - "Do not pitch with single-bloc framings — Uzbekistan under Mirziyoyev pragmatically balances Russia, China (Belt and Road), EU, US, Korea, Türkiye, Iran and Indian partnerships in a multi-vector foreign-policy approach; single-aligned framings will be filtered."
