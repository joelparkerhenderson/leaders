Parties prenantes du système de santé béninois:
  - Ministère de la Santé (MS):
      - Prof. Benjamin Hounkpatin (BR-mouvance présidentielle):
          - Title: Ministre de la Santé (Minister of Health)
          - Stakeholder engagement notes:
              - "Ministre de la Santé sous la présidence de Patrice Talon (second mandat depuis 2021); médecin; profil technocratique compatible avec la doctrine de gouvernance de l'administration Talon (mouvance présidentielle du Bloc Républicain et de l'Union Progressiste le Renouveau); vérifier la titularité courante contre le Secrétariat Général du Gouvernement (gouv.bj), l'Agence Béninoise de Presse (ABP) et La Nation."
              - "Owns la politique et le budget MS, le CNHU-HKM (Centre National Hospitalier Universitaire Hubert Koutoukou Maga) à Cotonou, l'Hôpital de la Mère et de l'Enfant Lagune (HOMEL), les Centres Hospitaliers Départementaux des douze départements (Alibori, Atacora, Atlantique, Borgou, Collines, Couffo, Donga, Littoral, Mono, Ouémé, Plateau, Zou), l'Agence Béninoise des Médicaments et autres produits de santé (ABMETS — agence régulatoire réformée), le volet santé du dispositif ARCH (Assurance pour le Renforcement du Capital Humain — la cible de couverture santé universelle de Talon), et la diplomatie OMS AFRO, CEDEAO, UEMOA et Francophonie."
              - "Hook: ARCH-Vie volet santé (la CUS-cible de Talon en cours de déploiement progressif), paludisme et lutte vectorielle, santé maternelle et infantile, NCDs (hypertension, diabète, drépanocytose), tuberculose et VIH (partenaire PEPFAR, Fonds Mondial), mpox et préparation aux urgences, et structuration de l'ABMETS comme régulateur national des produits de santé — ces lignes atterrissent."
          - Tone advice:
              - "Ouvrir avec ARCH-santé / CUS, paludisme, MCH, NCDs, préparation aux urgences et structuration régulatoire ABMETS — priorités visibles de la doctrine Talon et lignes opérationnelles du MS."
              - "Ne pas ignorer la réforme ABMETS (les framings basés sur l'ancienne architecture pharmaceutique seront corrigés) ni importer des framings nigérians (le Bénin est francophone, dans la zone CFA UEMOA, et institutionnellement distinct du Nigeria voisin anglophone)."
