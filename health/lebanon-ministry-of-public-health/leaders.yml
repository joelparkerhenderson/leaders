Lebanese health stakeholders / أصحاب المصلحة في النظام الصحي اللبناني:
  - Ministry of Public Health (وزارة الصحة العامة):
      - Dr. Rakan Nassereddine:
          - Title: Minister of Public Health of Lebanon (in the Nawaf Salam government, since 2025)
          - Stakeholder engagement notes:
              - "Minister of Public Health in the Nawaf Salam government formed after Joseph Aoun's election as President in January 2025; Lebanese doctor; PhD in infectious diseases; arterial / vascular surgeon at the American University of Beirut Medical Center (AUBMC) — clinical-academic background brings substantial professional credibility to the portfolio in a context of significant system strain."
              - "Active 2026: discussed health-sector reconstruction and hospital development with the World Bank (Profile News coverage); inaugurated the psychiatric department at St Charles Hospital in Rihaniyyeh (September 2025, Observe Lebanon), emphasising its significance in advancing mental-health services in Lebanon, highlighting the collective nature of mental-health care; visited hospitals in Bint Jbeil and other South Lebanon facilities (Dearborn.org coverage of the Lebanese diaspora link); reported to international press in March 2026 that Israeli airstrikes in Lebanon had killed 394 people since 2 March 2026, including 83 children and 42 women, with 1,130 wounded (CGTN, TRT World)."
              - "Owns MoPH policy, NSSF coordination, oversight of public hospitals (Rafik Hariri University Hospital is the main public tertiary facility), contracts with private hospitals (AUBMC, Hôtel-Dieu, LAUMC, Hammoud, Bahman, et al.), pharmaceutical supply through MoPH stocks, vaccination programmes, mental health, reconstruction of South Lebanon health facilities damaged in the 2023-2025 Israel-Hezbollah conflict, and Lebanon's WHO EMRO and Arab League positioning."
              - "Operates in continuing crisis: post-2019 banking-and-currency collapse, post-2023 conflict damage, IDP population, sectarian-political negotiation; the Aoun-Salam government is reform-oriented but constrained by confessional politics and Hezbollah's continuing weight."
              - "Hook: post-conflict reconstruction of South Lebanon hospitals, mental-health expansion, pharmaceutical supply, hospital-sector financing reform, MoPH-private-hospital contracts, climate-and-health, and WHO / World Bank / EU donor coordination land."
          - Tone advice:
              - "Open with post-conflict reconstruction, mental-health expansion, hospital sector financing and World Bank / WHO donor coordination — these are his sustained 2025-2026 public lines and align with the Aoun-Salam reform government's frame."
              - "Do not assume political stability — Lebanon's confessional politics, continued Israeli strikes, Hezbollah-state tensions, and economic crisis make every health-policy decision politically charged; framings that ignore these structural realities will not land."
