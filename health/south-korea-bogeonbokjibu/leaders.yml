대한민국 보건의료 이해관계자 / Republic of Korea health stakeholders:
  - Ministry of Health and Welfare (보건복지부 Bogeonbokjibu):
      - Jeong Eun-kyeong / 정은경:
          - Title: Minister of Health and Welfare (보건복지부 장관 Bogeonbokji Buchangwan) (in office in 2026; verify exact swearing-in date and party affiliation)
          - Stakeholder engagement notes:
              - "Minister of Health and Welfare in 2026, having delivered the '2026 New Year's Address as Minister of Health and Welfare' in early January 2026 (covered by Korea.net and Seoul Economic Daily); nationally and internationally recognised public-health figure as the former Commissioner of KDCA (then KCDC) who led the South Korean Covid-19 response from 2020 to 2022."
              - "Public-health physician by background, with rare cross-administration credibility — served under both progressive (Moon) and conservative (Yoon) governments at KDCA; the KDCA Commissioner authority translates into unusual institutional capital at MOHW, particularly on infectious-disease preparedness, vaccination programmes, and public-health workforce policy."
              - "Public mandate priorities for 2026 (per New Year's Address and follow-up): expanding regional and essential healthcare reforms, strengthening state responsibility for essential care (paediatrics, obstetrics, emergency medicine), managing the post-2024 doctor-strike workforce settlement around medical-school admission expansion, and dementia / ageing-care policy."
              - "Operates in the post-Yoon-impeachment political configuration after the December 2024 martial-law crisis and the 2025 presidential election cycle; political environment is recovering-from-shock and the MOHW agenda is read in that context."
              - "Hook: regional essential medical-care, paediatrics and emergency-medicine workforce, infectious-disease preparedness, NHI benefit reform, drug pricing through HIRA, dementia and ageing care, and digital health (My Health Way) land; pitches that bypass NHIS as single payer do not."
          - Tone advice:
              - "Open with regional essential healthcare, infectious-disease preparedness, public-health workforce strengthening and the post-doctor-strike settlement — these are her authored public-policy priorities and the political flashpoints of the 2024-2026 cycle."
              - "Do not propose framings that bypass NHIS as the single payer or HIRA as the claims-review body — Korea's NHI is the structural axis of operational decisions and pitches that assume direct MOHW commissioning will be redirected."
