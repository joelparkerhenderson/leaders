Bahraini health stakeholders:
  - Ministry of Health (وزارة الصحة):
      - H.E. Dr. Jaleela bint Sayed Jawad Hassan:
          - Title: Minister of Health of the Kingdom of Bahrain (since June 2022)
          - Stakeholder engagement notes:
              - "Minister of Health of Bahrain since June 2022 by Royal Decree of His Majesty King Hamad bin Isa Al Khalifa; medical doctor by training; widely cited as the first female Minister of Health in Bahrain; profile speaker at Abu Dhabi Global Health Week."
              - "Active 2026: met participants of the Prime Minister's Fellowship Programme (PMO Bahrain, 15 January 2026); cited 100% Bahrainisation in primary care amid a doctor-hiring discussion (Daily Tribune, NewsofBahrain); reaffirmed commitment to youth empowerment in MoH workforce; strengthened partnership with the Bahrain Sickle Cell Society (a national priority given high prevalence)."
              - "Owns MoH policy and budget, the Sehati mandatory-health-insurance rollout coordinated with the Supreme Council of Health, NHRA regulatory oversight, Salmaniya Medical Complex public-hospital network, King Hamad University Hospital joint governance, primary-care strengthening through health centres, sickle-cell national programme, and Bahrain's WHO EMRO and GCC Council of Health Ministers diplomacy."
              - "Hook: Sehati mandatory insurance rollout, primary-care Bahrainisation, sickle-cell programme, SMC modernisation, KHUH centre-of-excellence model, and GCC cooperation land."
          - Tone advice:
              - "Open with Sehati rollout, sickle-cell, primary-care Bahrainisation and GCC cooperation — these are her 2026 sustained authored priorities and consistent public lines."
              - "Do not assume Bahrainisation is a soft policy — workforce nationalisation in healthcare is a political priority in Bahrain, and pitches that ignore or de-emphasise it will not land politically."
