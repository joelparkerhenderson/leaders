Tongan health stakeholders:
  - Notes on Minister of Health of the Kingdom of Tonga:
      - Status: Identity of the current Minister of Health under the cabinet of Prime Minister Aisake Eke (who became PM in early 2025 after Hu'akavameiliku Siaosi Sovaleni resigned in December 2024 ahead of a vote of no confidence) to be verified against pmo.gov.to and Matangi Tonga; the Kingdom of Tonga is a constitutional monarchy under King Tupou VI.
      - Implication: Engagement on Tongan health requires (i) identification of the current titleholder via official channels in Nuku'alofa, (ii) recognition of Tonga's unique status as the only Pacific monarchy with a constitutional structure that gives the King and the nobility a continuing role alongside people's representatives, (iii) the Hunga Tonga-Hunga Ha'apai volcanic eruption and tsunami of January 2022 legacy (the largest atmospheric explosion ever recorded; disrupted health and other infrastructure across the archipelago and affected longer-term respiratory and mental-health patterns), and (iv) the donor architecture (Australia DFAT, New Zealand MFAT, World Bank, ADB, WHO WPRO, UNICEF, Japan JICA, Chinese bilateral — Tonga has significant Chinese debt — Taiwanese bilateral until 1998 and then no longer).
      - Hook: non-communicable diseases (very high obesity, diabetes, cardiovascular burden — among the highest in WPRO), Hunga Tonga 2022 recovery and respiratory/mental-health follow-up, climate-and-health (sea-level rise and cyclone exposure), maternal-and-child health, immunisation, dengue and arboviruses, kidney disease and dialysis (a significant burden), mental health, Vaiola Hospital reconstruction and capacity, and PIF-PSIDS regional cooperation.
      - Tone: Open with NCDs, Hunga Tonga recovery, climate-and-health, MCH, mental health and PIF cooperation — durable Tongan priorities. Recognise the monarchical-constitutional structure (unique in the Pacific) and do not conflate with Samoa or Fiji (distinct sovereigns with different systems).
