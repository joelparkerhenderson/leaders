Saint Kitts and Nevis health stakeholders:
  - Ministry of Health (Federation):
      - Hon. Dr. Terrance Drew (SKNLP):
          - Title: Prime Minister and Minister of Health (since August 2022)
          - Stakeholder engagement notes:
              - "Prime Minister and concurrently Minister of Health in the Saint Kitts and Nevis Labour Party (SKNLP) government since the SKNLP's victory in the 5 August 2022 general election that brought an end to Timothy Harris's PAM-CCM-PLP Team Unity coalition; medical doctor — internal medicine specialist with training in Cuba and the Caribbean — and the first PM to hold the health portfolio personally in many years, giving health an unusually direct head-of-government voice; Saint Kitts and Nevis is the smallest sovereign state in the Americas by population and area, a Commonwealth realm under King Charles III represented by Governor-General Sir Marcella Liburd; verify currency against gov.kn and SKN Newsroom."
              - "Owns federal MoH policy and budget, the Joseph N. France General Hospital in Basseterre (apex public facility on Saint Kitts), the Mary Charles Hospital and Pogson Medical Centre on Saint Kitts, coordination with the Nevis Island Administration (NIA) Minister of Health for the Alexandra Hospital and Nevis health services (Nevis has substantial autonomy under the 1983 Constitution including in health), the polyclinic network across the nine parishes on Saint Kitts and five parishes on Nevis, and CARICOM, CARPHA, OECS, ECCB, Commonwealth and PAHO diplomacy."
              - "Hook: non-communicable diseases (high Caribbean NCD burden), mental health, sugar tax and sugar-economy legacy (Saint Kitts ended its sugar industry in 2005; the diabetes legacy is a notable policy frame), Citizenship by Investment-financed health investments, federation health coordination with Nevis Island Administration, climate-and-health and disaster preparedness, MCH, and CARPHA-OECS regional cooperation — these all land."
          - Tone advice:
              - "Open with NCDs (especially diabetes), mental health, sugar-economy legacy and sugar-tax policy, CBI-financed health investments, federation-Nevis coordination, and CARPHA cooperation — durable lines."
              - "Recognise the Nevis Island Administration's substantial autonomy in health (the NIA Minister of Health is a separate office with operational authority over Nevis health services; framings that assume federal monopoly will be corrected) and do not conflate with OECS peers."
