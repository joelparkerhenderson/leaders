Pakistani health stakeholders:
  - Ministry of National Health Services, Regulations and Coordination (NHSRC):
      - Syed Mustafa Kamal (MQM-P):
          - Title: Federal Minister for National Health Services, Regulations and Coordination (in the Shehbaz Sharif PML-N coalition government, post-February 2024 election)
          - Stakeholder engagement notes:
              - "Federal Minister for National Health Services, Regulations and Coordination in the Shehbaz Sharif (PML-N) coalition government formed after the February 2024 general election; MQM-Pakistan; assumed charge formally at NHSRC headquarters in Islamabad."
              - "Previously Mayor of Karachi 2005-2010 under MQM; founder of Pak Sarzameen Party before its merger back into MQM-P; urban-development background with infrastructure and municipal-services orientation; brings Karachi political base to a federal portfolio."
              - "Owns federal-level coordination of immunisation (EPI) and Polio Eradication Programme (a high-priority federal portfolio because Pakistan and Afghanistan remain the world's last two polio-endemic countries), DRAP regulatory functions, Islamabad Capital Territory health delivery, Federal Government Polyclinic, and federal-provincial coordination through the Council of Common Interests."
              - "Operates in the constitutional framework of the 18th Amendment (2010), under which health is principally a provincial subject — the federal NHSRC role is therefore coordination, regulation and select vertical programmes, not delivery."
              - "Hook: Polio Eradication, EPI strengthening, Sehat Sahulat federal continuation, DRAP reform, climate-health response (post-2022 catastrophic floods), maternal-and-child health, antimicrobial resistance and Karachi-specific urban-health programmes land; provincial-delivery pitches at federal level do not."
          - Tone advice:
              - "Lead with Polio Eradication, EPI, DRAP regulation, Sehat Sahulat federal coordination, and Karachi urban-health — these are federally meaningful levers given the 18th-Amendment devolution and Mustafa Kamal's MQM-P / Karachi political base."
              - "Do not pitch as if delivery decisions were federal — provincial Health Departments own delivery; Punjab and Sindh in particular have independent reform agendas; engagement on services must go to provincial Health Ministers (currently Khawaja Salman Rafique in Punjab, Azra Pechuho in Sindh, et al., currency to verify)."
